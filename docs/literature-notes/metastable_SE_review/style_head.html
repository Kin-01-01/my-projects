<style>
  @page { size: A4; margin: 15mm 14mm; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Times New Roman", "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
    font-size: 10pt;
    line-height: 1.45;
    color: #111;
    text-align: justify;
  }
  h1 {
    text-align: center;
    font-size: 16pt;
    font-weight: 700;
    margin: 0 0 4mm 0;
  }
  h2 {
    font-size: 12.5pt;
    font-weight: 700;
    margin: 6mm 0 2mm 0;
    border-bottom: 0.6pt solid #444;
    padding-bottom: 1mm;
  }
  h3 {
    font-size: 11pt;
    font-weight: 700;
    margin: 3mm 0 1mm 0;
  }
  p { margin: 0 0 2mm 0; }
  blockquote { color:#555; border-left:2pt solid #ccc; margin:0 0 2mm 2mm; padding-left:2mm; }
  em { font-style: italic; }
  strong { font-weight: 700; }
  /* three-line table */
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 3mm 0;
    font-size: 9.5pt;
    border-top: 1.4pt solid #000;
    border-bottom: 1.4pt solid #000;
  }
  thead th { border-bottom: 0.8pt solid #000; font-weight: 700; text-align: left; padding: 1.5mm 2mm; }
  td { border: none; padding: 1.2mm 2mm; vertical-align: top; }
  tr { page-break-inside: avoid; }
  /* references */
  .ref {
    text-indent: -2em;
    padding-left: 2em;
    margin: 0 0 1mm 0;
    font-size: 9.5pt;
    line-height: 1.4;
  }
  .ref a, a { color: #0645ad; text-decoration: none; }
  code { font-family: "Consolas", monospace; font-size: 9pt; }
</style>
