<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>笔记详情 · 枯木逢春</title>
    <meta name="description" content="CS 学习笔记正文。" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090D" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="js/core/tailwind.config.js"></script>

    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />

    <!-- 代码高亮主题（背景与内边距已在 components.css 里剥掉，只借它的配色） -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/[邮箱已脱敏]/build/styles/github-dark.min.css"
    />

    <!-- Markdown 与代码高亮只在详情页加载，其它页面不引，省流量 -->
    <script src="https://cdn.jsdelivr.net/npm/[邮箱已脱敏]/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/[邮箱已脱敏]/build/highlight.min.js"></script>
  </head>

  <body data-page="note">
    <div class="page-veil" id="page-veil" aria-hidden="true"></div>
    <header id="site-header"></header>

    <main>
      <section class="section">
        <div class="wrap">
          <a
            class="mono hover-lift"
            href="notes.html"
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              color: var(--text-2);
            "
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H6" />
              <path d="m11.5 18-6-6 6-6" />
            </svg>
            返回笔记列表
          </a>

          <!-- 正文 + 右侧浮动目录。窄屏下目录自动隐藏 -->
          <div class="note-layout" style="margin-top: 22px">
            <article class="note-body">
              <header class="note-header" id="note-header"></header>
              <div id="note-body"></div>
            </article>

            <aside
              class="note-toc"
              id="note-toc"
              aria-label="本页目录"
            ></aside>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="js/pages/note.page.js"></script>
  </body>
</html>
