<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>枯木逢春 · CS 自学门户与作品集</title>
    <meta
      name="description"
      content="一个记录计算机科学自学过程的地方：知识笔记、代码练习、项目作品，以及一条正在长叶子的学习路径。"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090D" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <!-- 第三方：Tailwind Play CDN（锁版本）。配置紧随其后，顺序不能反。
         第三阶段若要转本地构建，把这两行换成生成的 assets/css/tailwind.css 即可。 -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="js/core/tailwind.config.js"></script>

    <!-- 本地样式：令牌 → 骨架 → 组件 → 动效，顺序有依赖，不要调换 -->
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>

  <body data-page="home">
    <!-- 页面切换遮罩：由 core/router.js 控制，负责多页之间的平滑过渡 -->
    <div class="page-veil" id="page-veil" aria-hidden="true"></div>

    <!-- 导航由 modules/navbar.js 根据 config.js 渲染，六个页面共用一份 -->
    <header id="site-header"></header>

    <main>
      <!-- ============================================================ Hero -->
      <section class="hero">
        <!-- 粒子画布挂载点。第一阶段为空容器，第二阶段接入 tsParticles -->
        <div class="hero-particles" id="particles-hero" aria-hidden="true"></div>

        <div class="wrap">
          <div class="hero-content">
            <span class="hero-eyebrow">
              <span class="hero-dot pulse-dot"></span>
              正在自学中 · 笔记与项目持续更新
            </span>

            <h1 class="hero-title">
              把学过的每一块知识<br />
              种成一棵<em>会开花的树</em>
            </h1>

            <p class="hero-sub">
              这里放三样东西：CS
              学习笔记、动手做过的项目、还有一条正在生长的学习路径。不追求速成，就是一篇一篇写下去。
            </p>

            <div class="hero-actions">
              <a class="btn btn-primary" href="notes.html">看笔记</a>
              <a class="btn" href="projects.html">看项目</a>
              <a class="btn" href="about.html">关于我</a>
            </div>
          </div>
        </div>
      </section>

      <!-- ======================================================== 三大板块 -->
      <section class="section">
        <div class="wrap">
          <div class="section-head">
            <div>
              <h2 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>三个板块
              </h2>
              <p class="section-desc">
                知识、作品、路径——分别对应"学了什么""做成了什么""下一步去哪"。
              </p>
            </div>
          </div>

          <!-- 卡片由 pages/home.js 根据 config.js 的 SECTIONS 渲染 -->
          <div class="grid-cards" id="entry-grid" data-reveal-group></div>
        </div>
      </section>

      <!-- ======================================================== 最新笔记 -->
      <section class="section section-tight">
        <div class="wrap">
          <div class="section-head">
            <div>
              <h2 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>最近写的笔记
              </h2>
            </div>
            <a class="section-more" href="notes.html">全部笔记 →</a>
          </div>

          <div class="note-list" id="latest-notes" data-reveal-group></div>
        </div>
      </section>

      <!-- ============================================ 知识树预告（第二阶段） -->
      <section class="section section-tight">
        <div class="wrap">
          <div class="notice" data-reveal>
            <span aria-hidden="true">🌱</span>
            <span>
              <strong>正在做：枯木逢春知识树。</strong>
              把学习路径画成一棵树，未掌握的知识点是枯枝，悬停时枯枝会缓缓转绿、发芽、开花。拖拽平移与滚轮缩放也在计划内，第二阶段上线。
            </span>
          </div>
        </div>
      </section>
    </main>

    <!-- 页脚由 modules/footer.js 渲染 -->
    <footer id="site-footer"></footer>

    <script type="module" src="js/pages/home.js"></script>
  </body>
</html>
