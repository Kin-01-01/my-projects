<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>关于我 · 枯木逢春</title>
    <meta
      name="description"
      content="个人背景、技能栈全景与学习路线规划。"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090D" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="js/core/tailwind.config.js"></script>

    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>

  <body data-page="about">
    <div class="page-veil" id="page-veil" aria-hidden="true"></div>
    <header id="site-header"></header>

    <main>
      <!-- ============================================================ 简介 -->
      <section class="section">
        <div class="wrap">
          <div class="section-head">
            <div>
              <h1 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>关于我
              </h1>
              <p class="section-desc">
                内容全部来自 data/profile.json，改数据即可，不用碰代码。
              </p>
            </div>
          </div>

          <div class="two-col">
            <div class="panel" id="profile-bio"></div>
            <div class="panel" id="profile-facts"></div>
          </div>
        </div>
      </section>

      <!-- ========================================================== 技能栈 -->
      <section class="section section-tight">
        <div class="wrap">
          <div class="section-head">
            <div>
              <h2 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>技能栈
              </h2>
              <p class="section-desc">
                五档自评：了解 / 入门 / 熟练 / 扎实 / 精通。不用百分比是因为那属于假精确。
              </p>
            </div>
          </div>

          <div class="panel" id="skills-container"></div>
        </div>
      </section>

      <!-- ==================================================== 路线与近期 -->
      <section class="section section-tight">
        <div class="wrap">
          <div class="two-col">
            <div>
              <h2 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>学习路线
              </h2>
              <p class="section-desc">
                实心点是已完成，琥珀点是进行中，空心点是规划中。
              </p>
              <div class="timeline" id="timeline" style="margin-top: 28px"></div>
            </div>

            <div>
              <h2 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>最近在做的事
              </h2>
              <p class="section-desc">同时推进的事情不会太多，写下来的都是真的在做的。</p>
              <div id="focus-list" style="margin-top: 28px"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ================================================ 知识路径可视化预告 -->
      <section class="section section-tight">
        <div class="wrap">
          <div class="notice" data-reveal>
            <span aria-hidden="true">🗺️</span>
            <span>
              <strong>学习路线的可视化版本在知识树页。</strong>
              技能栈是横向的"会什么"，知识树是纵向的"学到哪了"——后者第二阶段上线，
              悬停节点可以看到这条路径上每个知识点的掌握状态。
              <a href="knowledge-tree.html" style="color: var(--accent)">去看看 →</a>
            </span>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="js/pages/about.page.js"></script>
  </body>
</html>
