<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目作品 · 枯木逢春</title>
    <meta
      name="description"
      content="个人项目与练习作品档案：技术栈、实现思路、源码与演示链接。"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090D" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="js/core/tailwind.config.js"></script>

    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>

  <body data-page="projects">
    <div class="page-veil" id="page-veil" aria-hidden="true"></div>
    <header id="site-header"></header>

    <main>
      <section class="section">
        <div class="wrap">
          <div class="section-head">
            <div>
              <h1 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>项目作品
              </h1>
              <p class="section-desc">
                做过什么、用了什么、做到哪一步了。点技术栈标签可以只看相关项目。
              </p>
            </div>
            <div id="projects-count"></div>
          </div>

          <div class="filter-bar" id="projects-filter"></div>

          <!-- 响应式网格：移动端 1 列 / 平板 2 列 / 桌面 3 列，由 .grid-cards 控制 -->
          <div class="grid-cards" id="projects-list" data-reveal-group></div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="js/pages/projects.page.js"></script>
  </body>
</html>
