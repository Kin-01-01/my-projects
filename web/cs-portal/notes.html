<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学习笔记 · 枯木逢春</title>
    <meta
      name="description"
      content="按课程与主题归档的计算机科学知识点：数据库、操作系统、算法与数据结构、前端、Python。"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090D" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="js/core/tailwind.config.js"></script>

    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>

  <body data-page="notes">
    <div class="page-veil" id="page-veil" aria-hidden="true"></div>
    <header id="site-header"></header>

    <main>
      <section class="section">
        <div class="wrap">
          <div class="section-head">
            <div>
              <h1 class="section-title">
                <span class="accent-bar" aria-hidden="true"></span>学习笔记
              </h1>
              <p class="section-desc">
                按课程与主题归档。筛选条件会写进地址栏，可以直接把链接分享出去。
              </p>
            </div>
            <!-- 结果计数由 modules/notes.js 填充 -->
            <div id="notes-count"></div>
          </div>

          <!-- 左分类栏 + 右列表。移动端会自动变成"顶部横向滚动分类" -->
          <div class="notes-layout">
            <aside class="side-nav" id="notes-side" aria-label="笔记分类"></aside>

            <div>
              <div class="filter-bar" id="notes-filter"></div>
              <div class="note-list" id="notes-list" data-reveal-group></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="js/pages/notes.page.js"></script>
  </body>
</html>
