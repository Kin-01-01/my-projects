  --bg:#1c1c1e;--surface:#242426;--parchment:#161617;--ink:#f5f5f7;
  --muted:#bcbcc3;--faint:#9d9da5;--line:#38383b;--line-soft:#2c2c2f;
  --blue:#2997ff;--blue-hover:#47a9ff;--blue-soft:#1b3550;--blue-pale:#152436;
  --dark:#000000;--on-dark:#ffffff;--dark-muted:#a1a1a6;
  --veil:rgba(18,20,26,.10);
  --pane-bg:rgba(28,28,30,.46);
  --pane-solid:rgba(28,28,30,.90);
  --glass-bg:rgba(44,44,48,.56);
  --glass-solid:rgba(44,44,48,.88);
  --glass-line:rgba(255,255,255,.13);
  --glass-shadow:rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:clip}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  background-image:linear-gradient(var(--veil),var(--veil)), var(--wallpaper-light);
  background-size:cover;background-position:center;
  background-attachment:fixed;background-repeat:no-repeat;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei","WenQuanYi Micro Hei",system-ui,sans-serif;
  font-size:14px;line-height:1.6;font-optical-sizing:auto;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
::selection{background:var(--blue-soft);color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{height:48px;background:rgba(8,9,12,.88);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);color:var(--on-dark);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .mark{width:20px;height:20px;border-radius:5px;background:var(--blue);display:grid;place-items:center}
.brand .mark svg{width:16px;height:16px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand small{color:var(--dark-muted);font-size:12px;margin-left:2px}
.nav{display:flex;gap:26px;margin:0 auto;align-items:center}
.nav button{color:var(--dark-muted);font-size:12px;padding:14px 0;border-bottom:2px solid transparent;white-space:nowrap}
.nav button.on{color:var(--on-dark);font-weight:600;border-bottom-color:var(--blue)}
.tools{display:flex;align-items:center;gap:14px;flex:none}
.tools button{color:var(--dark-muted);font-size:12px;display:flex;align-items:center;gap:5px}
.tools svg{width:15px;height:15px}
.hamburger{display:none}

/* ---------- section sub navigation ---------- */
.subnav{height:40px;background:var(--subnav-bg);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--glass-line);
  position:sticky;top:48px;z-index:58}
.subnav-inner{height:100%;display:flex;align-items:center;gap:16px;padding:0 24px}
.subnav-label{font-size:12px;font-weight:600;color:var(--ink);flex:none;white-space:nowrap}
.subnav-sep{width:1px;height:16px;background:var(--line);flex:none}
.anchors{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.anchors::-webkit-scrollbar{display:none}
.anchor{font-size:12px;color:var(--muted);padding:5px 11px;border-radius:999px;white-space:nowrap;transition:color 150ms var(--ease-hover),background 150ms var(--ease-hover)}
.anchor.on{color:var(--blue);background:var(--blue-pale);font-weight:600}
.totop{flex:none;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:4px;
  opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out)}
.totop.show{opacity:1;pointer-events:auto}
[data-anchor]{scroll-margin-top:96px}
.detail-cols aside,.form-cols aside{position:sticky;top:96px;align-self:start;
  max-height:calc(100vh - 110px);overflow-y:auto;padding-right:2px}
.detail-cols aside::-webkit-scrollbar,.form-cols aside::-webkit-scrollbar{width:6px}
.detail-cols aside::-webkit-scrollbar-thumb,.form-cols aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr) 376px;min-height:calc(100vh - 88px)}
.shell.wide{grid-template-columns:260px minmax(0,1fr)}
.shell.wide .preview{display:none}
.sidebar{background:var(--bg);border-right:1px solid var(--glass-line);padding:24px 0 20px;display:flex;flex-direction:column;gap:0;position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:0 20px 14px}
.side-head b{font-size:13px}
.side-head span{font-size:12px;color:var(--faint)}
.side-group{padding:12px 20px}
.side-group.on{background:var(--blue-pale)}
.side-group h4{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
.side-group.on h4{color:var(--blue)}
.side-group h4 em{font-style:normal;color:var(--faint);font-size:11px;font-weight:400}
.side-group ul{list-style:none;margin:0;padding:0}
.side-group li{font-size:12px;color:var(--muted);line-height:25px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;white-space:nowrap;transition:transform 140ms var(--ease-out),background 140ms var(--ease-hover)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn-block{width:100%}
.btn-sm{padding:7px 14px;font-size:12px}

.main{background:var(--parchment);padding:28px;min-width:0}
.preview{background:var(--bg);border-left:1px solid var(--glass-line);padding:22px;display:flex;flex-direction:column;gap:12px;position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto}
.preview::-webkit-scrollbar,.sidebar::-webkit-scrollbar,.codebody::-webkit-scrollbar{width:8px;height:8px}
.preview::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.codebody::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- common ---------- */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:30px;font-weight:600;letter-spacing:-.5px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.stat.accent{background:var(--blue-pale);border-color:var(--blue-soft);color:var(--blue)}
.sec-title{font-size:17px;font-weight:600;margin:0 0 12px}
.eyebrow{font-size:12px;font-weight:600;color:var(--ink);margin:0 0 8px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.d0{background:var(--blue-soft);color:var(--blue)}
.d1{background:var(--blue);color:#fff}
.d2{background:var(--ink);color:var(--bg)}
.tag{display:inline-flex;border-radius:var(--r-sm);background:var(--parchment);color:var(--muted);padding:5px 10px;font-size:11px;white-space:nowrap}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.link{font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.box{background:var(--parchment);border-radius:var(--r-sm);padding:14px}

/* ---------- browse ---------- */
.search-row{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:44px;min-width:0}
.search svg{width:16px;height:16px;flex:none;color:var(--faint)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:13px;min-width:0}
.search input::placeholder{color:var(--faint)}
.search kbd{font:11px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border-radius:999px;padding:7px 14px;font-size:12px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.chip-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.result-line{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.entry{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:border-color 150ms var(--ease-hover),transform 150ms var(--ease-out)}
.entry.sel{border-color:var(--blue)}
.entry-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.entry h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.entry h3 em{font-style:normal;font-size:12px;color:var(--faint);font-weight:400;margin-left:5px}
.entry p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.entry .meta{font-size:11px;color:var(--faint);line-height:1.5}
.entry .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.icon-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);padding:3px 6px;border-radius:6px}
.icon-btn.on{color:var(--blue)}
.icon-btn svg{width:13px;height:13px}
.archive{margin-top:18px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.archive-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.empty{text-align:center;padding:48px 20px;color:var(--faint);font-size:13px}

/* ---------- preview ---------- */
.pv-head{display:flex;justify-content:space-between;align-items:center}
.pv-title{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.3}
.pv-body{font-size:13px;line-height:1.65;color:var(--muted)}
.pv-steps{font-size:12px;line-height:1.8;color:var(--muted);white-space:pre-line}
.codebox{background:var(--code);border-radius:var(--r-sm);overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--code-line);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#cccccc}
.codebar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2997ff;margin-right:8px}
.codebar-left{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-badge{background:#2997ff;color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;letter-spacing:.4px;flex:none}
.codefile{color:#8e8e93;flex:none}
.lang-pill{display:inline-flex;font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--blue);background:var(--blue-pale);border-radius:5px;padding:2px 7px;white-space:nowrap}
.codebar button{color:#2997ff;font-size:11px;font-weight:600}
.codebody{padding:12px 0;overflow-x:auto;font:11.5px/1.7 ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace}
.cline{display:flex;gap:14px;padding:0 14px;white-space:pre}
.cline .ln{width:22px;flex:none;text-align:right;color:#6e6e73;user-select:none}
.cline code{color:var(--code-text)}
.pv-actions{display:flex;gap:8px}
.pv-actions .btn{flex:1}
textarea.note{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg);font-size:12px;line-height:1.7;outline:0;white-space:pre-wrap}
textarea.note:focus{border-color:var(--blue)}
.note-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.note-item{background:var(--parchment);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;line-height:1.6;position:relative}
.note-item time{display:block;color:var(--faint);font-size:11px;margin-bottom:4px;padding-right:82px}
.note-item .note-text{white-space:pre-wrap;word-break:break-word;line-height:1.75;color:var(--ink)}
.note-item.editing{border:1px solid var(--blue);background:var(--blue-pale)}
.note-ops{position:absolute;right:8px;top:7px;display:flex;gap:2px}
.note-ops button{color:var(--faint);font-size:11px;line-height:1;padding:3px 6px;border-radius:5px}
.note-actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.note-hint{font-size:11px;color:var(--faint);margin:7px 0 0;line-height:1.6}

/* ---------- detail ---------- */
.crumb{font-size:12px;color:var(--faint);margin-bottom:16px}
.detail-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.detail-head h1{font-size:30px}
.detail-cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.info-card{background:var(--parchment);border-radius:var(--r-sm);padding:14px}
.info-card b{display:block;color:var(--blue);font-size:12px;margin-bottom:8px}
.info-card p{margin:0;font-size:12px;line-height:1.65;color:var(--muted)}
.block{margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--faint);font-weight:600;background:var(--parchment);padding:10px 12px}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);color:var(--muted);vertical-align:top}
td.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--blue);white-space:nowrap}
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.io-card{background:var(--parchment);border-radius:var(--r-sm);padding:14px}
.io-card b{font-size:12px}
.io-card pre{margin:8px 0 0;font:11.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--blue);white-space:pre-wrap;word-break:break-all}
.side-card{background:var(--parchment);border-radius:10px;padding:16px;margin-bottom:14px}
.side-card h4{font-size:13px;margin:0 0 10px}
.kv{font-size:12px;line-height:1.9;color:var(--muted);white-space:pre-line}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:60%;background:var(--blue);border-radius:3px}

/* ---------- review ---------- */
.review-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.review-stats .card{padding:18px}
.review-stats .num{font-size:28px;font-weight:600;line-height:1.2;font-family:Inter,-apple-system,sans-serif}
.review-stats .lbl{font-size:12px;color:var(--muted)}
.review-stats .extra{font-size:11px;color:var(--faint);margin-top:4px}
.review-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.qlist{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.qtable{width:100%;font-size:12px}
.qtable th{background:var(--parchment);border-top:1px solid var(--line)}
.qtable td{padding:13px 20px}
.qtable tr:last-child td{border-bottom:0}
.qtable .nm{font-weight:600;color:var(--ink)}
.dark-card{background:var(--code);color:#fff;border-radius:10px;padding:16px;margin-top:14px}
.dark-card h4{margin:0 0 8px;font-size:13px}
.dark-card p{margin:0 0 12px;font-size:12px;line-height:1.6;color:#cccccc}

/* ---------- new entry ---------- */
.form-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.form{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:24px}
.field{display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.field label{width:130px;flex:none;font-size:12px;font-weight:600}
.field input,.field select{width:100%;border:0;outline:0;background:transparent;font-size:12px;color:var(--ink)}
.field input::placeholder{color:var(--faint)}
.field input:focus,.field select:focus{color:var(--blue)}
.form-hint{font-size:11px;color:var(--faint);line-height:1.7;margin-top:12px}
.form-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}

.math-card{background:var(--blue-pale);border:1px solid var(--blue-soft);border-radius:10px;padding:16px 20px 18px;margin-bottom:14px}
.math-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.math-title{font-size:12px;font-weight:600;color:var(--blue)}
.math-copy{font-size:11px;font-weight:600;color:var(--blue);flex:none}
.mrow{display:flex;align-items:center;gap:14px;padding:5px 0}
.mrow + .mrow{border-top:1px dashed var(--blue-soft);margin-top:8px;padding-top:14px}
.mformula{flex:1;min-width:0;font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-size:17px;line-height:2.15;font-style:italic;color:var(--ink);letter-spacing:.2px}
.mno{flex:none;font-size:11px;color:var(--faint);font-style:normal}
.mfn{font-style:normal}
.mfn i,.mformula sup i,.mformula sub i{font-style:normal}
.mfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .28em;line-height:1.2;font-style:normal}
.mnum{display:block;padding:0 .35em;border-bottom:1.2px solid currentColor;text-align:center}
.mden{display:block;padding:0 .35em;text-align:center}
.msqrt{display:inline-flex;align-items:stretch;vertical-align:middle;font-style:normal}
.mrad{font-size:1.3em;line-height:1}
.mbody{border-top:1.2px solid currentColor;padding:0 .16em;margin-left:-.04em}
.mbigop{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 .16em;line-height:1;font-style:normal}
.mbigop .mop{font-size:1.35em;line-height:.9}
.mbigop sup,.mbigop sub{font-size:.55em;line-height:1.05;font-style:normal}
.mformula sup,.mformula sub{font-size:.66em;font-style:normal;line-height:0}
.mspace{display:inline-block;width:1.1em}
.munknown{color:#c0392b;font-style:normal;font-size:.8em}
.math-steps{margin:0;padding-left:20px;font-size:12.5px;line-height:1.9;color:var(--muted)}
.math-steps li{padding-left:4px;margin-bottom:6px}
.math-steps li::marker{color:var(--blue);font-weight:600}
.math-mini{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-size:14px;line-height:2.1;font-style:italic;color:var(--ink);background:var(--blue-pale);border-radius:8px;padding:10px 12px}
.math-note{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.7}
/* ---------- misc ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out);z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- floating glass dock ---------- */
.dock{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:70;
  width:64px;padding:9px 6px;border-radius:18px;
  background:var(--dock-bg);backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--dock-line);
  box-shadow:0 12px 40px var(--dock-shadow),inset 0 1px 0 rgba(255,255,255,.35);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:background 200ms var(--ease-hover)}
.dock-label{max-width:100%;font-size:9.5px;color:var(--faint);text-align:center;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0 4px}

from sklearn.mixture import GaussianMixture
from sklearn.preprocessing import StandardScaler

def gmm_fit(X, max_k=8):
    Xs = StandardScaler().fit_transform(X)
    bics = [GaussianMixture(n_components=k, n_init=3, random_state=42)
            .fit(Xs).bic(Xs) for k in range(1, max_k + 1)]

                            random_state=42).fit(Xs)
    print("best k by BIC:", best_k)
    return model, model.predict_proba(Xs), model.score_samples(Xs)

class MLP(nn.Module):
    def __init__(self, in_dim, num_classes, hidden=(128, 64), dropout=0.2):

import torch.nn as nn
import torch.nn.functional as F

class MultiHeadAttention(nn.Module):
    def __init__(self, d_model=512, n_heads=8, dropout=0.1):
        super().__init__()
        assert d_model % n_heads == 0
        self.n_heads = n_heads
        self.d_k = d_model // n_heads
        self.qkv = nn.Linear(d_model, 3 * d_model)
        self.out = nn.Linear(d_model, d_model)
        self.dropout = nn.Dropout(dropout)

    def forward(self, x, mask=None):
        b, n, _ = x.shape
        q, k, v = self.qkv(x).chunk(3, dim=-1)
        q = q.view(b, n, self.n_heads, self.d_k).transpose(1, 2)
        k = k.view(b, n, self.n_heads, self.d_k).transpose(1, 2)
        v = v.view(b, n, self.n_heads, self.d_k).transpose(1, 2)
        scores = (q @ k.transpose(-2, -1)) / (self.d_k ** 0.5)
        if mask is not None:
            scores = scores.masked_fill(mask == 0, -1e9)
        attn = self.dropout(F.softmax(scores, dim=-1))
        out = (attn @ v).transpose(1, 2).contiguous().view(b, n, -1)
        return self.out(out)

 code:`import torch
import torch.nn as nn

class EncoderBlock(nn.Module):
    def __init__(self, d_model=512, n_heads=8, d_ff=2048, dropout=0.1):
        super().__init__()
        self.norm1 = nn.LayerNorm(d_model)
        self.attn = nn.MultiheadAttention(d_model, n_heads,
                                         dropout=dropout, batch_first=True)
        self.norm2 = nn.LayerNorm(d_model)
        self.ffn = nn.Sequential(nn.Linear(d_model, d_ff), nn.GELU(),
                                 nn.Dropout(dropout),
                                 nn.Linear(d_ff, d_model))
        self.drop = nn.Dropout(dropout)

    def forward(self, x, key_padding_mask=None):
        h = self.norm1(x)
        h, _ = self.attn(h, h, h, key_padding_mask=key_padding_mask)
        x = x + self.drop(h)                       # 残差 1
        h = self.norm2(x)
        return x + self.drop(self.ffn(h))          # 残差 2

class Encoder(nn.Module):
    def __init__(self, num_layers=6, **kw):
        super().__init__()
        self.layers = nn.ModuleList([EncoderBlock(**kw)
                                    for _ in range(num_layers)])
    def forward(self, x, mask=None):
        for layer in self.layers:
            x = layer(x, mask)
        return x

    def reparameterize(self, mu, logvar):
        std = torch.exp(0.5 * logvar)
        return mu + std * torch.randn_like(std)

    def forward(self, x):
        h = self.enc(x)
        mu, logvar = self.mu(h), self.logvar(h)
        return self.dec(self.reparameterize(mu, logvar)), mu, logvar

    kld = -0.5 * torch.mean(1 + logvar - mu.pow(2) - logvar.exp())
    return bce + beta * kld, bce, kld

import torch
import torch.nn as nn

class LoRALinear(nn.Module):
    def __init__(self, base: nn.Linear, r=8, alpha=16, dropout=0.05):
        super().__init__()
        self.base = base
        for p in self.base.parameters():
            p.requires_grad_(False)               # 冻结预训练权重
        self.A = nn.Parameter(torch.empty(r, base.in_features))
        self.B = nn.Parameter(torch.zeros(base.out_features, r))
        nn.init.kaiming_uniform_(self.A, a=math.sqrt(5))
        self.scaling = alpha / r
        self.drop = nn.Dropout(dropout)

    def forward(self, x):
        return self.base(x) + self.drop(x) @ self.A.T @ self.B.T * self.scaling

    def merge(self):
        # 推理前把 BA 合并回原权重，去掉额外计算
        with torch.no_grad():
            self.base.weight += (self.B @ self.A) * self.scaling
        return self.base

def trainable_params(model):
    return sum(p.numel() for p in model.parameters() if p.requires_grad)

import torch.nn as nn
import torch.nn.functional as F

class DDPM:
    def __init__(self, model, timesteps=1000,
                 beta_start=1e-4, beta_end=0.02, device="cpu"):
        self.model, self.T, self.device = model, timesteps, device
        betas = torch.linspace(beta_start, beta_end, timesteps, device=device)
        alphas = 1.0 - betas
        self.a_bar = torch.cumprod(alphas, dim=0)

    def q_sample(self, x0, t, noise=None):
        noise = noise or torch.randn_like(x0)
        a = self.a_bar[t].view(-1, *([1] * (x0.dim() - 1)))
        return a.sqrt() * x0 + (1 - a).sqrt() * noise, noise

    def loss(self, x0):
        b = x0.size(0)
        t = torch.randint(0, self.T, (b,), device=x0.device)
        xt, noise = self.q_sample(x0, t)
        return F.mse_loss(self.model(xt, t), noise)

    @torch.no_grad()
    def sample(self, shape):
        self.model.eval()
        x = torch.randn(shape, device=self.device)
        for t in reversed(range(self.T)):
            tt = torch.full((shape[0],), t, device=self.device, dtype=torch.long)
            eps = self.model(x, tt)
            a, a_prev = self.a_bar[t], self.a_bar[max(t - 1, 0)]
            beta = 1 - a / a_prev
            x = (x - beta / (1 - a).sqrt() * eps) / (1 - beta).sqrt()
            if t > 0:
                x = x + beta.sqrt() * torch.randn_like(x)
        return x.clamp(-1, 1)

  'in','not','and','or','is','None','True','False','with','try','except','finally','raise','pass',
  'break','continue','lambda','yield','assert','global','nonlocal','del','async','await']);

  'zip','map','filter','any','all','int','float','str','list','dict','set','tuple','bool','type',
  'isinstance','open','self','super','np','torch','nn','F','pd','plt']);
function highlightLine(line){
  const s = String(line);
  let out = '', i = 0;
  while(i < s.length){
    const c = s[i];
    if(c === '#'){ out += '<span class="tk-c">'+esc(s.slice(i))+'</span>'; break; }
    if(c === '"' || c === "'"){
      const q = c; let j = i + 1;
      while(j < s.length){
        if(s[j] === '\\'){ j += 2; continue; }
        if(s[j] === q){ j++; break; }
        j++;
      }
      out += '<span class="tk-s">'+esc(s.slice(i, j))+'</span>';
      i = j; continue;
    }
    if(/[0-9]/.test(c)){
      let j = i;
      while(j < s.length && /[0-9.]/.test(s[j])) j++;
      out += '<span class="tk-n">'+esc(s.slice(i, j))+'</span>';
      i = j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j = i;
      while(j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++;
      const w = s.slice(i, j);
      let cls = '';
      if(PY_KW.has(w)) cls = 'tk-k';
      else if(PY_BUILTIN.has(w)) cls = 'tk-b';
      else if(/^[A-Z]/.test(w)) cls = 'tk-t';
      else if(s[j] === '(') cls = 'tk-f';
      out += cls ? '<span class="'+cls+'">'+esc(w)+'</span>' : esc(w);
      i = j; continue;
    }
    out += esc(c);
    i++;
  }
  return out;
}

const MFUNCS = new Set(['softmax','argmax','argmin','max','min','log','ln','exp','tanh','diag',
  'Var','Cov','E','I','N','L','CV','BCE','KLD','MSE','AUC','TPR','FPR','TP','FP','FN','TN',
  'Attention','MultiHead','Concat','Dropout','GELU','ReLU','Sigmoid','BatchNorm','Linear',
  'ELBO','Gain','Gini','Entropy','Ridge','Lasso','BIC','Obj','rank','dim','support','const',
  'subgrad','score','dist','head','FFN','MHA','LN','Attention','min_samples','sigmoid','clip']);
/* 轻量数学排版：真分式 / 上下标 / 大运算符 / 根号 / 变量斜体 / 函数名正体，无外部依赖 */
function mathHTML(src){
  const S = String(src || '');
  let i = 0;
  function readGroup(){
    if(S[i] !== '{') return null;
    i++;
    return parse('}');
  }
  function readScript(){
    if(S[i] === '{'){ i++; return parse('}'); }
    const c = esc(S.charAt(i) || ''); i++;
    return c;
  }
  function bigop(name){
    let lo = '', hi = '';
    if(S[i] === '_'){ i++; lo = readScript(); }
    if(S[i] === '^'){ i++; hi = readScript(); }
    const glyph = name === 'sum' ? '∑' : name === 'prod' ? '∏' : '∫';
    return '<span class="mbigop">'+(hi ? '<sup>'+hi+'</sup>' : '')+
      '<span class="mop">'+glyph+'</span>'+(lo ? '<sub>'+lo+'</sub>' : '')+'</span>';
  }
  function cmd(name){
    if(name === 'frac'){
      const a = readGroup(), b = readGroup();
      return '<span class="mfrac"><span class="mnum">'+(a||'')+'</span><span class="mden">'+(b||'')+'</span></span>';
    }
    if(name === 'sqrt'){
      const a = readGroup();
      return '<span class="msqrt"><span class="mrad">√</span><span class="mbody">'+(a||'')+'</span></span>';
    }
    if(name === 'sum' || name === 'prod' || name === 'int') return bigop(name);
    if(name === 'text' || name === 'operatorname'){
      return '<span class="mfn">'+(readGroup() || '')+'</span>';
    }
    if(name === 'left' || name === 'right'){
      const d = S.charAt(i); i++;
      return esc(d) || '';
    }
    if(Object.prototype.hasOwnProperty.call(MSYM, name)) return MSYM[name] || '';
    return '<span class="munknown">\\'+esc(name)+'</span>';
  }
  function parse(stop){
    let out = '';
    while(i < S.length){
      if(stop && S[i] === '}'){ i++; return out; }
      const c = S[i];
      if(c === '\\'){
        i++;
        const m = /^[A-Za-z]+/.exec(S.slice(i));
        const name = m ? m[0] : S.charAt(i);
        i += m ? m[0].length : 1;
        out += cmd(name);
        continue;
      }
      if(c === '{'){ i++; out += parse('}'); continue; }
      if(c === '^' || c === '_'){
        i++;
        const sub = readScript();
        out += c === '^' ? '<sup>'+sub+'</sup>' : '<sub>'+sub+'</sub>';
        continue;
      }
      if(/[A-Za-z]/.test(c)){
        const w = (/^[A-Za-z]+/.exec(S.slice(i)) || [c])[0];
        i += w.length;
        out += MFUNCS.has(w) ? '<span class="mfn">'+esc(w)+'</span>'
                             : w.split('').map(ch => '<i>'+ch+'</i>').join('');
        continue;
      }
      out += esc(c);
      i++;
    }
    return out;
  }
  return parse(null);
}

  const m = x.math;
  if(!m || !m.formulas || !m.formulas.length){

    rows+'</div>'+

/* ---- Section navigation: sticky anchor bar + scroll spy ---- */
const ANCHORS = {
  browse:[['sec-head','概览'],['sec-grid','算法条目'],['sec-archive','主题归档']],
  detail:[['sec-info','算法说明'],['sec-math','数学推导'],['sec-code','完整代码'],['sec-params','关键参数'],['sec-io','输入输出'],['sec-notes','学习备注']],
  review:[['sec-stats','复习概览'],['sec-queue','复习队列'],['sec-maintain','数据维护']],
  new:[['sec-form','条目表单'],['sec-code','代码编辑'],['sec-preview','实时预览']]
};
const VIEW_LABEL = {browse:'代码库', detail:'算法详情', review:'复习计划', fav:'收藏夹', new:'新增条目'};
function anchorsFor(v){
  if(v === 'fav'){
    return CATS.map((c, i) => ['sec-fav-' + i, c])
               .filter(a => document.getElementById(a[0]));
  }
  return ANCHORS[v] || [];
}
function renderSubnav(){
  const label = document.getElementById('subnavLabel');
  const bar = document.getElementById('anchors');
  if(!label || !bar) return;
  label.textContent = VIEW_LABEL[state.view] || '代码库';
  bar.innerHTML = anchorsFor(state.view).map((a, i) =>
    '<button type="button" class="anchor' + (i === 0 ? ' on' : '') + '" data-act="anchor" data-target="' + esc(a[0]) + '">' + esc(a[1]) + '</button>'
  ).join('');
  updateActiveAnchor();
}
function updateActiveAnchor(){
  const links = document.querySelectorAll('#anchors [data-act="anchor"]');
  if(!links || !links.length) return;
  const sections = document.querySelectorAll('[data-anchor]');
  if(!sections || !sections.length) return;
  const y = (window.scrollY || 0) + 120;
  let active = null;
  sections.forEach(el => {
    const top = el.getBoundingClientRect
      ? el.getBoundingClientRect().top + (window.scrollY || 0) : 0;
    if(top <= y) active = el.dataset.anchor;
  });
  links.forEach(a => a.classList.toggle('on', a.dataset.target === active));
}
function updateToTop(){
  const btn = document.getElementById('toTop');
  if(btn) btn.classList.toggle('show', (window.scrollY || 0) > 320);
}
let lastScrollTick = 0;
window.addEventListener('scroll', () => {
  const now = Date.now();
  if(now - lastScrollTick < 80) return;
  lastScrollTick = now;
  updateActiveAnchor();
  updateToTop();
  renderDock();
}, {passive:true});

/* ---- Floating glass dock: back / prev / next / home ---- */
const NAV_STACK = [];
function pushNav(){
  const cur = {view:state.view, detail:state.detail, selected:state.selected,
               q:state.q, cat:state.cat, diff:state.diff,
               favOnly:state.favOnly, reviewOnly:state.reviewOnly};
  const last = NAV_STACK[NAV_STACK.length-1];
  if(last && last.view===cur.view && last.detail===cur.detail && last.selected===cur.selected) return;
  NAV_STACK.push(cur);
  if(NAV_STACK.length > 30) NAV_STACK.shift();
}
function entryOrder(){
  const f = filtered();
  if(state.detail && f.some(x => x.id === state.detail)) return f;
  return allEntries();
}
function sectionIndex(){
  const list = anchorsFor(state.view);
  const ids = list.map(a => a[0]);
  const y = (window.scrollY || 0) + 130;
  let idx = 0;
  ids.forEach((id, i) => {
    const el = document.getElementById(id);
    if(el && el.getBoundingClientRect){
      const top = el.getBoundingClientRect().top + (window.scrollY || 0);
      if(top <= y) idx = i;
    }
  });
  return {list:list, ids:ids, idx:idx};
}
function sectionStep(step){
  const s = sectionIndex();
  const next = s.list[s.idx + step];
  if(!next){ toast(step > 0 ? '已经是最后一个区段' : '已经是第一个区段'); return; }
  const el = document.getElementById(next[0]);
  if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
  toast((step > 0 ? '下一页：' : '上一页：') + next[1]);
}
function goSibling(step, instant){
  if(state.view !== 'detail'){ sectionStep(step); return; }
  const list = entryOrder();
  const i = list.findIndex(x => x.id === state.detail);
  const target = list[i + step];
  if(!target){ toast(step > 0 ? '已经是最后一个条目' : '已经是第一个条目'); return; }
  pushNav();
  state.detail = target.id; state.selected = target.id;
  render({scroll:true, instant:instant});
  toast((step > 0 ? '下一页：' : '上一页：') + target.name);
}
function goBack(instant){
  const prev = NAV_STACK.pop();
  if(!prev){ toast('已经是第一页'); return; }
  state.view = prev.view; state.detail = prev.detail; state.selected = prev.selected;
  state.q = prev.q || ''; state.cat = prev.cat || '全部';
  state.diff = prev.diff || '全部';
  state.favOnly = !!prev.favOnly; state.reviewOnly = !!prev.reviewOnly;
  render({scroll:true, instant:instant});
  toast('已返回上一页');
}
function goHome(instant){
  pushNav();
  state.view='browse'; state.q=''; state.diff='全部'; state.cat='全部';
  state.favOnly=false; state.reviewOnly=false; state.detail=null;
  render({scroll:true, instant:instant});
  toast('已回到代码库首页');
}
function renderDock(){
  const label = document.getElementById('dockLabel');
  const hint = document.getElementById('dockHint');
  const setBtn = (id, opt) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(opt.title) el.title = opt.title;
    if('disabled' in opt) el.disabled = opt.disabled;
  };
  setBtn('dockBack', {disabled:NAV_STACK.length === 0, title:'返回上一个浏览位置'});
  if(state.view === 'detail'){
    const list = entryOrder();
    const i = list.findIndex(x => x.id === state.detail);
    const x = byId(state.detail);
    if(label) label.textContent = x ? x.name : '算法详情';
    if(hint) hint.textContent = (i >= 0 ? (i+1) + ' / ' + list.length + ' 条' : '条目详情');
    setBtn('dockPrev', {disabled:i <= 0, title:i > 0 ? '上一页：' + list[i-1].name : '已是第一个条目'});
    setBtn('dockNext', {disabled:i < 0 || i >= list.length-1,
      title:(i >= 0 && i < list.length-1) ? '下一页：' + list[i+1].name : '已是最后一个条目'});
  }else{
    const s = sectionIndex();
    if(label) label.textContent = VIEW_LABEL[state.view] || '代码库';
    if(hint) hint.textContent = s.ids.length ? (s.idx+1) + ' / ' + s.ids.length + ' 区段' : '区段导航';
    setBtn('dockPrev', {disabled:s.idx <= 0,
      title:s.idx > 0 ? '上一页：' + s.list[s.idx-1][1] : '已是第一个区段'});
    setBtn('dockNext', {disabled:s.idx >= s.ids.length-1,
      title:s.idx < s.ids.length-1 ? '下一页：' + s.list[s.idx+1][1] : '已是最后一个区段'});
  }
  setBtn('dockHome', {title:'回到代码库首页'});
}

function render(opts){
  captureNoteDraft();                  // 重建 DOM 前保住草稿（含换行）
  const shell = document.getElementById('shell');
  const wide = state.view !== 'browse';
  shell.classList.toggle('wide', wide);
  document.querySelectorAll('#nav [data-act="view"]').forEach(b =>
    b.classList.toggle('on', b.dataset.v === state.view));
  renderSidebar();
  let html = '';
  if(state.view === 'browse') html = renderBrowse();
  else if(state.view === 'detail') html = renderDetail(state.detail);
  else if(state.view === 'review') html = renderReview();
  else if(state.view === 'fav') html = renderFav();
  else if(state.view === 'new') html = renderNew();
  document.getElementById('main').innerHTML = html;
  if(state.view === 'browse'){
    document.getElementById('preview').innerHTML = renderPreview();
  }else{
    document.getElementById('preview').innerHTML = '';
  }
  restoreNoteDraft();                  // 重建后还原草稿
  renderSubnav();
  renderDock();
  if(opts && opts.scroll) window.scrollTo({top:0, behavior:(opts.instant ? 'auto' : 'smooth')});
  updateToTop();
}

/* ============================================================
   Actions
   ============================================================ */
function switchView(v, instant){
  pushNav();
  state.view = v;
  if(v !== 'browse') document.getElementById('sidebar').classList.remove('open');
  document.getElementById('nav').classList.remove('open');
  render({scroll:true, instant:instant});
}
function toggleFav(id){
  const i = FAV.indexOf(id);
  if(i >= 0) FAV.splice(i,1); else FAV.push(id);
  save(KEY.fav, FAV); render();
  toast(i >= 0 ? '已取消收藏' : '已加入收藏');
}
function toggleReview(id){
  const r = REVIEW[id];
  if(!r || r.mastered){
    REVIEW[id] = { last: r ? r.last : today(), next: today(), mastered:false };
    toast('已加入复习队列');
  }else{
    REVIEW[id] = { last: today(), next: shiftToday(7), mastered:true };
    toast('已标记本次复习完成');
  }
  save(KEY.review, REVIEW); render();
}
function addNote(id){
  const ta = document.getElementById('quickNote');
  const text = ta ? ta.value.trim() : '';
  if(!text){ toast('先写点内容再保存'); return; }
  if(!NOTES[id]) NOTES[id] = [];
  let msg;
  if(editingNote && editingNote.id === id){
    const n = NOTES[id][editingNote.index];
    if(n){ n.text = text; n.edited = today(); }
    msg = '批注已更新';
  }else{
    NOTES[id].unshift({ time: today(), text: text, edited: '' });
    msg = '批注已保存';
  }
  editingNote = null;
  noteDraft = '';
  save(KEY.notes, NOTES);
  const old = document.getElementById('quickNote');   // 清空后再 render，避免草稿回填
  if(old) old.value = '';
  render();
  toast(msg);
}
function exportNotes(){
  const entries = allEntries();
  let md = '# ML Atlas · 学习备注导出\n\n导出时间：'+today()+'\n\n';
  let n = 0;
  entries.forEach(x => {
    const list = NOTES[x.id] || [];
    if(!list.length) return;
    n += list.length;
    md += '## '+x.name+' ('+x.en+')\n\n';
    list.forEach(item => {
      const stamp = item.time + (item.edited ? ' · 编辑于 '+item.edited : '');
      const body = String(item.text).split('\n').join('  \n');  // 两个空格保留 Markdown 换行
      md += '**'+stamp+'**\n\n'+body+'\n\n---\n\n';
    });
  });
  if(!n){ toast('还没有备注可导出'); return; }
  download('ml-atlas-notes.md', md, 'text/markdown;charset=utf-8');
  toast('已导出 '+n+' 条备注');
}
function exportCustom(){
  if(!CUSTOM.length){ toast('还没有自定义条目，先新增或导入'); return; }
  download('ml-atlas-entries.json', JSON.stringify(CUSTOM, null, 2), 'application/json');
  toast('已导出 '+CUSTOM.length+' 个自定义条目');
}
/* 全量备份：把分散在各 localStorage 键里的状态打包成一个可带走的 JSON */
function exportBackup(){
  const payload = {
    format:'ml-atlas-backup', version:1, exportedAt:today(),
    notes:NOTES, fav:FAV, review:REVIEW, custom:CUSTOM,
    theme:load(KEY.theme,'light'), texture:(load(KEY.texture,false) === true), seeded:load(KEY.seed,false)
  };
  const noteCount = Object.keys(NOTES).reduce((s,k) => s + (Array.isArray(NOTES[k]) ? NOTES[k].length : 0), 0);
  download('ml-atlas-backup-'+today()+'.json', JSON.stringify(payload, null, 2), 'application/json');
  toast('已备份 '+noteCount+' 条备注 / '+FAV.length+' 个收藏');
}
/* 恢复：合并而非覆盖，避免把当前环境里新写的内容冲掉 */
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const b = JSON.parse(reader.result);
      if(!b || b.format !== 'ml-atlas-backup' || !Array.isArray(b.fav)){
        toast('这不是完整备份文件；批量新增条目请用「导入 JSON」'); return;
      }
      // 收藏取并集
      let favAdded = 0;
      b.fav.map(String).forEach(id => { if(!FAV.includes(id)){ FAV.push(id); favAdded++; } });
      // 备注按「时间 + 正文」去重后追加
      let noteAdded = 0;
      const srcNotes = (b.notes && typeof b.notes === 'object') ? b.notes : {};
      Object.keys(srcNotes).forEach(id => {
        const list = Array.isArray(srcNotes[id]) ? srcNotes[id] : [];
        if(!NOTES[id]) NOTES[id] = [];
        list.forEach(n => {
          if(!n || typeof n !== 'object') return;
          const text = String(n.text || '');
          if(!text) return;
          const time = String(n.time || today());
          if(NOTES[id].some(x => x && x.text === text && x.time === time)) return;
          NOTES[id].push({ time:time, text:text, edited:String(n.edited || '') });
          noteAdded++;
        });
      });
      // 复习状态：只补本地没有的，不覆盖已有进度
      let reviewAdded = 0;
      const srcReview = (b.review && typeof b.review === 'object') ? b.review : {};
      Object.keys(srcReview).forEach(id => {
        const r = srcReview[id];
        if(!REVIEW[id] && r && typeof r === 'object'){
          REVIEW[id] = { last:String(r.last || today()), next:String(r.next || today()), mastered:!!r.mastered };
          reviewAdded++;
        }
      });
      // 自定义条目按 id 去重追加
      let customAdded = 0;
      (Array.isArray(b.custom) ? b.custom : []).forEach(item => {
        if(!item || !item.id || byId(String(item.id))) return;
        CUSTOM.push(item); customAdded++;
      });
      // 护眼模式与质感模式
      if(b.theme === 'night' || b.theme === 'light'){
        document.body.dataset.theme = b.theme;
        save(KEY.theme, b.theme);
      }
      if(typeof b.texture === 'boolean'){
        TEXTURE = b.texture;
        document.body.dataset.texture = b.texture ? 'on' : 'off';
        save(KEY.texture, b.texture);
      }
      save(KEY.fav, FAV); save(KEY.notes, NOTES); save(KEY.review, REVIEW); save(KEY.custom, CUSTOM);
      save(KEY.seeded, true);
      render();
      toast('已恢复 '+noteAdded+' 条备注 / '+favAdded+' 个收藏 / '+reviewAdded+' 项复习 / '+customAdded+' 个自定义条目');
    }catch(e){
      toast('恢复失败：文件不是有效的备份 JSON');
    }
  };
  reader.readAsText(file);
}
function importCustom(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const arr = JSON.parse(reader.result);
      if(!Array.isArray(arr)) throw new Error('root');
      let added = 0;
      arr.forEach(item => {
        if(!item || !item.name || !item.code) return;
        const id = String(item.id || ('custom-'+Date.now()+'-'+added)).trim();
        if(byId(id)) return;
        CUSTOM.push({
          id, name:String(item.name), en:String(item.en || ''),
          cat: CATS.includes(item.cat) ? item.cat : CATS[0],
          diff: DIFFS.includes(item.diff) ? item.diff : '入门',
          summary:String(item.summary || ''),
          scenes: Array.isArray(item.scenes) ? item.scenes : [],
          idea: Array.isArray(item.idea) ? item.idea : [],
          deps:String(item.deps || 'Python'),
          lang:String(item.lang || 'Python 3'),
          math:(item.math && Array.isArray(item.math.formulas))
            ? {title:String(item.math.title || '公式与推导'),
               formulas:item.math.formulas.map(String),
               tex:Array.isArray(item.math.tex) ? item.math.tex.map(String) : [],
               steps:Array.isArray(item.math.steps) ? item.math.steps.map(String) : []}
            : null,
          params: Array.isArray(item.params) ? item.params : [],
          input:String(item.input || ''), output:String(item.output || ''),
          code:String(item.code), updated: today()
        });
        added++;
      });
      save(KEY.custom, CUSTOM);
      render(); toast('已导入 '+added+' 个条目');
    }catch(e){
      toast('导入失败：需要条目数组的 JSON 文件');
    }
  };
  reader.readAsText(file);
}
function saveEntry(){
  const val = id => { const el = document.getElementById('f_'+id); return el ? el.value.trim() : ''; };
  const codeEl = document.getElementById('f_code');
  const name = val('name'), code = codeEl ? codeEl.value.trim() : '';
  const summary = val('summary');
  if(!name || !code || !summary){ toast('名称、简介、代码为必填项'); return; }
  const parseList = s => s.split(/[；;]/).map(x => x.trim()).filter(Boolean);
  const parseMath = () => {
    const el = document.getElementById('f_math');
    const raw = el ? el.value.trim() : '';
    if(!raw) return null;
    const parts = raw.split(/\n\s*---\s*\n/);
    const formulas = (parts[0] || '').split('\n').map(s => s.trim()).filter(Boolean);
    const steps = (parts[1] || '').split('\n').map(s => s.trim()).filter(Boolean);
    return formulas.length
      ? {title: val('mathTitle') || '公式与推导', formulas: formulas, steps: steps}
      : null;
  };
  const params = parseList(val('params')).map(row => {
    const p = row.split('|').map(x => x.trim());
    return [p[0] || 'param', p[1] || '—', p[2] || '说明待补充'];
  });
  const id = 'custom-'+Date.now();
  CUSTOM.push({
    id, name, en: val('en') || name, cat: val('cat') || CATS[0],
    diff: val('diff') || '入门', summary,
    scenes: parseList(val('scenes')), idea: parseList(val('idea')),
    deps: val('deps') || 'Python', lang: val('lang') || 'Python 3',
    math: parseMath(), params,
    input: val('input') || '—', output: val('output') || '—',
    code, updated: today()
  });
  save(KEY.custom, CUSTOM);
  state.selected = id;
  switchView('browse');
  toast('条目已保存并归档到「'+(val('cat') || CATS[0])+'」');
}
function updatePreview(){
  const g = id => document.getElementById(id);
  const name = g('f_name'), diff = g('f_diff'), cat = g('f_cat'),
        sum = g('f_summary'), code = g('f_code');
  if(!name) return;
  g('pv_name').textContent = name.value || '未命名算法';
  const langEl = g('f_lang');
  if(g('pv_lang')) g('pv_lang').textContent = (langEl && langEl.value) || 'Python 3';
  g('pv_diff').textContent = diff ? diff.value : '入门';
  g('pv_diff').className = 'pill '+diffClass(diff ? diff.value : '入门');
  g('pv_cat').textContent = cat ? cat.value : CATS[0];
  g('pv_summary').textContent = sum.value || '填写简介后，这里会显示条目摘要。';
  g('pv_code').innerHTML = codeHTML((code ? code.value : '') || '# 等待粘贴代码', 8);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch(act){
    case 'view': switchView(t.dataset.v); break;
    case 'toggle-side':
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('nav').classList.toggle('open');
      break;
    case 'cat':
      state.cat = t.dataset.cat === '全部' ? '全部' : (state.cat === t.dataset.cat ? '全部' : t.dataset.cat);
      state.view = 'browse'; render(); break;
    case 'diff': state.diff = t.dataset.d; render(); break;
    case 'fav-only': state.favOnly = !state.favOnly; render(); break;
    case 'review-only': state.reviewOnly = !state.reviewOnly; render(); break;
    case 'clear':
      state.q=''; state.diff='全部'; state.cat='全部';
      state.favOnly=false; state.reviewOnly=false; render(); break;
    case 'select':
      state.selected = id;
      if(state.view !== 'browse'){ state.detail = id; switchView('detail'); }
      else render();
      break;
    case 'detail': state.detail = id; state.selected = id; switchView('detail'); break;
    case 'copy': {
      const x = byId(id);
      if(x) copyText(x.code, '已复制「'+x.name+'」完整代码');
      break;
    }
    case 'fav': e.stopPropagation(); toggleFav(id); break;
    case 'review': e.stopPropagation(); toggleReview(id); break;
    case 'done':
      REVIEW[id] = { last: today(), next: shiftToday(7), mastered:true };
      save(KEY.review, REVIEW); render(); toast('已完成本次复习，下次 '+shiftToday(7));
      break;
    case 'add-note': addNote(id); break;
    case 'edit-note': {
      const i = Number(t.dataset.i);
      const n = (NOTES[id] || [])[i];
      if(!n) break;
      editingNote = {id:id, index:i};
      noteDraft = n.text;
      render();
      const ta = document.getElementById('quickNote');
      if(ta){
        ta.value = n.text;
        noteDraft = n.text;
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
      toast('已载入批注，修改后点「保存修改」');
      break;
    }
    case 'cancel-edit': {
      editingNote = null;
      noteDraft = '';
      const old = document.getElementById('quickNote');
      if(old) old.value = '';
      render(); break;
    }
    case 'del-note': {
      const i = Number(t.dataset.i);
      if(NOTES[id]){ NOTES[id].splice(i,1); if(!NOTES[id].length) delete NOTES[id]; }
      if(editingNote && editingNote.id === id){       // 删除后索引会变，退出编辑态
        editingNote = null;
        noteDraft = '';
        const old = document.getElementById('quickNote');
        if(old) old.value = '';
      }
      save(KEY.notes, NOTES); render(); break;
    }
    case 'export-notes': exportNotes(); break;
    case 'export-json': exportCustom(); break;
    case 'export-backup': exportBackup(); break;
    case 'import-backup': { const f = document.getElementById('backupFile'); if(f) f.click(); break; }
    case 'export-py': {
      const x = byId(id);
      if(x) download(x.id+'.py', '# '+x.name+' / '+x.deps+'\n'+x.code+'\n', 'text/x-python;charset=utf-8');
      break;
    }
    case 'import-json': { const f = document.getElementById('importFile'); if(f) f.click(); break; }
    case 'save-entry': saveEntry(); break;
    case 'clear-form':
      document.querySelectorAll('.form input,.form textarea').forEach(el => el.value='');
      updatePreview(); break;
    case 'copy-formula': {
      const x = byId(id);
      if(x && x.math && x.math.formulas) copyText(x.math.formulas.join('\n'), '已复制公式文本');
      break;
    }
    case 'dock-back': goBack(); break;
    case 'dock-prev': goSibling(-1); break;
    case 'dock-next': goSibling(1); break;
    case 'dock-home': goHome(); break;
    case 'anchor': {
      const el = document.getElementById(t.dataset.target);
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
      break;
    }
    case 'totop': window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'focus-search':
      switchView('browse');
      setTimeout(() => { const s = document.getElementById('searchInput'); if(s) s.focus(); }, 0);
      break;
    case 'theme': {
      const next = document.body.dataset.theme === 'night' ? 'light' : 'night';
      document.body.dataset.theme = next; save(KEY.theme, next);
      toast(next === 'night' ? '已切换护眼模式' : '已恢复浅色模式');
      break;
    }
    case 'texture': {
      TEXTURE = !TEXTURE;
      document.body.dataset.texture = TEXTURE ? 'on' : 'off';
      save(KEY.texture, TEXTURE);
      toast(TEXTURE ? '已开启质感模式' : '已回到简洁模式');
      break;
    }
  }
});

let composing = false;
let searchTimer = 0;
function scheduleGrid(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderGridOnly, 150);   // 局部更新 + 防抖
}
document.addEventListener('compositionstart', e => {
  if(e.target.id === 'searchInput') composing = true;
});
document.addEventListener('compositionend', e => {
  if(e.target.id !== 'searchInput') return;
  composing = false;
  state.q = e.target.value;
  scheduleGrid();
});
document.addEventListener('input', e => {
  if(e.target.id === 'searchInput'){
    state.q = e.target.value;
    if(composing) return;            // 中文输入法组合期间不重绘，避免打断候选词
    scheduleGrid();                  // 输入框本身不再重建，光标与 IME 自然保持
  }
  if(e.target.dataset && e.target.dataset.preview) updatePreview();
});
document.addEventListener('change', e => {
  if(e.target.id === 'importFile' && e.target.files[0]){
    importCustom(e.target.files[0]); e.target.value = '';
  }
  if(e.target.id === 'backupFile' && e.target.files[0]){
    importBackup(e.target.files[0]); e.target.value = '';
  }
  if(e.target.id === 'f_cat' || e.target.id === 'f_diff') updatePreview();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.activeElement &&
     document.activeElement.id === 'quickNote'){
    e.preventDefault();
    const nid = currentNoteId();
    if(nid) addNote(nid);
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('.entry')){
    e.preventDefault();
    e.target.click();
  }
  if(e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault();
    switchView('browse', true);
    setTimeout(() => { const s = document.getElementById('searchInput'); if(s) s.focus(); }, 0);
  }
  if(e.key === 'Escape' && state.view !== 'browse') switchView('browse', true);
  if(e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); goSibling(-1, true); }
  if(e.altKey && e.key === 'ArrowRight'){ e.preventDefault(); goSibling(1, true); }
  if(e.key === 'Home' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault(); goHome(true);
  }
});

/* init */
document.body.dataset.theme = load(KEY.theme, 'light');
document.body.dataset.texture = (load(KEY.texture, false) === true) ? 'on' : 'off';
// canonical 只在已部署到 HTTP(S) 时声明，避免 file:// 生成无意义的地址
if(typeof location !== 'undefined' && document.head && document.createElement &&
   (location.protocol === 'https:' || location.protocol === 'http:')){
  const canonical = document.createElement('link');
  canonical.rel = 'canonical';
  canonical.href = location.origin + location.pathname;
  document.head.appendChild(canonical);
}
render();
