  {"id":"simclr","name":"SimCLR 对比学习","en":"Simple Contrastive Learning (SimCLR)","cat":"自监督与对比学习","diff":"高难","summary":"不用任何标签：同一张图做两种随机增强视为“正对”，batch 内其余样本都是“负对”，用 NT-Xent 损失把正对拉近、负对推远，学出的特征迁移到下游任务即可逼近有监督效果。","scenes":["无标签预训练","图像特征学习","少样本迁移","医学/工业小标注数据"],"idea":["每张图随机取两种增强（随机裁剪+颜色抖动+模糊），得到两个视图作为正样本对","编码器 f(·) 提特征，再经投影头 g(·)（两层 MLP）映射到对比空间——投影头只在预训练时用，下游任务丢弃它、只留 f","损失 NT-Xent：对每个正对算余弦相似度，用 softmax 在“1 个正 + 2N−2 个负”上做交叉熵","关键结论：batch 越大负样本越多、效果越好；强增强组合（裁剪+颜色）比单一增强收益大得多"],"deps":"PyTorch 2.2 · torchvision","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"NT-Xent 归一化温度交叉熵","formulas":["sim(z_i, z_j) = z_iᵀ z_j / (‖z_i‖·‖z_j‖)","ℓ_{i,j} = −log [ exp( sim(z_i,z_j)/τ ) / Σ_{k≠i} exp( sim(z_i,z_k)/τ ) ]","L = (1/2N) Σ_{k=1}^{N} [ ℓ(2k−1, 2k) + ℓ(2k, 2k−1) ]"],"steps":["一个 batch 取 N 张图，各自做两次随机增强，得到 2N 个视图。","过编码器与投影头得到 2N 个向量，做 L2 归一化后计算 2N×2N 的余弦相似度矩阵。","对每个样本，把它的另一个视图当作唯一正类，其余 2N−2 个视为负类，算温度缩放的交叉熵。","总损失对 2N 个样本取平均，反传只更新编码器与投影头；负样本全来自当前 batch，无需额外内存库。"],"tex":["\\mathrm{sim}(z_i,z_j)=\\frac{z_i^{\\top}z_j}{\\lVert z_i\\rVert\\lVert z_j\\rVert}","\\ell_{i,j}=-\\log\\frac{\\exp(\\mathrm{sim}(z_i,z_j)/\\tau)}{\\sum_{k\\ne i}\\exp(\\mathrm{sim}(z_i,z_k)/\\tau)}","L=\\frac{1}{2N}\\sum_{k=1}^{N}\\bigl[\\ell(2k-1,2k)+\\ell(2k,2k-1)\\bigr]"]},"params":[["temperature","float","0.5","温度系数 τ，正浮点数，默认 0.5（SimCLR 论文取值）。τ 越小越强调最难区分的负样本、特征越锐利，过小（<0.1）会让训练不稳定。"],["proj_dim","int","128","投影头输出维度，正整数，默认 128。只影响预训练阶段的对比空间，下游任务用编码器输出而非它。"],["batch_size","int","512","每批图像数 N，正整数，默认 512（实际负样本 2N−2）。SimCLR 对 batch 极敏感，少于 256 时效果明显退化。"],["lr","float","1e-3","学习率，正浮点数，默认 1e-3，无单位。原论文用 LARS 优化器并随 batch 线性缩放，用 Adam 时可从 1e-3 起。"],["epochs","int","200","预训练轮数，正整数，默认 200。对比学习收敛慢，ImageNet 上原论文训 1000 轮；小数据集 100–200 轮可看到明显迁移收益。"]],"input":"x1, x2: torch.Tensor [N, 3, H, W]  (同批图像的两种增强视图)","output":"z1, z2: torch.Tensor [N, proj_dim]  (L2 归一化后的对比特征)\nloss: torch.Tensor (标量)","code":"import torch, torch.nn as nn, torch.nn.functional as F\n\ndef nt_xent(z1, z2, tau=0.5):\n    N = z1.size(0)\n    z1, z2 = F.normalize(z1, dim=1), F.normalize(z2, dim=1)\n    z = torch.cat([z1, z2], 0)                     # [2N, d]\n    sim = z @ z.t() / tau                          # 余弦相似度矩阵\n    sim.fill_diagonal_(-1e9)                       # 排除自身\n    # 正样本：i 与 i+N 互为视图\n    idx = torch.arange(2 * N, device=z.device)\n    pos = torch.cat([idx[N:], idx[:N]])\n    return F.cross_entropy(sim, pos)\n\nclass SimCLR(nn.Module):\n    def __init__(self, backbone, feat_dim=2048, proj_dim=128):\n        super().__init__()\n        self.encoder = backbone                     # 下游只用它\n        self.proj = nn.Sequential(                  # 投影头，预训练后丢弃\n            nn.Linear(feat_dim, feat_dim), nn.ReLU(),\n            nn.Linear(feat_dim, proj_dim))\n\n    def forward(self, x1, x2):\n        h1, h2 = self.encoder(x1), self.encoder(x2)\n        return self.proj(h1), self.proj(h2)\n\n# 训练一步\n# z1, z2 = model(v1, v2)\n# loss = nt_xent(z1, z2, tau=0.5)\n# opt.zero_grad(); loss.backward(); opt.step()"},
  {"id":"moco-v2","name":"MoCo v2 动量对比","en":"Momentum Contrast v2 (MoCo v2)","cat":"自监督与对比学习","diff":"高难","summary":"用“队列 + 动量编码器”把负样本从 batch 里解放出来：队列存历史特征提供成千上万个负样本，动量编码器缓慢跟随主干，保证队列里新旧特征分布一致。","scenes":["显存受限下的对比学习","大负样本池","无标签预训练","检测/分割预训练"],"idea":["维护一个长度为 K 的特征队列，每步把当前 batch 的特征入队、最老的出队，负样本量不再受 batch 限制","动量编码器 θ_k ← m·θ_k + (1−m)·θ_q 缓慢跟随查询编码器，使队列中不同时刻的特征可比","损失为 InfoNCE：查询 q 与唯一正键 k+ 相似度做分子，与队列中全部 K 个键做分母","v2 相比 v1 的改进：加 MLP 投影头、加入高斯模糊等更强增强，小 batch 下也能追上 SimCLR"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"InfoNCE 与动量更新","formulas":["L_q = −log [ exp(q·k₊/τ) / Σ_{i=0}^{K} exp(q·k_i/τ) ]","θ_k ← m·θ_k + (1−m)·θ_q ,  m ∈ [0.9, 0.999]","队列：enqueue(k_batch) 后 dequeue(最老 batch)，长度恒为 K"],"steps":["同一张图两种增强：v1 过查询编码器得 q，v2 过动量编码器得 k（k 不回传梯度）。","把 q 与队列中所有键做点积，唯一的正样本是当前 batch 对应的 k，其余全为负样本。","按 InfoNCE 计算交叉熵损失，只更新查询编码器；动量编码器由 θ_q 经 EMA 同步。","当前 batch 的 k 入队、最老的一批出队。队列让负样本数 K 远大于 batch size，且无需大显存。"],"tex":["L_q=-\\log\\frac{\\exp(q\\cdot k_{+}/\\tau)}{\\sum_{i=0}^{K}\\exp(q\\cdot k_i/\\tau)}","\\theta_k\\leftarrow m\\theta_k+(1-m)\\theta_q,\\quad m\\in[0.9,\\,0.999]","\\text{queue}=[k_{t-K+1},\\ldots,k_{t}],\\quad |\\text{queue}|=K"]},"params":[["queue_size","int","65536","动量队列长度 K，正整数，默认 65536。越大负样本越多、特征越好，但占用显存为 K×dim×4 字节，需按显存调整。"],["momentum","float","0.999","动量编码器 EMA 系数 m，0–1，默认 0.999。越接近 1 动量编码器越稳、队列一致性越好，但跟踪主干过慢；常用 0.99–0.9995。"],["temperature","float","0.2","InfoNCE 温度 τ，正浮点数，默认 0.2。MoCo 系列比 SimCLR 用更小的 τ，越小越聚焦困难负样本。"],["proj_dim","int","128","投影头输出维度，正整数，默认 128。v2 加入 MLP 投影头后小 batch 下提升明显。"],["lr","float","3e-4","查询编码器学习率，正浮点数，默认 3e-4，无单位。动量编码器不参与优化，只由 EMA 更新。"]],"input":"im_q: torch.Tensor [N, 3, H, W]\nim_k: torch.Tensor [N, 3, H, W]","output":"logits: torch.Tensor [N, 1 + K]  (第 0 列为正样本)\nloss: torch.Tensor (标量)","code":"import torch, torch.nn as nn, torch.nn.functional as F\n\[邮箱已脱敏]()\ndef momentum_update(enc_q, enc_k, m=0.999):\n    for pq, pk in zip(enc_q.parameters(), enc_k.parameters()):\n        pk.mul_(m).add_(pq.detach(), alpha=1 - m)\n\nclass MoCo(nn.Module):\n    def __init__(self, enc_q, enc_k, dim=128, K=65536, m=0.999, tau=0.2):\n        super().__init__()\n        self.enc_q, self.enc_k = enc_q, enc_k\n        self.K, self.m, self.tau = K, m, tau\n        # 队列里的键与正样本键都 L2 归一化，点积即余弦相似度\n        self.register_buffer('queue', F.normalize(torch.randn(dim, K), dim=0))\n        self.register_buffer('queue_ptr', torch.zeros(1, dtype=torch.long))\n\n    @torch.no_grad()\n    def enqueue(self, keys):\n        bs = keys.size(0)\n        ptr = int(self.queue_ptr)\n        self.queue[:, ptr:ptr + bs] = keys.t()             # 环形入队\n        self.queue_ptr[0] = (ptr + bs) % self.K\n\n    def forward(self, im_q, im_k):\n        q = F.normalize(self.enc_q(im_q), dim=1)           # [N, d]\n        with torch.no_grad():\n            k = F.normalize(self.enc_k(im_k), dim=1)       # 不回传梯度\n        l_pos = (q * k).sum(1, keepdim=True)               # [N, 1]\n        l_neg = q @ self.queue.clone().detach()            # [N, K]\n        logits = torch.cat([l_pos, l_neg], 1) / self.tau\n        labels = torch.zeros(logits.size(0), dtype=torch.long, device=q.device)\n        loss = F.cross_entropy(logits, labels)\n        self.enqueue(k)\n        momentum_update(self.enc_q, self.enc_k, self.m)\n        return logits, loss"},
  {"id":"kv-cache","name":"KV 缓存增量解码","en":"KV Cache for Autoregressive Decoding","cat":"LLM 与参数高效微调","diff":"进阶","summary":"自回归生成时把每层已算过的 Key/Value 缓存下来，新 token 只算自己那一份注意力，把每步复杂度从 O(L²) 降到 O(L)，是让长文本生成可用的必备工程手段。","scenes":["LLM 推理加速","长文本生成","流式输出","批处理推理服务"],"idea":["因果注意力下第 t 个 token 只依赖前 t−1 个 token 的 K/V，而这些值一旦算出就不会再变","把各层每步产生的 K、V 追加进缓存张量；解码新 token 时只需为它算一份 q,k,v 并与缓存拼接","不做缓存时每生成一个 token 都要重算整段前缀，总复杂度 O(L³)；做缓存后整段生成降到 O(L²)","显存代价：2 × layers × heads × L × d_head × bytes，长上下文时往往比权重本身还大——这就是 PagedAttention 等显存管理方案要解决的问题"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"增量注意力与显存开销","formulas":["K_t = [K_{<t} ; k_t] ,  V_t = [V_{<t} ; v_t]","attn_t = softmax( q_t K_tᵀ / √d_k ) V_t，只算新的 q_t，不重算历史","缓存显存 ≈ 2 × n_layers × n_kv_heads × L × d_head × dtype_bytes"],"steps":["预填充阶段（prefill）：一次性把整段 prompt 送进模型，得到各层 K、V 并存入缓存。","解码阶段（decode）：只输入上一个新 token，q/k/v 均为长度 1，与缓存拼接后在长度 L+1 上算注意力。每步代价从 O(t²d) 降到 O(td)，整段生成从 O(L³d) 降到 O(L²d)。","把新算出的 k、v 追加到缓存尾部，缓存长度 +1，循环直到遇到结束符或达到最大长度。","批处理时各序列长度不一，需要 padding 或分页管理；KV 缓存的显存占用直接决定能并发多少请求。"],"tex":["K_t=[K_{<t};k_t],\\quad V_t=[V_{<t};v_t]","\\mathrm{attn}_t=\\mathrm{softmax}\\bigl(q_tK_t^{\\top}/\\sqrt{d_k}\\bigr)V_t","\\text{cache}=2\\cdot n_{\\mathrm{layers}}\\cdot n_{\\mathrm{kv}}\\cdot L\\cdot d_{\\mathrm{head}}\\cdot b"]},"params":[["max_len","int","2048","缓存支持的最大序列长度，正整数，默认 2048（即 max_position + generated）。须不小于 prompt 长度与生成长度之和，否则会溢出。"],["n_layers","int","—","Transformer 层数，正整数，须与模型一致。每层各存一份 K/V 缓存，层数翻倍则缓存显存翻倍。"],["n_kv_heads","int","—","K/V 头数，正整数。采用 GQA/MQA 时小于注意力头数（如 8 头但 1 个 KV 头），可直接把缓存压到 1/8。"],["d_head","int","—","每个注意力头的维度，正整数，等于 hidden / n_heads，无单位。缓存元素数 = 2·layers·kv_heads·L·d_head。"],["dtype","str","'fp16'","缓存数据类型，可取 fp32/fp16/bf16/int8，默认 fp16。半精度可省一半显存且精度损失通常可忽略，int8 量化需配套反量化。"]],"input":"input_ids: torch.LongTensor [B, 1]  (解码阶段单个新 token)\npast_kv: List[Tuple[Tensor]]  (长度 n_layers，每个 (k, v) 形状 [B, H, L, d_head])","output":"logits: torch.Tensor [B, 1, vocab]\npresent_kv: List[Tuple[Tensor]]  (长度 L+1 的新缓存)","code":"import torch, torch.nn as nn\n\nclass CachedAttention(nn.Module):\n    def __init__(self, d_model, n_heads, max_len=2048):\n        super().__init__()\n        self.h, self.dh = n_heads, d_model // n_heads\n        self.qkv = nn.Linear(d_model, 3 * d_model)\n        self.proj = nn.Linear(d_model, d_model)\n        # 预分配缓存：B 维按需 expand，避免每步重新 malloc\n        self.register_buffer('k_cache', torch.zeros(1, n_heads, max_len, self.dh), persistent=False)\n        self.register_buffer('v_cache', torch.zeros(1, n_heads, max_len, self.dh), persistent=False)\n\n    def forward(self, x, start_pos=0):\n        B, T, _ = x.shape\n        q, k, v = self.qkv(x).chunk(3, dim=-1)\n        # [B, T, H*dh] -> [B, H, T, dh]\n        q = q.view(B, T, self.h, self.dh).transpose(1, 2)\n        k = k.view(B, T, self.h, self.dh).transpose(1, 2)\n        v = v.view(B, T, self.h, self.dh).transpose(1, 2)\n\n        # 写入缓存（解码时 T 通常为 1）\n        self.k_cache[:, :, start_pos:start_pos + T] = k\n        self.v_cache[:, :, start_pos:start_pos + T] = v\n        K = self.k_cache[:, :, :start_pos + T]\n        V = self.v_cache[:, :, :start_pos + T]\n\n        # 增量注意力：q 只有 T 步，K/V 有 start_pos+T 步\n        att = (q @ K.transpose(-1, -2)) / (self.dh ** 0.5)\n        L = start_pos + T\n        mask = torch.ones(T, L, device=x.device).tril(diagonal=start_pos)\n        att = att.masked_fill(mask == 0, float('-inf')).softmax(-1)\n        out = (att @ V).transpose(1, 2).reshape(B, T, -1)\n        return self.proj(out), start_pos + T\n\n# 生成循环：每次只喂 1 个 token，pos 不断前移\n# pos = 0\n# for _ in range(max_new):\n#     logits, pos = model(last_token, pos)   # 复用缓存，不重算前缀\n#     last_token = logits[:, -1:].argmax(-1)"},
  {"id":"ia3","name":"IA³ 抑制与放大微调","en":"Infused Adapter by Inhibiting and Amplifying (IA³)","cat":"LLM 与参数高效微调","diff":"高难","summary":"只学三个极小的缩放向量，分别乘到 K、V 和 FFN 中间激活上，参数量比 LoRA 少一个数量级却能在多数任务上追平全量微调。","scenes":["极低参数微调","多任务多适配器切换","指令微调","显存极度受限"],"idea":["在注意力的 K 与 V 后面各乘一个长度为 d_head 的可学习向量（逐维缩放），相当于重新加权“关注什么/传递什么信息”","在前馈网络的中间激活（升维后、激活函数后）乘一个长度为 d_ff 的向量，抑制或放大特定神经元","只训练这三个向量，其余全部冻结；参数量通常仅为全量参数的 0.01% 量级","初始化全为 1：训练起点与原始模型完全等价，不会像随机初始化 Adapter 那样先掉点再恢复"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"三处逐维缩放","formulas":["K′ = K ⊙ l_k ,  V′ = V ⊙ l_v ,  其中 l_k, l_v ∈ R^{d_head}","h′ = ( γ(W_1 x) ⊙ l_ff ) W_2 ,  其中 l_ff ∈ R^{d_ff}","可训练参数 ≈ n_layers × (2·d_head + d_ff)，其余权重冻结"],"steps":["在每层注意力的 K、V 投影后插入逐维乘法，缩放向量初始化为全 1。","在 FFN 的激活之后插入逐维乘法，同样初始化为全 1，保证初始输出与原模型一致。","训练时只打开这三组向量的 requires_grad，主干与 embedding 全部冻结。","推理时可把缩放向量吸收进相邻的线性层权重（W·diag(l)），从而零额外延迟。"],"tex":["K\\prime=K\\odot l_k,\\quad V\\prime=V\\odot l_v","h\\prime=\\bigl(\\gamma(W_1x)\\odot l_{ff}\\bigr)W_2","l_k,l_v\\in\\mathbb R^{d_{\\mathrm{head}}},\\; l_{ff}\\in\\mathbb R^{d_{ff}}"]},"params":[["d_head","int","—","单头维度，正整数（等于 d_model / n_heads），决定 l_k、l_v 的长度，无单位。"],["d_ff","int","—","FFN 中间层维度，正整数（通常 4×d_model），决定 l_ff 的长度，也是 IA³ 参数量的主要来源。"],["init_value","float","1.0","缩放向量初值，正浮点数，默认 1.0。必须为 1 才能保证初始输出等价原模型；设为其它值会引入随机扰动。"],["lr","float","1e-3","仅缩放向量的学习率，正浮点数，默认 1e-3，无单位。可训练参数极少，可用比全量微调大 10 倍的学习率快速收敛。"]],"input":"x: torch.Tensor [B, T, d_model]\nl_k, l_v: torch.Tensor [d_head]\nl_ff: torch.Tensor [d_ff]","output":"out: torch.Tensor [B, T, d_model]  (与输入同形状)","code":"import torch, torch.nn as nn, math\n\nclass IA3Attention(nn.Module):\n    \"\"\"在 K、V 上做逐维缩放；只训练 l_k、l_v\"\"\"\n    def __init__(self, d_model, n_heads):\n        super().__init__()\n        self.h, self.dh = n_heads, d_model // n_heads\n        self.qkv = nn.Linear(d_model, 3 * d_model)\n        self.proj = nn.Linear(d_model, d_model)\n        for p in self.qkv.parameters(): p.requires_grad = False\n        for p in self.proj.parameters(): p.requires_grad = False\n        self.l_k = nn.Parameter(torch.ones(self.dh))   # 初始为 1，等价原模型\n        self.l_v = nn.Parameter(torch.ones(self.dh))\n\n    def forward(self, x):\n        B, T, _ = x.shape\n        q, k, v = self.qkv(x).chunk(3, -1)\n        q = q.view(B, T, self.h, self.dh).transpose(1, 2)\n        k = k.view(B, T, self.h, self.dh).transpose(1, 2) * self.l_k   # 抑制/放大 键\n        v = v.view(B, T, self.h, self.dh).transpose(1, 2) * self.l_v   # 抑制/放大 值\n        att = (q @ k.transpose(-1, -2) / math.sqrt(self.dh)).softmax(-1)\n        return self.proj((att @ v).transpose(1, 2).reshape(B, T, -1))\n\nclass IA3FFN(nn.Module):\n    def __init__(self, d_model, d_ff):\n        super().__init__()\n        self.fc1 = nn.Linear(d_model, d_ff)\n        self.fc2 = nn.Linear(d_ff, d_model)\n        for p in list(self.fc1.parameters()) + list(self.fc2.parameters()):\n            p.requires_grad = False\n        self.l_ff = nn.Parameter(torch.ones(d_ff))\n\n    def forward(self, x):\n        return self.fc2(nn.functional.gelu(self.fc1(x)) * self.l_ff)"},
  {"id":"adapter","name":"Adapter 瓶颈适配器","en":"Bottleneck Adapter Tuning","cat":"LLM 与参数高效微调","diff":"进阶","summary":"在每个 Transformer 子层后插入一个“降维-激活-升维”的小瓶颈模块，只训这部分参数；靠残差连接保证初始等价于原模型，是多任务适配器路线的开山之作。","scenes":["多任务适配","跨语言迁移","参数高效微调","一个主干多份技能"],"idea":["Adapter 结构：x → 降维线性层（d→r）→ 激活 → 升维线性层（r→d）→ 残差相加","瓶颈维度 r 远小于 d（如 d=768 取 r=64），参数量约占主干的 1%–5%","升维层权重零初始化 + 残差：训练起点输出恒等于输入，不会破坏预训练能力","每个任务训练一份独立 Adapter，主干共享；推理时按任务切换，避免多份全量模型"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"瓶颈残差与零初始化","formulas":["h = x + W_up · act( W_down · x )","W_down ∈ R^{r×d} ,  W_up ∈ R^{d×r} ,  r ≪ d","W_up ← 0  ⇒  h = x  (训练初始等价于恒等映射)"],"steps":["在注意力和 FFN 之后各插入一个 Adapter；LayerNorm 保持在子层之前（Pre-LN 结构）。","降维把 d 维压到 r 维瓶颈，再升回 d 维，形成信息瓶颈迫使适配参数只学任务相关的低秩增量。","升维层零初始化，因此初始时 Adapter 分支输出为 0，残差直通，模型行为与预训练完全一致。","训练时冻结主干全部参数，只更新 Adapter 与 LayerNorm；推理可把 W_up·W_down 预乘合并回主干以省延迟。"],"tex":["h=x+W_{\\mathrm{up}}\\,\\varphi(W_{\\mathrm{down}}x)","W_{\\mathrm{down}}\\in\\mathbb R^{r\\times d},\\quad W_{\\mathrm{up}}\\in\\mathbb R^{d\\times r}","W_{\\mathrm{up}}\\leftarrow 0\\;\\Rightarrow\\;h=x"]},"params":[["d_model","int","—","主干隐藏维度，正整数（如 BERT-base 为 768），决定 Adapter 的输入输出宽度，无单位。"],["bottleneck","int","64","瓶颈维度 r，正整数，默认 64。r 越小参数越少、容量越低；r 取 d/8~d/4 通常能在效果与成本间取得平衡。"],["adapter_dropout","float","0.1","Adapter 内部 dropout 比例，0–1，默认 0.1。小样本微调时提高可抗过拟合，数据充足时降到 0。"],["ln_before","bool","true","是否在 Adapter 前加 LayerNorm，布尔值，默认 True。先归一化能让瓶颈层输入尺度稳定，训练更不易发散。"],["lr","float","1e-3","Adapter 参数学习率，正浮点数，默认 1e-3，无单位。可训练参数少，通常比全量微调的学习率大 1–2 个数量级。"]],"input":"x: torch.Tensor [B, T, d_model]","output":"out: torch.Tensor [B, T, d_model]  (残差相加后的结果)","code":"import torch, torch.nn as nn\n\nclass Adapter(nn.Module):\n    \"\"\"瓶颈残差适配器：零初始化升维层，初始等价恒等映射\"\"\"\n    def __init__(self, d_model, bottleneck=64, dropout=0.1, ln_before=True):\n        super().__init__()\n        self.ln = nn.LayerNorm(d_model) if ln_before else nn.Identity()\n        self.down = nn.Linear(d_model, bottleneck)\n        self.act = nn.GELU()\n        self.up = nn.Linear(bottleneck, d_model)\n        self.drop = nn.Dropout(dropout)\n        # 关键：升维层零初始化，保证训练开始时 h = x\n        nn.init.zeros_(self.up.weight)\n        nn.init.zeros_(self.up.bias)\n\n    def forward(self, x):\n        h = self.ln(x)\n        h = self.up(self.drop(self.act(self.down(h))))\n        return x + h                            # 残差直通\n\nclass BlockWithAdapter(nn.Module):\n    def __init__(self, attn, ffn, d_model, bottleneck=64):\n        super().__init__()\n        self.attn, self.ffn = attn, ffn\n        self.adapter_attn = Adapter(d_model, bottleneck)\n        self.adapter_ffn = Adapter(d_model, bottleneck)\n        for m in (self.attn, self.ffn):         # 冻结主干\n            for p in m.parameters(): p.requires_grad = False\n\n    def forward(self, x):\n        x = self.adapter_attn(self.attn(x) + x)\n        x = self.adapter_ffn(self.ffn(x) + x)\n        return x\n\ndef trainable_params(model):\n    return sum(p.numel() for p in model.parameters() if p.requires_grad)"},
  {"id":"focal-loss","name":"焦点损失 Focal Loss","en":"Focal Loss","cat":"损失函数与评估指标","diff":"进阶","summary":"给交叉熵乘一个 (1−p_t)^γ 的调制因子，让大量“已经学得很好”的简单负样本几乎不贡献梯度，从而把训练注意力集中到难分的少数样本上——RetinaNet 解决单阶段检测正负样本极度失衡的关键。","scenes":["目标检测前景背景失衡","极度类别不平衡分类","难样本挖掘","长尾分布"],"idea":["标准交叉熵对每个样本一视同仁，而检测任务里一张图可能有十万个背景框、只有十几个前景，简单负样本的总损失会淹没正样本","调制因子 (1−p_t)^γ：样本越容易（p_t 接近 1），因子越接近 0，损失被压下去；难样本 p_t 小，因子接近 1，损失基本保留","γ=0 时退化为普通交叉熵；γ=2 是原论文的推荐值，难样本的损失相对权重被放大约 1000 倍","常配 α 平衡因子：α 抑制负样本总量，γ 聚焦难样本，两者一起用效果最好"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"调制交叉熵","formulas":["p_t = p  若 y=1；p_t = 1−p  若 y=0","FL(p_t) = −α_t · (1 − p_t)^γ · log(p_t)","γ=0 且 α=1 时退化为标准交叉熵 CE = −log p_t"],"steps":["由网络输出的概率 p 与真实标签 y 算出 p_t：正类取 p，负类取 1−p。","计算调制因子 (1−p_t)^γ：p_t 越接近 1 因子越小，简单样本的损失被大幅衰减。","乘上类别平衡权重 α_t 后与 log(p_t) 相乘，得到单个样本的 Focal 损失。","对 batch 取平均后反传；注意 γ 会改变有效学习率，换用 Focal 后通常需重新调 lr。"],"tex":["p_t=\\begin{cases}p & y=1\\\\ 1-p & y=0\\end{cases}","\\mathrm{FL}(p_t)=-\\alpha_t(1-p_t)^{\\gamma}\\log(p_t)","\\gamma=0,\\alpha=1\\;\\Rightarrow\\;\\mathrm{CE}=-\\log p_t"]},"params":[["gamma","float","2.0","聚焦参数 γ，非负浮点数，默认 2.0。γ 越大越只关注极难样本；γ=0 退化为交叉熵，γ>5 时训练常因梯度过小而停滞。"],["alpha","float","0.25","正类权重 α，0–1 浮点数，默认 0.25（原论文取值）。α 越小越抑制正样本、越大越抑制负样本，需与正负样本比例匹配。"],["reduction","str","'mean'","归约方式，可选 mean/sum/none，默认 mean。选 none 可拿到逐样本损失用于自定义加权或难样本筛选。"],["label_smooth","float","0.0","标签平滑系数，0–0.1，默认 0.0（不平滑）。与 Focal 同用时平滑会抬高高置信样本的 p_t，削弱聚焦效果，一般保持 0。"]],"input":"logits: torch.Tensor [N, C]\ntarget: torch.LongTensor [N]  (类别索引)","output":"loss: torch.Tensor (标量或 [N]，取决于 reduction)","code":"import torch, torch.nn as nn, torch.nn.functional as F\n\nclass FocalLoss(nn.Module):\n    def __init__(self, gamma=2.0, alpha=0.25, reduction='mean'):\n        super().__init__()\n        self.gamma, self.alpha, self.reduction = gamma, alpha, reduction\n\n    def forward(self, logits, target):\n        logp = F.log_softmax(logits, dim=-1)                  # 数值稳定的 log 概率\n        logpt = logp.gather(1, target[:, None]).squeeze(1)     # log p_t\n        pt = logpt.exp()                                       # p_t\n        # 调制因子 (1 - p_t)^gamma\n        focal = (1.0 - pt).pow(self.gamma) * logpt\n        # alpha_t：正类用 alpha，其余用 1-alpha（二分类近似；多分类可用类别权重张量）\n        at = torch.where(target == 1, self.alpha, 1.0 - self.alpha)\n        loss = -(at * focal)\n        if self.reduction == 'mean':\n            return loss.mean()\n        if self.reduction == 'sum':\n            return loss.sum()\n        return loss\n\n# 与交叉熵对比：简单样本 (p_t=0.95) 的损失被压到约 1/400\n# ce   = -log(0.95)            ≈ 0.051\n# fl   = -(0.05)^2 * log(0.95) ≈ 0.00013"},
  {"id":"dice-loss","name":"Dice 损失","en":"Dice Loss / Soft Dice","cat":"损失函数与评估指标","diff":"进阶","summary":"直接优化预测区域与标注区域的重叠度（Dice 系数），对前景占比极小的分割任务天然友好，是医学影像分割里替代交叉熵的首选。","scenes":["医学影像分割","小目标分割","前景极度稀疏","类别不平衡分割"],"idea":["Dice 系数 = 2|P∩G| / (|P|+|G|)，本质是 F1 的连续版本，取值 0–1，越大越好","损失取 1−Dice：完全重合时为 0，完全不相交时为 1","与交叉熵的区别：CE 逐像素独立计算、按像素数平均，前景少就被淹没；Dice 是集合级指标，前景大小不影响权重","常与 CE/Bce 组合（如 0.5·CE + 0.5·Dice）：Dice 提供区域级梯度，CE 提供稳定的逐像素梯度"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"Soft Dice 及其梯度","formulas":["Dice(P,G) = 2Σ_i p_i g_i / ( Σ_i p_i + Σ_i g_i )","L_dice = 1 − Dice = 1 − ( 2Σ p_i g_i + ε ) / ( Σ p_i + Σ g_i + ε )","∂L/∂p_i = −[ 2g_i·(Σp + Σg) − 2Σpg ] / ( Σp + Σg )²"],"steps":["把网络输出的 logits 过 sigmoid（或多类 softmax）得到连续概率 p_i ∈ [0,1]，使 Dice 可微。","分子是预测与标注逐元素乘积之和（交集的软近似），分母是两者总量之和。","加平滑项 ε 防止分母为 0（尤其小目标在早期预测全 0 时），ε 常取 1。","损失取 1−Dice 后反传；注意 Dice 梯度对每个像素都依赖整幅图的统计量，小 batch 时梯度方差较大。"],"tex":["\\mathrm{Dice}(P,G)=\\frac{2\\sum_i p_i g_i}{\\sum_i p_i+\\sum_i g_i}","L_{\\mathrm{dice}}=1-\\frac{2\\sum_i p_i g_i+\\epsilon}{\\sum_i p_i+\\sum_i g_i+\\epsilon}","\\frac{\\partial L}{\\partial p_i}=-\\frac{2g_i(\\sum p+\\sum g)-2\\sum pg}{(\\sum p+\\sum g)^{2}}"]},"params":[["smooth","float","1.0","平滑项 ε，正浮点数，默认 1.0。防止小目标分母为 0；ε 过大会让损失对重叠度变化不敏感，目标很小时常降到 1e-5。"],["per_class","bool","false","是否按类别分别算 Dice 再取平均，布尔值，默认 False（全体一起算）。多类分割设 True 可避免大类主导，但小类梯度噪声更大。"],["dice_weight","float","0.5","组合损失 DiceBCE 中 Dice 项的权重，0–1，默认 0.5。设为 1 退化为纯 Dice（只优化区域重叠），设为 0 退化为纯 BCE（只优化逐像素）；常用 0.5 让区域级梯度与像素级梯度互补。仅 DiceBCE 接收该参数，DiceLoss 本身不组合交叉熵。"],["from_logits","bool","true","输入是否为未归一化 logits，布尔值，默认 True（内部做 sigmoid）。若已自行过 sigmoid 需设为 False，否则会二次压缩。"]],"input":"pred: torch.Tensor [B, C, H, W]  (logits 或概率)\ntarget: torch.Tensor [B, C, H, W]  (0/1 或多类 one-hot)","output":"loss: torch.Tensor (标量)","code":"import torch, torch.nn as nn\n\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0, per_class=False, from_logits=True):\n        super().__init__()\n        self.smooth, self.per_class, self.from_logits = smooth, per_class, from_logits\n\n    def forward(self, pred, target):\n        if self.from_logits:\n            pred = pred.sigmoid() if pred.size(1) == 1 else pred.softmax(1)\n        # 展平空间维，只保留类别维做统计\n        p = pred.flatten(2)                     # [B, C, N]\n        g = target.flatten(2).float()\n\n        dims = (0, 2) if self.per_class else (0, 1, 2)\n        inter = (p * g).sum(dims)\n        union = p.sum(dims) + g.sum(dims)\n        dice = (2 * inter + self.smooth) / (union + self.smooth)\n        return 1 - dice.mean()                  # 逐类平均后取 1-Dice\n\nclass DiceBCE(nn.Module):\n    \"\"\"实践中常用的组合损失：区域级 + 像素级梯度互补\"\"\"\n    def __init__(self, dice_weight=0.5, smooth=1.0):\n        super().__init__()\n        self.dice = DiceLoss(smooth=smooth)\n        self.bce = nn.BCEWithLogitsLoss()\n        self.dice_weight = dice_weight\n\n    def forward(self, logits, target):\n        return self.dice_weight * self.dice(logits, target) \\\n            + (1 - self.dice_weight) * self.bce(logits, target)"},
  {"id":"triplet-loss","name":"三元组损失","en":"Triplet Loss","cat":"损失函数与评估指标","diff":"进阶","summary":"每次取一个锚点、一个同类正样本、一个异类负样本构成三元组，要求“锚-正距离”比“锚-负距离”小至少一个 margin，直接优化嵌入空间的度量结构。","scenes":["人脸识别","行人重识别","图像检索","度量学习"],"idea":["距离用欧氏距离（或余弦距离）：d(a,p) 与 d(a,n)","损失 = max( 0, d(a,p) − d(a,n) + margin )：只要负样本没比正样本远够 margin，就产生梯度","难例挖掘是关键：随机三元组大多满足约束、梯度为 0；需挑“半困难”样本（负样本比正样本远但不够远）才有效","FaceNet 用 batch-all + 在线半困难挖掘，训练稳定且收敛快；全困难挖掘容易早期塌缩"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"间隔约束与半困难挖掘","formulas":["L = Σ_i max( 0 , ‖f(x_i^a) − f(x_i^p)‖² − ‖f(x_i^a) − f(x_i^n)‖² + α )","半困难负样本：d(a,n) 满足 d(a,p) < d(a,n) < d(a,p) + α","全困难负样本：argmin_n d(a,n) 且 n 与 a 不同类"],"steps":["对每个 batch 算出所有样本对的嵌入距离矩阵，同时记录标签。","为每个锚点筛出同类正样本与异类负样本，按半困难准则挑出有效的负样本。","计算 max(0, d_ap − d_an + α)：约束满足时为 0 不产生梯度，违反时线性惩罚。","对有效三元组取平均反传；嵌入通常需 L2 归一化到单位球面，否则距离尺度会被网络任意缩放。"],"tex":["L=\\sum_i\\Bigl[\\lVert f(x_i^{a})-f(x_i^{p})\\rVert_2^{2}-\\lVert f(x_i^{a})-f(x_i^{n})\\rVert_2^{2}+\\alpha\\Bigr]_{+}","d(a,p)<d(a,n)<d(a,p)+\\alpha","n^{*}=\\argmin_{n:\\,y_{n}\\neq y_{a}}d(a,n)"]},"params":[["margin","float","0.2","间隔 α，正浮点数，默认 0.2（嵌入已归一化时）。margin 太小约束宽松、类间分不开；太大训练难收敛、易塌缩。"],["p","int","4","PK 采样中每类的样本数 P，正整数，默认 4。一个 batch 含 K 个类、每类 P 个样本，保证同类正样本必然存在。"],["k","int","8","PK 采样中的类别数 K，正整数，默认 8。K 越大负样本越多、挖掘空间越大，batch size = K×P。"],["mining","str","'semi-hard'","难例挖掘策略，可选 easy/semi-hard/hard，默认 semi-hard。easy 几乎无梯度，hard 早期易塌缩，semi-hard 最稳。"],["normalize","bool","true","是否对嵌入做 L2 归一化，布尔值，默认 True。归一化后距离落在 [0,2] 有界区间，margin 才具有可比意义。"]],"input":"embeddings: torch.Tensor [B, d]\nlabels: torch.LongTensor [B]","output":"loss: torch.Tensor (标量)\nn_valid_triplets: int","code":"import torch, torch.nn as nn, torch.nn.functional as F\n\ndef pairwise_dist(x):\n    \"\"\"欧氏距离矩阵；x 已 L2 归一化时等价于 sqrt(2-2cos)\"\"\"\n    x = x.float()\n    sq = x.pow(2).sum(1, keepdim=True)\n    d2 = sq + sq.t() - 2 * x @ x.t()\n    return d2.clamp(min=1e-12).sqrt()\n\ndef batch_hard_triplet_loss(emb, labels, margin=0.2, mining='semi-hard'):\n    if mining != 'easy':\n        emb = F.normalize(emb, dim=1)\n    d = pairwise_dist(emb)\n    same = labels[:, None] == labels[None, :]\n    eye = torch.eye(len(labels), dtype=torch.bool, device=emb.device)\n    pos_mask = same & ~eye\n    neg_mask = ~same\n\n    # 每个锚点取最远的正样本（最难的）与最近/半困难的负样本\n    d_ap = (d * pos_mask).max(1).values\n    if mining == 'hard':\n        d_an = (d.masked_fill(~neg_mask, 1e9)).min(1).values\n    else:  # semi-hard：在满足 d_an > d_ap 的负样本里取最近的\n        cand = d.masked_fill(~neg_mask, 1e9)\n        semi = cand.masked_fill(cand <= d_ap[:, None], 1e9)\n        d_an = semi.min(1).values\n        fb = cand.min(1).values                       # 无半困难样本时回退\n        d_an = torch.where(torch.isinf(d_an), fb, d_an)\n\n    loss = (d_ap - d_an + margin).clamp(min=0)\n    valid = (loss > 0).sum().item()\n    return loss.mean(), valid\n\nclass EmbeddingNet(nn.Module):\n    def __init__(self, in_dim, out_dim=128):\n        super().__init__()\n        self.net = nn.Sequential(nn.Linear(in_dim, 256), nn.ReLU(),\n                                 nn.Linear(256, out_dim))\n    def forward(self, x):\n        return F.normalize(self.net(x), dim=1)"},
  {"id":"extra-metrics","name":"分割与排序扩展指标","en":"Segmentation & Ranking Metrics (mIoU / Dice / NDCG / MAP / MRR)","cat":"损失函数与评估指标","diff":"进阶","summary":"一组“看结果、不看损失”的评测口径：分割用 mIoU、Dice、HD95 衡量重叠与边界，排序用 NDCG@K、MAP、MRR、HitRate 衡量名次与相关性，决定模型能不能上线。","scenes":["分割模型验收","推荐/检索排序评估","离线指标对比","模型选型与阈值确定"],"idea":["mIoU 逐类算交集/并集再平均，对类别不平衡敏感，是分割的行业标准；Dice 与 F1 等价但更常用于医学","HD95 取双向豪斯多夫距离的 95 分位，专门罚“整体对但边界歪”的预测，mIoU 高不一定 HD95 好","NDCG@K：按相关性做折损累计增益并除以理想 DCG，越相关的样本排得越靠前分越高，支持多级相关性","MAP 对每个查询算平均精度再平均，关注全表的精确率-召回曲线；MRR 只看第一个正确结果的倒数名次，适合问答式检索"],"deps":"NumPy · scikit-learn","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"常用指标定义","formulas":["mIoU = (1/C) Σ_c |P_c∩G_c| / |P_c∪G_c| ,  Dice_c = 2|P_c∩G_c| / (|P_c|+|G_c|)","DCG@K = Σ_{i=1}^{K} (2^{rel_i} − 1) / log₂(i+1) ,  NDCG@K = DCG@K / IDCG@K","AP = Σ_k P(k)·Δrecall(k) ,  MAP = (1/|Q|) Σ_q AP(q) ,  MRR = (1/|Q|) Σ_q 1/rank_q"],"steps":["分割：对每个类别求混淆矩阵，用对角线/行和列和算 IoU 与 Dice，再对类别取平均。","排序：把预测列表按分数降序，按真实相关性 rel_i 计算折损累计增益，除以理想排序的增益得到 NDCG。","检索：对每个查询判断正确项首次出现的位置 rank，取倒数后对查询平均得到 MRR。","线上还要看校准（如 ECE）与业务指标（CTR、转化率），离线指标涨不等于线上涨。"],"tex":["\\mathrm{mIoU}=\\frac{1}{C}\\sum_c\\frac{|P_c\\cap G_c|}{|P_c\\cup G_c|},\\quad \\mathrm{Dice}_c=\\frac{2|P_c\\cap G_c|}{|P_c|+|G_c|}","\\mathrm{NDCG@}K=\\frac{\\mathrm{DCG@}K}{\\mathrm{IDCG@}K},\\quad \\mathrm{DCG@}K=\\sum_{i=1}^{K}\\frac{2^{rel_i}-1}{\\log_2(i+1)}","\\mathrm{AP}=\\sum_k P(k)\\,\\Delta\\text{recall}(k),\\quad \\mathrm{MAP}=\\frac{1}{|Q|}\\sum_q\\mathrm{AP}(q),\\quad \\mathrm{MRR}=\\frac{1}{|Q|}\\sum_q\\frac{1}{\\mathrm{rank}_q}"]},"params":[["k","int","10","排序指标的截断位置 K，正整数，默认 10。只看前 K 名，K 越大越接近全表表现；推荐场景常用 5/10/20。"],["n_classes","int","—","分割类别数 C（含背景），正整数，默认按混淆矩阵形状推断。mIoU 会对所有类取平均，是否含背景需提前约定。"],["ignore_index","int","255","评估时忽略的标签值，整数，默认 255。常用来屏蔽边界未标注像素，避免把“无法判定”算成错误。"],["relevance","str","'graded'","相关性类型，可选 binary/graded，默认 graded。二值时 NDCG 退化为带折损的 precision，多级时用 2^rel−1 更强调高相关项。"]],"input":"pred_mask: np.ndarray [H, W] 或 [B, H, W]\ntarget_mask: np.ndarray [H, W]\nranked_items: List[int] , relevance: Dict[int, float]","output":"metrics: Dict[str, float]  (mIoU / Dice / HD95 / NDCG@K / MAP / MRR / HitRate)","code":"import numpy as np\n\ndef confusion(pred, target, n_classes, ignore=255):\n    m = target != ignore\n    idx = target[m].astype(np.int64) * n_classes + pred[m].astype(np.int64)\n    return np.bincount(idx, minlength=n_classes ** 2).reshape(n_classes, n_classes)\n\ndef seg_metrics(pred, target, n_classes, ignore=255):\n    cm = confusion(pred, target, n_classes, ignore)\n    tp = np.diag(cm).astype(float)\n    fp = cm.sum(0) - tp\n    fn = cm.sum(1) - tp\n    iou = tp / np.maximum(tp + fp + fn, 1e-9)\n    dice = 2 * tp / np.maximum(2 * tp + fp + fn, 1e-9)\n    return {'mIoU': iou.mean(), 'Dice': dice.mean(),\n            'per_class_iou': iou.tolist()}\n\ndef dcg(rels, k=10):\n    rels = np.asarray(rels[:k], dtype=float)\n    gains = 2 ** rels - 1\n    disc = np.log2(np.arange(2, rels.size + 2))\n    return float((gains / disc).sum())\n\ndef ndcg_at_k(ranked_rels, k=10):\n    ideal = sorted(ranked_rels, reverse=True)\n    idcg = dcg(ideal, k)\n    return dcg(ranked_rels, k) / idcg if idcg > 0 else 0.0\n\ndef average_precision(ranked_relevant, n_relevant):\n    hits, prec_sum = 0, 0.0\n    for i, r in enumerate(ranked_relevant, start=1):\n        if r:\n            hits += 1\n            prec_sum += hits / i\n    return prec_sum / max(n_relevant, 1)\n\ndef map_mrr(list_of_ranked, list_of_relevant):\n    aps, rrs = [], []\n    for ranked, rel in zip(list_of_ranked, list_of_relevant):\n        flags = [1 if x in rel else 0 for x in ranked]\n        aps.append(average_precision(flags, len(rel)))\n        first = next((i for i, f in enumerate(flags, 1) if f), None)\n        rrs.append(1.0 / first if first else 0.0)\n    return {'MAP': float(np.mean(aps)), 'MRR': float(np.mean(rrs))}\n\n# 用法\n# pred = logits.argmax(1) ; seg_metrics(pred, target, n_classes=5)\n# map_mrr([[3,1,7,9],[2,5,1]], [{1,9},{5}])"}
];

  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }

      : '浏览器禁用了本地存储，改动只在当前页面生效，刷新后就会丢。');

/* 缓存层：条目合并结果、检索串、筛选结果都构建一次后复用。

let _all = null;

let _fKey = '';
let _fList = null;

function byId(id){ return allEntries().find(x => x.id === id); }
/* id 白名单：只保留小写字母/数字/下划线/连字符；空串或原型保留字返回空，交给调用方兜底生成 */
function safeId(raw){
  const s = String(raw === null || raw === undefined ? '' : raw).trim()
    .replace(/[^A-Za-z0-9_-]+/g, '-').replace(/-{2,}/g, '-').replace(/^-+|-+$/g, '').slice(0, 64);
  return (s && s !== '__proto__' && s !== 'constructor' && s !== 'prototype') ? s : '';
}
/* 已规范化的 id 才沿用；被清洗改动过的一律视为不可信，交给调用方重新生成，避免清洗残渣互相撞键 */
function cleanId(raw){
  const t = String(raw === null || raw === undefined ? '' : raw).trim();
  return (t && t === safeId(t)) ? t : '';
}
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function diffClass(d){ return d === '入门' ? 'd0' : d === '进阶' ? 'd1' : 'd2'; }
/* 参数统一为 [名称, 类型, 默认值, 说明] 四元组，兼容历史三元组 */
function normParam(p){
  const a = Array.isArray(p) ? p : [p];
  if(a.length >= 4) return [a[0], a[1], a[2], a[3]];
  if(a.length === 3) return [a[0], a[1], '', a[2]];
  if(a.length === 2) return [a[0], a[1], '', ''];
  return [a[0], '', '', ''];
}

async function copyText(text, label){

    const ta = document.createElement('textarea');

function download(name, text, type){
  const blob = new Blob([text], {type: type || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);       // 先存下来，元素移除后仍能精确释放
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  /* 太早 revoke 会让个别浏览器把这次下载丢掉，放到下一个宏任务之后再释放 */
  setTimeout(() => URL.revokeObjectURL(url), 250);
}
/* 轻量 Python 词法着色：先切 token 再逐段 esc，避免转义后被正则二次改写 */
const PY_KW = new Set(['import','from','as','def','class','return','if','elif','else','for','while',
  'in','not','and','or','is','None','True','False','with','try','except','finally','raise','pass',
  'break','continue','lambda','yield','assert','global','nonlocal','del','async','await']);
const PY_BUILTIN = new Set(['print','len','range','sum','max','min','abs','round','sorted','enumerate',
  'zip','map','filter','any','all','int','float','str','list','dict','set','tuple','bool','type',
  'isinstance','open','self','super','np','torch','nn','F','pd','plt']);
function highlightLine(line){
  const s = String(line);
  let out = '', i = 0;
  while(i < s.length){
    const c = s[i];
    if(c === '#'){ out += '<span class="tk-c">'+esc(s.slice(i))+'</span>'; break; }
    if(c === '"' || c === "'"){
      const q = c; let j = i + 1;
      while(j < s.length){
        if(s[j] === '\\'){ j += 2; continue; }
        if(s[j] === q){ j++; break; }
        j++;
      }
      out += '<span class="tk-s">'+esc(s.slice(i, j))+'</span>';
      i = j; continue;
    }
    if(/[0-9]/.test(c)){
      let j = i;
      while(j < s.length && /[0-9.]/.test(s[j])) j++;
      out += '<span class="tk-n">'+esc(s.slice(i, j))+'</span>';
      i = j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j = i;
      while(j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++;
      const w = s.slice(i, j);
      let cls = '';
      if(PY_KW.has(w)) cls = 'tk-k';
      else if(PY_BUILTIN.has(w)) cls = 'tk-b';
      else if(/^[A-Z]/.test(w)) cls = 'tk-t';
      else if(s[j] === '(') cls = 'tk-f';
      out += cls ? '<span class="'+cls+'">'+esc(w)+'</span>' : esc(w);
      i = j; continue;
    }
    out += esc(c);
    i++;
  }
  return out;
}
function codeHTML(code, maxLines){
  const lines = String(code || '').split('\n');
  const shown = maxLines ? lines.slice(0, maxLines) : lines;
  let html = shown.map((l, i) =>
    '<div class="cline"><span class="ln">'+ (i+1) +'</span><code>'+ highlightLine(l || ' ') +'</code></div>'
  ).join('');
  if(maxLines && lines.length > maxLines){
    html += '<div class="cline"><span class="ln"></span><code>... 共 '+ lines.length +' 行，打开详情查看完整代码</code></div>';
  }
  return html;
}
function codeBlock(code, lang, maxLines, id, file){
  const name = file || 'snippet.py';
  return '<div class="codebox"><div class="codebar">'+

/* 收藏/复习按钮的内部标记抽成函数，局部重绘时只换这一段 HTML。

const FAV_ICON_OFF = '<svg aria-hidden="true" focusable="false" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .8 4.3L8 11.6l-3.9 2 .8-4.3-3.1-3 4.3-.6z"/></svg>';
const FAV_ICON_ON  = '<svg aria-hidden="true" focusable="false" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.3"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .8 4.3L8 11.6l-3.9 2 .8-4.3-3.1-3 4.3-.6z"/></svg>';
const REV_ICON = '<svg aria-hidden="true" focusable="false" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.3 1.5"/></svg>';
function favText(on, flavor){
  if(flavor === 'add') return on ? '取消收藏' : '加入收藏';
  return on ? '已收藏' : '收藏';
}
function revText(r, flavor){
  const waiting = !!r && !r.mastered;
  if(flavor === 'side') return waiting ? '标记本次已复习' : '加入复习队列';
  if(flavor === 'icon') return r ? (r.mastered ? '已掌握' : '待复习') : '标记复习';
  return waiting ? '标记已复习' : '标记待复习';
}
function favInner(id, flavor){
  const on = FAV.includes(id);
  return flavor === 'icon' ? (on ? FAV_ICON_ON : FAV_ICON_OFF) + favText(on, flavor) : favText(on, flavor);
}
function revInner(id, flavor){
  const r = REVIEW[id];
  return flavor === 'icon' ? REV_ICON + revText(r, flavor) : revText(r, flavor);
}
function favBtn(id){
  const on = FAV.includes(id);
  return '<button type="button" class="icon-btn'+(on?' on':'')+'" data-act="fav" data-id="'+esc(id)+'" data-fv="icon" title="收藏">'+
    favInner(id,'icon')+'</button>';
}
function reviewBtn(id){
  const on = !!REVIEW[id] && !REVIEW[id].mastered;
  return '<button type="button" class="icon-btn'+(on?' on':'')+'" data-act="review" data-id="'+esc(id)+'" data-fv="icon" title="复习标记">'+

}
/* 每个条目的检索串只构建一次并记住，避免每次按键都把整段代码重新拼一遍 */
function hayOf(x){
  let hay = _hayById.get(x.id);
  if(hay === undefined){
    const mathText = x.math ? [x.math.title,asList(x.math.formulas).join(' '),asList(x.math.steps).join(' ')].join(' ') : '';
    hay = [x.name,x.en,x.cat,x.diff,x.summary,asList(x.scenes).join(' '),
           asList(x.idea).join(' '),x.deps,x.lang,mathText,String(x.code || '')].join(' ').toLowerCase();
    _hayById.set(x.id, hay);
  }
  return hay;
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  const key = JSON.stringify([q,state.diff,state.cat,!!state.favOnly,!!state.reviewOnly,FILTER_VER]);
  if(_fList && _fKey === key) return _fList;      // 滚动/重绘复用上次结果
  const out = allEntries().filter(x => {
    if(state.diff !== '全部' && x.diff !== state.diff) return false;
    if(state.cat !== '全部' && x.cat !== state.cat) return false;
    if(state.favOnly && FAV.indexOf(x.id) < 0) return false;
    if(state.reviewOnly && (!REVIEW[x.id] || REVIEW[x.id].mastered)) return false;
    if(!q) return true;
    return hayOf(x).indexOf(q) >= 0;
  });
  _fKey = key; _fList = out;
  return out;
}

const MACC = { hat:'^', widehat:'^', bar:'¯', tilde:'˜', widetilde:'˜', vec:'→', dot:'·', ddot:'¨' };
/* 字体样式命令 */
const MSTYLE = { mathrm:'mrm', mathsf:'mrm', mathtt:'mrm', mathit:'mcal',
                 mathbf:'mbf', boldsymbol:'mbf', textbf:'mbf', textit:'mcal',
                 mathcal:'mcal', mathscr:'mcal', mathbb:'mbb', mathfrak:'mcal' };
const MFUNCS = new Set(['softmax','argmax','argmin','max','min','log','ln','exp','tanh','diag',
  'Var','Cov','E','I','N','L','CV','BCE','KLD','MSE','AUC','TPR','FPR','TP','FP','FN','TN',

/* 轻量数学排版：真分式 / 上下标 / 大运算符 / 根号 / 变量斜体 / 函数名正体，无外部依赖 */
function mathHTML(src){
  const S = String(src || '');
  let i = 0;
  function readGroup(){
    if(S[i] !== '{') return null;
    i++;
    return parse('}');
  }
  function readScript(){
    if(S[i] === '{'){ i++; return parse('}'); }
    if(S[i] === '\\'){                        /* \theta 之类：命令整体作为一个脚本项 */
      i++;
      const m = /^[A-Za-z]+/.exec(S.slice(i));
      const nm = m ? m[0] : S.charAt(i);
      i += m ? m[0].length : 1;
      return cmd(nm);
    }
    const c = esc(S.charAt(i) || ''); i++;
    return c;
  }
  function bigop(name){
    let lo = '', hi = '';
    if(S[i] === '_'){ i++; lo = readScript(); }
    if(S[i] === '^'){ i++; hi = readScript(); }
    const glyph = name === 'sum' ? '∑' : name === 'prod' ? '∏' : '∫';
    return '<span class="mbigop">'+(hi ? '<sup>'+hi+'</sup>' : '')+
      '<span class="mop">'+glyph+'</span>'+(lo ? '<sub>'+lo+'</sub>' : '')+'</span>';
  }
  function cmd(name){
    if(name === 'frac' || name === 'tfrac' || name === 'dfrac'){
      const a = readGroup(), b = readGroup();
      return '<span class="mfrac"><span class="mnum">'+(a||'')+'</span><span class="mden">'+(b||'')+'</span></span>';
    }
    if(name === 'sqrt'){
      const a = readGroup();
      return '<span class="msqrt"><span class="mrad">√</span><span class="mbody">'+(a||'')+'</span></span>';
    }
    if(name === 'sum' || name === 'prod' || name === 'int') return bigop(name);
    if(name === 'text' || name === 'operatorname' || name === 'textrm'){
      return '<span class="mfn">'+(readGroup() || '')+'</span>';
    }
    if(name === 'left' || name === 'right'){
      const d = S.charAt(i); i++;
      return esc(d) || '';
    }
    if(MACC[name]){
      while(S[i] === ' ') i++;                 /* \hat A 中的空格不属于本体 */
      const g = readGroup();
      const body = (g === null) ? readScript() : g;
      return '<span class="macc">'+body+'<i class="maccm">'+MACC[name]+'</i></span>';
    }
    if(MSTYLE[name]) return '<span class="'+MSTYLE[name]+'">'+(readGroup() || '')+'</span>';
    if(name === 'begin' || name === 'end'){ readGroup(); return ''; }   /* 环境名丢弃，内容照常排版 */
    if(name === 'Big' || name === 'big' || name === 'Bigg' || name === 'bigg' ||
       name === 'bigl' || name === 'bigr' || name === 'Bigl' || name === 'Bigr' ||
       name === 'middle' || name === 'limits' || name === 'nolimits' || name === 'displaystyle' ||
       name === 'scriptstyle' || name === 'scriptscriptstyle' || name === 'textstyle'){
      return '';                                                        /* 定界符尺寸修饰：忽略即可 */
    }
    if(name === '\\') return '<br>';                                  /* 矩阵/多行的换行 */
    if(Object.prototype.hasOwnProperty.call(MSYM, name)) return MSYM[name] || '';
    return '<span class="mfn">'+esc(name)+'</span>';                     /* 未识别命令按正体文字输出，不再露出反斜杠 */
  }
  function parse(stop){
    let out = '';
    while(i < S.length){
      if(stop && S[i] === '}'){ i++; return out; }
      const c = S[i];
      if(c === '\\'){
        i++;
        const m = /^[A-Za-z]+/.exec(S.slice(i));
        const name = m ? m[0] : S.charAt(i);
        i += m ? m[0].length : 1;
        out += cmd(name);
        continue;
      }
      if(c === '{'){ i++; out += parse('}'); continue; }
      if(c === '&'){ i++; out += '<span class="mspace" style="display:inline-block;width:1.2em"></span>'; continue; } /* 对齐符：留出列间距（cases/矩阵里就是 & 的位置） */
      if(c === '~'){ i++; out += '<span class="mspace" style="width:.3em"></span>'; continue; }
      if(c === '$'){ i++; continue; }
      if(c === '^' || c === '_'){
        i++;
        const sub = readScript();
        out += c === '^' ? '<sup>'+sub+'</sup>' : '<sub>'+sub+'</sub>';
        continue;
      }
      if(/[A-Za-z]/.test(c)){
        const w = (/^[A-Za-z]+/.exec(S.slice(i)) || [c])[0];
        i += w.length;
        out += MFUNCS.has(w) ? '<span class="mfn">'+esc(w)+'</span>'
                             : w.split('').map(ch => '<i>'+ch+'</i>').join('');
        continue;
      }
      out += esc(c);
      i++;
    }
    return out;
  }
  return parse(null);
}

/* 相关算法：先给跨分类的同族条目，不足 4 条再用同分类补，
   这样 Weka 实现组与主家族之间互相都能跳过去 */
function relatedOf(x){
  const seen = new Set([x.id]), out = [];
  const push = y => { if(y && !seen.has(y.id)){ seen.add(y.id); out.push(y); } };
  asList(NEAR[x.id]).forEach(nid => push(byId(nid)));
  if(out.length < 4){
    allEntries().filter(y => y.cat === x.cat).forEach(push);
    allEntries().forEach(push);          /* 该分类条目过少时兜底，仍保证不留白 */
  }
  return out.slice(0, 4);
}

/* ---- Section navigation: sticky anchor bar + scroll spy ---- */
const ANCHORS = {
  browse:[['sec-head','概览'],['sec-grid','算法条目'],['sec-archive','主题归档']],
  detail:[['sec-info','算法说明'],['sec-math','数学推导'],['sec-code','完整代码'],['sec-params','关键参数'],['sec-io','输入输出'],['sec-notes','学习备注']],
  review:[['sec-stats','复习概览'],['sec-queue','复习队列'],['sec-maintain','数据维护']],
  new:[['sec-form','条目表单'],['sec-code','代码编辑'],['sec-preview','实时预览']]
};
const VIEW_LABEL = {browse:'代码库', detail:'算法详情', review:'复习计划', fav:'收藏夹', new:'新增条目'};
function anchorsFor(v){
  if(v === 'fav'){
    return CATS.map((c, i) => ['sec-fav-' + i, c])
               .filter(a => document.getElementById(a[0]));
  }
  return ANCHORS[v] || [];
}
function renderSubnav(){
  const label = document.getElementById('subnavLabel');
  const bar = document.getElementById('anchors');
  if(!label || !bar) return;
  label.textContent = VIEW_LABEL[state.view] || '代码库';
  bar.innerHTML = anchorsFor(state.view).map((a, i) =>
    '<button type="button" class="anchor' + (i === 0 ? ' on' : '') + '" data-act="anchor" data-target="' + esc(a[0]) + '">' + esc(a[1]) + '</button>'
  ).join('');
  updateActiveAnchor();
}
function updateActiveAnchor(){
  const links = document.querySelectorAll('#anchors [data-act="anchor"]');
  if(!links || !links.length) return;
  const sections = document.querySelectorAll('[data-anchor]');
  if(!sections || !sections.length) return;
  const y = (window.scrollY || 0) + 120;
  let active = null;
  sections.forEach(el => {
    const top = el.getBoundingClientRect
      ? el.getBoundingClientRect().top + (window.scrollY || 0) : 0;
    if(top <= y) active = el.dataset.anchor;
  });
  links.forEach(a => a.classList.toggle('on', a.dataset.target === active));
}
function updateToTop(){
  const btn = document.getElementById('toTop');
  if(btn) btn.classList.toggle('show', (window.scrollY || 0) > 320);
}
let lastScrollTick = 0;
window.addEventListener('scroll', () => {
  const now = Date.now();
  if(now - lastScrollTick < 80) return;
  lastScrollTick = now;
  updateActiveAnchor();
  updateToTop();
  renderDock();
}, {passive:true});

/* ---- Floating glass dock: back / prev / next / home ---- */
const NAV_STACK = [];
function pushNav(){
  const cur = {view:state.view, detail:state.detail, selected:state.selected,
               q:state.q, cat:state.cat, diff:state.diff,
               favOnly:state.favOnly, reviewOnly:state.reviewOnly};
  const last = NAV_STACK[NAV_STACK.length-1];
  if(last && last.view===cur.view && last.detail===cur.detail && last.selected===cur.selected) return;
  NAV_STACK.push(cur);
  if(NAV_STACK.length > 30) NAV_STACK.shift();
}
function entryOrder(){
  const f = filtered();
  if(state.detail && f.some(x => x.id === state.detail)) return f;
  return allEntries();
}
function sectionIndex(){
  const list = anchorsFor(state.view);
  const ids = list.map(a => a[0]);
  const y = (window.scrollY || 0) + 130;
  let idx = 0;
  ids.forEach((id, i) => {
    const el = document.getElementById(id);
    if(el && el.getBoundingClientRect){
      const top = el.getBoundingClientRect().top + (window.scrollY || 0);
      if(top <= y) idx = i;
    }
  });
  return {list:list, ids:ids, idx:idx};
}
function sectionStep(step){
  const s = sectionIndex();
  const next = s.list[s.idx + step];
  if(!next){ toast(step > 0 ? '已经是最后一个区段' : '已经是第一个区段'); return; }
  const el = document.getElementById(next[0]);
  if(el && el.scrollIntoView) el.scrollIntoView({behavior:sbeh(), block:'start'});
  toast((step > 0 ? '下一页：' : '上一页：') + next[1]);
}
function goSibling(step, instant){
  if(state.view !== 'detail'){ sectionStep(step); return; }
  const list = entryOrder();
  const i = list.findIndex(x => x.id === state.detail);
  const target = list[i + step];
  if(!target){ toast(step > 0 ? '已经是最后一个条目' : '已经是第一个条目'); return; }
  pushNav();
  state.detail = target.id; state.selected = target.id;
  render({scroll:true, instant:instant});
  toast((step > 0 ? '下一页：' : '上一页：') + target.name);
}
function goBack(instant){
  const prev = NAV_STACK.pop();
  if(!prev){ toast('已经是第一页'); return; }
  state.view = prev.view; state.detail = prev.detail; state.selected = prev.selected;
  state.q = prev.q || ''; state.cat = prev.cat || '全部';
  state.diff = prev.diff || '全部';
  state.favOnly = !!prev.favOnly; state.reviewOnly = !!prev.reviewOnly;
  render({scroll:true, instant:instant});
  toast('已返回上一页');
}
function goHome(instant){
  pushNav();
  state.view='browse'; state.q=''; state.diff='全部'; state.cat='全部';
  state.favOnly=false; state.reviewOnly=false; state.detail=null;
  render({scroll:true, instant:instant});
  toast('已回到代码库首页');
}
function renderDock(){
  const label = document.getElementById('dockLabel');
  const hint = document.getElementById('dockHint');
  const setBtn = (id, opt) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(opt.title) el.title = opt.title;
    if('disabled' in opt) el.disabled = opt.disabled;
  };
  setBtn('dockBack', {disabled:NAV_STACK.length === 0, title:'返回上一个浏览位置'});
  if(state.view === 'detail'){
    const list = entryOrder();
    const i = list.findIndex(x => x.id === state.detail);
    const x = byId(state.detail);
    if(label) label.textContent = x ? x.name : '算法详情';
    if(hint) hint.textContent = (i >= 0 ? (i+1) + ' / ' + list.length + ' 条' : '条目详情');
    setBtn('dockPrev', {disabled:i <= 0, title:i > 0 ? '上一页：' + list[i-1].name : '已是第一个条目'});
    setBtn('dockNext', {disabled:i < 0 || i >= list.length-1,
      title:(i >= 0 && i < list.length-1) ? '下一页：' + list[i+1].name : '已是最后一个条目'});
  }else{
    const s = sectionIndex();
    if(label) label.textContent = VIEW_LABEL[state.view] || '代码库';
    if(hint) hint.textContent = s.ids.length ? (s.idx+1) + ' / ' + s.ids.length + ' 区段' : '区段导航';
    setBtn('dockPrev', {disabled:s.idx <= 0,
      title:s.idx > 0 ? '上一页：' + s.list[s.idx-1][1] : '已是第一个区段'});
    setBtn('dockNext', {disabled:s.idx >= s.ids.length-1,
      title:s.idx < s.ids.length-1 ? '下一页：' + s.list[s.idx+1][1] : '已是最后一个区段'});
  }
  setBtn('dockHome', {title:'回到代码库首页'});
}

const VIEWS = { browse:1, detail:1, review:1, fav:1, new:1 };
function render(opts){
  if(!VIEWS[state.view]) state.view = 'browse';        /* 未知视图兜底，避免整页白屏 */
  captureNoteDraft();                  // 重建 DOM 前保住草稿（含换行）
  const shell = document.getElementById('shell');
  const wide = state.view !== 'browse';
  shell.classList.toggle('wide', wide);
  document.querySelectorAll('#nav [data-act="view"]').forEach(b =>
    b.classList.toggle('on', b.dataset.v === state.view));
  renderSidebar();
  let html = '';
  if(state.view === 'browse') html = renderBrowse();
  else if(state.view === 'detail') html = renderDetail(state.detail);
  else if(state.view === 'review') html = renderReview();
  else if(state.view === 'fav') html = renderFav();
  else if(state.view === 'new') html = renderNew();
  document.getElementById('main').innerHTML = html;
  if(state.view === 'browse'){
    document.getElementById('preview').innerHTML = renderPreview();
  }else{
    document.getElementById('preview').innerHTML = '';
  }
  restoreNoteDraft();                  // 重建后还原草稿
  renderSubnav();
  renderDock();
  if(opts && opts.scroll) window.scrollTo({top:0, behavior:((opts.instant || REDUCED) ? 'auto' : 'smooth')});
  updateToTop();
}

/* 只替换受影响的那几个按钮的文案与状态，保住焦点、滚动位置与输入中的草稿 */
function paintToggles(id){
  ['fav','review'].forEach(kind => {
    const nodes = document.querySelectorAll('[data-act="'+kind+'"]');
    for(let i = 0; i < nodes.length; i++){
      const el = nodes[i];
      if(el.dataset.id !== id) continue;
      const flavor = el.dataset.fv || 'plain';
      const on = kind === 'fav' ? FAV.includes(id) : (!!REVIEW[id] && !REVIEW[id].mastered);
      if(flavor === 'icon') el.classList.toggle('on', on);
      el.innerHTML = kind === 'fav' ? favInner(id, flavor) : revInner(id, flavor);
    }
  });
  const due = Object.values(REVIEW).filter(r => r && !r.mastered && r.next <= shiftToday(7)).length;
  const stat = document.querySelector('#sec-head .stat.accent');
  if(stat) stat.textContent = due + ' 待复习';
}
function afterToggle(id){
  /* 列表本身依赖收藏/复习状态时，条目可能被筛掉，只能整体重绘 */
  if(state.view === 'fav' || state.view === 'review' || state.favOnly || state.reviewOnly){ render(); return; }
  paintToggles(id);
}
function toggleFav(id){
  const i = FAV.indexOf(id);
  if(i >= 0) FAV.splice(i,1); else FAV.push(id);
  bumpFilter(); save(KEY.fav, FAV);
  afterToggle(id);
  toast(i >= 0 ? '已取消收藏' : '已加入收藏');
}
function toggleReview(id){
  const r = REVIEW[id];
  let msg;
  if(!r || r.mastered){
    REVIEW[id] = { last: r ? r.last : today(), next: today(), mastered:false };
    msg = '已加入复习队列';
  }else{
    REVIEW[id] = { last: today(), next: shiftToday(7), mastered:true };
    msg = '已标记本次复习完成';
  }
  bumpFilter(); save(KEY.review, REVIEW);
  afterToggle(id);
  toast(msg);
}
function addNote(id){
  const ta = document.getElementById('quickNote');
  const text = ta ? ta.value.trim() : '';
  if(!text){ toast('先写点内容再保存'); return; }
  if(!NOTES[id]) NOTES[id] = [];
  let msg;
  if(editingNote && editingNote.id === id){
    const n = NOTES[id][editingNote.index];
    if(n){ n.text = text; n.edited = today(); }
    msg = '批注已更新';
  }else{
    NOTES[id].unshift({ time: today(), text: text, edited: '' });
    msg = '批注已保存';
  }
  editingNote = null;
  noteDraft = '';
  save(KEY.notes, NOTES);
  const old = document.getElementById('quickNote');   // 清空后再 render，避免草稿回填
  if(old) old.value = '';
  render();
  toast(msg);
}
function exportNotes(){
  const entries = allEntries();
  let md = '# ML Atlas · 学习备注导出\n\n导出时间：'+today()+'\n\n';
  let n = 0;
  entries.forEach(x => {
    const list = NOTES[x.id] || [];
    if(!list.length) return;
    n += list.length;
    md += '## '+x.name+' ('+x.en+')\n\n';
    list.forEach(item => {
      const stamp = item.time + (item.edited ? ' · 编辑于 '+item.edited : '');
      const body = String(item.text).split('\n').join('  \n');  // 两个空格保留 Markdown 换行
      md += '**'+stamp+'**\n\n'+body+'\n\n---\n\n';
    });
  });
  if(!n){ toast('还没有备注可导出'); return; }
  download('ml-atlas-notes.md', md, 'text/markdown;charset=utf-8');
  toast('已导出 '+n+' 条备注');
}
function exportCustom(){

/* 全量备份：把分散在各 localStorage 键里的状态打包成一个可带走的 JSON */
function exportBackup(){

    format:'ml-atlas-backup', version:1, exportedAt:today(),

  };

/* 恢复：合并而非覆盖，避免把当前环境里新写的内容冲掉 */
/* 把任意来源的条目对象收敛成站内固定结构；不合格返回 null。
   「导入 JSON」与「恢复备份」共用这一条通道，避免两条路径的校验强度不一致。
   fallbackId 只在批量导入时给，用于生成稳定的兜底 id；恢复备份不给，缺 id 直接跳过。 */
function normalizeEntry(item, fallbackId){
  if(!item || typeof item !== 'object' || Array.isArray(item)) return null;
  if(!item.name || !item.code) return null;
  if(String(item.code).length > 20000) return null;
  const id = cleanId(item.id) || cleanId(fallbackId);
  if(!id) return null;
  return {
    id, name:String(item.name), en:String(item.en || ''),
    cat: CATS.includes(item.cat) ? item.cat : CATS[0],
    diff: DIFFS.includes(item.diff) ? item.diff : '入门',
    summary:String(item.summary || ''),
    scenes:asList(item.scenes).map(String),
    idea:asList(item.idea).map(String),
    deps:String(item.deps || 'Python'),
    lang:String(item.lang || 'Python 3'),
    math:(item.math && asList(item.math.formulas).length)
      ? {title:String(item.math.title || '公式与推导'),
         formulas:asList(item.math.formulas).map(String),
         tex:asList(item.math.tex).map(String),
         steps:asList(item.math.steps).map(String)}
      : null,
    params:asList(item.params).map(normParam),
    input:String(item.input || ''), output:String(item.output || ''),
    code:String(item.code), updated:String(item.updated || today())
  };
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const b = JSON.parse(reader.result);
      if(!b || b.format !== 'ml-atlas-backup' || !Array.isArray(b.fav)){
        toast('这不是完整备份文件；批量新增条目请用「导入 JSON」'); return;
      }
      // 收藏取并集（id 同样过白名单，避免 __proto__ 之类混进 id 集合）
      let favAdded = 0;
      b.fav.forEach(raw => {
        const id = cleanId(raw);
        if(id && !FAV.includes(id)){ FAV.push(id); favAdded++; }
      });
      // 备注按「时间 + 正文」去重后追加
      let noteAdded = 0;
      const srcNotes = (b.notes && typeof b.notes === 'object') ? b.notes : {};
      Object.keys(srcNotes).forEach(rawId => {
        const id = cleanId(rawId);
        if(!id) return;
        const list = Array.isArray(srcNotes[rawId]) ? srcNotes[rawId] : [];
        if(!NOTES[id]) NOTES[id] = [];
        list.forEach(n => {
          if(!n || typeof n !== 'object') return;
          const text = String(n.text || '');
          if(!text) return;
          const time = String(n.time || today());
          if(NOTES[id].some(x => x && x.text === text && x.time === time)) return;
          NOTES[id].push({ time:time, text:text, edited:String(n.edited || '') });
          noteAdded++;
        });
      });
      // 复习状态：只补本地没有的，不覆盖已有进度
      let reviewAdded = 0;
      const srcReview = (b.review && typeof b.review === 'object') ? b.review : {};
      Object.keys(srcReview).forEach(rawId => {
        const id = cleanId(rawId);
        if(!id) return;
        const r = srcReview[rawId];
        if(!REVIEW[id] && r && typeof r === 'object'){
          REVIEW[id] = { last:String(r.last || today()), next:String(r.next || today()), mastered:!!r.mastered };
          reviewAdded++;
        }
      });
      // 自定义条目按 id 去重追加
      let customAdded = 0, customSkipped = 0;
      const seenBackup = new Set();
      (Array.isArray(b.custom) ? b.custom : []).forEach(item => {
        const rec = normalizeEntry(item);
        if(!rec || seenBackup.has(rec.id) || byId(rec.id)){ customSkipped++; return; }
        seenBackup.add(rec.id);
        CUSTOM.push(rec); customAdded++;
      });
      // 护眼模式与质感模式
      if(b.theme === 'night' || b.theme === 'light'){
        document.body.dataset.theme = b.theme;
        save(KEY.theme, b.theme);
      }
      if(typeof b.texture === 'boolean'){
        TEXTURE = b.texture;
        document.body.dataset.texture = b.texture ? 'on' : 'off';
        save(KEY.texture, b.texture);
      }
      invalidateAll();
      save(KEY.fav, FAV); save(KEY.notes, NOTES); save(KEY.review, REVIEW); save(KEY.custom, CUSTOM);
      save(KEY.seed, true);
      render();
      toast('已恢复 '+noteAdded+' 条备注 / '+favAdded+' 个收藏 / '+reviewAdded+' 项复习 / '+customAdded+' 个自定义条目'
        + (customSkipped ? '（另有 '+customSkipped+' 个条目字段不全或重复，已跳过）' : ''));
    }catch(e){
      toast('恢复失败：文件不是有效的备份 JSON');
    }
  };
  reader.readAsText(file);
}
function importCustom(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const arr = JSON.parse(reader.result);
      if(!Array.isArray(arr)) throw new Error('root');
      let added = 0, skipped = 0;
      const seen = new Set();      // 同一批里重复的 id 也要拦掉，byId() 读的是缓存，拦不住批内
      arr.forEach((item, i) => {
        if(added >= 500){ skipped++; return; }
        /* id 过白名单，避免 __proto__ / 特殊字符进入 id、笔记键或导出文件名 */
        const rec = normalizeEntry(item, 'custom-'+Date.now()+'-'+i);
        if(!rec || seen.has(rec.id) || byId(rec.id)){ skipped++; return; }
        seen.add(rec.id);
        CUSTOM.push(rec); added++;
      });
      invalidateAll();
      save(KEY.custom, CUSTOM);
      render();
      toast(added
        ? '已导入 '+added+' 个条目'+(skipped ? '，跳过 '+skipped+' 个（重复或字段不全）' : '')
        : '没有可导入的条目：需要至少包含 name 与 code 的对象数组');
    }catch(e){
      toast('导入失败：需要条目数组的 JSON 文件');
    }
  };
  reader.readAsText(file);
}
function saveEntry(){
  const val = id => { const el = document.getElementById('f_'+id); return el ? el.value.trim() : ''; };
  const codeEl = document.getElementById('f_code');
  const name = val('name'), code = codeEl ? codeEl.value.trim() : '';
  const summary = val('summary');
  if(!name || !code || !summary){ toast('名称、简介、代码为必填项'); return; }
  const parseList = s => s.split(/[；;]/).map(x => x.trim()).filter(Boolean);
  const parseMath = () => {
    const el = document.getElementById('f_math');
    const raw = el ? el.value.trim() : '';
    if(!raw) return null;
    const parts = raw.split(/\n\s*---\s*\n/);
    const formulas = (parts[0] || '').split('\n').map(s => s.trim()).filter(Boolean);
    const steps = (parts[1] || '').split('\n').map(s => s.trim()).filter(Boolean);
    return formulas.length
      ? {title: val('mathTitle') || '公式与推导', formulas: formulas, steps: steps}
      : null;
  };
  const params = parseList(val('params')).map(row => {
    const p = row.split('|').map(x => x.trim());
    return normParam([p[0] || 'param', p[1] || '—', p[2] || '说明待补充']);
  });
  const id = 'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  CUSTOM.push({
    id, name, en: val('en') || name, cat: val('cat') || CATS[0],
    diff: val('diff') || '入门', summary,
    scenes: parseList(val('scenes')), idea: parseList(val('idea')),
    deps: val('deps') || 'Python', lang: val('lang') || 'Python 3',
    math: parseMath(), params,
    input: val('input') || '—', output: val('output') || '—',
    code, updated: today()
  });
  invalidateAll();
  save(KEY.custom, CUSTOM);
  state.selected = id;
  switchView('browse');
  toast('条目已保存并归档到「'+(val('cat') || CATS[0])+'」');
}
function updatePreview(){
  const g = id => document.getElementById(id);
  const name = g('f_name'), diff = g('f_diff'), cat = g('f_cat'),
        sum = g('f_summary'), code = g('f_code');
  if(!name) return;
  g('pv_name').textContent = name.value || '未命名算法';
  const langEl = g('f_lang');
  if(g('pv_lang')) g('pv_lang').textContent = (langEl && langEl.value) || 'Python 3';
  g('pv_diff').textContent = diff ? diff.value : '入门';
  g('pv_diff').className = 'pill '+diffClass(diff ? diff.value : '入门');
  g('pv_cat').textContent = cat ? cat.value : CATS[0];
  g('pv_summary').textContent = sum.value || '填写简介后，这里会显示条目摘要。';
  g('pv_code').innerHTML = codeHTML((code ? code.value : '') || '# 等待粘贴代码', 8);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch(act){
    case 'view': switchView(t.dataset.v); break;
    case 'toggle-side':
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('nav').classList.toggle('open');
      break;
    case 'cat':
      state.cat = t.dataset.cat === '全部' ? '全部' : (state.cat === t.dataset.cat ? '全部' : t.dataset.cat);
      state.view = 'browse'; render(); break;
    case 'diff': state.diff = t.dataset.d; render(); break;
    case 'fav-only': state.favOnly = !state.favOnly; render(); break;
    case 'review-only': state.reviewOnly = !state.reviewOnly; render(); break;
    case 'clear':
      state.q=''; state.diff='全部'; state.cat='全部';
      state.favOnly=false; state.reviewOnly=false; render(); break;
    case 'select':
      if(state.view !== 'browse'){ state.detail = id; state.selected = id; switchView('detail'); break; }
      selectCard(id);
      break;
    case 'detail': state.detail = id; state.selected = id; switchView('detail'); break;
    case 'copy': {
      const x = byId(id);
      if(x) copyText(x.code, '已复制「'+x.name+'」完整代码');
      break;
    }
    case 'fav': e.stopPropagation(); toggleFav(id); break;
    case 'review': e.stopPropagation(); toggleReview(id); break;
    case 'done':
      REVIEW[id] = { last: today(), next: shiftToday(7), mastered:true };
      bumpFilter(); save(KEY.review, REVIEW); render(); toast('已完成本次复习，下次 '+shiftToday(7));
      break;
    case 'add-note': addNote(id); break;
    case 'edit-note': {
      const i = Number(t.dataset.i);
      const n = (NOTES[id] || [])[i];
      if(!n) break;
      editingNote = {id:id, index:i};
      noteDraft = n.text;
      render();
      const ta = document.getElementById('quickNote');
      if(ta){
        ta.value = n.text;
        noteDraft = n.text;
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
      toast('已载入批注，修改后点「保存修改」');
      break;
    }
    case 'cancel-edit': {
      editingNote = null;
      noteDraft = '';
      const old = document.getElementById('quickNote');
      if(old) old.value = '';
      render(); break;
    }
    case 'del-note': {
      const i = Number(t.dataset.i);
      if(NOTES[id]){ NOTES[id].splice(i,1); if(!NOTES[id].length) delete NOTES[id]; }
      if(editingNote && editingNote.id === id){       // 删除后索引会变，退出编辑态
        editingNote = null;
        noteDraft = '';
        const old = document.getElementById('quickNote');
        if(old) old.value = '';
      }
      save(KEY.notes, NOTES); render(); break;
    }
    case 'export-notes': exportNotes(); break;
    case 'export-json': exportCustom(); break;
    case 'export-backup': exportBackup(); break;
    case 'import-backup': { const f = document.getElementById('backupFile'); if(f) f.click(); break; }
    case 'export-py': {
      const x = byId(id);
      if(x) download(x.id+'.py', '# '+x.name+' / '+x.deps+'\n'+x.code+'\n', 'text/x-python;charset=utf-8');
      break;
    }
    case 'import-json': { const f = document.getElementById('importFile'); if(f) f.click(); break; }
    case 'save-entry': saveEntry(); break;
    case 'clear-form':
      document.querySelectorAll('.form input,.form textarea').forEach(el => el.value='');
      updatePreview(); break;
    case 'copy-formula': {
      const x = byId(id);
      if(x && x.math && x.math.formulas) copyText(x.math.formulas.join('\n'), '已复制公式文本');
      break;
    }
    case 'dock-back': goBack(); break;
    case 'dock-prev': goSibling(-1); break;
    case 'dock-next': goSibling(1); break;
    case 'dock-home': goHome(); break;
    case 'anchor': {
      const el = document.getElementById(t.dataset.target);
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:sbeh(), block:'start'});
      break;
    }
    case 'totop': window.scrollTo({top:0, behavior:sbeh()}); break;
    case 'focus-search':
      switchView('browse');
      setTimeout(() => { const s = document.getElementById('searchInput'); if(s) s.focus(); }, 0);
      break;
    case 'theme': {
      const next = document.body.dataset.theme === 'night' ? 'light' : 'night';
      document.body.dataset.theme = next; save(KEY.theme, next);
      toast(next === 'night' ? '已切换护眼模式' : '已恢复浅色模式');
      break;
    }
    case 'texture': {
      TEXTURE = !TEXTURE;
      document.body.dataset.texture = TEXTURE ? 'on' : 'off';
      save(KEY.texture, TEXTURE);
      toast(TEXTURE ? '已开启质感模式' : '已回到简洁模式');
      break;
    }
  }
});

let composing = false;
let searchTimer = 0;
function scheduleGrid(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderGridOnly, 150);   // 局部更新 + 防抖
}
document.addEventListener('compositionstart', e => {
  if(e.target.id === 'searchInput') composing = true;
});
document.addEventListener('compositionend', e => {
  if(e.target.id !== 'searchInput') return;
  composing = false;
  state.q = e.target.value;
  scheduleGrid();
});
document.addEventListener('input', e => {
  if(e.target.id === 'searchInput'){
    state.q = e.target.value;
    if(composing) return;            // 中文输入法组合期间不重绘，避免打断候选词
    scheduleGrid();                  // 输入框本身不再重建，光标与 IME 自然保持
  }
  if(e.target.dataset && e.target.dataset.preview) updatePreview();
});
document.addEventListener('change', e => {
  if(e.target.id === 'importFile' && e.target.files[0]){
    importCustom(e.target.files[0]); e.target.value = '';
  }
  if(e.target.id === 'backupFile' && e.target.files[0]){
    importBackup(e.target.files[0]); e.target.value = '';
  }
  if(e.target.id === 'f_cat' || e.target.id === 'f_diff') updatePreview();
});
document.addEventListener('keydown', e => {
  const _tag = (document.activeElement && document.activeElement.tagName) || '';
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.activeElement &&
     document.activeElement.id === 'quickNote'){
    e.preventDefault();
    const nid = currentNoteId();
    if(nid) addNote(nid);
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('.entry, .rel')){
    /* 键盘回车直接进详情；鼠标点击仍是「选中 + 右侧速览」 */
    e.preventDefault();
    const kid = e.target.dataset.id;
    if(kid){ state.detail = kid; state.selected = kid; switchView('detail'); }
  }
  if(e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(_tag)){
    e.preventDefault();
    switchView('browse', true);
    setTimeout(() => { const s = document.getElementById('searchInput'); if(s) s.focus(); }, 0);
  }
  if(e.key === 'Escape' && state.view !== 'browse') switchView('browse', true);
  if(e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); goSibling(-1, true); }
  if(e.altKey && e.key === 'ArrowRight'){ e.preventDefault(); goSibling(1, true); }
  if(e.key === 'Home' && !/INPUT|TEXTAREA|SELECT/.test(_tag)){
    e.preventDefault(); goHome(true);
  }
});

/* init */
document.body.dataset.theme = load(KEY.theme, 'light');
document.body.dataset.texture = (load(KEY.texture, false) === true) ? 'on' : 'off';
// canonical 只在已部署到 HTTP(S) 时声明，避免 file:// 生成无意义的地址
if(typeof location !== 'undefined' && document.head && document.createElement &&
   (location.protocol === 'https:' || location.protocol === 'http:')){
  const canonical = document.createElement('link');
  canonical.rel = 'canonical';
  canonical.href = location.origin + location.pathname;
  document.head.appendChild(canonical);
}
render();
</script>
