  {"id":"catboost","name":"CatBoost 梯度提升","en":"CatBoost","cat":"树模型与集成学习","diff":"进阶","summary":"梯度提升的工程强化版：用「有序提升」消除目标泄漏、用对称树加速推理、原生处理类别特征，默认参数就能在小数据上给出很强的结果。","scenes":["含大量类别特征的表数据","小样本竞赛 baseline","需要少调参的 GBDT"],"idea":["每棵树都是对称（oblivious）树：同一层所有节点共用同一组特征与阈值","有序提升：为第 i 个样本算残差时只用排在它之前的样本训练出的模型","类别特征转成有序目标统计量并加先验平滑，避免把高频类别直接编码"],"deps":"catboost 1.2","updated":"2026-11-15","lang":"Python 3 · catboost","math":{"title":"有序目标统计与对称树","formulas":["TS_c = (Σ_{j<k} [x_j = c]·y_j + a·P) / (Σ_{j<k} [x_j = c] + a)","对称树：第 l 层所有节点共用同一 (特征, 阈值) 对，深度 d 共 2^d 个叶子","残差 rᵢ = yᵢ − F_{i−1}(xᵢ)，F_{i−1} 只用前 i−1 个样本训练 ⇒ 切断泄漏"],"steps":["目标统计（把类别换成该类别的平均标签）信息量最大，但直接用会把标签泄漏进特征；CatBoost 用「只用前面的样本」的顺序统计量解决。","对称树把分裂条件限制为「每层一个」，牺牲一点表达力换来 2^d 个叶子可向量化计算，推理比普通树快数倍。","类别特征直接给字符串列名即可，不必手工 one-hot；one_hot_max_size 控制「少量类别直接 one-hot」的阈值。"],"tex":["TS_{c} = \\frac{\\sum_{j<k}[x_{j}=c]\\,y_{j}+aP}{\\sum_{j<k}[x_{j}=c]+a}","\\text{leaf}(x)=\\sum_{l=1}^{d}2^{\\,l-1}I\\big[x_{f_{l}}>\\theta_{l}\\big]","r_{i}=y_{i}-F_{i-1}(x_{i}),\\quad F_{i-1}\\ \\text{只用前 }i-1\\text{ 个样本训练}"]},"params":[["iterations","int","1000","提升轮数（树的数量），正整数，默认 1000。偏大配合 early_stopping_rounds 自动停；偏小欠拟合。"],["depth","int","6","对称树深度，常用 4–10，默认 6。深度 d 对应 2^d 个叶子；越深表达越强也越容易过拟合，小数据建议 4–6。"],["learning_rate","float","0.03","每棵树的收缩步长，正浮点数，默认 0.03。越小需要越多轮但泛化更好；0.03–0.1 是常用区间。"],["l2_leaf_reg","float","3.0","叶子值的 L2 正则，正浮点数，默认 3.0。越大越保守、抗噪更强；越小越贴合训练集。"],["one_hot_max_size","int","2","类别数不超过该阈值的特征直接用 one-hot，其余用目标统计，默认 2。类别基数小的特征调大此项常能提升效果。"]],"input":"X: DataFrame（可含字符串列）；y: 标签；cat_features: 类别列名或索引","output":"model: CatBoostClassifier/Regressor；predict_proba、get_feature_importance","code":"import numpy as np, pandas as pd\nfrom catboost import CatBoostClassifier, Pool\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\nrng = np.random.RandomState(0)\nn = 3000\ndf = pd.DataFrame({\n    'city': rng.choice(['北京', '上海', '成都', '西安'], n),      # 类别特征直接用字符串\n    'channel': rng.choice(['app', 'web', 'mini'], n),\n    'age': rng.randint(18, 60, n),\n    'freq': rng.poisson(3, n),\n})\n# 让 city 真正影响标签，验证目标统计能学到东西\nboost = df['city'].map({'北京': 1.2, '上海': 0.6, '成都': -0.4, '西安': -1.0}).values\nlogit = boost + 0.03 * (df['age'] - 38) + 0.2 * df['freq'] + rng.normal(0, .8, n)\ndf['y'] = (logit > np.median(logit)).astype(int)\n\nXtr, Xte, ytr, yte = train_test_split(df.drop(columns='y'), df['y'], test_size=.25,\n                                      random_state=0, stratify=df['y'])\ncats = ['city', 'channel']\n\nmodel = CatBoostClassifier(iterations=600, depth=6, learning_rate=0.05,\n                           l2_leaf_reg=3.0, one_hot_max_size=4,\n                           eval_metric='AUC', random_seed=0, verbose=100)\nmodel.fit(Pool(Xtr, ytr, cat_features=cats),\n          eval_set=Pool(Xte, yte, cat_features=cats),\n          early_stopping_rounds=80)          # 验证集 AUC 不再提升就停\n\nprint('AUC:', round(roc_auc_score(yte, model.predict_proba(Xte)[:, 1]), 4))\nprint(pd.Series(model.get_feature_importance(), index=Xtr.columns).sort_values(ascending=False))\n# 类别特征的处理结果可以直接导出，便于排查目标统计是否合理\nprint(model.get_cat_feature_indices())"},
  {"id":"som","name":"自组织映射 SOM","en":"Self-Organizing Map","cat":"无监督与降维","diff":"进阶","summary":"把高维样本铺到一张低维网格上，靠「竞争找最近节点 + 邻域一起靠拢」保持拓扑：相似的样本落到相邻节点，是早期最有名的拓扑保持降维方法。","scenes":["高维数据可视化","拓扑结构探索","聚类结果解释"],"idea":["网格上每个节点挂一个与输入同维的权向量","每个样本找最近的节点（BMU），把 BMU 和它的网格邻居一起往样本方向拉","学习率与邻域半径随训练衰减，后期只做局部微调"],"deps":"numpy · matplotlib","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"竞争学习与邻域更新","formulas":["BMU： c = argmin_k ‖x − w_k‖","w_k ← w_k + η·h(k,c)·(x − w_k)","h(k,c) = exp(−‖r_k − r_c‖² / (2σ²))，η、σ 随轮数衰减"],"steps":["关键在 h(k,c)：不只更新胜者，还按网格距离带着邻居一起动，拓扑结构才能保留下来。","权向量初值建议从样本里随机抽（比全零收敛快得多），否则早期几乎所有样本都抢同一个节点。","U-Matrix（每个节点与邻居权向量的平均距离）常用来直接看图上的簇边界，比只看节点颜色直观。"],"tex":["c = \\arg\\min_{k}\\lVert x-w_{k}\\rVert","w_{k} \\leftarrow w_{k} + \\eta\\,h(k,c)(x-w_{k})","h(k,c) = \\exp\\!\\left(-\\frac{\\lVert r_{k}-r_{c}\\rVert^{2}}{2\\sigma^{2}}\\right)"]},"params":[["grid","tuple","(10, 10)","网格尺寸 (rows, cols)，正整数。节点总数应大致与样本量同量级或略少；太小挤不下结构，太大得到大量几乎无样本的节点，无单位。"],["sigma","float","3.0","邻域半径初始值（网格步长单位），默认 3.0。越大时邻居被拉扯的范围越广、拓扑更平滑；过大会把不同簇强行拉在一起。"],["lr","float","0.5","初始学习率，0–1，默认 0.5。越大更新越激进、收敛快但可能来回震荡；随轮数线性衰减到 0.01 附近最稳。"],["epochs","int","50","遍历训练集的轮数，正整数，默认 50。偏少则拓扑未成形；50–200 是常用范围，数据量大时可减到 20。"]],"input":"X: (n_samples, n_features)，建议先标准化","output":"weights: (rows, cols, n_features) 节点权向量；可画出 U-Matrix 与节点类分布","code":"import numpy as np\n\nclass SOM:\n    \"\"\"经典 Kohonen 自组织映射，网格节点权向量 + 高斯邻域。\"\"\"\n    def __init__(self, grid=(10, 10), sigma=3.0, lr=0.5, epochs=50, seed=0):\n        self.R, self.C = grid\n        self.sigma0, self.lr0, self.epochs = sigma, lr, epochs\n        self.rng = np.random.RandomState(seed)\n        # 节点在网格上的坐标，用于算邻域距离\n        rr, cc = np.meshgrid(np.arange(self.R), np.arange(self.C), indexing='ij')\n        self.pos = np.stack([rr.ravel(), cc.ravel()], axis=1).astype(float)\n\n    def fit(self, X):\n        X = np.asarray(X, float)\n        X = (X - X.mean(0)) / (X.std(0) + 1e-9)          # 标准化，避免某一维主导距离\n        n, d = X.shape\n        idx = self.rng.choice(n, self.R * self.C, replace=n < self.R * self.C)\n        self.W = X[idx].copy()                            # 用真实样本初始化权向量\n        total = self.epochs * n\n        for ep in range(self.epochs):\n            eta = self.lr0 * (1 - ep / self.epochs) + 0.01\n            sigma = self.sigma0 * (1 - ep / self.epochs) + 0.5\n            for i in self.rng.permutation(n):\n                d2 = ((self.W - X[i]) ** 2).sum(1)        # 每个节点到样本的距离\n                c = int(d2.argmin())                      # 胜者 BMU\n                h = np.exp(-((self.pos - self.pos[c]) ** 2).sum(1) / (2 * sigma ** 2))\n                self.W += (eta * h)[:, None] * (X[i] - self.W)\n        return self\n\n    def u_matrix(self):\n        \"\"\"U-Matrix：每个节点与 4 邻域权向量的平均距离，值大处是簇边界。\"\"\"\n        W = self.W.reshape(self.R, self.C, -1)\n        U = np.zeros((self.R, self.C))\n        for dr, dc in [(1, 0), (-1, 0), (0, 1), (0, -1)]:\n            shifted = np.roll(np.roll(W, dr, 0), dc, 1)\n            U += np.linalg.norm(W - shifted, axis=2)\n        return U / 4\n\nif __name__ == '__main__':\n    from sklearn.datasets import load_iris\n    X, y = load_iris(return_X_y=True)\n    som = SOM(grid=(8, 8), epochs=30).fit(X)\n    U = som.u_matrix()\n    print('U-Matrix 形状', U.shape, '边界强度范围', round(U.min(), 3), '~', round(U.max(), 3))\n    # 把每个节点映射到样本最多的类别，看拓扑是否把三类分开了\n    labels = np.full(len(som.W), -1)\n    for i, x in enumerate((X - X.mean(0)) / (X.std(0) + 1e-9)):\n        b = int(((som.W - x) ** 2).sum(1).argmin())\n        labels[b] = y[i] if labels[b] == -1 else labels[b]\n    print('有样本的节点数:', int((labels >= 0).sum()), '/', len(labels))"},
  {"id":"art","name":"ART 自适应谐振理论网络","en":"Adaptive Resonance Theory (ART1)","cat":"无监督与降维","diff":"高难","summary":"靠「警戒参数」在线聚类的网络：新样本与已有原型足够像就归入并微调原型，不够像就新建一类。它专门解决增量学习里「学新忘旧」的稳定性-可塑性困境。","scenes":["在线/流式聚类","增量学习不遗忘","二值特征分类"],"idea":["每个类别保存一个原型（0/1 向量）与计数","新样本与各原型算匹配度（按位与的占比），取最高者比较警戒值 ρ","通过就并入（原型取交集，只减不增），不通过就新建节点——权值只能收缩，因此旧类别不会被后来的样本抹掉"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"匹配度、警戒与原型收缩","formulas":["选择： T_j = |x ∧ w_j| / (α + |w_j|)","匹配检验： |x ∧ w_j| / |x| ≥ ρ  →  归入类别 j","原型更新： w_j ← w_j ∧ x（只保留共同为 1 的位）"],"steps":["ρ 是关键旋钮：接近 1 时要求几乎完全一致，会切出很多细类；接近 0 则什么都往一类塞。","原型用「按位与」更新意味着它只会越来越窄，这保证了类别不会因为新样本而无界扩张——这就是 ART 的稳定性来源。","ART1 只处理二值输入；连续值要先归一化成 0/1（或用 ART2 / Fuzzy ART），否则匹配度失去意义。"],"tex":["T_{j} = \\frac{|x \\wedge w_{j}|}{\\alpha+|w_{j}|}","\\frac{|x \\wedge w_{j}|}{|x|} \\ge \\rho","w_{j} \\leftarrow w_{j} \\wedge x"]},"params":[["rho","float","0.75","警戒参数，取值 0–1，默认 0.75。越接近 1 分类越细、类别越多；越小越粗、容易把不同模式并成一类。"],["alpha","float","0.001","选择函数的分母偏置，正浮点数，默认 0.001。只影响「多个原型都合格时挑哪个」，通常取小值让选择偏向原型更具体的类别。"],["max_classes","int","50","类别数上限，正整数，默认 50。达到上限后若仍不匹配则归入最相近的类，防止异常样本把类别数撑爆。"],["epochs","int","1","遍历轮数，正整数，默认 1。ART 是单遍在线算法，多轮通常不再改变结果，仅在顺序敏感时用于稳定。"]],"input":"X: (n_samples, n_features) 二值（0/1）矩阵","output":"labels: (n,) 在线分配的类别号；prototypes: 每个类别的原型向量","code":"import numpy as np\n\nclass ART1:\n    \"\"\"自适应谐振理论（二值版）：警戒参数控制粒度，原型只收缩不扩张。\"\"\"\n    def __init__(self, rho=0.75, alpha=0.001, max_classes=50):\n        self.rho, self.alpha, self.max = rho, alpha, max_classes\n\n    def fit_predict(self, X):\n        X = (np.asarray(X) > 0).astype(np.int8)\n        n, d = X.shape\n        self.W = np.zeros((0, d), dtype=np.int8)     # 原型矩阵\n        self.count = np.zeros(0, dtype=int)\n        labels = np.zeros(n, dtype=int)\n        for i, x in enumerate(X):\n            nx = x.sum()\n            if nx == 0:                              # 全零样本无法匹配任何原型\n                labels[i] = -1\n                continue\n            if len(self.W) == 0:\n                self.W = np.vstack([self.W, x]); self.count = np.append(self.count, 1)\n                labels[i] = 0\n                continue\n            inter = (self.W & x).sum(1)              # |x ∧ w_j|\n            T = inter / (self.alpha + self.W.sum(1)) # 选择函数\n            order = np.argsort(-T)                   # 按匹配度从高到低试\n            assigned = -1\n            for j in order:\n                if inter[j] / nx >= self.rho:        # 警戒检验通过\n                    self.W[j] = self.W[j] & x         # 原型只会收缩（稳定性）\n                    self.count[j] += 1\n                    assigned = j\n                    break\n            if assigned < 0:\n                if len(self.W) < self.max:\n                    self.W = np.vstack([self.W, x]); self.count = np.append(self.count, 1)\n                    assigned = len(self.W) - 1\n                else:                                # 到上限：退化为最近类\n                    assigned = int(np.argmax(inter / (self.alpha + self.W.sum(1))))\n                    self.count[assigned] += 1\n            labels[i] = assigned\n        return labels\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    # 三簇二值模式，模拟增量到达\n    X = np.vstack([(rng.rand(60, 12) > .8), (rng.rand(60, 12) > .5), (rng.rand(60, 12) > .2)]).astype(int)\n    for rho in (0.5, 0.75, 0.95):\n        art = ART1(rho=rho)\n        lab = art.fit_predict(X)\n        print(f'rho={rho}: 类别数={len(art.W)}  归属分布={np.bincount(lab[lab >= 0])}')"},
  {"id":"counter-propagation","name":"对偶传播网络 CPN","en":"Counter-Propagation Network","cat":"无监督与降维","diff":"高难","summary":"两层前向网：Kohonen 层做竞争聚类，Grossberg 层把胜出节点映射成目标向量。本质是「在线聚类 + 查表」的组合，训练只做局部更新，速度极快。","scenes":["快速有监督分类","在线学习","聚类+映射一体化"],"idea":["输入→Kohonen 层竞争，只有胜出节点输出 1，其余为 0","Grossberg 层把该 1 转成目标向量，只更新胜出节点对应的那行权重","两层的权分别学「聚类中心」和「类→目标」的映射关系"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"竞争层的胜者与 Grossberg 层的输出","formulas":["胜者： c = argmax_j (w_jᵀx / ‖w_j‖)（输入归一化后即最大内积）","Kohonen 输出： y = onehot(c)","Grossberg 更新： v_k ← v_k + β·(t − v_k)·y_k"],"steps":["Kohonen 层训练阶段用「胜者向样本靠拢」的自组织规则；Grossberg 层只在胜者对应行上做向目标插值。","两层的学习率通常分开设：聚类层小（稳），映射层大（快速对齐目标）。","与 LVQ 的区别：CPN 的竞争完全无监督，目标只进入第二层；LVQ 用标签直接拉近/推远原型。"],"tex":["c = \\arg\\max_{j}\\frac{w_{j}^{\\top}x}{\\lVert w_{j}\\rVert}","y = \\mathrm{onehot}(c)","v_{k} \\leftarrow v_{k}+\\beta\\,(t-v_{k})\\,y_{k}"]},"params":[["n_units","int","20","Kohonen 层节点数，正整数，默认 20。太少会欠拟合类别结构，太多则大量节点闲置；一般取类别数的 3–10 倍。"],["lr_kohonen","float","0.1","竞争层学习率，默认 0.1。越大聚类中心移动越快但易震荡；训练后期可衰减到 0.01。"],["lr_grossberg","float","0.05","映射层学习率，默认 0.05。越大输出层越快对齐目标，但同一节点被多个类别争用时会产生平均混合。"],["epochs","int","100","遍历轮数，正整数，默认 100。CPN 收敛很快，通常 20–100 轮足够。"]],"input":"X: (n, d) 输入向量（建议归一化）；y: 目标 one-hot 或标量标签","output":"model: W (n_units, d) 聚类中心、V (n_units, n_out) 映射权；predict 返回输出","code":"import numpy as np\n\nclass CPN:\n    \"\"\"对偶传播网络：Kohonen 竞争层 + Grossberg 映射层。\"\"\"\n    def __init__(self, n_units=20, lr_kohonen=0.1, lr_grossberg=0.05, epochs=100, seed=0):\n        self.k, self.lr1, self.lr2, self.epochs = n_units, lr_kohonen, lr_grossberg, epochs\n        self.rng = np.random.RandomState(seed)\n\n    def fit(self, X, Y):\n        X = np.asarray(X, float); Y = np.asarray(Y, float)\n        if Y.ndim == 1:\n            Y = np.eye(int(Y.max()) + 1)[Y.astype(int)]     # 标量标签转 one-hot\n        n, d = X.shape\n        self.W = self.rng.rand(self.k, d)                   # 竞争层权（聚类中心）\n        self.V = np.zeros((self.k, Y.shape[1]))             # 映射层权（类 -> 输出）\n        for _ in range(self.epochs):\n            for i in self.rng.permutation(n):\n                x = X[i]\n                c = int(np.argmax(self.W @ x / (np.linalg.norm(self.W, axis=1) + 1e-9)))\n                self.W[c] += self.lr1 * (x - self.W[c])     # 胜者向样本靠拢\n                self.V[c] += self.lr2 * (Y[i] - self.V[c])  # 胜者对应的输出行向目标靠拢\n        return self\n\n    def predict(self, X):\n        X = np.asarray(X, float)\n        idx = np.argmax(X @ self.W.T / (np.linalg.norm(self.W, axis=1) + 1e-9), axis=1)\n        return self.V[idx]\n\nif __name__ == '__main__':\n    from sklearn.datasets import load_iris\n    from sklearn.model_selection import train_test_split\n    X, y = load_iris(return_X_y=True)\n    X = X / np.linalg.norm(X, axis=1, keepdims=True)        # 竞争层要求输入归一化\n    Xtr, Xte, ytr, yte = train_test_split(X, y, test_size=.3, random_state=0, stratify=y)\n    m = CPN(n_units=20, epochs=60).fit(Xtr, ytr)\n    pred = m.predict(Xte).argmax(1)\n    print('test acc:', round((pred == yte).mean(), 4))\n    print('空节点数:', int((np.linalg.norm(m.V, axis=1) == 0).sum()), '/ 20')"},
  {"id":"collaborative-filtering","name":"协同过滤 CF","en":"Collaborative Filtering","cat":"无监督与降维","diff":"入门","summary":"只用「用户-物品」交互矩阵做推荐：按相似用户或相似物品加权打分，或把矩阵分解成隐向量补全缺失值。冷启动与稀疏是它的两个死穴。","scenes":["推荐系统召回","评分预测","隐式反馈建模"],"idea":["User-CF：找兴趣最像的 K 个用户，用他们的评分加权预测目标用户","Item-CF：找与目标物品最像的 K 个物品（更稳定，工业界主力）","矩阵分解：把 R 近似成 P·Qᵀ，用隐向量内积补全缺失评分"],"deps":"numpy · scipy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"邻域加权与矩阵分解","formulas":["r̂_ui = μ_u + Σ_{v∈N} sim(u,v)(r_vi − μ_v) / Σ_{v∈N} |sim(u,v)|","min Σ_{(u,i)∈Ω} (r_ui − p_uᵀq_i)² + λ(‖p_u‖² + ‖q_i‖²)","余弦相似度 sim(i,j) = r_i·r_j / (‖r_i‖·‖r_j‖)"],"steps":["Item-CF 通常比 User-CF 稳：物品数量少、变化慢，相似度可以离线算好复用。","评分矩阵极稀疏（<1% 非零），所以邻域方法要先减去用户均值，否则「谁打得分多」会成为主要信号。","矩阵分解把「相似」交给隐空间自动学，比手工相似度更能捕捉跨类偏好；加正则与偏置项是必备操作。"],"tex":["\\hat{r}_{ui} = \\mu_{u}+\\frac{\\sum_{v\\in N}sim(u,v)(r_{vi}-\\mu_{v})}{\\sum_{v\\in N}|sim(u,v)|}","\\min\\sum_{(u,i)\\in\\Omega}(r_{ui}-p_{u}^{\\top}q_{i})^{2}+\\lambda(\\lVert p_{u}\\rVert^{2}+\\lVert q_{i}\\rVert^{2})","\\mathrm{sim}(i,j)=\\frac{r_i\\cdot r_j}{\\lVert r_i\\rVert\\,\\lVert r_j\\rVert}"]},"params":[["mode","str","item","邻域对象。item（默认，找相似物品，稳定且可离线缓存）、user（找相似用户，兴趣迁移快但更抖）。"],["k_neighbors","int","20","参与加权的最相似邻居数，正整数，默认 20。太小噪声大，太大把不相关的也拉进来；10–40 常用。"],["n_factors","int","32","矩阵分解的隐向量维度，正整数，默认 32。越大表达越强、越容易过拟合稀疏数据；8–64 常用。"],["reg","float","0.05","矩阵分解的正则系数，正浮点数，默认 0.05。越大越保守、缓解稀疏过拟合；太小在稀疏数据上会严重过拟合。"],["n_epochs","int","30","SGD 迭代轮数，正整数，默认 30。配合早停使用，过多轮在稀疏矩阵上几乎必然过拟合。"]],"input":"R: (n_users, n_items) 评分矩阵，缺失用 0 或 NaN 表示","output":"pred: 补全后的评分矩阵；top_k: 每个用户的 top-N 推荐","code":"import numpy as np\n\ndef cosine_sim(A):\n    \"\"\"行向量的余弦相似度矩阵（A: n_items x n_users）。\"\"\"\n    n = np.linalg.norm(A, axis=1, keepdims=True) + 1e-9\n    Z = A / n\n    return Z @ Z.T\n\nclass ItemCF:\n    def __init__(self, k_neighbors=20):\n        self.k = k_neighbors\n\n    def fit(self, R):\n        self.R = np.asarray(R, float)\n        self.mu_u = np.true_divide(self.R.sum(1), (self.R > 0).sum(1) + 1e-9)\n        self.S = cosine_sim(self.R.T)                 # 物品-物品相似度\n        np.fill_diagonal(self.S, 0)\n        return self\n\n    def predict(self, R=None):\n        R = self.R if R is None else np.asarray(R, float)\n        pred = np.zeros_like(R)\n        for u in range(R.shape[0]):\n            rated = R[u] > 0\n            if rated.sum() == 0:\n                continue\n            sim = self.S[rated]                       # (已评分物品, 全部物品)\n            w = np.sort(sim, axis=0)[-self.k:]        # 只留 K 个最强邻居\n            mask = sim >= w[0] if sim.shape[0] > self.k else np.ones_like(sim, bool)\n            num = (sim * mask * (R[u][rated] - self.mu_u[u])[:, None]).sum(0)\n            den = (np.abs(sim) * mask).sum(0) + 1e-9\n            pred[u] = self.mu_u[u] + num / den\n            pred[u][rated] = R[u][rated]              # 已评分的保持原值\n        return pred\n\nclass MF:\n    \"\"\"带偏置的矩阵分解，SGD 训练。\"\"\"\n    def __init__(self, n_factors=32, reg=0.05, n_epochs=30, lr=0.01, seed=0):\n        self.k, self.reg, self.epochs, self.lr = n_factors, reg, n_epochs, lr\n        self.rng = np.random.RandomState(seed)\n\n    def fit(self, R):\n        R = np.asarray(R, float)\n        nu, ni = R.shape\n        self.bu, self.bi = np.zeros(nu), np.zeros(ni)\n        self.mu = R[R > 0].mean()\n        self.P = self.rng.normal(0, .1, (nu, self.k))\n        self.Q = self.rng.normal(0, .1, (ni, self.k))\n        for _ in range(self.epochs):\n            for u, i in zip(*np.nonzero(R)):\n                e = R[u, i] - self.predict_one(u, i)\n                self.bu[u] += self.lr * (e - self.reg * self.bu[u])\n                self.bi[i] += self.lr * (e - self.reg * self.bi[i])\n                pu, qi = self.P[u].copy(), self.Q[i].copy()\n                self.P[u] += self.lr * (e * qi - self.reg * pu)\n                self.Q[i] += self.lr * (e * pu - self.reg * qi)\n        return self\n\n    def predict_one(self, u, i):\n        return self.mu + self.bu[u] + self.bi[i] + self.P[u] @ self.Q[i]\n\n    def predict(self):\n        return self.mu + self.bu[:, None] + self.bi[None, :] + self.P @ self.Q.T\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    true = rng.rand(40, 30) * 4 + 1\n    R = np.where(rng.rand(40, 30) < 0.2, np.round(true), 0)   # 只有 20% 有评分\n\n    icf = ItemCF(k_neighbors=10).fit(R)\n    P1 = icf.predict()\n    mf = MF(n_factors=8, n_epochs=20).fit(R)\n    P2 = mf.predict()\n    mask = R == 0\n    print('ItemCF RMSE:', round(float(np.sqrt(((P1[mask] - true[mask]) ** 2).mean())), 3))\n    print('MF     RMSE:', round(float(np.sqrt(((P2[mask] - true[mask]) ** 2).mean())), 3))"},
  {"id":"label-propagation","name":"标签传播","en":"Label Propagation","cat":"半监督学习","diff":"进阶","summary":"把样本连成图，让已标注样本的标签沿相似边「扩散」到未标注样本：只需极少人工标签，就能给整个数据集打上标签，是半监督里最轻量的方案。","scenes":["标注成本高的场景","图结构数据","快速打伪标签"],"idea":["用 kNN 或 RBF 核建相似度图 W，归一化成概率转移矩阵 S","已标注节点的标签固定，迭代 Y ← αSY + (1−α)Y₀","收敛后取每个未标注节点概率最大的类（闭式解可一步算完）"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"图上的标签扩散不动点","formulas":["S = D^{−1/2} W D^{−1/2}","Y^{(t+1)} = α S Y^{(t)} + (1−α) Y^{(0)}","收敛解 Y* = (1−α)(I − αS)^{−1} Y^{(0)}，再取 ŷ_i = argmax_c Y_ic"],"steps":["α 控制「信自己还是信邻居」：接近 1 时标签几乎完全由图结构决定，接近 0 则几乎不动。","因为 (I − αS) 可逆，迭代版与直接解线性方程组等价，数据量大时用迭代、小数据直接求解。","图建得好不好决定上限：kNN 尺度不一致会切出孤立点，RBF 的 γ 过大图会碎成一片孤岛。"],"tex":["S = D^{-1/2}WD^{-1/2}","Y^{(t+1)} = \\alpha S Y^{(t)}+(1-\\alpha)Y^{(0)}","Y^{*}=(1-\\alpha)(I-\\alpha S)^{-1}Y^{(0)},\\quad \\hat y_{i}=\\argmax_{c}Y_{ic}"]},"params":[["kernel","str","knn","建图方式。knn（默认，按近邻连边，适合均匀分布）、rbf（按距离给权重，需调 gamma）、linear（内积，适合高维文本）。"],["n_neighbors","int","7","knn 建图时的邻居数，正整数，默认 7。太小图不连通、标签传不过去；太大把远处的类也连起来造成串味。"],["gamma","float","20","rbf 核宽度参数，正浮点数，默认 20。越大只有很近的点相连、图容易碎；越小连接越密、容易跨类传播。"],["alpha","float","0.2","标签回拉强度相关参数（sklearn 中为 clamping 系数），0–1，默认 0.2。越小越贴住已标注值、越大越依赖邻居。"],["max_iter","int","1000","最大迭代轮数，正整数，默认 1000。通常几十轮即收敛，设大只是兜底。"]],"input":"X: (n, d) 特征；y: (n,) 标签，未标注用 −1 表示","output":"model: label_distributions_ 与 transduction_（未标注样本的预测标签）","code":"import numpy as np\nfrom sklearn.semi_supervised import LabelSpreading\nfrom sklearn.datasets import make_moons\nfrom sklearn.metrics import accuracy_score\n\nX, y_true = make_moons(n_samples=400, noise=0.15, random_state=0)\n\n# 只保留 10 个标签，其余设为 -1（未标注）\nrng = np.random.RandomState(0)\ny = np.full_like(y_true, -1)\nidx = np.concatenate([rng.choice(np.where(y_true == 0)[0], 5, replace=False),\n                      rng.choice(np.where(y_true == 1)[0], 5, replace=False)])\ny[idx] = y_true[idx]\n\nfor kernel, kw in [('knn', {'n_neighbors': 7}), ('rbf', {'gamma': 20})]:\n    m = LabelSpreading(kernel=kernel, alpha=0.2, max_iter=1000, **kw)\n    m.fit(X, y)\n    acc = accuracy_score(y_true, m.transduction_)\n    print(f'{kernel}: 用 10 个标签 -> 全量准确率 {acc:.4f}')\n\n# 手写迭代版，看清「扩散」这一步\ndef propagate(X, y, k=7, alpha=0.2, iters=100):\n    n = len(y)\n    d2 = ((X[:, None, :] - X[None, :, :]) ** 2).sum(-1)\n    np.fill_diagonal(d2, np.inf)\n    nn = np.argsort(d2, axis=1)[:, :k]                      # kNN 邻接\n    W = np.zeros((n, n))\n    W[np.repeat(np.arange(n), k), nn.ravel()] = 1.0\n    W = np.maximum(W, W.T)\n    D = np.diag(W.sum(1) ** -0.5)\n    S = D @ W @ D                                           # 对称归一化\n    Y0 = np.eye(y.max() + 1)[np.where(y >= 0, y, 0)]\n    Y0[y < 0] = 0\n    Y = Y0.copy()\n    for _ in range(iters):\n        Y = alpha * (S @ Y) + (1 - alpha) * Y0\n    return Y.argmax(1)\n\nprint('手写版准确率:', round(accuracy_score(y_true, propagate(X, y)), 4))"},
  {"id":"td-learning","name":"时序差分 TD 学习","en":"Temporal Difference Learning","cat":"强化学习","diff":"进阶","summary":"不等回合结束，用「下一状态的当前估计」来更新当前估计（自举）。TD 误差是 Q-Learning、Sarsa、Actor-Critic 的共同祖先，是强化学习最核心的那一步。","scenes":["无模型价值估计","在线学习","理解 Q-Learning 的前置"],"idea":["V(s) ← V(s) + α[r + γV(s′) − V(s)]","方括号内就是 TD 误差 δ，衡量「新证据」与「旧估计」的差","TD(λ) 用资格迹在「一步自举」和「整回合回报」之间连续插值"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"TD(0) 更新与 TD(λ) 资格迹","formulas":["δ_t = r_{t+1} + γV(s_{t+1}) − V(s_t)","V(s_t) ← V(s_t) + α·δ_t","e_t = γλ·e_{t−1} + 1_{s=s_t}，V ← V + α·δ_t·e_t"],"steps":["TD 与蒙特卡洛的区别：MC 要等真实回报，TD 用下一状态的估计顶上，因此可以逐步在线更新、方差更低但引入偏差。","λ=0 退化为 TD(0)，λ=1 等价于每次访问的蒙特卡洛；中间值通常收敛更快。","Q-Learning 就是把这里的 V 换成 Q 并取 max 的 off-policy 版本；Sarsa 换成实际执行的下一动作。"],"tex":["\\delta_{t} = r_{t+1}+\\gamma V(s_{t+1})-V(s_{t})","V(s_{t}) \\leftarrow V(s_{t})+\\alpha\\,\\delta_{t}","e_{t} = \\gamma\\lambda\\,e_{t-1}+\\mathbf{1}_{s=s_{t}}"]},"params":[["alpha","float","0.1","学习率（步长），0–1，默认 0.1。越大跟得越快但估计更抖；越小越稳但收敛慢，非平稳环境需保持较大值。"],["gamma","float","0.9","折扣因子，0–1，默认 0.9。越接近 1 越重视长期回报、但方差更大；越接近 0 越短视。"],["lambda","float","0.8","资格迹衰减 λ，0–1，默认 0.8。λ=0 即 TD(0)，λ=1 近似蒙特卡洛；0.6–0.9 通常收敛最快，仅 TD(λ) 使用。"],["episodes","int","500","训练回合数，正整数，默认 500。随机策略下需要足够回合让所有状态被访问到。"]],"input":"env: 带 reset()/step() 的环境（如随机游走、GridWorld）","output":"V: 状态价值表；可画出每回合的 TD 误差曲线","code":"import numpy as np\n\nclass RandomWalk:\n    \"\"\"经典 TD 教材环境：5 个非终止状态，走到最右 +1，最左 0。\"\"\"\n    n = 5\n    def reset(self):\n        self.s = 2\n        return self.s\n    def step(self, a):\n        self.s += 1 if a == 1 else -1\n        if self.s == 6:  return self.s, 1.0, True\n        if self.s == 0:  return self.s, 0.0, True\n        return self.s, 0.0, False\n\ndef td0(env, episodes=500, alpha=0.1, gamma=1.0, seed=0):\n    rng = np.random.RandomState(seed)\n    V = np.zeros(env.n + 2)                        # 索引 0..6，0 和 6 是终止\n    for _ in range(episodes):\n        s = env.reset()\n        while True:\n            a = rng.randint(2)\n            s2, r, done = env.step(a)\n            target = r if done else r + gamma * V[s2]   # 自举：用下一状态的估计\n            V[s] += alpha * (target - V[s])             # 括号内即 TD 误差 δ\n            s = s2\n            if done:\n                break\n    return V\n\ndef td_lambda(env, episodes=500, alpha=0.1, gamma=1.0, lam=0.8, seed=0):\n    rng = np.random.RandomState(seed)\n    V = np.zeros(env.n + 2)\n    for _ in range(episodes):\n        s = env.reset()\n        e = np.zeros_like(V)                       # 资格迹\n        while True:\n            a = rng.randint(2)\n            s2, r, done = env.step(a)\n            delta = r + (0 if done else gamma * V[s2]) - V[s]\n            e *= gamma * lam\n            e[s] += 1\n            V += alpha * delta * e                 # 按迹回溯更新所有经过的状态\n            s = s2\n            if done:\n                break\n    return V\n\nif __name__ == '__main__':\n    truth = np.array([0, 1/6, 2/6, 3/6, 4/6, 5/6, 0])   # 理论真实价值\n    for name, f in [('TD(0)', td0), ('TD(lambda)', td_lambda)]:\n        V = f(RandomWalk(), episodes=800)\n        err = np.abs(V[1:6] - truth[1:6]).mean()\n        print(f'{name}: 平均绝对误差 {err:.4f}  V={np.round(V[1:6], 2)}')"},
  {"id":"hmm","name":"隐马尔可夫模型 HMM","en":"Hidden Markov Model","cat":"概率图与生成模型","diff":"进阶","summary":"用「隐藏状态链 + 转移概率 + 发射概率」描述可观测序列背后的不可见状态：前向-后向算似然、Viterbi 解最可能路径，是语音识别与序列标注的经典底座。","scenes":["序列标注与分词","语音/手势识别","状态切换检测"],"idea":["隐状态按马尔可夫链转移：P(z_t | z_{t−1})，只看前一状态","观测只依赖当前状态：P(x_t | z_t)","学习用 Baum-Welch（EM 的特例），解码用 Viterbi 动态规划"],"deps":"hmmlearn 0.3","updated":"2026-11-15","lang":"Python 3 · hmmlearn","math":{"title":"前向递推与 Viterbi 解码","formulas":["α_t(j) = [Σ_i α_{t−1}(i)·a_ij]·b_j(x_t)","P(X|θ) = Σ_j α_T(j)","δ_t(j) = max_i [δ_{t−1}(i)·a_ij]·b_j(x_t)"],"steps":["直接枚举所有状态路径是 K^T 指数级；前向递推把它压成 O(TK²)，这是 HMM 能用的根本原因。","Viterbi 与前向的唯一差别是把 Σ 换成 max，并额外记回溯指针；求的是最可能路径而不是似然。","Baum-Welch 就是 EM：E 步用前向-后向算状态占用与转移期望，M 步重新估计参数，反复直到似然不再提升。"],"tex":["\\alpha_{t}(j) = \\Big[\\sum_{i}\\alpha_{t-1}(i)a_{ij}\\Big]b_{j}(x_{t})","P(X|\\theta) = \\sum_{j}\\alpha_{T}(j)","\\delta_{t}(j) = \\max_{i}\\big[\\delta_{t-1}(i)a_{ij}\\big]b_{j}(x_{t})"]},"params":[["n_components","int","3","隐状态数 K，正整数，默认 3。太少无法刻画状态切换，太多则参数爆炸、易过拟合；可用 BIC 或不同 K 的似然做选择。"],["covariance_type","str","diag","发射分布的协方差形式。diag（默认，各维独立，参数少）、full（含维间相关，需更多数据）、spherical/tied 更省参数。"],["n_iter","int","100","Baum-Welch 迭代上限，正整数，默认 100。偏小可能未收敛（似然还在涨），偏大只是多花时间；配合 tol 判断。"],["tol","float","1e-2","似然提升小于该值即停止，正浮点数，默认 0.01。越小解得越准但更慢。"],["algorithm","str","viterbi","解码算法：viterbi（默认，最可能路径）或 map（逐点最可能状态，会给出不合法的状态转移）。"]],"input":"X: (n_samples, n_features) 观测序列；可选 lengths 表示多条不等长序列","output":"model: transmat_ 转移矩阵、means_/covars_ 发射参数；predict 返回状态路径","code":"import numpy as np\nfrom hmmlearn.hmm import GaussianHMM\n\nrng = np.random.RandomState(0)\n\n# 造一条「两种状态交替」的序列：状态 0 均值 0，状态 1 均值 4\nn = 300\nstates = np.zeros(n, dtype=int)\nfor t in range(1, n):\n    if rng.rand() < 0.05:                       # 5% 概率切换状态\n        states[t] = 1 - states[t - 1]\n    else:\n        states[t] = states[t - 1]\nX = np.where(states[:, None] == 0, rng.normal(0, 1, (n, 2)), rng.normal(4, 1.2, (n, 2)))\n\nmodel = GaussianHMM(n_components=2, covariance_type='diag', n_iter=200,\n                    tol=1e-3, random_state=0)\nmodel.fit(X)\n\nprint('对数似然:', round(model.score(X), 2))\nprint('转移矩阵:\\n', np.round(model.transmat_, 3))   # 行和为 1\nprint('各状态均值:', np.round(model.means_, 2))\nprint('按均值判断哪个状态对应高值:', np.argsort(model.means_[:, 0]))\n\n# Viterbi 解码：最可能的状态路径\npath = model.predict(X)\nprint('解码准确率:', round((path == states).mean(), 3))\nprint('前 20 步预测/真实:', path[:20], states[:20])\n\n# 前向-后向：逐时刻的状态后验（软解码）\npost = model.predict_proba(X)\nprint('第 0 步后验:', np.round(post[0], 3))"},
  {"id":"backprop","name":"反向传播 BP / BPTT","en":"Backpropagation / BPTT","cat":"深度学习核心","diff":"进阶","summary":"用链式法则从损失往回逐层算梯度，把梯度计算量从 O(W²) 降到 O(W)。这是神经网络能被训起来的前提；在循环网络上沿时间回传的版本叫 BPTT。","scenes":["手写训练循环","理解框架自动求导","RNN 梯度问题排查"],"idea":["前向传播时把每层的中间量（z、a）存下来","反向时用「上游梯度 × 本地雅可比」逐层往回传","BPTT 把时间维展开当成深网，梯度沿时间累加——所以会梯度爆炸/消失"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"逐层递推与沿时反向","formulas":["δ^l = (W^{l+1})ᵀ δ^{l+1} ⊙ σ′(z^l)","∂L/∂W^l = δ^l (a^{l−1})ᵀ，∂L/∂b^l = δ^l","BPTT： δ_t = W_hhᵀ δ_{t+1} ⊙ σ′(z_t) + (∂L_t/∂h_t)"],"steps":["反向传播不是「另一种算法」，它就是链式法则的复用：每层只关心自己的局部导数，梯度靠乘法串起来。","delta 的定义是「损失对本层加权输入 z 的梯度」，算出 δ 后权重梯度只是一个外积，这就是 O(W) 的来源。","BPTT 里 δ 每往时间前回退一步就乘一次 W_hhᵀ，谱半径 >1 时指数爆炸、<1 时指数消失，这正是 LSTM 门控要解决的问题。"],"tex":["\\delta^{l} = (W^{l+1})^{\\top}\\delta^{l+1}\\odot\\sigma^{\\prime}(z^{l})","\\frac{\\partial L}{\\partial W^{l}} = \\delta^{l}(a^{l-1})^{\\top}","\\delta_{t} = W_{hh}^{\\top}\\delta_{t+1}\\odot\\sigma^{\\prime}(z_{t})+\\frac{\\partial L_{t}}{\\partial h_{t}}"]},"params":[["lr","float","0.1","学习率，正浮点数，默认 0.1。太大直接发散（损失变 NaN），太小收敛慢；配合梯度裁剪可用更大值。"],["epochs","int","300","训练轮数，正整数，默认 300。偏少欠拟合；偏多需配合验证集早停。"],["hidden","int","16","隐层宽度，正整数，默认 16。越大表达越强、越容易过拟合小数据。"],["clip","float","5.0","梯度范数裁剪阈值，正浮点数，默认 5.0。按 L2 范数等比缩放梯度，是训练 RNN/BPTT 时防爆炸的必备操作。"],["batch_size","int","32","小批量样本数，正整数，默认 32。越小噪声大但更新频繁，越大梯度更准但内存占用高。"]],"input":"X: (n, d)；y: 标签或序列目标","output":"model: 各层 W/b；可选每轮损失曲线","code":"import numpy as np\n\ndef sigmoid(z): return 1 / (1 + np.exp(-z))\ndef sigmoid_grad(a): return a * (1 - a)          # a 已是 sigmoid 输出\n\nclass MLP:\n    \"\"\"两层 MLP + 手写反向传播，梯度公式与推导一一对应。\"\"\"\n    def __init__(self, n_in, n_hidden=16, n_out=1, lr=0.1, clip=5.0, seed=0):\n        rng = np.random.RandomState(seed)\n        self.W1 = rng.normal(0, np.sqrt(2 / n_in), (n_in, n_hidden))\n        self.b1 = np.zeros(n_hidden)\n        self.W2 = rng.normal(0, np.sqrt(2 / n_hidden), (n_hidden, n_out))\n        self.b2 = np.zeros(n_out)\n        self.lr, self.clip = lr, clip\n\n    def forward(self, X):\n        self.a0 = X\n        self.z1 = X @ self.W1 + self.b1\n        self.a1 = sigmoid(self.z1)\n        self.z2 = self.a1 @ self.W2 + self.b2\n        self.a2 = self.z2\n        return self.a2\n\n    def backward(self, y):\n        m = len(y)\n        d2 = (self.a2 - y.reshape(-1, 1)) / m        # 平方损失对 z2 的梯度\n        gW2 = self.a1.T @ d2\n        gb2 = d2.sum(0)\n        d1 = (d2 @ self.W2.T) * sigmoid_grad(self.a1)  # δ1 = (δ2 W2ᵀ) ⊙ σ'(z1)\n        gW1 = self.a0.T @ d1\n        gb1 = d1.sum(0)\n        grads = [gW1, gb1, gW2, gb2]\n        norm = np.sqrt(sum((g ** 2).sum() for g in grads))\n        if norm > self.clip:                           # 全局梯度裁剪\n            grads = [g * self.clip / norm for g in grads]\n        self.W1 -= self.lr * grads[0]; self.b1 -= self.lr * grads[1]\n        self.W2 -= self.lr * grads[2]; self.b2 -= self.lr * grads[3]\n        return float(((self.a2 - y.reshape(-1, 1)) ** 2).mean())\n\nclass TinyRNN:\n    \"\"\"单层 RNN 的 BPTT：把时间维展开，梯度沿 t 往回累加。\"\"\"\n    def __init__(self, n_in, n_hidden=16, lr=0.05, clip=5.0, seed=0):\n        rng = np.random.RandomState(seed)\n        self.Wx = rng.normal(0, .1, (n_in, n_hidden))\n        self.Wh = rng.normal(0, .1, (n_hidden, n_hidden))\n        self.Wy = rng.normal(0, .1, (n_hidden, 1))\n        self.lr, self.clip = lr, clip\n\n    def step(self, x, h):\n        h = np.tanh(x @ self.Wx + h @ self.Wh)\n        return h, float(np.tanh(h @ self.Wy))          # (新隐状态, 标量输出)\n\n    def bptt(self, xs, target):\n        h, hs = np.zeros(self.Wh.shape[0]), []\n        for x in xs:\n            h, y = self.step(x, h)\n            hs.append(h)\n        err = hs[-1] @ self.Wy - target                # 只在最后一步取损失\n        dh = err * self.Wy.ravel() * (1 - hs[-1] ** 2) # 反向穿过 tanh\n        gWh = np.zeros_like(self.Wh); gWx = np.zeros_like(self.Wx)\n        for t in range(len(xs) - 1, -1, -1):\n            gWh += hs[t - 1][:, None] @ dh[None, :] if t > 0 else 0\n            gWx += xs[t][:, None] @ dh[None, :]\n            if t > 0:                                  # 沿时间回传：δ_{t-1} = (Wᵀδ_t) ⊙ (1-h²)\n                dh = (dh @ self.Wh.T) * (1 - hs[t - 1] ** 2)\n        for g in (gWx, gWh):                           # 裁剪防爆炸\n            n = np.linalg.norm(g)\n            if n > self.clip: g *= self.clip / n\n        self.Wx -= self.lr * gWx; self.Wh -= self.lr * gWh\n        self.Wy -= self.lr * np.outer(hs[-1], err).reshape(self.Wy.shape)\n        return float(err ** 2)\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    X = rng.randn(400, 5); y = X[:, 0] * 1.5 - X[:, 1] ** 2 + rng.randn(400) * .1\n    m = MLP(5, 16, 1, lr=0.1)\n    for ep in range(400):\n        m.forward(X); loss = m.backward(y)\n        if ep % 100 == 0: print('MLP epoch', ep, 'loss', round(loss, 4))\n\n    r = TinyRNN(3, 8, lr=0.02)\n    seqs = [rng.rand(6, 3) for _ in range(200)]\n    for ep in range(100):\n        for s in seqs:\n            r.bptt(s, target=float(s[:, 0].sum() > 3))   # 目标：首列和是否 > 3\n        if ep % 25 == 0: print('RNN epoch', ep, 'loss', round(r.bptt(seqs[0], 0.0), 4))"},
  {"id":"rbfn","name":"径向基函数网络 RBFN","en":"Radial Basis Function Network","cat":"深度学习核心","diff":"进阶","summary":"隐层是一组「以样本为中心的高斯球」，输出层线性加权。训练分两步（先定中心再解线性方程），没有反向传播、收敛极快，是核方法的神经网络版本。","scenes":["小样本非线性回归","快速拟合","需要可解释基函数"],"idea":["隐层第 j 个单元输出 φ_j(x) = exp(−‖x − c_j‖²/2σ²)","中心 c_j 用 k-means 聚出来，也可以直接从样本里挑","输出层 w 用最小二乘闭式解（加一点岭正则），无需迭代"],"deps":"numpy · scikit-learn","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"隐层响应与输出层闭式解","formulas":["φ_j(x) = exp(−‖x − c_j‖² / (2σ_j²))","y(x) = Σ_j w_j φ_j(x) + b","w* = (ΦᵀΦ + λI)^{−1} Φᵀ y，Φ_ij = φ_j(x_i)"],"steps":["RBF 层把「输入到中心的距离」变成特征，输出层就是这些特征的线性回归——所以只有一次矩阵求解，没有迭代。","σ 是最关键参数：太小则基函数像尖峰、只能插值训练点；太大则所有样本的响应都接近 1，退化成常数模型。","与 SVM 的关系：SVR 也是 RBF 核 + 线性组合，区别在于 RBFN 用平方损失解全部权重，SVR 用 ε-管带 + L1 稀疏只留支持向量。"],"tex":["\\varphi_{j}(x) = \\exp\\!\\left(-\\frac{\\lVert x-c_{j}\\rVert^{2}}{2\\sigma_{j}^{2}}\\right)","y(x) = \\sum_{j}w_{j}\\varphi_{j}(x)+b","w^{*} = (\\Phi^{\\top}\\Phi+\\lambda I)^{-1}\\Phi^{\\top}y"]},"params":[["n_centers","int","20","隐层基函数个数（中心数），正整数，默认 20。太少欠拟合、太多在小数据上直接过拟合（等于高次插值）。"],["sigma","float","1.0","基函数宽度，正浮点数，默认 1.0。越小基函数越尖、越局部；经验做法取中心间平均距离的 0.5–2 倍。"],["reg","float","1e-3","岭回归正则系数，非负浮点数，默认 0.001。可稳定 ΦᵀΦ 的求逆，也可抑制过拟合；0 表示纯最小二乘。"],["center_by","str","kmeans","中心获取方式。kmeans（默认，按分布均匀铺开）、random（随机抽样本，快但可能留空洞）。"]],"input":"X: (n, d)，建议先标准化；y: 连续目标","output":"model: centers (m, d)、sigma、w (m+1)；predict 返回 (n,)","code":"import numpy as np\nfrom sklearn.cluster import KMeans\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.svm import SVR\nfrom sklearn.metrics import r2_score\n\nclass RBFN:\n    def __init__(self, n_centers=20, sigma=1.0, reg=1e-3, center_by='kmeans', seed=0):\n        self.m, self.sigma, self.reg, self.mode, self.seed = n_centers, sigma, reg, center_by, seed\n\n    def _phi(self, X):\n        # 每个样本到每个中心的距离 -> 高斯响应，(n, m)\n        d2 = ((X[:, None, :] - self.centers[None, :, :]) ** 2).sum(-1)\n        return np.exp(-d2 / (2 * self.sigma ** 2))\n\n    def fit(self, X, y):\n        X, y = np.asarray(X, float), np.asarray(y, float).ravel()\n        if self.mode == 'kmeans':\n            self.centers = KMeans(self.m, n_init=10, random_state=self.seed).fit(X).cluster_centers_\n        else:\n            idx = np.random.RandomState(self.seed).choice(len(X), self.m, replace=False)\n            self.centers = X[idx]\n        if self.sigma is None:                       # 自适应：取中心间平均距离\n            self.sigma = float(np.mean(np.linalg.norm(self.centers[:, None] - self.centers[None], axis=-1)))\n        Phi = self._phi(X)\n        A = np.hstack([Phi, np.ones((len(X), 1))])   # 拼上偏置列\n        self.w = np.linalg.solve(A.T @ A + self.reg * np.eye(A.shape[1]), A.T @ y)\n        return self\n\n    def predict(self, X):\n        A = np.hstack([self._phi(np.asarray(X, float)), np.ones((len(X), 1))])\n        return A @ self.w\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    X = np.sort(rng.rand(200, 1) * 6, axis=0)\n    y = np.sin(X).ravel() + rng.normal(0, .15, 200)\n    Xtr, Xte, ytr, yte = X[:140], X[140:], y[:140], y[140:]\n\n    for m in (10, 20, 40):\n        net = RBFN(n_centers=m, sigma=0.8).fit(Xtr, ytr)\n        print(f'中心数 {m:2d}: test R2 = {r2_score(yte, net.predict(Xte)):.4f}')\n\n    svr = make_pipeline(StandardScaler(), SVR(kernel='rbf', C=10, epsilon=.1)).fit(Xtr, ytr)\n    print('SVR 对照 R2 =', round(r2_score(yte, svr.predict(Xte)), 4))"},
  {"id":"hopfield","name":"Hopfield 网络","en":"Hopfield Network","cat":"深度学习核心","diff":"进阶","summary":"单层全连接的对称反馈网络，靠能量函数保证收敛：把模式存成吸引子，给一个残缺输入就能迭代回到最近的记忆，是联想记忆的最简模型。","scenes":["联想记忆 / 残缺恢复","组合优化建模","理解吸引子动力学"],"idea":["状态 s ∈ {−1,+1}^n，权重对称且对角为 0（无自反馈）","Hebb 学习把 P 个模式叠加成权重矩阵","异步随机挑一个单元翻转，能量单调下降直到进入不动点"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"能量函数与吸引子","formulas":["E = −½ Σ_{i≠j} W_ij s_i s_j","W_ij = (1/N) Σ_p ξ_i^p ξ_j^p（i≠j），W_ii = 0","s_i ← sign(Σ_j W_ij s_j)，单点翻转使 ΔE ≤ 0"],"steps":["对称且无自环是能量的存在条件；一旦 W 不对称，状态可能陷入振荡而不收敛。","容量约 0.138N 个模式：超过后模式之间开始串扰，回忆会收敛到「混合态」而不是原模式。","异步单点更新（每次只翻一个）保证能量严格下降；同时更新多个单元则可能不收敛。"],"tex":["E = -\\frac{1}{2}\\sum_{i\\ne j}W_{ij}s_{i}s_{j}","W_{ij} = \\frac{1}{N}\\sum_{p}\\xi_{i}^{p}\\xi_{j}^{p},\\quad W_{ii}=0","s_{i} \\leftarrow \\mathrm{sign}\\Big(\\sum_{j}W_{ij}s_{j}\\Big)"]},"params":[["n_units","int","100","神经元个数 N，正整数。存 P 个模式时需满足 P < 0.138N 才不会串扰，所以 N 要远大于模式数。"],["rule","str","hebb","权重学习规则。hebb（默认，P 个模式直接叠加）、pseudoinverse（伪逆规则，容量提升到接近 N，但计算更贵）。"],["max_iter","int","50","单次回忆的最大迭代步数，正整数，默认 50。通常几十步即达不动点；设大只是兜底。"],["async_update","bool","True","是否每次只随机更新一个单元。true（默认，能量单调下降、保证收敛）；false 并行更新可能振荡。"]],"input":"patterns: (P, N) 由 ±1 组成的模式矩阵；probe: 带噪输入","output":"W: (N, N) 权重；recalled: 收敛后的状态","code":"import numpy as np\n\nclass Hopfield:\n    def __init__(self, rule='hebb', max_iter=50, async_update=True, seed=0):\n        self.rule, self.max_iter, self.async_update = rule, max_iter, async_update\n        self.rng = np.random.RandomState(seed)\n\n    def fit(self, patterns):\n        P = np.asarray(patterns, float)\n        if self.rule == 'hebb':\n            self.W = (P.T @ P) / P.shape[1]            # Hebb 规则：模式外积叠加\n        else:                                          # 伪逆规则：容量接近 N\n            self.W = P.T @ np.linalg.pinv(P @ P.T) @ P\n        np.fill_diagonal(self.W, 0)                    # 必须去掉自反馈\n        return self\n\n    def energy(self, s):\n        return -0.5 * s @ self.W @ s\n\n    def recall(self, probe):\n        s = np.asarray(probe, float).copy()\n        n = len(s)\n        for _ in range(self.max_iter):\n            if self.async_update:\n                i = self.rng.randint(n)               # 异步：只翻一个神经元\n                s[i] = 1.0 if self.W[i] @ s >= 0 else -1.0\n            else:\n                s = np.where(self.W @ s >= 0, 1.0, -1.0)\n            if np.all((self.W @ s >= 0) == (s >= 0)):  # 已达不动点\n                break\n        return s\n\nif __name__ == '__main__':\n    N, P = 100, 10\n    rng = np.random.RandomState(0)\n    raw = np.sign(rng.randn(P, N))                    # 10 个 ±1 模式\n    net = Hopfield().fit(raw)\n\n    # 用 20% 位翻转的版本去回忆\n    probe = raw[3].copy()\n    flip = rng.choice(N, int(0.2 * N), replace=False)\n    probe[flip] *= -1\n    got = net.recall(probe)\n    print('与原始模式一致率:', round((got == raw[3]).mean(), 3))\n    print('能量: 初始 %.3f -> 回忆后 %.3f' % (net.energy(probe), net.energy(got)))\n\n    # 容量验证：P 超过 0.138N 后开始串扰\n    for p in (5, 13, 20, 30):\n        W = Hopfield().fit(np.sign(rng.randn(p, N)))\n        acc = np.mean([(W.recall(pat) == pat).mean() for pat in np.sign(rng.randn(p, N))])\n        print(f'模式数 {p:2d} (阈值 {0.138*N:.0f}): 平均回忆一致率 {acc:.3f}')"},
  {"id":"recursive-nn","name":"递归神经网络 Recursive NN","en":"Recursive Neural Network","cat":"深度学习核心","diff":"高难","summary":"按句法/结构树自底向上组合：叶子是词向量，每个内部节点用同一套参数把两个子节点合成为父节点。面向「结构」而非「时序」，和循环 RNN 是两回事。","scenes":["句法分析与情感分类","分子/表达式树建模","组合语义"],"idea":["输入是树：叶子给向量，内部节点由左右子节点合成","p = tanh(W_l·c_left + W_r·c_right + b)，同一组 W 在所有节点共享","根节点表示送分类器，梯度沿树后序遍历回传"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"树上的自底向上组合","formulas":["p = tanh(W_l·c_L + W_r·c_R + b)","h_root = p^{(root)}，score = softmax(U·h_root)","∂L/∂W_l = Σ_{nodes} δ_n · c_Lᵀ（后序累加）"],"steps":["关键区别：参数在所有树节点共享（和 CNN 的权共享同理），所以一棵树有多少节点都不增加参数量。","树结构来源有两种：外部给定（句法分析器）或模型自己学（Gumbel-Softmax 选组合方式）。","和 RNN 对比：RNN 沿时间链式组合，深度等于序列长度；Recursive NN 沿语法树组合，深度等于树高，长句不必承受长依赖衰减。"],"tex":["p = \\tanh(W_{l}c_{L}+W_{r}c_{R}+b)","h_{root} = p^{(root)},\\quad score = \\mathrm{softmax}(Uh_{root})","\\frac{\\partial L}{\\partial W_{l}} = \\sum_{n}\\delta_{n}c_{L}^{\\top}"]},"params":[["dim","int","16","节点表示维度，正整数，默认 16。越大表达越强、参数按 dim² 增长，小数据集建议 8–32。"],["lr","float","0.05","学习率，正浮点数，默认 0.05。梯度在树深处会累乘，过大很容易发散。"],["epochs","int","200","训练轮数，正整数，默认 200。树结构数据量通常不大，200–500 轮配合监控损失即可。"],["max_depth","int","3","允许建树的最大深度，正整数，默认 3。限制深度等价于限制组合复杂度，也是控制梯度消失的手段。"]],"input":"trees: 每个样本一棵二叉树（叶子为向量，提供 parent/left/right 结构）；y: 标签","output":"model: W_l, W_r, b, U；predict 返回每棵树的类别","code":"import numpy as np\n\nclass RecursiveNN:\n    \"\"\"固定二叉树的递归神经网络：全树共享一组组合参数。\"\"\"\n    def __init__(self, dim=16, n_class=2, lr=0.05, seed=0):\n        rng = np.random.RandomState(seed)\n        self.Wl = rng.normal(0, .3, (dim, dim))\n        self.Wr = rng.normal(0, .3, (dim, dim))\n        self.b = np.zeros(dim)\n        self.U = rng.normal(0, .3, (dim, n_class))\n        self.lr = lr\n\n    def _forward(self, tree, cache):\n        if isinstance(tree, np.ndarray):              # 叶子\n            return tree\n        cl = self._forward(tree['left'], cache)\n        cr = self._forward(tree['right'], cache)\n        z = self.Wl @ cl + self.Wr @ cr + self.b\n        p = np.tanh(z)\n        cache[id(tree)] = (cl, cr, p, z)              # 存中间量，反向要用\n        return p\n\n    def _backward(self, tree, dout, cache, grads):\n        if isinstance(tree, np.ndarray):\n            return\n        cl, cr, p, z = cache[id(tree)]\n        dz = dout * (1 - p ** 2)                      # 穿过 tanh\n        grads['Wl'] += np.outer(dz, cl)\n        grads['Wr'] += np.outer(dz, cr)\n        grads['b'] += dz\n        self._backward(tree['left'], self.Wl.T @ dz, cache, grads)\n        self._backward(tree['right'], self.Wr.T @ dz, cache, grads)\n\n    def fit(self, trees, y, epochs=200):\n        for ep in range(epochs):\n            total = 0.0\n            for t, label in zip(trees, y):\n                cache = {}\n                h = self._forward(t, cache)\n                logits = h @ self.U\n                prob = np.exp(logits - logits.max()); prob /= prob.sum()\n                total += -np.log(prob[label] + 1e-12)\n                dlog = prob.copy(); dlog[label] -= 1     # softmax + 交叉熵的梯度\n                grads = {'Wl': np.zeros_like(self.Wl), 'Wr': np.zeros_like(self.Wr), 'b': np.zeros_like(self.b)}\n                self.U -= self.lr * np.outer(h, dlog)\n                self._backward(t, self.U @ dlog, cache, grads)\n                for k in grads: self.__dict__[k] -= self.lr * grads[k]\n            if ep % 50 == 0: print('epoch', ep, 'loss', round(total / len(y), 4))\n        return self\n\n    def predict(self, tree):\n        return int(np.argmax(self._forward(tree, {}) @ self.U))\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    d = 8\n    def leaf(): return rng.normal(0, .5, d)\n    # 造数据：左子树叶子均值 +1 的为类 1，否则类 0 —— 只有组合结构才能区分\n    def make_tree(sign):\n        return {'left': leaf() + sign, 'right': {'left': leaf(), 'right': leaf()}}\n    trees = [make_tree(1.0 if i % 2 else -1.0) for i in range(120)]\n    y = np.array([1 if i % 2 else 0 for i in range(120)])\n    m = RecursiveNN(dim=d, n_class=2).fit(trees, y, epochs=150)\n    acc = np.mean([m.predict(t) == t_y for t, t_y in zip(trees, y)])\n    print('train acc:', round(float(acc), 3))"},
  {"id":"autoencoder","name":"自编码器 AutoEncoder","en":"Autoencoder","cat":"深度学习核心","diff":"进阶","summary":"用「编码器压缩 + 解码器重建」逼网络学出低维表示，目标就是输入自己——不需要任何标签。去噪、稀疏、变分都是它的变体。","scenes":["无监督表示学习","降维与去噪","预训练特征"],"idea":["编码 z = f(x)，解码 x̂ = g(z)，最小化 ‖x − x̂‖²","瓶颈维度小于输入维度，网络必须保留主要结构才能重建","加输入噪声（DAE）逼它学鲁棒特征；加稀疏惩罚（SAE）让隐单元只在少数样本上活跃"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"重建损失与（可选）稀疏惩罚","formulas":["z = σ(W₁x + b₁)，x̂ = σ(W₂z + b₂)","L = ‖x − x̂‖²（或逐元素二元交叉熵）","SAE：L + β·Σ_j KL(ρ ‖ ρ̂_j)"],"steps":["唯一约束是瓶颈：如果隐层比输入宽，网络会学成恒等映射，什么也没学到。","线性激活 + 平方损失时，自编码器的最优解张成的子空间与 PCA 一致；换成非线性才真正超越 PCA。","去噪版（先把 x 加上噪声再重建干净的 x）学到的表示在下游任务上通常明显更好，是 VAE/扩散模型的思想源头之一。"],"tex":["z = \\sigma(W_{1}x+b_{1}),\\quad \\hat{x} = \\sigma(W_{2}z+b_{2})","L = \\lVert x-\\hat{x}\\rVert^{2}","L_{SAE} = L+\\beta\\sum_{j}\\mathrm{KL}(\\rho\\,\\Vert\\,\\hat{\\rho}_{j})"]},"params":[["hidden","int","16","瓶颈层维度，正整数，默认 16。必须明显小于输入维度才有压缩意义；太大退化成恒等映射，太小信息损失过多。"],["lr","float","0.05","学习率，正浮点数，默认 0.05。重建任务通常比分类更敏感，过大易震荡。"],["epochs","int","300","训练轮数，正整数，默认 300。偏少则重建仍糊，偏多在小数据上开始记噪声。"],["noise","float","0.0","输入噪声标准差（去噪自编码器），非负浮点数，默认 0（关闭）。取 0.1–0.5 可显著提升表示鲁棒性。"],["sparse","float","0.0","稀疏惩罚系数 β，非负浮点数，默认 0（关闭）。大于 0 时惩罚隐单元的平均激活偏离目标稀疏度 ρ。"]],"input":"X: (n, d)，建议归一化到 [0,1] 或标准化","output":"model: W1,b1,W2,b2；encode(X) 返回瓶颈表示，decode(z) 重建","code":"import numpy as np\n\ndef sigmoid(z): return 1 / (1 + np.exp(-z))\n\nclass AutoEncoder:\n    \"\"\"单隐层自编码器，支持输入加噪 (DAE) 与稀疏惩罚 (SAE)。\"\"\"\n    def __init__(self, n_in, hidden=16, lr=0.05, epochs=300, noise=0.0, sparse=0.0, rho=0.05, seed=0):\n        rng = np.random.RandomState(seed)\n        self.W1 = rng.normal(0, np.sqrt(1 / n_in), (n_in, hidden))\n        self.b1 = np.zeros(hidden)\n        self.W2 = rng.normal(0, np.sqrt(1 / hidden), (hidden, n_in))\n        self.b2 = np.zeros(n_in)\n        self.lr, self.epochs, self.noise = lr, epochs, noise\n        self.beta, self.rho = sparse, rho\n        self.rng = rng\n\n    def encode(self, X):\n        return sigmoid(X @ self.W1 + self.b1)\n\n    def decode(self, Z):\n        return sigmoid(Z @ self.W2 + self.b2)\n\n    def fit(self, X):\n        X = np.asarray(X, float)\n        n, d = X.shape\n        for ep in range(self.epochs):\n            Xin = X + self.noise * self.rng.randn(n, d) if self.noise > 0 else X\n            Z = self.encode(Xin)\n            out = self.decode(Z)\n            err = out - X                          # 平方损失对输出的梯度（缩放 2 已并入 lr）\n            rho_hat = Z.mean(0)                    # 隐单元平均激活\n            sparse_term = self.beta * (-self.rho / rho_hat + (1 - self.rho) / (1 - rho_hat)) if self.beta > 0 else 0\n            dz = (err @ self.W2.T + sparse_term) * Z * (1 - Z)\n            gW2 = Z.T @ err; gb2 = err.sum(0)\n            gW1 = Xin.T @ dz; gb1 = dz.sum(0)\n            self.W1 -= self.lr * gW1 / n; self.b1 -= self.lr * gb1 / n\n            self.W2 -= self.lr * gW2 / n; self.b2 -= self.lr * gb2 / n\n            if ep % 100 == 0:\n                rec = ((self.decode(self.encode(X)) - X) ** 2).mean()\n                print(f'epoch {ep:3d} recon MSE {rec:.5f}')\n        return self\n\nif __name__ == '__main__':\n    from sklearn.datasets import load_digits\n    X = load_digits().data / 16.0                 # 64 维 -> [0,1]\n\n    ae = AutoEncoder(n_in=64, hidden=8, lr=0.5, epochs=400).fit(X)\n    Z = ae.encode(X)\n    print('瓶颈表示形状:', Z.shape)\n    print('重建 MSE:', round(float(((ae.decode(Z) - X) ** 2).mean()), 5))\n\n    # 用 8 维瓶颈做分类，验证表示是否保留了类别信息\n    from sklearn.linear_model import LogisticRegression\n    from sklearn.model_selection import cross_val_score\n    y = load_digits().target\n    print('瓶颈特征 + 逻辑回归 CV:', round(cross_val_score(LogisticRegression(max_iter=1000), Z, y, cv=5).mean(), 3))\n    print('原始 64 维 + 逻辑回归 CV:', round(cross_val_score(LogisticRegression(max_iter=1000), X, y, cv=5).mean(), 3))"},
  {"id":"dbn","name":"深度信念网络 DBN（含 DBM / CDBN）","en":"Deep Belief Network / Deep Boltzmann Machine","cat":"深度学习核心","diff":"高难","summary":"把多层受限玻尔兹曼机（RBM）堆叠起来，先逐层无监督预训练、再用反向传播微调。它是「深度学习能训深」的第一个可行方案，也是逐层贪心预训练的代表。","scenes":["无标签数据预训练","小样本深层模型","理解预训练思想"],"idea":["每层是一个 RBM：层间全连接、层内无连接，用对比散度（CD）训练","把下层 RBM 的隐单元输出当作上层 RBM 的输入，逐层往上堆","堆完后接分类头，用 BP 整体微调（这一步让 DBN 变成判别模型）"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"RBM 能量、条件概率与对比散度","formulas":["E(v,h) = −bᵀv − cᵀh − vᵀWh","P(h_j=1|v) = σ(c_j + Σ_i W_ij v_i)，P(v_i=1|h) = σ(b_i + Σ_j W_ij h_j)","CD-k：ΔW = η(⟨vhᵀ⟩_data − ⟨vhᵀ⟩_recon)"],"steps":["RBM 层内无连接是关键：给定可见层时隐单元条件独立，一次矩阵乘法就能并行采样。","对比散度用「跑 k 步 Gibbs 的重建」近似模型分布，k=1 就够用，这是 RBM 训练能落地的原因。","DBN 与 DBM 的差别：DBN 顶两层仍是无向的、往下是有向信念网；DBM 所有层都无向且上下都连，需要更复杂的推断。CDBN 则是把 RBM 的权改成卷积核，用于图像。"],"tex":["E(v,h) = -b^{\\top}v-c^{\\top}h-v^{\\top}Wh","P(h_{j}=1|v) = \\sigma\\Big(c_{j}+\\sum_{i}W_{ij}v_{i}\\Big)","\\Delta W = \\eta\\big(\\langle vh^{\\top}\\rangle_{data}-\\langle vh^{\\top}\\rangle_{recon}\\big)"]},"params":[["layers","list","[256, 128]","各隐层单元数，正整数列表，默认 [256, 128]。层数越多越「深」，但小数据上两层通常已足够，再深只增加训练难度。"],["lr","float","0.01","CD 更新的学习率，正浮点数，默认 0.01。RBM 对学习率较敏感，过大权值会爆掉，0.001–0.05 是常见范围。"],["cd_k","int","1","对比散度的 Gibbs 步数 k，正整数，默认 1。k 越大对模型分布的近似越准但越慢；实践中 k=1 效果已足够。"],["epochs_per_layer","int","15","每层 RBM 的预训练轮数，正整数，默认 15。偏少则初始化没学到结构，偏多则过拟合且浪费时间。"],["finetune_epochs","int","50","整体 BP 微调轮数，正整数，默认 50。设 0 表示只做无监督预训练（可用隐层特征做下游任务）。"]],"input":"X: (n, d)，二值或 [0,1] 连续值；y: 可选标签（微调用）","output":"model: 每层 W/b/c；encode 逐层前向得到顶层表示","code":"import numpy as np\n\ndef sigmoid(z): return 1 / (1 + np.exp(-z))\n\nclass RBM:\n    \"\"\"二值 RBM + 对比散度 (CD-k)。\"\"\"\n    def __init__(self, n_vis, n_hid, lr=0.01, cd_k=1, seed=0):\n        rng = np.random.RandomState(seed)\n        self.W = rng.normal(0, .01, (n_vis, n_hid))\n        self.bv = np.zeros(n_vis)\n        self.bh = np.zeros(n_hid)\n        self.lr, self.k = lr, cd_k\n\n    def _p_h(self, v): return sigmoid(v @ self.W + self.bh)\n    def _p_v(self, h): return sigmoid(h @ self.W.T + self.bv)\n\n    def fit(self, X, epochs=15):\n        X = np.asarray(X, float)\n        for _ in range(epochs):\n            v0 = X\n            h0 = (self._p_h(v0) > self.rng.rand(*v0.shape[:1], self.W.shape[1])).astype(float)\n            vk, hk = v0, h0\n            for _ in range(self.k):                     # k 步 Gibbs 采样\n                vk = (self._p_v(hk) > self.rng.rand(*hk.shape[:1], v0.shape[1])).astype(float)\n                hk = (self._p_h(vk) > self.rng.rand(*vk.shape[:1], self.W.shape[1])).astype(float)\n            pos = v0.T @ self._p_h(v0) / len(X)         # ⟨vh⟩_data\n            neg = vk.T @ self._p_h(vk) / len(X)         # ⟨vh⟩_recon\n            self.W += self.lr * (pos - neg)\n            self.bv += self.lr * (v0.mean(0) - vk.mean(0))\n            self.bh += self.lr * (self._p_h(v0).mean(0) - self._p_h(vk).mean(0))\n        return self\n\n    def transform(self, X):\n        return self._p_h(np.asarray(X, float))\n\nclass DBN:\n    \"\"\"逐层堆 RBM 做无监督预训练，可选再用 BP 微调分类头。\"\"\"\n    def __init__(self, layers=(256, 128), lr=0.01, cd_k=1, epochs_per_layer=15, seed=0):\n        self.layers, self.lr, self.k, self.epl, self.seed = layers, lr, cd_k, epochs_per_layer, seed\n\n    def pretrain(self, X):\n        self.rbms, h = [], np.asarray(X, float)\n        for i, n_hid in enumerate(self.layers):\n            rbm = RBM(h.shape[1], n_hid, lr=self.lr, cd_k=self.k, seed=self.seed + i)\n            rbm.fit(h, epochs=self.epl)\n            self.rbms.append(rbm)\n            h = rbm.transform(h)                       # 用隐单元概率作为下一层输入\n            print(f'第 {i+1} 层 RBM 训练完，输出形状 {h.shape}')\n        return h\n\n    def encode(self, X):\n        h = np.asarray(X, float)\n        for rbm in self.rbms:\n            h = rbm.transform(h)\n        return h\n\nif __name__ == '__main__':\n    from sklearn.datasets import load_digits\n    from sklearn.linear_model import LogisticRegression\n    from sklearn.model_selection import cross_val_score\n    X = (load_digits().data / 16.0 > 0.5).astype(float)   # 二值化，RBM 的标准输入\n    y = load_digits().target\n\n    dbn = DBN(layers=(128, 64), lr=0.05, epochs_per_layer=8)\n    H = dbn.pretrain(X)\n    print('顶层表示:', H.shape)\n    print('DBN 特征 + 逻辑回归 CV:',\n          round(cross_val_score(LogisticRegression(max_iter=1000), H, y, cv=5).mean(), 3))\n    print('原始像素 + 逻辑回归 CV:',\n          round(cross_val_score(LogisticRegression(max_iter=1000), X, y, cv=5).mean(), 3))"},
  {"id":"gru","name":"门控循环单元 GRU","en":"Gated Recurrent Unit","cat":"深度学习核心","diff":"进阶","summary":"LSTM 的精简版：把三个门合成「更新门 + 重置门」，参数量少约四分之一，效果通常相当，是序列建模里最常用的默认结构之一。","scenes":["序列预测","文本建模","资源受限的 RNN"],"idea":["更新门 z 决定「保留多少旧状态」，重置门 r 决定「忘掉多少旧状态再算候选」","候选 h̃ = tanh(W·[x, r⊙h])，最终 h = (1−z)⊙h + z⊙h̃","没有独立细胞状态 c，所以参数更少、训练更快"],"deps":"PyTorch 2.1","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"两个门怎么工作","formulas":["z_t = σ(W_z x_t + U_z h_{t−1} + b_z)","r_t = σ(W_r x_t + U_r h_{t−1} + b_r)","h_t = (1−z_t)⊙h_{t−1} + z_t⊙tanh(W_h x_t + U_h(r_t⊙h_{t−1}))"],"steps":["z 与 (1−z) 构成互补权重，所以梯度沿时间回传时相当于乘一个受门控的系数，长期依赖不容易消失。","r 只作用在候选状态上、不直接作用于 h 的传递路径，这是它比 LSTM 少一个门却几乎不掉点的原因。","与 LSTM 的选择：数据量小或要低延迟用 GRU，需要精细控制记忆内容（如长文档）时 LSTM 仍有优势。"],"tex":["z_{t} = \\sigma(W_{z}x_{t}+U_{z}h_{t-1}+b_{z})","r_{t} = \\sigma(W_{r}x_{t}+U_{r}h_{t-1}+b_{r})","h_{t} = (1-z_{t})\\odot h_{t-1}+z_{t}\\odot\\tanh\\!\\big(W_{h}x_{t}+U_{h}(r_{t}\\odot h_{t-1})\\big)"]},"params":[["hidden_size","int","64","隐状态维度，正整数，默认 64。越大记忆容量越强、参数按平方增长；序列简单时 16–64 足够。"],["num_layers","int","2","堆叠层数，正整数，默认 2。层数越多表示越抽象，但训练更慢、更易过拟合小数据。"],["seq_len","int","32","输入回看窗口长度，正整数，默认 32。需要覆盖一个完整周期；太短看不到趋势，太长引入无关历史。"],["lr","float","0.01","学习率，正浮点数，默认 0.01。RNN 类结构对学习率敏感，0.001–0.01 常用；过大直接发散。"],["dropout","float","0.1","层间 dropout 比例，0–1，默认 0.1。只在多层时生效；数据量小可调到 0.2–0.3 抑制过拟合。"]],"input":"X: (batch, seq_len, n_features)；y: (batch, 1) 或 (batch, horizon)","output":"model: GRU 网络；predict 返回 (batch, horizon) 预测","code":"import numpy as np, torch, torch.nn as nn\n\nclass GRUForecaster(nn.Module):\n    def __init__(self, n_features=1, hidden_size=64, num_layers=2, dropout=0.1, horizon=1):\n        super().__init__()\n        self.gru = nn.GRU(n_features, hidden_size, num_layers=num_layers,\n                          batch_first=True, dropout=dropout if num_layers > 1 else 0.0)\n        self.head = nn.Linear(hidden_size, horizon)      # 用最后时刻的隐状态做预测\n\n    def forward(self, x):\n        out, _ = self.gru(x)\n        return self.head(out[:, -1, :])\n\ndef make_windows(series, seq_len=32, horizon=1):\n    X, y = [], []\n    for i in range(len(series) - seq_len - horizon + 1):\n        X.append(series[i:i + seq_len])\n        y.append(series[i + seq_len:i + seq_len + horizon])\n    return np.array(X, dtype=np.float32), np.array(y, dtype=np.float32)\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    t = np.arange(2000)\n    series = np.sin(2 * np.pi * t / 24) + 0.15 * rng.randn(2000)   # 周期 + 噪声\n    series = (series - series.mean()) / series.std()\n\n    X, y = make_windows(series, seq_len=32)\n    X = X[..., None]\n    split = int(len(X) * .8)\n    Xtr, ytr = torch.tensor(X[:split]), torch.tensor(y[:split])\n    Xte, yte = torch.tensor(X[split:]), torch.tensor(y[split:])\n\n    model = GRUForecaster(hidden_size=32, num_layers=2, dropout=.1)\n    opt = torch.optim.Adam(model.parameters(), lr=0.01)\n    lossf = nn.MSELoss()\n    for ep in range(30):\n        model.train(); opt.zero_grad()\n        loss = lossf(model(Xtr), ytr)\n        loss.backward()\n        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)   # RNN 必备：梯度裁剪\n        opt.step()\n        if ep % 10 == 0: print(f'epoch {ep:2d} train MSE {loss.item():.5f}')\n\n    model.eval()\n    with torch.no_grad():\n        pred = model(Xte)\n    print('test MSE:', round(float(((pred - yte) ** 2).mean()), 5))"},
  {"id":"tcn","name":"时间卷积网络 TCN","en":"Temporal Convolutional Network","cat":"时间序列与预测","diff":"高难","summary":"用「因果卷积 + 空洞卷积 + 残差」在时序上获得指数级扩大的感受野：不偷看未来、训练可完全并行（不像 RNN 必须串行），长序列预测常胜过 LSTM。","scenes":["长序列预测","需要并行训练","实时因果推理"],"idea":["因果卷积：t 时刻只依赖 ≤t 的输入，未来信息绝不泄漏","空洞卷积按 1,2,4,… 堆叠，感受野随层数指数增长","残差连接 + 1×1 卷积对齐通道，让深网络能稳定训练"],"deps":"PyTorch 2.1","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"因果空洞卷积与感受野","formulas":["(F * x)(t) = Σ_{k=0}^{K−1} F(k)·x_{t − d·k}","感受野 R = 1 + 2(K−1)(2^L − 1)，d = 2^i","输出 = ReLU(Conv(x)) + x"],"steps":["因果性靠左侧 padding 实现：卷积核只往过去方向看，右侧补零保证长度不变。","空洞让每层不增加参数就能跳到更远的过去，4 层 dilation=1,2,4,8 的核大小 3 就能覆盖 30+ 步。","与 RNN 的关键差别：所有时间步并行卷积，GPU 利用率高；代价是固定感受野，超长依赖仍需堆层。"],"tex":["(F*x)(t) = \\sum_{k=0}^{K-1}F(k)\\,x_{t-dk}","R = 1+2(K-1)(2^{L}-1)","y = \\mathrm{ReLU}(\\mathrm{Conv}(x))+x"]},"params":[["channels","list","[32, 32, 32]","各残差块的输出通道数，默认三层 32。通道越多容量越大；序列单变量时 16–32 足够。"],["kernel_size","int","3","卷积核长度 K，正整数，默认 3。越大每层覆盖越远但参数越多；2–5 常用。"],["levels","int","4","空洞层数 L，正整数，默认 4。感受野随 L 指数增长，L=4 即覆盖 2^4 量级的跨度。"],["lr","float","0.005","学习率，正浮点数，默认 0.005。CNN 结构比 RNN 稳，0.001–0.01 都可。"],["dropout","float","0.1","残差块内 dropout，0–1，默认 0.1。长序列过拟合时调到 0.2。"]],"input":"X: (batch, n_features, seq_len) 注意通道在前；y: (batch, horizon)","output":"model: TCN 网络；predict 返回 (batch, horizon)","code":"import torch, torch.nn as nn\nfrom torch.nn.utils import weight_norm\n\nclass Chomp1d(nn.Module):\n    \"\"\"裁掉右侧多出来的 padding，保证因果性且长度不变。\"\"\"\n    def __init__(self, n): super().__init__(); self.n = n\n    def forward(self, x): return x[:, :, :-self.n].contiguous()\n\nclass TemporalBlock(nn.Module):\n    def __init__(self, n_in, n_out, kernel_size, dilation, dropout=0.1):\n        super().__init__()\n        pad = (kernel_size - 1) * dilation                 # 只补左侧 -> 只看过去\n        self.conv1 = weight_norm(nn.Conv1d(n_in, n_out, kernel_size, padding=pad, dilation=dilation))\n        self.chomp1 = Chomp1d(pad)\n        self.conv2 = weight_norm(nn.Conv1d(n_out, n_out, kernel_size, padding=pad, dilation=dilation))\n        self.chomp2 = Chomp1d(pad)\n        self.act = nn.ReLU()\n        self.drop = nn.Dropout(dropout)\n        self.down = nn.Conv1d(n_in, n_out, 1) if n_in != n_out else None   # 残差通道对齐\n\n    def forward(self, x):\n        out = self.drop(self.act(self.chomp1(self.conv1(x))))\n        out = self.drop(self.act(self.chomp2(self.conv2(out))))\n        res = x if self.down is None else self.down(x)\n        return self.act(out + res)\n\nclass TCN(nn.Module):\n    def __init__(self, n_features=1, channels=(32, 32, 32), kernel_size=3, dropout=0.1, horizon=1):\n        super().__init__()\n        blocks, prev = [], n_features\n        for i, ch in enumerate(channels):\n            blocks.append(TemporalBlock(prev, ch, kernel_size, dilation=2 ** i, dropout=dropout))\n            prev = ch\n        self.net = nn.Sequential(*blocks)\n        self.head = nn.Linear(prev, horizon)\n\n    def forward(self, x):                                  # x: (B, C, T)\n        h = self.net(x)\n        return self.head(h[:, :, -1])                      # 用最后一个时间步的表示\n\nif __name__ == '__main__':\n    import numpy as np\n    rng = np.random.RandomState(0)\n    t = np.arange(1500)\n    s = np.sin(2 * np.pi * t / 24) + 0.1 * rng.randn(1500)\n    s = (s - s.mean()) / s.std()\n\n    L = 48\n    X = np.stack([s[i:i + L] for i in range(len(s) - L - 1)])[:, None, :].astype('float32')\n    y = s[L + 1:][:len(X)].astype('float32')[:, None]\n    Xtr, ytr = torch.tensor(X[:-200]), torch.tensor(y[:-200])\n    Xte, yte = torch.tensor(X[-200:]), torch.tensor(y[-200:])\n\n    m = TCN(n_features=1, channels=(16, 16, 16, 16), kernel_size=3, dropout=.1)\n    opt = torch.optim.Adam(m.parameters(), lr=5e-3)\n    for ep in range(20):\n        opt.zero_grad()\n        loss = nn.functional.mse_loss(m(Xtr), ytr)\n        loss.backward(); opt.step()\n        if ep % 5 == 0: print(f'epoch {ep} train MSE {loss.item():.5f}')\n    with torch.no_grad():\n        print('test MSE:', round(float(((m(Xte) - yte) ** 2).mean()), 5))\n        print('感受野(理论):', 1 + 2 * (3 - 1) * (2 ** 4 - 1))"},
  {"id":"spn","name":"和积网络 SPN","en":"Sum-Product Network","cat":"深度学习核心","diff":"高难","summary":"由「和节点 + 积节点」组成的分层有向无环图：既能像贝叶斯网一样可解释地建概率，又能像神经网络一样一次前向求出边缘与条件概率，复杂度与网络规模同阶。","scenes":["可解释概率建模","缺失值下的推断","密度估计"],"idea":["叶子是单变量分布，积节点表示「变量独立分解」，和节点表示「混合」","结构（DAG + 变量划分）固定，只学和节点的权重","一次前向即可得到联合概率；边缘化只需把不关心的叶子置 1"],"deps":"numpy · scikit-learn","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"和积网络的概率语义","formulas":["积节点： S(x) = ∏_{c∈ch} S_c(x|_{scope(c)})","和节点： S(x) = Σ_c w_c·S_c(x)，Σ_c w_c = 1","边缘化后 S(x) 写成嵌套的「积之和」：∏_c Σ_k w_ck S_ck(x)"],"steps":["有效性条件是「完备且分解」：同一和节点下各子节点的变量集必须相同（完备），积节点下各子节点的变量集必须不相交（分解）。","这两条约束保证 S(x) 一定是一个合法的归一化概率密度——结构错了，概率就没有意义。","这里是两层结构：根做混合、每个分量把变量切成两半各自建模，属于最小可用的分层和积网络。"],"tex":["S(x) = \\prod_{c\\in ch} S_{c}(x|_{scope(c)})","S(x) = \\sum_{c}w_{c}S_{c}(x),\\quad \\sum_{c}w_{c}=1","S(x)=\\prod_{c}\\Big[\\sum_{k}w_{ck}\\,S_{ck}(x)\\Big]"]},"params":[["n_components","int","4","和节点的混合分量数 K，正整数，默认 4。越大表达越强、参数线性增长；4–16 是常用范围。"],["n_iter","int","50","学习根权重的 EM 迭代数，正整数，默认 50。权重只有 K−1 个自由度，通常很快收敛。"],["block","int","2","变量分块大小，正整数，默认 2（每块 2 个变量）。必须是变量总数的约数，用于构成积节点的作用域划分。"],["reg","float","1e-6","协方差正则项，非负浮点数，默认 1e-6。防止某分量退化到单点时协方差奇异。"]],"input":"X: (n, d) 连续数据（d 能被 block 整除）","output":"model: 每个分量的块高斯参数 + 根权重；log_prob / marginal 可查询","code":"import numpy as np\nfrom sklearn.mixture import GaussianMixture\n\nclass BlockSPN:\n    \"\"\"两层和积网络：根是混合（和），每个分量把变量分块后各自建模（积）。\"\"\"\n    def __init__(self, n_components=4, block=2, n_iter=50, reg=1e-6, seed=0):\n        self.K, self.block, self.n_iter, self.reg = n_components, block, n_iter, reg\n        self.seed = seed\n\n    def fit(self, X):\n        X = np.asarray(X, float)\n        n, d = X.shape\n        assert d % self.block == 0, '变量数必须能被 block 整除'\n        self.slices = [slice(i, i + self.block) for i in range(0, d, self.block)]\n        # 每个块用 K 个分量拟合（相当于给每个积节点的第 k 个子节点定参数）\n        self.models = []\n        for sl in self.slices:\n            gm = GaussianMixture(self.K, covariance_type='full', reg_covar=self.reg,\n                                 random_state=self.seed).fit(X[:, sl])\n            self.models.append(gm)\n        # 根的和节点权重：用 EM 在固定结构上学（只学 K 个权重）\n        logp = self._log_component_densities(X)          # (n, K)\n        w = np.ones(self.K) / self.K\n        for _ in range(self.n_iter):\n            lp = logp + np.log(w + 1e-12)\n            lp -= lp.max(1, keepdims=True)\n            resp = np.exp(lp); resp /= resp.sum(1, keepdims=True)\n            w = resp.mean(0)\n        self.w = w\n        return self\n\n    def _log_component_densities(self, X):\n        \"\"\"每个分量的密度 = 各块密度之积（积节点的高斯因子分解）。\"\"\"\n        out = np.zeros((len(X), self.K))\n        for sl, gm in zip(self.slices, self.models):\n            out += gm._estimate_weighted_log_prob(X[:, sl]) if hasattr(gm, '_estimate_weighted_log_prob') \\\n                   else gm.score_samples(X[:, sl])[:, None]\n        return out\n\n    def log_prob(self, X):\n        lp = self._log_component_densities(np.asarray(X, float)) + np.log(self.w + 1e-12)\n        m = lp.max(1, keepdims=True)\n        return (m + np.log(np.exp(lp - m).sum(1, keepdims=True))).ravel()\n\n    def marginal_log_prob(self, X, keep):\n        \"\"\"只对 keep 里的变量求边缘：把其他块的密度置 1（即丢掉对应对数项）。\"\"\"\n        lp = np.zeros((len(X), self.K))\n        for i, (sl, gm) in enumerate(zip(self.slices, self.models)):\n            if any(sl.start <= k < sl.stop for k in keep):\n                lp += gm.score_samples(np.asarray(X, float)[:, sl])[:, None]\n        lp += np.log(self.w + 1e-12)\n        m = lp.max(1, keepdims=True)\n        return (m + np.log(np.exp(lp - m).sum(1, keepdims=True))).ravel()\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    n = 800\n    # 前两个变量负相关，后两个独立 —— 混合结构能捕捉跨块相关\n    x0 = rng.randn(n)\n    x1 = -0.8 * x0 + 0.4 * rng.randn(n)\n    x2 = rng.randn(n) + 1.5\n    x3 = rng.randn(n)\n    X = np.c_[x0, x1, x2, x3]\n\n    spn = BlockSPN(n_components=4, block=2).fit(X)\n    print('根权重:', np.round(spn.w, 3), '总和', round(float(spn.w.sum()), 4))\n    print('平均 log 概率:', round(float(spn.log_prob(X).mean()), 4))\n    print('只保留变量 (0,1) 的边缘 log 概率均值:', round(float(spn.marginal_log_prob(X, [0, 1]).mean()), 4))\n    print('与高斯混合(全协方差)的 log 概率对比:',\n          round(float(GaussianMixture(4, covariance_type='full', random_state=0).fit(X).score_samples(X).mean()), 4))"},
  {"id":"dsn","name":"深度堆叠网络 DSN","en":"Deeply Supervised Network","cat":"深度学习核心","diff":"高难","summary":"深度监督网络：每个隐层都接一个辅助分类头、各自贡献损失，浅层不必等梯度穿过整条链就能拿到有效信号。是缓解深层网络训练困难的一类结构技巧。","scenes":["深层网络难收敛","梯度消失诊断","小样本深层模型"],"idea":["第 l 层隐表示直接接一个辅助分类头","总损失 = Σ_l λ_l · L(head_l(h_l), y)","浅层梯度主要来自它自己的头，不再完全依赖深层的回传"],"deps":"PyTorch 2.1","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"多层监督的复合损失","formulas":["L = Σ_{l=1}^{L} λ_l · CE(head_l(h_l), y)","h_l = σ(W_l h_{l−1})，每个 h_l 都有一个头","∂L/∂W_l = 自身头的直接项 + 深层经链式回传的项"],"steps":["辅助头只用于训练，推理时丢弃——所以它不增加任何预测成本。","λ_l 通常越靠浅层越小，避免浅层被「过早分类」约束得太死而损失通用表示能力。","本质是给每一层提供一条短梯度路径，与 ResNet 的短路连接、辅助分类器（GoogLeNet）属同一族思路。"],"tex":["L = \\sum_{l=1}^{L}\\lambda_{l}\\,\\mathrm{CE}(head_{l}(h_{l}),y)","h_{l}=\\sigma(W_{l}h_{l-1}),\\quad \\hat y_{l}=\\mathrm{head}_{l}(h_{l})","\\frac{\\partial L}{\\partial W_l}=\\frac{\\partial L_l}{\\partial W_l}+\\sum_{m>l}\\frac{\\partial L_m}{\\partial W_l}"]},"params":[["hidden","int","64","各隐层宽度，正整数，默认 64。宽度一致便于堆叠；加深网络时建议同时调大。"],["depth","int","6","隐层数，正整数，默认 6。越深越能体现深度监督的价值（≥5 层时效果最明显）。"],["lam","float","0.3","辅助头损失权重，0–1，默认 0.3。太大让浅层过早贴合标签、损失泛化能力；0 退化为普通 MLP。"],["lr","float","0.01","学习率，正浮点数，默认 0.01。多损失叠加会让梯度变大，可比普通 MLP 略小。"],["epochs","int","60","训练轮数，正整数，默认 60。多损失叠加时收敛通常比单头网络更快，60 轮足以看清趋势。"]],"input":"X: (n, d)；y: (n,) 类别","output":"model: 主干 + 各层辅助头；推理只用最后一层","code":"import torch, torch.nn as nn\n\nclass DSN(nn.Module):\n    \"\"\"每个隐层带一个辅助分类头；训练用全部头的加权损失，推理只用最后一层。\"\"\"\n    def __init__(self, n_in, n_class, hidden=64, depth=6, lam=0.3):\n        super().__init__()\n        self.lam = lam\n        self.blocks = nn.ModuleList()\n        self.heads = nn.ModuleList()\n        prev = n_in\n        for _ in range(depth):\n            self.blocks.append(nn.Sequential(nn.Linear(prev, hidden), nn.ReLU()))\n            self.heads.append(nn.Linear(hidden, n_class))   # 辅助头\n            prev = hidden\n        self.main = nn.Linear(hidden, n_class)\n\n    def forward(self, x):\n        logits_aux = []\n        h = x\n        for blk, head in zip(self.blocks, self.heads):\n            h = blk(h)\n            logits_aux.append(head(h))                      # 每层都留一个分类输出\n        return self.main(h), logits_aux\n\ndef train(model, Xtr, ytr, epochs=60, lr=0.01):\n    opt = torch.optim.Adam(model.parameters(), lr=lr)\n    lossf = nn.CrossEntropyLoss()\n    for ep in range(epochs):\n        opt.zero_grad()\n        out, aux = model(Xtr)\n        loss = lossf(out, ytr)\n        for i, a in enumerate(aux):                         # 越浅的头权重越小\n            loss = loss + model.lam * (i + 1) / len(aux) * lossf(a, ytr)\n        loss.backward(); opt.step()\n        if ep % 20 == 0: print(f'epoch {ep} loss {loss.item():.4f}')\n    return model\n\nif __name__ == '__main__':\n    from sklearn.datasets import load_digits\n    from sklearn.model_selection import train_test_split\n    import numpy as np\n    X, y = load_digits(return_X_y=True)\n    X = X / 16.0\n    Xtr, Xte, ytr, yte = train_test_split(X, y, test_size=.3, random_state=0, stratify=y)\n    tXtr, tytr = torch.tensor(Xtr, dtype=torch.float32), torch.tensor(ytr)\n    tXte, tyte = torch.tensor(Xte, dtype=torch.float32), torch.tensor(yte)\n\n    model = DSN(X.shape[1], 10, hidden=64, depth=6, lam=0.3)\n    train(model, tXtr, tytr, epochs=60)\n    model.eval()\n    with torch.no_grad():\n        acc = (model(tXte)[0].argmax(1) == tyte).float().mean().item()\n    print('test acc:', round(acc, 4))\n\n    plain = nn.Sequential(nn.Linear(X.shape[1], 64), nn.ReLU(),\n                          *[m for _ in range(5) for m in (nn.Linear(64, 64), nn.ReLU())],\n                          nn.Linear(64, 10))\n    opt = torch.optim.Adam(plain.parameters(), lr=0.01); lf = nn.CrossEntropyLoss()\n    for _ in range(60):\n        opt.zero_grad(); lf(plain(tXtr), tytr).backward(); opt.step()\n    with torch.no_grad():\n        print('同深度普通 MLP test acc:',\n              round((plain(tXte).argmax(1) == tyte).float().mean().item(), 4))"},
  {"id":"random-nn","name":"随机神经网络","en":"Random Neural Network (Gelenbe)","cat":"深度学习核心","diff":"高难","summary":"Gelenbe 提出的脉冲型网络：正/负信号在网络中随机游走，每个神经元用「处于激发态的概率」表示状态，天然支持在线学习，还能直接对应排队论解释。","scenes":["在线/流式学习","脉冲数据建模","排队与网络控制"],"idea":["神经元状态 q_i ∈ [0,1] 表示处于激发态的概率","正信号使其激发、负信号抑制；权重可解释为信号转发概率","稳态方程给出 q_i，学习按「目标 − 实际激发率」直接调整权重"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"稳态激发率方程","formulas":["λ⁺_i = Σ_j q_j r_j p⁺_{ji} + Λ_i，λ⁻_i = Σ_j q_j r_j p⁻_{ji} + λ_i","q_i = λ⁺_i / (r_i + λ⁻_i)","权重更新： p⁺_{ij} ← p⁺_{ij} + η·(t_i − q_i)"],"steps":["q_i 是「神经元正在发放」的稳态概率，介于 0 与 1，所以输出天然有界，不需要额外的归一化层。","正负两套权重让网络可以表达「抑制」关系，这是普通前馈网络只能靠负权重间接表达的。","与反向传播的区别：RNN* 用局部规则（只看本节点的目标与实际差）更新，不需要全局梯度传播，适合在线与非平稳场景。"],"tex":["\\lambda_{i}^{+} = \\sum_{j}q_{j}r_{j}p_{ji}^{+}+\\Lambda_{i}","q_{i} = \\frac{\\lambda_{i}^{+}}{r_{i}+\\lambda_{i}^{-}}","p_{ij}^{+} \\leftarrow p_{ij}^{+}+\\eta\\,(t_{i}-q_{i})"]},"params":[["n_out","int","2","输出（决策）神经元个数，正整数，默认 2。每个输出神经元对应一个类别或一个回归目标。"],["lr","float","0.05","外部权重的学习率，正浮点数，默认 0.05。越大跟得快但可能不稳；在线场景常用 0.01–0.1。"],["rate","float","1.0","神经元激发率 r_i，正浮点数，默认 1.0。相当于响应速度，决定 q 被推向 1 的快慢。"],["iter_steady","int","20","稳态迭代次数，正整数，默认 20。太少 q 未收敛、梯度噪声大；20–50 通常足够。"]],"input":"X: (n, d)；y: 目标激发强度（回归）或 one-hot（分类）","output":"model: Wx / Wi / Vi 权矩阵；predict 返回各输出神经元的稳态激发率 q","code":"import numpy as np\n\nclass RandomNN:\n    \"\"\"Gelenbe 随机神经网络：稳态激发率 + 局部权重更新（无全局反向传播）。\"\"\"\n    def __init__(self, n_in, n_out=2, lr=0.05, rate=1.0, iter_steady=20, seed=0):\n        rng = np.random.RandomState(seed)\n        self.n_in, self.n_out = n_in, n_out\n        self.Wx = rng.rand(n_in, n_out) * 0.1     # 外部输入 -> 神经元的正信号权\n        self.Wi = rng.rand(n_out, n_out) * 0.1    # 神经元之间的正信号权\n        self.Vi = rng.rand(n_out, n_out) * 0.1    # 神经元之间的负信号权（抑制）\n        self.lr, self.rate, self.iters = lr, rate, iter_steady\n\n    def _steady(self, x):\n        \"\"\"不动点迭代求稳态激发率 q_i = λ⁺/(r + λ⁻)。\"\"\"\n        q = np.full(self.n_out, 0.1)\n        for _ in range(self.iters):\n            pos = q @ self.Wi + x @ self.Wx        # λ⁺：内部转发 + 外部到达\n            neg = q @ self.Vi                      # λ⁻：抑制信号\n            q = np.clip(pos / (self.rate + neg + 1e-9), 0.0, 1.0)\n        return q\n\n    def fit(self, X, Y, epochs=200):\n        X, Y = np.asarray(X, float), np.asarray(Y, float)\n        for _ in range(epochs):\n            for x, t in zip(X, Y):\n                q = self._steady(x)\n                err = t - q                                  # 局部误差：目标 - 实际激发率\n                self.Wx += self.lr * x[:, None] * err[None, :]\n                self.Wi += self.lr * 0.3 * q[:, None] * err[None, :]\n                self.Vi -= self.lr * 0.15 * q[:, None] * err[None, :]\n        return self\n\n    def predict(self, X):\n        return np.array([self._steady(np.asarray(x, float)) for x in X])\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    X = rng.rand(300, 4)\n    # 目标：两个输出的激发强度分别由前两列和后两列决定\n    Y = np.c_[X[:, 0] * .6 + X[:, 1] * .3, X[:, 2] * .5 + X[:, 3] * .4]\n    Y = (Y - Y.min(0)) / (Y.max(0) - Y.min(0) + 1e-9)\n\n    net = RandomNN(n_in=4, n_out=2, lr=0.05).fit(X[:240], Y[:240], epochs=150)\n    pred = net.predict(X[240:])\n    print('输出范围（应在 0~1）:', np.round(pred.min(0), 3), np.round(pred.max(0), 3))\n    print('MSE:', round(float(((pred - Y[240:]) ** 2).mean()), 5))"},
  {"id":"quantum-nn","name":"量子神经网络 QNN","en":"Quantum Neural Network","cat":"深度学习核心","diff":"高难","summary":"用参数化量子线路（PQC）当一层：数据编码成量子态、可训练旋转门充当权重、测量期望值作为输出，靠经典优化器调参。理论表达力更强，当前受硬件噪声限制。","scenes":["量子机器学习入门","变分量子算法 VQE/QAOA","NISQ 设备实验"],"idea":["角度编码把每个特征变成一个旋转角，塞进量子态","一层层参数化旋转门（含纠缠）构成可训练部分，类似网络权重","测量 ⟨Z⟩ 得到实数输出，用「参数移位规则」精确算梯度"],"deps":"PennyLane 0.35","updated":"2026-11-15","lang":"Python 3 · PennyLane","math":{"title":"参数化线路与参数移位梯度","formulas":["|ψ(θ)⟩ = U(θ)|0⟩，U(θ) = ∏_l U_l(θ_l)","输出 f(x;θ) = ⟨ψ(x,θ)|Z|ψ(x,θ)⟩","∂f/∂θ_k = ½[f(θ_k + π/2) − f(θ_k − π/2)]"],"steps":["参数移位规则是量子版的「解析梯度」：只评估两次线路就能拿到精确导数，不需要数值差分近似。","角度编码用 RY(arcsin x) 之类的映射把连续特征塞进振幅，编码方式本身会显著影响可训练性。","「贫瘠高原」是 QNN 的核心难点：线路太深、随机初始化时梯度会指数级趋零，所以要控制层数与初始化策略。"],"tex":["|\\psi(\\theta)\\rangle = U(\\theta)|0\\rangle","f(x;\\theta) = \\langle\\psi(x,\\theta)|Z|\\psi(x,\\theta)\\rangle","\\frac{\\partial f}{\\partial\\theta_{k}} = \\frac{1}{2}\\big[f(\\theta_{k}+\\tfrac{\\pi}{2})-f(\\theta_{k}-\\tfrac{\\pi}{2})\\big]"]},"params":[["n_qubits","int","4","量子比特数，正整数，默认 4。决定可编码的特征数与希尔伯特空间维度（2^n）；模拟器上超过 12 个比特会明显变慢。"],["n_layers","int","3","参数化层数，正整数，默认 3。层越多表达越强，但梯度更容易消失（贫瘠高原）。"],["lr","float","0.1","经典优化器学习率，正浮点数，默认 0.1。配合 Adam 常用 0.01–0.1。"],["epochs","int","40","训练轮数，正整数，默认 40。量子线路每次评估都要跑线路，轮数不宜过大。"],["shots","int","None","测量采样次数，None（默认，解析期望值）或正整数。设为几百次可模拟真实硬件采样噪声。"]],"input":"X: (n, n_qubits) 归一化到 [−1,1] 的特征；y: ±1 标签","output":"model: 线路参数 θ；predict 返回 ⟨Z⟩ ∈ [−1,1]","code":"import numpy as np\nimport pennylane as qml\nfrom pennylane import numpy as pnp\n\nn_qubits, n_layers = 4, 3\ndev = qml.device('default.qubit', wires=n_qubits)\n\[邮箱已脱敏](dev)\ndef circuit(x, theta):\n    # 1) 角度编码：把每个特征变成一次旋转塞进量子态\n    for i in range(n_qubits):\n        qml.RY(np.pi * x[i], wires=i)\n    # 2) 参数化层：可训练旋转 + 环形纠缠（相当于网络的权重）\n    for l in range(n_layers):\n        for i in range(n_qubits):\n            qml.RY(theta[l, i, 0], wires=i)\n            qml.RZ(theta[l, i, 1], wires=i)\n        for i in range(n_qubits):\n            qml.CNOT(wires=[i, (i + 1) % n_qubits])\n    # 3) 测量第一个比特的 Z 期望值作为输出\n    return qml.expval(qml.PauliZ(0))\n\ndef predict(params, X):\n    return np.array([circuit(x, params) for x in X])\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    X = rng.uniform(-1, 1, (120, n_qubits))\n    # 目标：第一个比特与第二个比特符号相同 -> +1，不同 -> -1\n    y = np.where(np.sign(X[:, 0]) == np.sign(X[:, 1]), 1.0, -1.0)\n\n    params = pnp.array(rng.normal(0, 0.1, (n_layers, n_qubits, 2)), requires_grad=True)\n    opt = qml.AdamOptimizer(stepsize=0.1)\n\n    def cost(p):\n        # 平方损失，标签在 ±1 上，输出同样在 ±1 上\n        return pnp.mean((pnp.array([circuit(x, p) for x in X[:60]]) - y[:60]) ** 2)\n\n    for ep in range(40):\n        params, c = opt.step_and_cost(cost, params)\n        if ep % 10 == 0: print(f'epoch {ep:2d} cost {float(c):.4f}')\n\n    pred = predict(params, X[60:])\n    acc = ((pred > 0) == (y[60:] > 0)).mean()\n    print('test acc:', round(float(acc), 3))\n    print('参数移位梯度（第一个参数）:',\n          round(float(qml.grad(circuit, argnum=1)(X[0], params)[0, 0, 0]), 5))"},
  {"id":"gradient-descent","name":"梯度下降 GD","en":"Gradient Descent","cat":"优化·度量·迁移学习","diff":"入门","summary":"沿负梯度方向按步长更新参数。全批量（BGD）稳但慢、小批量（Mini-Batch）是实践默认、随机（SGD）噪声大却能跳出局部极小——所有现代优化器都是它的改良。","scenes":["模型训练基础","理解优化器家族","教学与收敛分析"],"idea":["θ ← θ − η·∇L(θ)，η 是学习率","每步用全部样本（BGD）/ 一个批量（Mini-Batch）/ 单个样本（SGD）估计梯度","动量与学习率调度，分别改进「方向」和「步长」"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"更新规则与三种梯度估计","formulas":["θ_{t+1} = θ_t − η·∇L(θ_t)","BGD： ∇L = (1/n)Σ_i ∇ℓ_i；SGD： ∇ℓ_i；Mini-Batch： 取 B 个样本均值","收敛条件： Ση_t = ∞ 且 Ση_t² < ∞"],"steps":["梯度给出的是「局部最陡上升方向」，所以取负号；步长 η 决定走多远，太大振荡发散、太小慢慢爬。","Mini-Batch 是方差与效率的折中：批量越大梯度越准但每步更贵，1–1024 之间取，GPU 上常按显存取大值。","BGD 的损失曲线单调下降；SGD 的曲线是抖的——抖动不是坏事，它正是能跳出鞍点的原因。"],"tex":["\\theta_{t+1} = \\theta_{t}-\\eta\\nabla L(\\theta_{t})","\\nabla L = \\frac{1}{|B|}\\sum_{i\\in B}\\nabla\\ell_{i}","\\sum_{t}\\eta_{t}=\\infty,\\quad \\sum_{t}\\eta_{t}^{2}<\\infty"]},"params":[["lr","float","0.1","学习率，正浮点数，默认 0.1。太大直接发散（损失变 NaN 或震荡），太小收敛极慢；可用网格按数量级试 0.001–1。"],["batch_size","int","32","每步样本数，正整数，默认 32。1 即 SGD（噪声最大），等于样本数即 BGD（最稳最慢）；GPU 上常取 64–1024 提高吞吐。"],["epochs","int","100","遍历训练集的轮数，正整数，默认 100。配合验证集早停；偏小欠拟合。"],["momentum","float","0.0","动量系数，0–1，默认 0（纯 GD）。取 0.9 时相当于对梯度做指数平滑，能在沟谷方向加速并抑制横向震荡。"],["schedule","str","none","学习率调度。none（固定）、step（每 k 轮乘 0.1）、cosine（余弦退火）。后期衰减能让模型在极小值附近稳定下来。"]],"input":"loss_fn(theta) 与 grad_fn(theta)，或 (X, y) 与可微损失","output":"theta: 最优参数；history: 每步损失","code":"import numpy as np\n\ndef gd(f, grad, theta0, lr=0.1, epochs=100, momentum=0.0, batch=None, data=None):\n    \"\"\"通用梯度下降：支持 BGD / SGD / Mini-Batch 与动量。\"\"\"\n    theta = np.array(theta0, float)\n    v = np.zeros_like(theta)                     # 动量累积\n    hist = []\n    for ep in range(epochs):\n        if batch is None:                        # 全批量\n            g = grad(theta)\n            theta -= lr * g\n        else:                                    # 小批量 / 单样本\n            X, y = data\n            idx = np.random.permutation(len(X))\n            for s in range(0, len(X), batch):\n                b = idx[s:s + batch]\n                g = grad(theta, X[b], y[b])\n                v = momentum * v + g             # 动量：平滑梯度方向\n                theta -= lr * v\n        hist.append(f(theta) if batch is None else f(theta, *data))\n    return theta, hist\n\nif __name__ == '__main__':\n    # 病态二次函数：条件数 100，用来观察三种梯度估计的差别\n    A = np.diag([1.0, 100.0])\n    f = lambda t, *a: 0.5 * t @ A @ t\n    grad_full = lambda t, *a: A @ t\n\n    np.random.seed(0)\n    X = np.random.randn(400, 2)\n    y = X @ np.array([1.0, 1.0]) + 0.1 * np.random.randn(400)\n    loss = lambda t, X, y: float(((X @ t - y) ** 2).mean())\n    grad_sgd = lambda t, X, y: 2 * X.T @ (X @ t - y) / len(X)\n\n    for name, kw in [('BGD', dict(batch=None)),\n                     ('Mini-Batch(32)', dict(batch=32, data=(X, y))),\n                     ('SGD', dict(batch=1, data=(X, y)))]:\n        th, h = gd((lambda t, *a: loss(t, X, y)), grad_sgd, np.zeros(2),\n                   lr=0.1, epochs=50, **kw)\n        print(f'{name:16s} 最终损失 {h[-1]:.6f}  theta={np.round(th,3)}')\n\n    th, h = gd(f, grad_full, np.array([9.0, 9.0]), lr=0.005, epochs=5, momentum=0.9)\n    print('二次函数 + 动量:', [round(x, 3) for x in h])"},
  {"id":"adagrad","name":"AdaGrad 自适应步长","en":"Adaptive Gradient","cat":"优化·度量·迁移学习","diff":"进阶","summary":"给每个参数配一个自适应步长：历史梯度平方和越大、步长越小。稀疏特征上表现很好，但分母单调累积会让训练后期几乎停滞。","scenes":["稀疏特征（NLP）","不同量纲参数","理解自适应优化器"],"idea":["累加每个参数的历史梯度平方 G ← G + g²","用 η/√(G+ε) 作为该参数的实际步长","梯度一直很大的参数自动减速，很少更新的参数保持较大步长"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"逐坐标的累积分母","formulas":["G_t = G_{t−1} + g_t²  （逐元素）","θ_{t+1} = θ_t − η·g_t / √(G_t + ε)","有效步长 η_{t,i} ∝ 1/√(Σ_{s≤t} g_{s,i}²)"],"steps":["关键在「逐坐标」：不同参数各自一个分母，所以量纲差异大的特征不会互相拖累。","G 只增不减，因此步长单调递减 —— 训练久了更新趋近于零，这是 AdaGrad 最被诟病的缺陷，也是 RMSProp 要修的。","ε 的作用是防止前期 G=0 时除零，通常取 1e-8~1e-10。"],"tex":["G_{t} = G_{t-1}+g_{t}^{2}","\\theta_{t+1} = \\theta_{t}-\\frac{\\eta\\,g_{t}}{\\sqrt{G_{t}+\\varepsilon}}","\\eta_{t,i} \\propto \\frac{1}{\\sqrt{\\sum_{s\\le t}g_{s,i}^{2}}}"]},"params":[["lr","float","0.01","基础学习率，正浮点数，默认 0.01。AdaGrad 的有效步长已被分母缩放，所以基础值可比 SGD 略大。"],["eps","float","1e-8","数值稳定项，正浮点数，默认 1e-8。防止前期分母为 0；太大反而压制更新。"],["lr_decay","float","0.0","额外的学习率衰减，非负浮点数，默认 0。配合累积分母可进一步控制后期步长。"],["initial_accumulator","float","0.0","累积器的初值，非负浮点数，默认 0。设成小正数可让第一步更稳，避免分母溢出。"]],"input":"grad_fn(theta, batch) 与初始 theta","output":"theta: 优化后参数；history: 损失与逐坐标步长","code":"import numpy as np\n\nclass AdaGrad:\n    def __init__(self, lr=0.01, eps=1e-8, lr_decay=0.0, init_acc=0.0):\n        self.lr, self.eps, self.decay, self.init = lr, eps, lr_decay, init_acc\n\n    def step(self, theta, grad, t):\n        if not hasattr(self, 'G'):\n            self.G = np.full_like(theta, self.init)\n        self.G += grad ** 2                                  # 只增不减的累积分母\n        lr = self.lr / (1 + self.decay * t)\n        return theta - lr * grad / np.sqrt(self.G + self.eps)\n\nif __name__ == '__main__':\n    # 病态二次函数：两个方向曲率差 100 倍，看 AdaGrad 如何自动平衡\n    A = np.diag([1.0, 100.0])\n    theta = np.array([9.0, 9.0])\n    opt = AdaGrad(lr=1.5)\n    for t in range(200):\n        g = A @ theta\n        prev = theta.copy()\n        theta = opt.step(theta, g, t)\n        if t % 50 == 0:\n            step = np.abs(theta - prev)\n            print(f'iter {t:3d} theta={np.round(theta,4)} 逐坐标步长={np.round(step,4)}')\n\n    # 稀疏特征场景：AdaGrad 的经典优势\n    rng = np.random.RandomState(0)\n    X = (rng.rand(2000, 100) < 0.05).astype(float)            # 95% 为 0\n    w_true = rng.randn(100)\n    y = (X @ w_true > 0).astype(float)\n    w, G = np.zeros(100), np.zeros(100)\n    for ep in range(30):\n        g = X.T @ (1 / (1 + np.exp(-X @ w)) - y) / len(X)\n        G += g ** 2\n        w -= 0.5 * g / np.sqrt(G + 1e-8)\n    print('稀疏逻辑回归：非零特征权重范数 %.2f，长期未激活特征权重范数 %.2f'\n          % (np.linalg.norm(w[X.sum(0) > 0]), np.linalg.norm(w[X.sum(0) == 0])))"},
