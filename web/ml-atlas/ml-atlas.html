  {"id":"bayesian-inference","name":"贝叶斯方法（推断流程）","en":"Bayesian Inference","cat":"基础与线性模型","diff":"进阶","summary":"把未知参数当作随机变量：先验 → 似然 → 后验 → 后验预测，用贝叶斯定理随数据逐次更新信念；也是贝叶斯优化与实验设计的骨架。","scenes":["小样本参数估计","不确定性量化","序贯实验设计"],"idea":["设定先验 p(θ) 编码已有知识或领域约束","用观测数据 D 构造似然 p(D|θ)，按 p(θ|D) ∝ p(D|θ)p(θ) 更新","用后验做预测 p(y*|D)=∫p(y*|θ)p(θ|D)dθ，并把后验当作下一批数据的先验"],"deps":"SciPy 1.12","updated":"2026-11-14","lang":"Python 3 · SciPy","math":{"title":"先验—似然—后验更新链","formulas":["p(θ|D) = p(D|θ)p(θ) / p(D) ∝ p(D|θ)p(θ)，p(D) = ∫p(D|θ)p(θ)dθ","后验预测：p(y*|D) = ∫ p(y*|θ) p(θ|D) dθ","Beta-Bernoulli 共轭：θ ~ Beta(a,b)，观测 s 次成功 / n 次试验 ⇒ θ|D ~ Beta(a+s, b+n−s)"],"steps":["先验与似然属于同一共轭族时后验可解析求出，无需 MCMC，且天然支持逐批数据更新。","非共轭模型需用 MCMC / 变分推断近似；后验预测积分把参数不确定性传播到预测上，这是点估计给不了的。","代码 bayes_update 返回后验参数，可直接作为下一批数据的先验，形成「数据→信念→再观测」的闭环。"],"tex":["p(θ|D) = \\frac{p(D|θ)p(θ)}{p(D)} ∝ p(D|θ)p(θ),\\quad p(D) = \\int p(D|θ)p(θ)\\,dθ","p(y^{*}|D) = \\int p(y^{*}|θ)\\,p(θ|D)\\,dθ","θ ∼ \\text{Beta}(a,b),\\quad θ|D ∼ \\text{Beta}(a+s,\\ b+n−s)"]},"params":[["prior_a / prior_b","float","1.0","Beta 先验的两个形状参数，正浮点数，默认 1.0/1.0（均匀先验）。a 越大先验越偏向“成功”、b 越大越偏向“失败”，共同决定后验的初始强度。无单位。"],["successes","int","—","观测到的成功次数，非负整数。与 trials 构成二项似然，观测越多数据对后验的影响越强。"],["trials","int","—","总试验次数，正整数，须 ≥ successes。决定似然携带的信息量。"],["alpha","float","0.05","显著性水平（可信区间外的尾部概率），0–1 之间，常用 0.05。越小则区间越宽、结论越保守。默认 0.05。"]],"input":"prior_a, prior_b（先验），successes, trials（本批观测）","output":"后验 (a,b)、后验均值、95% 可信区间、下一次试验的预测概率","code":"from scipy.stats import beta\n\ndef bayes_update(prior_a=1.0, prior_b=1.0, successes=0, trials=0):\n    \"\"\"Beta-Bernoulli 共轭：后验仍是 Beta，可逐批数据连续更新。\"\"\"\n    a = prior_a + successes\n    b = prior_b + (trials - successes)\n    post = beta(a, b)\n    return {\n        \"posterior\": (a, b),\n        \"mean\": float(post.mean()),\n        \"ci95\": tuple(map(float, post.interval(0.95))),\n        \"predictive\": float(a / (a + b)),   # 下一次成功的后验预测\n    }\n\n# 序贯更新：均匀先验 -> 观测 8/10 -> 后验成为新先验 -> 再观测 30/50\n# r1 = bayes_update(1, 1, 8, 10)\n# r2 = bayes_update(*r1[\"posterior\"], 30, 50)\n# print(r2[\"mean\"], r2[\"ci95\"])"},
  {"id":"ahc","name":"凝聚层次聚类 AHC","en":"Agglomerative Hierarchical Clustering","cat":"无监督与降维","diff":"入门","summary":"自底向上：每个样本初始为一簇，反复合并距离最近的两簇直到满足条件；产出树状图，不必事先指定簇数。","scenes":["层次结构/谱系分析","小样本探索","需要树状图的场景"],"idea":["初始化 n 个单点簇，计算两两距离矩阵","按 linkage 规则定义簇间距离，合并最小的一对，记录合并高度","在树状图任意高度切一刀即得不同 K，无需重新训练"],"deps":"scikit-learn 1.4 / SciPy","updated":"2026-11-14","lang":"Python 3 · scikit-learn","math":{"title":"簇间距离与 Ward 合并代价","formulas":["single: d(A,B) = min_{a∈A,b∈B} d(a,b)；complete: 换成 max","average: d(A,B) = (1/(n_A n_B)) Σ_{a∈A} Σ_{b∈B} d(a,b)","Ward: Δ(A,B) = (n_A n_B)/(n_A+n_B) ‖μ_A − μ_B‖²，等价于最小化簇内方差增量"],"steps":["不同 linkage 决定簇形状偏好：single 会链式连接，complete/average 偏好紧凑球簇，Ward 类似 K-Means 的目标。","每次合并把两个簇的信息压缩成一个新簇，距离矩阵需按 Lance–Williams 公式递推更新，复杂度约 O(n²)~O(n³)。","代码 fcluster(Z, t=k, criterion=\"maxclust\") 从同一棵树切出任意 K；切的高度就是合并距离。"],"tex":["d_{\\text{single}}(A,B) = \\min_{a ∈ A, b ∈ B} d(a,b),\\quad d_{\\text{complete}} = \\max d(a,b)","d_{\\text{average}}(A,B) = \\frac{1}{n_A n_B}\\sum_{a ∈ A}\\sum_{b ∈ B} d(a,b)","\\Delta_{\\text{Ward}}(A,B) = \\frac{n_A n_B}{n_A+n_B}‖μ_A − μ_B‖^{2}"]},"params":[["n_clusters","int","2","目标簇数，正整数或 None，默认 2。与 distance_threshold 二选一；设它则按该簇数切割树。"],["linkage","str","ward","链接准则。ward（默认，最小化簇内方差）、complete（最大距离）、average（平均）、single（最小）。ward 对欧氏距离最常用。"],["metric","str","euclidean","距离度量，euclidean（默认）等。linkage 为 ward 时必须用 euclidean。"],["distance_threshold","float","None","切割树的高度阈值，浮点数或 None。None（默认）改用 n_clusters；设定后按该距离切树，可自动确定簇数。"]],"input":"X: array [n, d]；或预计算的距离矩阵 [n, n]","output":"labels: array [n]；scipy linkage 矩阵 Z 可用于画树状图","code":"import numpy as np\nfrom sklearn.cluster import AgglomerativeClustering\nfrom sklearn.metrics import silhouette_score\nfrom scipy.cluster.hierarchy import linkage, fcluster, dendrogram\n\ndef ahc_fit(X, k=4, method=\"ward\"):\n    model = AgglomerativeClustering(n_clusters=k, linkage=method)\n    labels = model.fit_predict(X)\n    print(\"silhouette:\", silhouette_score(X, labels))\n    # 同一棵树可在任意高度切出不同 K\n    Z = linkage(X, method=method)\n    labels_by_height = fcluster(Z, t=k, criterion=\"maxclust\")\n    assert (labels == 0).sum() > 0 and labels_by_height.shape[0] == len(X)\n    return model, Z, labels\n\n# 调用：m, Z, lab = ahc_fit(X, k=4)\n# dendrogram(Z)  # 画树状图"},
  {"id":"spectral-clustering","name":"谱聚类 SC","en":"Spectral Clustering","cat":"无监督与降维","diff":"进阶","summary":"用样本相似度建图，对拉普拉斯矩阵做特征分解，在低维谱嵌入空间里再跑 K-Means；能识别 K-Means 搞不定的非凸形状簇。","scenes":["非凸/流形形状簇","图与网络社群发现","图像分割"],"idea":["构造相似度矩阵 W（RBF 或 kNN 图），度矩阵 D_ii=Σ_j W_ij","归一化拉普拉斯 L_sym = I − D^{−1/2}WD^{−1/2}，取最小的 k 个特征向量","把特征向量按行归一化成 Y，Y 的每行视为新样本再跑 K-Means"],"deps":"scikit-learn 1.4 / SciPy","updated":"2026-11-14","lang":"Python 3 · scikit-learn","math":{"title":"图拉普拉斯与谱嵌入","formulas":["W_ij = exp(−γ‖x_i−x_j‖²)，D_ii = Σ_j W_ij","L = D − W，L_sym = I − D^{−1/2} W D^{−1/2}","min_{UᵀU=I} tr(Uᵀ L U) ⇒ U 取 L_sym 最小的 k 个特征向量；Y_ij = U_ij / ‖U_i‖"],"steps":["图割的松弛解就是拉普拉斯的低频特征向量，所以「谱」聚类本质是在低维嵌入里让同类样本靠近。","L_sym 的最小特征值 0 对应常向量，通常在 k 个向量里包含它；行归一化能让不同度数的节点尺度一致。","代码 spectral_np 用 numpy 复现全过程，spectral_sklearn 是工程版；gamma 控制邻域宽度，太大图会碎成孤岛。"],"tex":["W_{ij} = e^{−γ‖x_i−x_j‖^{2}},\\quad D_{ii} = \\sum_j W_{ij}","L = D − W,\\quad L_{sym} = I − D^{−1/2} W D^{−1/2}","\\min_{U^{T}U=I}\\text{tr}(U^{T}LU)\\Rightarrow U=\\text{最小的 }k\\text{ 个特征向量},\\quad Y_{ij}=\\frac{U_{ij}}{\\lVert U_{i}\\rVert}"]},"params":[["n_clusters","int","3","目标簇数量，正整数，默认 3。需预先指定；过小合并、过大碎裂。"],["affinity","str","rbf","相似度图构建方式。rbf（默认，高斯核）、nearest_neighbors（K 近邻）、precomputed。"],["gamma","float","1.0","rbf 亲和度系数，正浮点数，默认 1.0。越大邻域越小、图越稀疏；越小越平滑。"],["n_neighbors","int","10","构建 K 近邻图时的邻居数，正整数，默认 10。affinity 为 nearest_neighbors 时生效。"]],"input":"X: array [n, d]；或预计算的相似度矩阵","output":"labels: array [n]；谱嵌入 Y: array [n, k]","code":"import numpy as np\nfrom sklearn.cluster import SpectralClustering, KMeans\nfrom sklearn.metrics.pairwise import rbf_kernel\n\ndef spectral_np(X, k=3, gamma=1.0):\n    \"\"\"纯 numpy 复现：相似度 -> 归一化拉普拉斯 -> 谱嵌入 -> KMeans\"\"\"\n    W = rbf_kernel(X, gamma=gamma)\n    d = W.sum(axis=1)\n    D = np.diag(1.0 / np.sqrt(d + 1e-12))\n    L_sym = np.eye(len(X)) - D @ W @ D\n    vals, vecs = np.linalg.eigh(L_sym)\n    Y = vecs[:, :k]\n    Y = Y / (np.linalg.norm(Y, axis=1, keepdims=True) + 1e-12)\n    return KMeans(n_clusters=k, n_init=10, random_state=42).fit_predict(Y), Y\n\ndef spectral_sklearn(X, k=3):\n    return SpectralClustering(n_clusters=k, affinity=\"rbf\",\n                              gamma=1.0, random_state=42).fit_predict(X)\n\n# 调用：lab, Y = spectral_np(X, k=3)"},
  {"id":"vgg11","name":"VGG-11 骨干网络","en":"VGG-11","cat":"深度学习核心","diff":"进阶","summary":"Simonyan & Zisserman 的经典深层架构：8 个 3×3 卷积 + 3 个全连接，结构规整、迁移性好。XRDMatch 把它改成 1D 卷积，用于 4501 维 XRD 谱线特征提取。","scenes":["图像分类 backbone","XRD 谱线特征提取（XRDMatch）","迁移学习"],"idea":["全程 3×3 卷积 + 2×2 maxpool，通道数 64→128→256→512 逐级翻倍","两个 3×3 串联的感受野等价于一个 5×5，但参数更少、非线性更多","1D 版把 Conv2d/MaxPool2d 换成 Conv1d/MaxPool1d，输入形状 1×4501"],"deps":"PyTorch 2.3 / torchvision","updated":"2026-11-14","lang":"Python 3 · PyTorch / torchvision","math":{"title":"小卷积核堆叠与感受野","formulas":["感受野递推：R_l = R_{l−1} + (k_l − 1) Π_{i<l} s_i","两个 3×3 参数量 = 2·3²·C² = 18C² < 一个 5×5 的 25C²","输出尺寸：H_out = ⌊(H + 2p − k)/s⌋ + 1"],"steps":["小核堆叠用更少的参数换到同等感受野，还多插入一次非线性，这是 VGG 相对 AlexNet 的核心改进。","每个 maxpool 把步长累积乘进 Πs_i，后面的卷积核因此能覆盖更大的原始输入区域。","代码 VGG11_1D 保留 8 卷积 + 5 池化的骨架，把 2D 换成 1D 后可直接吃 1×4501 的谱线；AdaptiveAvgPool1d(1) 让输入长度可变。"],"tex":["R_l = R_{l−1} + (k_l − 1)\\prod_{i<l} s_i","2\\cdot 3^{2}C^{2} = 18C^{2} < 25C^{2}\\quad (\\text{两个 } 3×3 \\text{ 对比一个 } 5×5)","H_{out} = ⌊\\frac{H + 2p − k}{s}⌋ + 1"]},"params":[["cfg","list","[64,M,128,M,...]","各层配置列表，如 [64,M,128,M,...]：数字为卷积通道数、M 为最大池化。决定网络深度与宽度。"],["num_classes","int","2","输出类别数，正整数，默认 2。等于分类任务类数。"],["pretrained","bool","False","是否加载 ImageNet 预训练权重。true 可迁移学习、收敛快；false（默认）从头训练。"],["in_channels","int","1","输入通道数，正整数，默认 1（灰度）；RGB 图像设 3。"]],"input":"2D: Tensor [B, 3, H, W]；1D: Tensor [B, 1, 4501]","output":"logits: Tensor [B, num_classes]","code":"import torch\nimport torch.nn as nn\nfrom torchvision.models import vgg11, VGG11_Weights\n\ndef vgg11_backbone(num_classes=2, pretrained=False):\n    weights = VGG11_Weights.DEFAULT if pretrained else None\n    model = vgg11(weights=weights)\n    model.classifier[-1] = nn.Linear(4096, num_classes)\n    return model\n\nclass VGG11_1D(nn.Module):\n    \"\"\"XRDMatch 风格：1×4501 XRD 谱线的 1D VGG-11 特征提取器\"\"\"\n    def __init__(self, num_classes=2):\n        super().__init__()\n        cfg = [64, \"M\", 128, \"M\", 256, 256, \"M\",\n               512, 512, \"M\", 512, 512, \"M\"]\n        layers, c = [], 1\n        for v in cfg:\n            if v == \"M\":\n                layers.append(nn.MaxPool1d(2))\n            else:\n                layers += [nn.Conv1d(c, v, 3, padding=1),\n                           nn.BatchNorm1d(v), nn.ReLU(inplace=True)]\n                c = v\n        self.features = nn.Sequential(*layers)\n        self.head = nn.Sequential(nn.AdaptiveAvgPool1d(1), nn.Flatten(),\n                                  nn.Linear(512, 128), nn.ReLU(),\n                                  nn.Linear(128, num_classes))\n    def forward(self, x):\n        return self.head(self.features(x))\n\n# m = VGG11_1D(); y = m(torch.randn(8, 1, 4501))   # -> [8, 2]"},
  {"id":"gnn","name":"图神经网络 GNN / GCN","en":"Graph Neural Network","cat":"图与晶体建模","diff":"进阶","summary":"用消息传递在非欧结构数据上聚合邻居信息；GCN 是其对称归一化的一阶近似，也是 CGCNN、MEGNet 等晶体图模型的共同基础。","scenes":["分子与晶体性质预测","社交网络/知识图谱","推荐系统"],"idea":["消息传递三阶段：message（邻居造消息）→ aggregate（求和/平均）→ update（融合自身）","GCN 一阶谱近似：H^{(l+1)} = σ(D̃^{−1/2}ÃD̃^{−1/2}H^{(l)}W^{(l)})","堆 L 层即聚合 L 跳邻居；层数过多会导致节点表征过平滑"],"deps":"PyTorch 2.3","updated":"2026-11-14","lang":"Python 3 · PyTorch","math":{"title":"消息传递与 GCN 一阶近似","formulas":["m_i^{(l)} = AGG({ MSG(h_i^{(l)}, h_j^{(l)}, e_{ij}) : j ∈ N(i) })，h_i^{(l+1)} = UPD(h_i^{(l)}, m_i^{(l)})","Ã = A + I，D̃_ii = Σ_j Ã_ij；H^{(l+1)} = σ(D̃^{−1/2} Ã D̃^{−1/2} H^{(l)} W^{(l)})","单层节点式：h_i^{(l+1)} = σ( Σ_{j∈N(i)∪{i}} (1/√(d̃_i d̃_j)) W^{(l)} h_j^{(l)} )"],"steps":["加自环 Ã=A+I 保证节点自身信息不被丢掉；度矩阵对称归一化避免高度数节点主导聚合。","GCN 可看作谱域图卷积的一阶切比雪夫近似，因此每层只聚合 1 跳邻居，参数与图规模无关。","代码 normalize_adj 加自环并做 D^{−1/2}AD^{−1/2}，GCNLayer 直接用稠密矩阵乘法实现，无需安装 PyG。"],"tex":["m_i^{(l)} = \\text{AGG}_{j ∈ N(i)}\\ \\text{MSG}(h_i^{(l)},h_j^{(l)},e_{ij}),\\quad h_i^{(l+1)} = \\text{UPD}(h_i^{(l)},m_i^{(l)})","Ã = A + I,\\quad H^{(l+1)} = σ\\left(D̃^{−1/2}ÃD̃^{−1/2}H^{(l)}W^{(l)}\\right)","h_i^{(l+1)} = σ\\left(\\sum_{j ∈ N^{+}(i)}\\frac{1}{\\sqrt{d̃_i d̃_j}}W^{(l)}h_j^{(l)}\\right)"]},"params":[["in_dim","int","—","节点输入特征维度，正整数，须与节点特征向量长度一致；无单位。"],["hidden","int","32","隐藏层维度，正整数，默认 32。越大表达越强但更慢。"],["num_layers","int","2","消息传递层数，正整数，默认 2。越多感受野越大（可达 K 跳邻居）但易过平滑。"],["aggr","str","add","邻居聚合方式，add（默认）、mean、max。mean 对度不敏感、add 保留规模信息。"]],"input":"节点特征 H: Tensor [N, F]；edge_index: [2, E] 或邻接 A","output":"节点级 logits [N, C]；配合全局池化可得图级表示","code":"import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\ndef normalize_adj(edge_index, n):\n    \"\"\"无向图加自环 + 对称归一化 D^-1/2 A D^-1/2\"\"\"\n    src, dst = edge_index\n    idx = torch.cat([torch.stack([src, dst]),\n                     torch.stack([dst, src]),\n                     torch.stack([torch.arange(n), torch.arange(n)])], dim=1)\n    A = torch.zeros(n, n)\n    A[idx[0], idx[1]] = 1.0\n    d = A.sum(1)\n    return A / torch.sqrt(d[:, None] * d[None, :] + 1e-12)\n\nclass GCNLayer(nn.Module):\n    def __init__(self, in_dim, out_dim):\n        super().__init__()\n        self.lin = nn.Linear(in_dim, out_dim)\n    def forward(self, H, A_norm):\n        return F.relu(A_norm @ self.lin(H))\n\nclass GCN(nn.Module):\n    def __init__(self, in_dim, hidden, num_classes):\n        super().__init__()\n        self.g1 = GCNLayer(in_dim, hidden)\n        self.g2 = GCNLayer(hidden, num_classes)\n    def forward(self, H, A_norm):\n        return F.log_softmax(self.g2(self.g1(H, A_norm), A_norm), dim=-1)\n\n# n = 6; ei = (torch.tensor([0,1,2,3,4]), torch.tensor([1,2,3,4,5]))\n# A = normalize_adj(ei, n); out = GCN(16, 32, 2)(torch.randn(n, 16), A)"},
  {"id":"cgcnn","name":"晶体图卷积神经网络 CGCNN","en":"CGCNN","cat":"图与晶体建模","diff":"高难","summary":"Xie & Grossman（PRL 120, 145301, 2018）把晶体表示为无向多重图（原子为节点、键为边），用门控图卷积 + 池化端到端预测形成能、带隙等性质，是材料信息学的经典基线。","scenes":["晶体性质预测","形成能/带隙回归","高通量材料筛选"],"idea":["晶体图允许同一对原子间存在多条边（周期性边界），边特征用键长的高斯径向基展开","门控卷积 v_i^{(t+1)} = v_i^{(t)} + Σ σ(zW_f+b_f) ⊙ g(zW_s+b_s)，z 拼接中心/邻居/边特征","池化得到排列不变的晶体级向量 v_c，再经全连接回归目标性质"],"deps":"PyTorch 2.3 / PyTorch Geometric","updated":"2026-11-14","lang":"Python 3 · PyTorch Geometric","math":{"title":"晶体图、门控卷积与池化","formulas":["晶体图 G = (V, E) 为无向多重图；边特征 u_{(i,j)_k} = exp(−(d − μ_k)²/σ²)（高斯距离展开）","z = v_i^{(t)} ⊕ v_j^{(t)} ⊕ u_{(i,j)_k}，σ = sigmoid, g = softplus","v_i^{(t+1)} = v_i^{(t)} + Σ_{j,k} σ(zW_f^{(t)}+b_f^{(t)}) ⊙ g(zW_s^{(t)}+b_s^{(t)})；v_c = (1/N)Σ_i v_i^{(R)}"],"steps":["周期性晶体中同一对原子在相邻原胞里会多次成键，所以必须允许多重边，这是晶体图与普通分子图的关键差别。","门控机制让 sigmoid 分支学「哪些邻居重要」、softplus 分支学「传递什么特征」，比共享权重的简单卷积 MAE 从 0.108 降到 0.039 eV/atom。","代码用 PyG 的 CGConv 实现门控卷积，global_mean_pool 得到晶体级向量；GaussianExpansion 把连续键长变成模型易学的 RBF 向量。"],"tex":["G = (V,E)\\ \\text{为无向多重图},\\quad u_{(i,j)_k} = e^{−(d−μ_k)^{2}/σ^{2}}","z = v_i^{(t)} ⊕ v_j^{(t)} ⊕ u_{(i,j)_k},\\quad σ = \\text{sigmoid},\\ g = \\text{softplus}","v_i^{(t+1)} = v_i^{(t)} + \\sum_{j,k} σ(zW_f+b_f) ⊙ g(zW_s+b_s),\\quad v_c = \\frac{1}{N}\\sum_i v_i^{(R)}"]},"params":[["node_dim","int","64","原子节点特征嵌入维度，正整数，默认 64。越大表达越强但参数更多。"],["edge_dim","int","41","键（边）特征维度，正整数，默认 41。须与晶体图构建的特征数一致。"],["n_convs","int","3","图卷积层数，正整数，默认 3。越多感受野越大但更慢、易过平滑。"],["radius","float","5.0","建边时的截断半径（Å），正浮点数，默认 5.0。越大邻域越大、边越多，显著影响精度与开销。"]],"input":"x: Tensor [N, node_dim]；edge_index [2,E]；edge_attr [E, edge_dim]；batch [N]","output":"ŷ: Tensor [B]，晶体级性质预测（形成能等）","code":"import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch_geometric.nn import CGConv, global_mean_pool\n\nclass GaussianExpansion(nn.Module):\n    \"\"\"键长标量 -> 高斯径向基向量（CGCNN 边特征）\"\"\"\n    def __init__(self, dmin=0.0, dmax=8.0, step=0.2):\n        super().__init__()\n        self.register_buffer(\"centers\", torch.arange(dmin, dmax + step, step))\n        self.var = step\n    def forward(self, d):\n        return torch.exp(-(d - self.centers) ** 2 / self.var ** 2)\n\nclass CGCNNNet(nn.Module):\n    def __init__(self, node_dim=64, edge_dim=41, hidden=64, n_convs=3):\n        super().__init__()\n        self.embed = nn.Linear(node_dim, hidden)\n        self.convs = nn.ModuleList(\n            [CGConv(hidden, edge_dim, aggr=\"add\", batch_norm=False)\n             for _ in range(n_convs)])\n        self.head = nn.Sequential(nn.Linear(hidden, 64), nn.Softplus(),\n                                  nn.Linear(64, 1))\n    def forward(self, x, edge_index, edge_attr, batch):\n        h = self.embed(x)\n        for conv in self.convs:\n            h = h + F.softplus(conv(h, edge_index, edge_attr))\n        vc = global_mean_pool(h, batch)      # 排列不变的晶体级表示\n        return self.head(vc).squeeze(-1)\n\n# net = CGCNNNet(); out = net(x, edge_index, edge_attr, batch)  # -> [B]\n# 参考：Xie & Grossman, Phys. Rev. Lett. 120, 145301 (2018), txie-93/cgcnn"},
  {"id":"fixmatch","name":"FixMatch 半监督学习","en":"FixMatch","cat":"半监督学习","diff":"高难","summary":"Sohn 等（NeurIPS 2020, arXiv:2001.07685）把伪标签与一致性正则化简成一步：弱增强预测过阈值才作硬伪标签，再让强增强预测去拟合它。XRDMatch 的直接借鉴对象。","scenes":["极少标注样本","半监督图像分类","SSL 强基线"],"idea":["标注批在弱增强上算标准交叉熵 L_s","未标注批弱增强得 q_b，仅当 max(q_b) ≥ τ（默认 0.95）才保留 argmax 硬伪标签 q̂_b","强增强预测与 q̂_b 做交叉熵得 L_u，总损失 L = L_s + λ_u L_u"],"deps":"PyTorch 2.3","updated":"2026-11-14","lang":"Python 3 · PyTorch","math":{"title":"置信度阈值伪标签 + 一致性损失","formulas":["L_s = (1/B) Σ_b CE(y_b, p_θ(y | A_weak(x_b)))","q_b = p_θ(y | A_weak(u_b))，q̂_b = argmax(q_b)，仅当 max(q_b) ≥ τ 参与损失","L_u = (1/(μB)) Σ_b I[max(q_b) ≥ τ] · CE(q̂_b, p_θ(y | A_strong(u_b)))，L = L_s + λ_u L_u"],"steps":["弱增强预测更稳，适合生成伪标签；强增强预测更难，用它来训练能扩展决策边界，二者构成一致性正则化。","阈值 τ 把低置信样本直接丢弃（不参与梯度），等价于隐式课程学习：训练早期只有少量样本通过，后期逐渐增多。","代码 fixmatch_loss 返回 mask_rate 便于监控伪标签通过率；XRDMatch 中 α 即这里的 λ_u。"],"tex":["L_s = \\frac{1}{B}\\sum_b \\text{CE}\\left(y_b,\\ p_θ(y|A_{weak}(x_b))\\right)","q_b = p_θ(y|A_{weak}(u_b)),\\quad q̂_b = \\text{argmax}(q_b),\\quad \\max(q_b) ≥ τ","L_u = \\frac{1}{μB}\\sum_b I[\\max(q_b) ≥ τ]\\,\\text{CE}\\left(q̂_b,\\ p_θ(y|A_{strong}(u_b))\\right)"]},"params":[["tau","float","0.95","伪标签置信度阈值，0–1，默认 0.95。越高伪标签越可靠但覆盖越少；越低覆盖多但噪声大。"],["lambda_u","float","1.0","无监督损失权重，非负浮点数，默认 1.0。越大越依赖无标注数据。"],["mu","int","7","每个有标签样本对应的无标签样本倍数，正整数，默认 7。越大无监督占比越高。"],["strong_aug","str","RandAugment","强增广策略，默认 RandAugment。越强增广提升一致性正则效果，但过强会伤性能。"]],"input":"x_l [B,...], y_l [B]；x_u [μB,...]；任意分类模型 model","output":"总损失标量；监控字典 {mask_rate, Ls, Lu}","code":"import torch\nimport torch.nn.functional as F\n\ndef weak_augment(x, noise=0.01):\n    \"\"\"轻微扰动：XRDMatch 语境下模拟测量噪声\"\"\"\n    return x + noise * torch.randn_like(x)\n\ndef strong_augment(x, drop=0.15, noise=0.08):\n    \"\"\"强增强：随机遮蔽 + 较大扰动 + 谱线平移\"\"\"\n    mask = (torch.rand_like(x) > drop).float()\n    shift = int(torch.randint(-5, 6, (1,)).item())\n    return mask * (x + noise * torch.randn_like(x)).roll(shift, dims=-1)\n\ndef fixmatch_loss(model, x_l, y_l, x_u, tau=0.95, lambda_u=1.0):\n    l_s = F.cross_entropy(model(weak_augment(x_l)), y_l)\n    with torch.no_grad():\n        q = model(weak_augment(x_u)).softmax(dim=-1)\n        conf, pseudo = q.max(dim=-1)\n        mask = (conf >= tau).float()\n    logits_s = model(strong_augment(x_u))\n    l_u = (F.cross_entropy(logits_s, pseudo, reduction=\"none\") * mask).mean()\n    loss = l_s + lambda_u * l_u\n    return loss, {\"mask_rate\": float(mask.mean()),\n                  \"Ls\": float(l_s), \"Lu\": float(l_u)}\n\n# loss, info = fixmatch_loss(net, x_l, y_l, x_u)\n# 参考：Sohn et al., FixMatch, NeurIPS 2020, arXiv:2001.07685"},
  {"id":"xrdmatch","name":"XRDMatch 半监督框架","en":"XRDMatch","cat":"半监督学习","diff":"高难","summary":"Wan 等（Energy & Environmental Science, 2024, DOI:10.1039/D4EE02970D）提出：仅用 Pymatgen 模拟的 4501 维 XRD 谱线作描述符，VGG-11 为骨干，融合伪标签与一致性正则化，从少量标记数据中发现室温锂超离子导体（集成模型 F1 = 0.92）。","scenes":["小样本材料筛选","XRD 谱线分类","固态电解质发现"],"idea":["用 Pymatgen 从 ICSD 晶体结构计算 XRD 图谱，得到 4501 维向量并归一化","弱增强（模拟测量噪声）生成高置信伪标签，强增强（模拟成分/结构变化）做一致性约束","总损失 L = L_s + α·L_u；迭代把高置信伪样本并入训练集，VGG-11（1D）负责特征提取"],"deps":"PyTorch 2.3 / Pymatgen","updated":"2026-11-14","lang":"Python 3 · PyTorch","math":{"title":"XRD 描述符、一致性损失与迭代伪标签","formulas":["描述符：x = XRD(structure) ∈ R^{4501}，x̂ = x / max(x)","L_s = CE(y, f_θ(A_weak(x_l)))；L_u = I[max p_θ(A_weak(x_u)) ≥ τ] · CE(q̂, f_θ(A_strong(x_u)))","L = L_s + α L_u；迭代：D_labeled ← D_labeled ∪ {(x_u, q̂) | conf ≥ τ}"],"steps":["只依赖 XRD 谱线、无需人工特征，标记样本稀少时借 ICSD 中大量未标记结构提升泛化；VGG-11 参数量适中，适配小数据。","弱/强增强的物理含义由材料专家定义：弱增强只加测量噪声，强增强模拟成分或结构剧烈变化，这是把领域知识注入一致性正则化的关键。","代码 xrdmatch_step 给出单轮训练并返回高置信伪样本，供下一轮并入；原论文还用了集成学习，最终 F1 达 0.92 并实验验证了 Li6AsSe5I。"],"tex":["x = \\text{XRD}(\\text{structure}) ∈ R^{4501},\\quad x̂ = \\frac{x}{\\max(x)}","L_s = \\text{CE}\\left(y,\\ f_θ(A_{weak}(x_l))\\right),\\quad L_u = I[\\max q ≥ τ]\\,\\text{CE}\\left(q̂,\\ f_θ(A_{strong}(x_u))\\right)","L = L_s + αL_u,\\quad D_{labeled}^{(t+1)} = D_{labeled}^{(t)} ∪ P_t"]},"params":[["tau","float","0.95","伪标签置信度阈值，0–1，默认 0.95。越高越保守、覆盖少；越低覆盖多但噪声大。"],["alpha","float","1.0","无监督一致性损失权重，非负浮点数，默认 1.0。越大越依赖无标注 XRD 图谱。"],["descriptor_dim","int","4501","XRD 描述子维度，正整数，默认 4501。须与特征提取方式匹配（如 2θ 网格点数）。"],["backbone","str","VGG-11 (1D)","主干网络类型，默认 VGG-11(1D)。决定特征提取能力与计算量。"]],"input":"x_l [B,1,4501] + y_l [B]；x_u [μB,1,4501] 未标记谱线","output":"logits [B,2]；每轮返回 loss、新增伪样本 x 与伪标签 q̂","code":"import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass XRDVGG11(nn.Module):\n    \"\"\"XRDMatch 骨干：1×4501 谱线的 1D VGG-11\"\"\"\n    def __init__(self, num_classes=2):\n        super().__init__()\n        cfg = [64, \"M\", 128, \"M\", 256, 256, \"M\",\n               512, 512, \"M\", 512, 512, \"M\"]\n        layers, c = [], 1\n        for v in cfg:\n            if v == \"M\":\n                layers.append(nn.MaxPool1d(2))\n            else:\n                layers += [nn.Conv1d(c, v, 3, padding=1),\n                           nn.BatchNorm1d(v), nn.ReLU(inplace=True)]\n                c = v\n        self.features = nn.Sequential(*layers)\n        self.head = nn.Sequential(nn.AdaptiveAvgPool1d(1), nn.Flatten(),\n                                  nn.Linear(512, num_classes))\n    def forward(self, x):\n        return self.head(self.features(x))\n\ndef weak_aug(x):\n    return x + 0.01 * torch.randn_like(x)          # 模拟测量噪声\n\ndef strong_aug(x):\n    m = (torch.rand_like(x) > 0.15).float()         # 模拟成分/结构变化\n    return m * (x + 0.08 * torch.randn_like(x))\n\ndef xrdmatch_step(model, x_l, y_l, x_u, opt, alpha=1.0, tau=0.95):\n    \"\"\"单轮：监督损失 + 一致性损失，并返回高置信伪样本供下轮并入\"\"\"\n    model.train()\n    ls = F.cross_entropy(model(weak_aug(x_l)), y_l)\n    with torch.no_grad():\n        q = model(weak_aug(x_u)).softmax(-1)\n        conf, pseudo = q.max(-1)\n        keep = conf >= tau\n    lu = F.cross_entropy(model(strong_aug(x_u)), pseudo) if keep.any() else 0.0\n    loss = ls + alpha * lu\n    opt.zero_grad(); loss.backward(); opt.step()\n    return float(loss), x_u[keep], pseudo[keep]\n\n# model = XRDVGG11(); opt = torch.optim.Adam(model.parameters(), 1e-3)\n# loss, new_x, new_y = xrdmatch_step(model, x_l, y_l, x_u, opt)\n# 参考：Wan et al., Energy Environ. Sci., 2024, DOI:10.1039/D4EE02970D\n# PaddleScience 另有基于 FlexMatch 的复现示例（1×4501 输入 + VGG 骨干）"},
  {"id":"elastic-net","name":"弹性网络 ElasticNet","en":"Elastic Net","cat":"基础与线性模型","diff":"进阶","summary":"把 L1（Lasso）与 L2（Ridge）惩罚按 ρ 加权组合，既做特征选择又保持分组稳定，适合强相关特征群与高维稀疏场景。","scenes":["强相关特征群","高维稀疏回归","特征选择 + 稳定"],"idea":["目标为残差平方和 + α[ ρ‖w‖₁ + (1−ρ)/2·‖w‖₂² ]","ρ=1 退化为 Lasso，ρ=0 退化为 Ridge，中间值兼顾两者优点","用坐标下降逐特征更新权重，带软阈值的闭式步"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"组合惩罚与坐标下降","formulas":["L(w) = ‖y − Xw‖₂² + α[ ρ‖w‖₁ + (1−ρ)/2 · ‖w‖₂² ]","ρ = 1 ⇒ Lasso；ρ = 0 ⇒ Ridge；0 < ρ < 1 ⇒ 弹性网络","坐标下降对 wⱼ 的闭合更新含软阈值 S_αρ(zⱼ)/(1+α(1−ρ))"],"steps":["单一 L1 在强相关特征间会随机挑一个、其余置零，不稳定；加入 L2 让整组特征一起保留。","α 控制整体惩罚强度，l1_ratio=ρ 控制稀疏倾向；两超参用交叉验证选。","代码里 StandardScaler 仍建议放进 pipeline，因惩罚对尺度敏感。"],"tex":["L(w) = ‖y − Xw‖_2^{2} + α\\left[ ρ‖w‖_1 + \\frac{1−ρ}{2}‖w‖_2^{2}\\right]","ρ = 1 \\Rightarrow \\text{Lasso},\\quad ρ = 0 \\Rightarrow \\text{Ridge}","w_j \\leftarrow \\frac{S_{αρ}(z_j)}{1 + α(1−ρ)},\\quad S_τ(z) = \\text{sign}(z)\\max(|z|−τ,0)"]},"params":[["alpha","float","1.0","总正则强度，非负浮点数，常用 1e-4–10。越大整体收缩越强。默认 1.0，无单位。"],["l1_ratio","float","0.5","L1 与 L2 的混合比例，0–1。0 为纯岭回归（不稀疏）、1 为纯 Lasso（稀疏）、0.5（默认）两者折中；越大越倾向稀疏选特征。"],["max_iter","int","5000","坐标下降最大迭代次数，正整数，默认 5000。过小可能未收敛，可适当调大。"]],"input":"标准化后的 X: array [n, d]；y: array [n]","output":"model.predict(X)；model.coef_ 系数","code":"from sklearn.linear_model import ElasticNet\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.metrics import mean_squared_error\n\ndef en_fit(X, y, X_test, y_test=None, alpha=1.0, l1_ratio=0.5):\n    model = make_pipeline(StandardScaler(),\n                         ElasticNet(alpha=alpha, l1_ratio=l1_ratio, max_iter=5000))\n    model.fit(X, y)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print('MSE:', mean_squared_error(y_test, pred))\n    return model, pred\n\n# m, p = en_fit(X_tr, y_tr, X_te, y_te, alpha=0.5, l1_ratio=0.5)"},
  {"id":"poly-regression","name":"多项式回归","en":"Polynomial Regression","cat":"基础与线性模型","diff":"入门","summary":"先做多项式特征展开（x → 1, x, x², x₁x₂, …）再用线性回归拟合，把线性模型扩展到非线性曲线。","scenes":["单变量非线性拟合","曲线趋势建模","特征交叉入门"],"idea":["PolynomialFeatures 把 d 维特征映射到更高阶组合","展开后仍是线性回归，可用普通最小二乘求解","degree 过大易过拟合，需用验证集选阶数"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"特征展开与基函数","formulas":["φ(x) = [1, x₁, …, x_k, x₁², x₁x₂, …]  即 d 阶单项式基（k 个特征）","ŷ = wᵀ φ(x)，参数 w 用最小二乘估计","自由度随 degree d 与特征数 k 约按 O(k^d) 增长"],"steps":["多项式回归本质是线性模型套基函数，所以可解析求解、可解释。","阶数越高越能贴合训练曲线，但方差也越大，必须正则或早停。","代码把 PolynomialFeatures 与 LinearRegression 串成 pipeline，避免数据泄漏。"],"tex":["\\phi(x) = [1,\\ x_1, \\ldots, x_k,\\ x_1^{2},\\ x_1x_2,\\ \\ldots]","\\hat{y} = w^{T}\\phi(x),\\quad w = (\\Phi^{T}\\Phi)^{-1}\\Phi^{T}y","\\text{参数量} \\sim O(k^{d})"]},"params":[["degree","int","3","多项式最高次数，正整数，常用 2–4。越大拟合能力越强但极易过拟合、数值不稳，建议配合正则或交叉验证。默认 3。"],["include_bias","bool","True","是否包含偏置列（全 1 列）。true（默认）常与线性模型组合；若下游模型自带截距可设 false 以免共线。"],["interaction_only","bool","False","是否只保留特征交互项（如 x1·x2）而不含各特征的高次幂。false（默认）生成全部组合；true 仅交互项，维数更低。"]],"input":"X: array [n, d]（单变量时 reshape 成 [n,1]）","output":"model.predict(X)；model.coef_","code":"import numpy as np\nfrom sklearn.preprocessing import PolynomialFeatures\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.metrics import r2_score\n\ndef poly_fit(X, y, X_test, y_test=None, degree=3):\n    model = make_pipeline(PolynomialFeatures(degree), LinearRegression())\n    model.fit(X, y)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print('R2:', r2_score(y_test, pred))\n    return model, pred\n\n# X = np.linspace(0, 1, 50).reshape(-1, 1)\n# m, p = poly_fit(X[:40], y[:40], X[40:], y[40:], degree=3)"},
  {"id":"isotonic","name":"等渗回归","en":"Isotonic Regression","cat":"基础与线性模型","diff":"进阶","summary":"在仅要求「单调不减」的约束下拟合数据，不假设具体函数形式，适合单调但非线性的关系。","scenes":["单调非线性关系","概率校准","累积分布拟合"],"idea":["最小化 Σ wᵢ(yᵢ − ŷᵢ)² 并约束 ŷ₁ ≤ ŷ₂ ≤ … ≤ ŷₙ","用 PAVA（相邻违例池化算法）高效求解","输出是分段常数阶梯函数"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"保序约束与 PAVA","formulas":["min Σᵢ wᵢ (yᵢ − ŷᵢ)²   s.t.   ŷ₁ ≤ ŷ₂ ≤ … ≤ ŷₙ","PAVA 合并块取加权均值：ŷ_B = Σ_{i∈B} wᵢyᵢ / Σ_{i∈B} wᵢ，直至序列单调","合并块内取值相同，故拟合结果是分段常数"],"steps":["相比多项式回归，等渗不引入阶数假设，只利用单调性，更稳健。","常用于把任意分类器的输出概率做保序校准（isotonic calibration）。","代码 y_min/y_max 可限制输出范围（如概率 0~1）。"],"tex":["\\min \\sum_i w_i (y_i - \\hat{y}_i)^2 \\quad \\text{s.t.}\\quad \\hat{y}_1 \\le \\hat{y}_2 \\le \\cdots \\le \\hat{y}_n","\\hat y_{B}=\\frac{\\sum_{i\\in B}w_{i}y_{i}}{\\sum_{i\\in B}w_{i}}\\quad\\text{(合并下降块直至单调)}","\\hat{y}\\ \\text{为分段常数}"]},"params":[["increasing","bool/str","auto","单调方向。auto（默认）从数据自动判断，true 强制不减、false 强制不增。已知单调趋势时显式指定更稳。"],["y_min","float","None","输出下界，浮点数或 None。None（默认）不设限；设定后预测值被裁剪到该下界，用于已知物理范围时防越界。"],["y_max","float","None","输出上界，浮点数或 None。None（默认）不设限；设定后裁剪预测上界。"]],"input":"x: 1D array [n]；y: array [n]（与 x 同序）","output":"model.predict(x_test) → 保序后的预测","code":"import numpy as np\nfrom sklearn.isotonic import IsotonicRegression\nfrom sklearn.metrics import mean_squared_error\n\ndef isotonic_fit(x, y, x_test, y_test=None):\n    model = IsotonicRegression(increasing='auto', y_min=0, y_max=1)\n    model.fit(x, y)\n    pred = model.predict(x_test)\n    if y_test is not None:\n        print('MSE:', mean_squared_error(y_test, pred))\n    return model, pred\n\n# 适合单调但非线性关系，如评分随某指标单调上升"},
  {"id":"kernel-ridge","name":"核岭回归","en":"Kernel Ridge Regression","cat":"基础与线性模型","diff":"进阶","summary":"把岭回归通过核技巧隐式映射到高维特征空间，拟合非线性关系，同时保留闭式解、无需迭代优化。","scenes":["非线性回归","核方法基线","小样本高维"],"idea":["对偶形式下权重写成 α = (K + αI)⁻¹ y，K 为核矩阵","RBF 核 Kᵢⱼ = exp(−γ‖xᵢ−xⱼ‖²) 引入非线性","无稀疏性（所有样本都是支持向量），但仍是闭式解"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"对偶闭式解","formulas":["min_w ‖y − Φw‖² + α‖w‖²  ⇒  w* = Φᵀ(K + αI)⁻¹ y","Kᵢⱼ = k(xᵢ, xⱼ)，α 为回归系数（非拉格朗日乘子）","预测 ŷ = K(x, X)(K + αI)⁻¹ y"],"steps":["与 SVM 一样走核技巧，但损失是平方误差而非合页损失，因此有闭式解。","没有稀疏性意味着预测依赖全部训练样本，规模大时比 SVR 慢。","α 与 γ 两个超参分别控制正则与核宽，需网格/交叉验证。"],"tex":["\\min_w ‖y − \\Phi w‖^{2} + α‖w‖^{2} \\Rightarrow w^{*} = \\Phi^{T}(K + αI)^{-1} y","K_{ij} = k(x_i, x_j)","\\hat{y} = K(x, X)\\,(K + αI)^{-1} y"]},"params":[["alpha","float","1.0","正则强度，非负浮点数，常用 1e-3–10。越大越平滑抗过拟合、但可能欠拟合。默认 1.0，无单位。"],["kernel","str","rbf","核函数，rbf（默认）、linear、poly、laplacian 等。非线性关系优先 rbf。"],["gamma","float","1.0","rbf/laplacian 核系数，正浮点数。越大影响范围越小、越易过拟合；越小越平滑。核为 linear 时忽略。默认 1.0。"]],"input":"X: array [n, d]；y: array [n]","output":"model.predict(X)；model.dual_coef_","code":"import numpy as np\nfrom sklearn.kernel_ridge import KernelRidge\nfrom sklearn.metrics import mean_squared_error\n\ndef kr_fit(X, y, X_test, y_test=None, alpha=1.0, gamma=0.1):\n    model = KernelRidge(alpha=alpha, kernel='rbf', gamma=gamma)\n    model.fit(X, y)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print('MSE:', mean_squared_error(y_test, pred))\n    return model, pred\n\n# 核技巧的岭回归：非线性但可闭式求解"},
  {"id":"pls","name":"偏最小二乘回归 PLS","en":"Partial Least Squares","cat":"基础与线性模型","diff":"进阶","summary":"同时把 X 与 y 投影到低维潜变量，使投影方向最大化 X 与 y 的协方差，适合 X 高维且强共线。","scenes":["高维共线特征","化学/谱学建模","监督降维"],"idea":["找权重向量 w, c 使 t=Xw 与 u=Yc 相关性最大","交替回归出潜变量，再 deflation 去掉已解释部分","用 n_components 控制潜变量个数"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"协方差最大化的潜变量","formulas":["max_w,c  cov(Xw, Yc)   s.t.  ‖w‖=‖c‖=1","t = Xw,  u = Yc；一轮后 X ← X − t pᵀ,  Y ← Y − t qᵀ（deflation）","预测 ŷ = t₁…t_A 的回归组合"],"steps":["PCA 只看 X 方差，PLS 还利用 y 信息，所以少分量就能抓住与 y 相关的方向。","当特征数远大于样本或高度共线时，比普通最小二乘更稳定。","n_components 不是单纯降维而是取与 y 最相关的潜变量数。"],"tex":["\\max_{w,c}\\ \\text{cov}(Xw,\\ Yc)\\quad \\text{s.t.}\\ ‖w‖=‖c‖=1","t = Xw,\\ u = Yc;\\quad X \\leftarrow X - tp^{T},\\ Y \\leftarrow Y - tq^{T}","\\hat{y} = \\sum_{a=1}^{A} t_a q_a"]},"params":[["n_components","int","2","提取的潜变量（成分）个数，正整数，通常 ≤ 特征数。太少欠拟合，太多趋近普通回归且易过拟合。默认 2。"],["scale","bool","True","是否在建模前对 X、Y 标准化。true（默认）消除量纲影响，通常保留；false 保留原始尺度。"],["max_iter","int","500","NIPALS 迭代上限，正整数，默认 500。多数数据很快收敛，一般无需修改。"]],"input":"X: array [n, d]；y: array [n]（PLSRegression 接受 1D 或 2D）","output":"model.predict(X)；model.x_weights_（X 侧载荷）","code":"import numpy as np\nfrom sklearn.cross_decomposition import PLSRegression\nfrom sklearn.metrics import r2_score\n\ndef pls_fit(X, y, X_test, y_test=None, n_comp=2):\n    model = PLSRegression(n_components=n_comp)\n    model.fit(X, y)\n    pred = model.predict(X_test).ravel()\n    if y_test is not None:\n        print('R2:', r2_score(y_test, pred))\n    return model, pred\n\n# 同时投影 X 与 y，适合高维且强共线"},
  {"id":"kernel-perceptron","name":"核感知机","en":"Kernel Perceptron","cat":"基础与线性模型","diff":"进阶","summary":"感知机的核化版本：用核函数把样本隐式映射到高维，仅保留被更新的支持向量，能学非线性决策边界。","scenes":["非线性二类分类","核方法入门","支持向量直观理解"],"idea":["权重写成 αⱼyⱼ 的核组合，决策依赖 K(xⱼ, x)","误分类时给对应 α 加 1，正确则不变","最终只保留 α>0 的样本（支持向量）"],"deps":"NumPy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"核化的加法更新","formulas":["f(x) = sign( Σⱼ αⱼ yⱼ K(xⱼ, x) )","若 yᵢ·f(xᵢ) ≤ 0，则 αᵢ ← αᵢ + 1","K = 线性 / 多项式 / RBF，决定特征空间"],"steps":["原始感知机权重是样本线性组合，核化后组合系数即 α。","只有被更新过的样本 α>0，天然对应支持向量概念。","代码用纯 NumPy 演示原理，生产用 sklearn 的 SVC 更高效。"],"tex":["f(x) = \\text{sign}\\left(\\sum_j α_j y_j K(x_j, x)\\right)","y_i f(x_i) \\le 0 \\Rightarrow α_i \\leftarrow α_i + 1","K = \\text{linear / poly / rbf}"]},"params":[["n_iter","int","10","遍历训练集的轮数，正整数，默认 10。越多越充分但可能过拟合；线性可分数据通常几轮即收敛。"],["kernel","str","linear","核函数，linear（默认）、rbf、poly。线性不可分时改用 rbf。"],["gamma","float","1.0","rbf/poly 核系数，正浮点数，默认 1.0。越大边界越弯曲易过拟合；越小越平滑。"]],"input":"X: array [n, d]；y: array [n]（需为 ±1）","output":"predict(x)：单点类别预测；返回支持向量三元组","code":"import numpy as np\n\ndef kernel_perceptron(X, y, kernel='linear', n_iter=10, gamma=1.0):\n    n = len(X); alpha = np.zeros(n); sv = np.zeros(n, bool)\n    def K(a, b):\n        return np.exp(-gamma*np.sum((a-b)**2)) if kernel=='rbf' else a @ b\n    for _ in range(n_iter):\n        for i in range(n):\n            s = sum(alpha[j]*y[j]*K(X[j], X[i]) for j in range(n) if sv[j])\n            if y[i]*s <= 0:\n                alpha[i] += 1; sv[i] = True\n    def predict(x):\n        return np.sign(sum(alpha[j]*y[j]*K(X[j], x) for j in range(n) if sv[j]))\n    return predict, (X[sv], y[sv], alpha[sv])\n\n# 感知机核化版本，仅保留支持向量"},
  {"id":"perceptron","name":"感知机","en":"Perceptron","cat":"基础与线性模型","diff":"入门","summary":"最基础的二类线性分类器：误分类时沿梯度方向修正权重，线性可分数据必在有限步内收敛。","scenes":["线性可分二类","神经网络启蒙","在线学习入门"],"idea":["预测 ŷ = sign(wᵀx + b)","误分类时 w ← w + η·yᵢxᵢ,  b ← b + η·yᵢ","线性可分则保证收敛；否则靠 max_iter 上限停"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"误分类驱动的权重更新","formulas":["ŷ = sign(wᵀx + b)","若 yᵢ(wᵀxᵢ + b) ≤ 0： w ← w + η yᵢ xᵢ,  b ← b + η yᵢ","线性可分存在 R, γ 使 ‖w*‖ ≤ R,  误分类次数 ≤ (R/γ)²"],"steps":["感知机是单层神经元，没有隐藏层，只能学线性边界。","更新方向正好指向减小该样本误分类损失，是 SGD 的雏形。","代码 eta0 为学习率，tol 控制提前停止；数据需标准化。"],"tex":["\\hat{y} = \\text{sign}(w^{T}x + b)","y_i(w^{T}x_i + b) \\le 0 \\Rightarrow w \\leftarrow w + η y_i x_i,\\ b \\leftarrow b + η y_i","\\text{可分数据误分类次数} \\le (R/γ)^{2}"]},"params":[["eta0","float","1.0","初始学习率，正浮点数，常用 0.01–1.0。越大更新步长越大、收敛快但不稳；越小越稳但更慢。默认 1.0，无单位。"],["max_iter","int","1000","最大迭代轮数，正整数，默认 1000。数据线性不可分时不会收敛，靠此上限停止。"],["tol","float","1e-3","停止阈值（连续若干轮误差下降小于 tol 即停），正浮点数，默认 1e-3。越大越早停、越快但可能欠拟合。"]],"input":"X: array [n, d]；y: ±1 或 0/1（自动映射）","output":"model.predict(X)；model.coef_ / intercept_","code":"import numpy as np\nfrom sklearn.linear_model import Perceptron\nfrom sklearn.metrics import accuracy_score\n\ndef perceptron_fit(X, y, X_test, y_test=None, max_iter=1000):\n    model = Perceptron(max_iter=max_iter, eta0=1.0, random_state=42)\n    model.fit(X, y)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print('acc:', accuracy_score(y_test, pred))\n    return model, pred\n\n# 最早的两类线性分类器，误分类驱动权重更新"},
  {"id":"fisher-lda","name":"Fisher 判别分析 LDA","en":"Linear Discriminant Analysis","cat":"基础与线性模型","diff":"进阶","summary":"寻找使类间散度最大、类内散度最小的方向做监督降维与分类，高斯同协方差假设下即最优贝叶斯分类。","scenes":["监督降维可视化","二类/多类分类","特征压缩"],"idea":["定义类间散度 S_B 与类内散度 S_W","求使 tr(S_W⁻¹ S_B) 最大的投影方向 w","多类时取前 k−1 个广义特征向量"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"Fisher 准则与广义特征值","formulas":["S_B = Σ_c N_c (μ_c − μ)(μ_c − μ)ᵀ","S_W = Σ_c Σ_{x∈c} (x − μ_c)(x − μ_c)ᵀ","max_w  (wᵀ S_B w)/(wᵀ S_W w)  ⇒  S_W⁻¹ S_B w = λ w"],"steps":["Fisher 准则等价于最大化「类间/类内」散度比，投影后类别更可分。","解是 S_W⁻¹S_B 的广义特征向量，最多 k−1 个有效方向（k 为类别数）。","代码 n_components 受类别数限制；也常用于把高维数据压到 2D 可视化。"],"tex":["S_B = \\sum_c N_c(\\mu_c - \\mu)(\\mu_c - \\mu)^{T}","S_W = \\sum_c \\sum_{x\\in c}(x - \\mu_c)(x - \\mu_c)^{T}","S_W^{-1}S_B w = λ w,\\quad w = \\text{降维方向}"]},"params":[["n_components","int","None","降维后的维度（≤ 类别数−1），正整数或 None。None（默认）取 min(类别数−1, 特征数)；分类任务通常保留到 类别数−1。"],["solver","str","svd","求解器。svd（默认，不估协方差、最稳）、lsqr（支持收缩）、eigen（特征分解）。高维小样本优先 svd。"],["shrinkage","str/float","None","协方差收缩。None（默认，不收缩）、auto（Ledoit-Wolf 自动）或 0–1 浮点数。样本少、特征多时收缩能显著稳定估计。"]],"input":"X: array [n, d]；y: 类别标签","output":"model.transform(X) 降维；model.predict(X) 分类","code":"import numpy as np\nfrom sklearn.discriminant_analysis import LinearDiscriminantAnalysis\nfrom sklearn.metrics import accuracy_score\n\ndef lda_fit(X, y, X_test, y_test=None, n_comp=1):\n    model = LinearDiscriminantAnalysis(n_components=n_comp)\n    model.fit(X, y)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print('acc:', accuracy_score(y_test, pred))\n    return model, pred\n\n# 最大化类间/类内散度比，监督降维 + 分类"},
  {"id":"adaboost","name":"AdaBoost 自适应提升","en":"AdaBoost","cat":"树模型与集成学习","diff":"进阶","summary":"串行训练一连串弱分类器，每轮提高被错分样本权重，最终按精度加权投票；是最早成功实用的提升算法。","scenes":["二类分类","弱学习器提升","表格数据"],"idea":["样本权重 wᵢ 初始化为 1/n，每轮训练一个弱分类器 hₜ","根据错分率 εₜ 算 αₜ = ½ln((1−εₜ)/εₜ)，错分样本权重乘 e^{αₜ}","归一化权重后，预测取 sign(Σ αₜ hₜ(x))"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"权重更新与指数损失","formulas":["wᵢ ← wᵢ·e^{−αₜ yᵢ hₜ(xᵢ)}，再归一化使 Σw = 1","αₜ = ½ ln((1−εₜ)/εₜ)，其中 εₜ = Σ_{错分} wᵢ","最终 ŷ = sign( Σₜ αₜ hₜ(x) )"],"steps":["错分样本在下一轮被重点对待，模型逐步聚焦困难样本。","αₜ 让精度高的弱分类器话语权更大；εₜ>½ 时算法停止（弱学习器需略优于随机）。","代码 base_estimator 默认是深度 1 的决策树桩，learning_rate 收缩各 αₜ。"],"tex":["w_i \\leftarrow w_i e^{-\\alpha_t y_i h_t(x_i)},\\quad \\sum_i w_i = 1","\\alpha_t = \\frac{1}{2}\\ln\\frac{1-\\epsilon_t}{\\epsilon_t}","\\hat{y} = \\text{sign}\\left(\\sum_t \\alpha_t h_t(x)\\right)"]},"params":[["n_estimators","int","50","弱分类器数量，正整数，默认 50。越多集成越强，但过多会过拟合（对噪声敏感）。"],["learning_rate","float","1.0","每个弱分类器的权重缩放，约 0–1，默认 1.0。越小需越多轮、更稳；越大越快。"],["estimator","estimator","DecisionTree(1)","基学习器，默认深度 1 的决策树（决策 stump）。可换更深的树或其它分类器，但需支持样本权重。"]],"input":"X: array [n, d]；y: ±1","output":"model.predict(X)；model.estimator_weights_","code":"from sklearn.ensemble import AdaBoostClassifier\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.metrics import accuracy_score\n\ndef adaboost_fit(X, y, X_test, y_test=None, n=50, lr=1.0):\n    model = AdaBoostClassifier(\n        estimator=DecisionTreeClassifier(max_depth=1),\n        n_estimators=n, learning_rate=lr, random_state=42)\n    model.fit(X, y)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print('acc:', accuracy_score(y_test, pred))\n    return model, pred\n\n# 串行提升：每轮聚焦上一轮错分的样本"},
  {"id":"extra-trees","name":"极端随机森林 Extra Trees","en":"Extra Trees","cat":"树模型与集成学习","diff":"进阶","summary":"随机森林的变体：每棵树分裂时从随机特征子集中随机选阈值（而非搜索最优），方差更低、训练更快，代价是偏差略升。","scenes":["高维表格","训练速度优先","抗过拟合鲁棒"],"idea":["Bootstrap 之外，每个节点再从随机特征子集里随机取切分点","不搜索最优阈值，而是随机选，进一步打散树间相关性","预测仍用投票/平均"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"随机阈值 vs 最优阈值","formulas":["RF：节点在所有特征上找使不纯度下降最大的阈值","ET：在随机特征子集内均匀随机取阈值，再在其中选最优","树间相关性 ρ 更低 ⇒ 集成方差更小、训练更快"],"steps":["省去阈值搜索让单棵树训练极快，整体常比 RF 快。","随机性更强，单棵树偏差略高，但集成后方差收益更大。","代码接口与 RandomForest 几乎一致，max_features 同样控制随机性。"],"tex":["\\tau^{*}=\\argmax_{\\tau}\\Delta\\text{Gini}(S,\\tau)","\\tau_{k}\\sim\\mathcal U(\\min_{j}x_{j},\\ \\max_{j}x_{j}),\\ k=1\\ldots K","\\mathrm{Var}(\\hat h)=\\rho\\sigma^{2}+\\frac{(1-\\rho)\\sigma^{2}}{B}"]},"params":[["n_estimators","int","100","树数量，正整数，默认 100。越多方差越低越稳，但训练/预测越慢、收益递减。"],["max_features","str","sqrt","每次分裂考虑的特征数，sqrt（默认）等。越小越随机、降方差。"],["min_samples_leaf","int","1","叶最少样本数，正整数，默认 1。越大正则越强、抗噪。"]],"input":"X: array [n, d]；y: 标签","output":"model.predict(X)；feature_importances_","code":"from sklearn.ensemble import ExtraTreesClassifier\nfrom sklearn.metrics import classification_report\n\ndef et_fit(X, y, X_test, y_test, n=200):\n    model = ExtraTreesClassifier(\n        n_estimators=n, max_features='sqrt',\n        min_samples_leaf=2, n_jobs=-1, random_state=42)\n    model.fit(X, y)\n    print(classification_report(y_test, model.predict(X_test)))\n    return model\n\n# 随机阈值让训练更快、方差更低"},
  {"id":"bagging","name":"Bagging 自助聚合","en":"Bootstrap Aggregating","cat":"树模型与集成学习","diff":"入门","summary":"对训练集有放回抽样训练多个相互独立的基学习器再平均/投票，主要靠降低方差提升稳定性。","scenes":["高方差模型（决策树）","并行集成","通用集成基线"],"idea":["每轮 Bootstrap 有放回抽样得到子集，训练一个基学习器 h_b","回归取平均、分类取多数投票","约 36.8% 样本未进入某棵树，可作袋外(OOB)误差估计"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"方差缩减","formulas":["ĥ(x) = (1/B) Σ_b h_b(x)，分类：argmax_c Σ_b I(h_b(x)=c)","单模型方差 σ²、相关系数 ρ ⇒ Var(ĥ) = ρσ² + (1−ρ)σ²/B","OOB 样本比例 ≈ 1 − (1−1/n)ⁿ ≈ 1 − 1/e ≈ 36.8%"],"steps":["基学习器越独立、相关性 ρ 越低，集成方差下降越多。","Bagging 对高方差低偏差模型（如深决策树）最有效。","代码 oob_score=True 可直接用袋外样本评估泛化。"],"tex":["\\hat{h}(x) = \\frac{1}{B}\\sum_b h_b(x)","\\text{Var}(\\hat{h}) = \\rho\\sigma^{2} + \\frac{(1-\\rho)\\sigma^{2}}{B}","\\text{OOB} \\approx 1 - e^{-1}"]},"params":[["n_estimators","int","10","基学习器数量，正整数，默认 10。越多方差越低但耗时增加。"],["max_samples","float","1.0","每个基学习器自助采样的样本比例/数量，0–1 或整数，默认 1.0。越小基学习器差异越大、降方差但单模型更弱。"],["base_estimator","estimator","DecisionTree","基学习器类型，默认决策树。应选高方差低偏差模型（如深树）才能发挥 Bagging 优势。"]],"input":"X: array [n, d]；y: 标签","output":"model.predict(X)；oob_score_（若开启）","code":"from sklearn.ensemble import BaggingClassifier\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.metrics import accuracy_score\n\ndef bagging_fit(X, y, X_test, y_test, n=20):\n    model = BaggingClassifier(\n        estimator=DecisionTreeClassifier(), n_estimators=n,\n        oob_score=True, n_jobs=-1, random_state=42)\n    model.fit(X, y)\n    print('acc:', accuracy_score(y_test, model.predict(X_test)))\n    print('oob:', model.oob_score_)\n    return model\n\n# 自助抽样 + 聚合，主要降低方差"},
  {"id":"stacking","name":"Stacking 分层集成","en":"Stacking","cat":"树模型与集成学习","diff":"高难","summary":"用基学习器的预测结果作为元学习器的输入特征，由元模型学习如何最优地组合它们，是竞赛常用高阶融合。","scenes":["竞赛高阶融合","异质模型组合","追求泛化上限"],"idea":["基模型在训练集做交叉验证产生 out-of-fold 预测，作为新特征 Z","元模型在这些新特征 Z 上训练，目标仍是 y","预测时基模型先预测，结果喂给元模型得到最终输出"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"两级学习","formulas":["Z_i^{(k)} = h_k^{(-i)}(x_i)（基模型 k 对 i 的 OOF 预测）","元模型 f_meta 在 (Z, y) 上训练","最终 ŷ = f_meta( h₁(x), …, h_K(x) )"],"steps":["用 OOF 预测而非训练集预测，避免元模型记住基模型的训练误差（数据泄漏）。","基模型应尽量异构（树、线性、NN）以互补。","代码 final_estimator 即元模型，cv 控制 OOF 折数。"],"tex":["Z^{(k)}_{i} = h_k^{(-i)}(x_i)","f_{meta}: (Z, y) \\mapsto \\hat{y}","\\hat{y} = f_{meta}(h_1(x), \\ldots, h_K(x))"]},"params":[["estimators","list","—","第一层基学习器列表（多个不同模型）。越多样、越互补，集成上限越高。"],["final_estimator","estimator","LogisticReg","第二层元学习器，默认逻辑回归。以第一层的交叉验证预测为输入学习如何组合；简单模型可防过拟合。"],["cv","int","5","生成元特征的交叉验证折数，正整数，默认 5。折数越多元特征越可靠但越慢。"]],"input":"X: array [n, d]；y: 标签","output":"model.predict(X)；predict_proba 可用","code":"from sklearn.ensemble import StackingClassifier\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.svm import SVC\nfrom sklearn.metrics import accuracy_score\n\ndef stacking_fit(X, y, X_test, y_test):\n    model = StackingClassifier(\n        estimators=[('tree', DecisionTreeClassifier(max_depth=4)),\n                    ('svm', SVC(probability=True))],\n        final_estimator=LogisticRegression(),\n        cv=5, n_jobs=-1)\n    model.fit(X, y)\n    print('acc:', accuracy_score(y_test, model.predict(X_test)))\n    return model\n\n# 基模型 OOF 预测作元模型特征"},
  {"id":"blending","name":"Blending 混合集成","en":"Blending","cat":"树模型与集成学习","diff":"进阶","summary":"Stacking 的简化：把训练集按固定比例拆成训练份与留出份，基模型在训练份预测、元模型在留出份学习，省去交叉验证。","scenes":["快速融合","小数据防泄漏","竞赛实践"],"idea":["数据集拆成 A（训基模型）与 B（训元模型）两份","基模型在 A 上训练后预测 B，得到元特征 Z_B","元模型用 (Z_B, y_B) 训练；测试时基模型预测喂给元模型"],"deps":"scikit-learn 1.4 / NumPy","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"留出式两级融合","formulas":["A 训基模型 → 预测 B 得 Z_B","元模型 f_meta 在 (Z_B, y_B) 上训练","最终 ŷ = f_meta( h₁(x), …, h_K(x) )"],"steps":["相比 Stacking 用全部数据做 OOF，Blending 只用一份留出，更快更省。","代价是训练数据变少、元模型见到的样本有限，数据极小时易过拟合留出份。","holdout_ratio 控制拆分比例（如 0.2 留作元模型训练）。"],"tex":["Z_B = h(A\\_trained).predict(B)","f_{meta}: (Z_B, y_B) \\mapsto \\hat{y}","\\hat{y} = f_{meta}(h_1(x), \\ldots, h_K(x))"]},"params":[["holdout_ratio","float","0.2","留出集比例，0–1，默认 0.2。基学习器在其余数据训练、用留出集预测来训练元学习器；比例越大元特征越可靠但基模型训练数据越少。"],["base_estimators","list","—","第一层基学习器列表。同 Stacking，越多样越好。"],["meta_estimator","estimator","LogisticReg","元学习器，默认逻辑回归。在留出集预测上学习组合方式。"]],"input":"X: array [n, d]；y: 标签","output":"blended 预测 ŷ","code":"import numpy as np\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier\n\ndef blending_fit(X, y, X_test, y_test, holdout=0.2):\n    n = len(X); k = int(n*(1-holdout))\n    Xa, Ya, Xb, Yb = X[:k], y[:k], X[k:], y[k:]\n    b1 = RandomForestClassifier(n_estimators=100).fit(Xa, Ya)\n    b2 = GradientBoostingClassifier().fit(Xa, Ya)\n    Zb = np.column_stack([b1.predict_proba(Xb)[:,1], b2.predict_proba(Xb)[:,1]])\n    meta = LogisticRegression().fit(Zb, Yb)\n    Zt = np.column_stack([b1.predict_proba(X_test)[:,1], b2.predict_proba(X_test)[:,1]])\n    return meta.predict(Zt)\n\n# 比 Stacking 更快，但训练样本略少"},
  {"id":"voting","name":"Voting 投票集成","en":"Voting Ensemble","cat":"树模型与集成学习","diff":"入门","summary":"多个基学习器直接投票或平均：硬投票取多数类、软投票取预测概率均值，简单且常能提升稳定性。","scenes":["异构模型融合","快速集成","稳健 baseline"],"idea":["训练多个不同基模型（如树、SVM、逻辑回归）","硬投票：ŷ = argmax_c Σ_b I(h_b(x)=c)","软投票：ŷ = argmax_c (1/B)Σ_b p_b(c)，可设权重"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"硬投票与软投票","formulas":["硬投票： ŷ = argmax_c Σ_b I(h_b(x) = c)","软投票： ŷ = argmax_c (1/B) Σ_b p_b(c)","加权软投票： (1/B)Σ_b w_b p_b(c)，Σw_b = B"],"steps":["软投票通常优于硬投票，因为它利用了概率置信度信息。","基模型间相关性越低，投票带来的提升越大。","代码 voting='soft' 需各基模型支持 predict_proba。"],"tex":["\\hat{y}_{hard} = \\arg\\max_c \\sum_b I(h_b(x)=c)","\\hat{y}_{soft} = \\arg\\max_c \\frac{1}{B}\\sum_b p_b(c)","w\\text{-soft}: \\arg\\max_c \\sum_b w_b p_b(c)"]},"params":[["estimators","list","—","参与投票的模型列表。适合多个性能相近、错误互补的模型。"],["voting","str","hard","hard（默认，多数类标投票）、soft（用预测概率加权平均，通常更优但需各模型支持 predict_proba）。"],["weights","list","None","各模型权重列表，None（默认）等权。给更可靠的模型更大权重可提升效果。"]],"input":"X: array [n, d]；y: 标签","output":"model.predict(X)；predict_proba（软投票）","code":"from sklearn.ensemble import VotingClassifier\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.svm import SVC\nfrom sklearn.metrics import accuracy_score\n\ndef voting_fit(X, y, X_test, y_test):\n    model = VotingClassifier(\n        estimators=[('tree', DecisionTreeClassifier(max_depth=4)),\n                    ('lr', LogisticRegression()),\n                    ('svm', SVC(probability=True))],\n        voting='soft')\n    model.fit(X, y)\n    print('acc:', accuracy_score(y_test, model.predict(X_test)))\n    return model\n\n# 多模型直接投票/平均，简单稳 baseline"},
  {"id":"averaging","name":"模型平均 Averaging","en":"Model Averaging","cat":"树模型与集成学习","diff":"入门","summary":"对多个模型的回归值或概率输出直接取平均，靠模型间独立性降低方差、提升鲁棒性，是深度学习集成常用手段。","scenes":["回归集成","多模型稳输出","深度学习集成"],"idea":["训练 M 个同构或异构模型 f₁…f_M","预测 ŷ = (1/M) Σ_m f_m(x)","可对不同的初始化、数据子集或结构取平均"],"deps":"NumPy / scikit-learn","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"均值集成降低方差","formulas":["ŷ = (1/M) Σ_m f_m(x)","若模型误差独立同方差 σ² ⇒ Var(ŷ) = σ²/M","加权平均： ŷ = Σ_m w_m f_m(x)，Σw_m = 1"],"steps":["平均对回归和概率输出都适用，是 Kaggle 常见提分技巧。","模型越独立（不同种子/结构/数据），平均收益越大。","深度学习中常用多个 checkpoint 或多次训练取平均。"],"tex":["\\hat{y} = \\frac{1}{M}\\sum_{m=1}^{M} f_m(x)","\\text{Var}(\\hat{y}) = \\frac{\\sigma^{2}}{M}\\ (\\text{独立})","w\\text{-avg}: \\hat{y} = \\sum_m w_m f_m(x)"]},"params":[["models","list","—","参与平均的模型列表（通常为回归器），至少两个。模型越多样、误差越互补，平均效果越好。"],["weights","list","None","各模型权重，None（默认）等权平均。按验证表现分配权重可提升效果。"]],"input":"probas: [n_models, n_samples, n_classes]（分类，各模型 output_proba）\npreds: [n_models, n_samples]（回归，各模型 predict）","output":"ŷ: [n_samples, n_classes]（概率平均 / 软投票）或 [n_samples]（回归均值）","code":"import numpy as np\n\ndef average_predict(models, x, weights=None):\n    preds = [m.predict(x) for m in models]\n    preds = np.stack(preds, axis=0)\n    if weights is None:\n        return preds.mean(axis=0)\n    w = np.array(weights)[:, None]\n    return (preds * w).sum(axis=0) / w.sum()\n\n# 多个模型预测直接平均，降低方差"},
  {"id":"tsne","name":"t-SNE 可视化降维","en":"t-SNE","cat":"无监督与降维","diff":"进阶","summary":"非线性降维：把高维相似度转成条件概率，再用 KL 散度最小化高低维分布差异，擅长把簇聚成清晰的可视团块。","scenes":["高维可视化","聚类前探索","流形结构展示"],"idea":["高维用高斯条件概率 p_{j|i} 刻画邻居关系","低维用学生 t 分布 q_{ij}（长尾缓解拥挤问题）","梯度下降最小化 Σ KL(P_i‖Q_i)，perplexity 控制邻域大小"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"条件概率与 KL 散度","formulas":["p_{j|i} = exp(−‖x_i−x_j‖²/2σ_i²) / Σ_k exp(−‖x_i−x_k‖²/2σ_i²)","q_{ij} = (1+‖y_i−y_j‖²)^{−1} / Σ_{k≠l}(1+‖y_k−y_l‖²)^{−1}  （学生 t）","目标 C = Σ_i KL(P_i ‖ Q_i)"],"steps":["低维用 t 分布而非高斯，使中等距离的点被推得更开，缓解高维映射到低维的拥挤。","perplexity 近似近邻数，太小噪声大、太大忽略局部结构。","t-SNE 只适合可视化，距离与密度不具全局可比性。"],"tex":["p_{j|i} = \\frac{\\exp(-\\|x_i-x_j\\|^2/2\\sigma_i^2)}{\\sum_k \\exp(-\\|x_i-x_k\\|^2/2\\sigma_i^2)}","q_{ij} = \\frac{(1+\\|y_i-y_j\\|^2)^{-1}}{\\sum_{k\\neq l}(1+\\|y_k-y_l\\|^2)^{-1}}","C = \\sum_i KL(P_i\\|Q_i)"]},"params":[["n_components","int","2","嵌入维度，正整数，默认 2（可视化常用 2 或 3）。"],["perplexity","float","30","困惑度，正浮点数，约 5–50，默认 30。近似每点的有效邻居数；过小簇碎、过大趋同；建议小于样本数。"],["learning_rate","float","200","学习率，正浮点数，默认 200。太大易发散、太小易陷入局部最优；常用 10–1000。"]],"input":"标准化后的 X: array [n, d]","output":"Z: array [n, 2] 低维坐标","code":"import numpy as np\nfrom sklearn.manifold import TSNE\nfrom sklearn.preprocessing import StandardScaler\n\ndef tsne_vis(X, n=2, perplexity=30):\n    Xs = StandardScaler().fit_transform(X)\n    Z = TSNE(n_components=n, perplexity=perplexity,\n             init='pca', random_state=42).fit_transform(Xs)\n    return Z\n\n# Z = tsne_vis(X); plt.scatter(Z[:,0], Z[:,1])"},
  {"id":"nmf","name":"NMF 非负矩阵分解","en":"Non-negative Matrix Factorization","cat":"无监督与降维","diff":"进阶","summary":"把非负矩阵 V 分解为两个非负矩阵 W·H，列可解释为基特征与组合系数，常用于图像与文本主题提取。","scenes":["图像特征学习","文本主题","推荐分解"],"idea":["最小化 ‖V − WH‖²（或广义 KL 散度）","用乘性更新保持 W、H 非负","k 为成分数，越小越抽象"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"乘性更新规则","formulas":["V ≈ W H，V∈R^{m×n}_+, W∈R^{m×k}_+, H∈R^{k×n}_+","L = ‖V − WH‖_F²","W ← W⊙(VHᵀ)/(WHHᵀ)，H ← H⊙(WᵀV)/(WᵀWH)"],"steps":["非负约束让分解有加性可解释性（如图像部件、主题词）。","与 PCA 不同，NMF 不要求正交，结果更局部化。","k 需事先给定，常用轮廓系数或业务可解释性选择。"],"tex":["V \\approx WH,\\quad V,W,H \\ge 0","L = \\|V - WH\\|_F^{2}","W \\leftarrow W \\odot \\frac{VH^T}{WHH^T},\\quad H \\leftarrow H \\odot \\frac{W^TV}{W^TWH}"]},"params":[["n_components","int","2","潜在主题/成分个数，正整数，默认 2。越多重建越好但可解释性下降、易过拟合。"],["init","str","nndsvda","初始化方式。nndsvda（默认）、random、nndsvd 等。nndsvd 系更稳、收敛更快。"],["max_iter","int","200","最大迭代次数，正整数，默认 200。过小可能未收敛。"]],"input":"非负 X: array [m, n]（如词频矩阵）","output":"W (基), H (系数)；model.transform 得新样本表示","code":"import numpy as np\nfrom sklearn.decomposition import NMF\n\ndef nmf_fit(V, k=3, max_iter=300):\n    model = NMF(n_components=k, init='nndsvda', max_iter=max_iter, random_state=42)\n    W = model.fit_transform(V)\n    H = model.components_\n    return W, H\n\n# V = 词频矩阵; W, H = nmf_fit(V, k=5)"},
  {"id":"lda-topic","name":"LDA 主题模型","en":"Latent Dirichlet Allocation","cat":"无监督与降维","diff":"高难","summary":"生成式概率模型：每篇文档是若干主题的混合，每个主题是词的概率分布；用变分推断或吉布斯采样估计后验。","scenes":["文本主题挖掘","文档聚类","内容标签生成"],"idea":["先验 Dirichlet(α) 给出文档的主题分布 θ，β 给出主题词分布 φ","生成每个词：先抽主题 z，再按 φ_z 抽词 w","推断文档-主题分布 θ 与主题-词分布 φ"],"deps":"scikit-learn 1.4 / gensim","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"生成过程与后验","formulas":["文档 d：θ_d ~ Dirichlet(α)；主题 k：φ_k ~ Dirichlet(β)","词 w：z ~ Mult(θ_d)，w ~ Mult(φ_z)","后验 p(z, w | α, β) 用变分推断 / 吉布斯采样近似"],"steps":["LDA 是『词袋』模型，不考虑词序，适合大规模语料的主题概览。","α 小→每篇文档主题更集中；β 小→每个主题词更聚焦。","scikit-learn 用变分 EM；gensim 常用吉布斯采样，可处理超大语料。"],"tex":["\\theta_d \\sim \\text{Dir}(\\alpha),\\quad \\phi_k \\sim \\text{Dir}(\\beta)","z_{di} \\sim \\text{Mult}(\\theta_d),\\quad w_{di} \\sim \\text{Mult}(\\phi_{z_{di}})","p(z,w\\mid \\alpha,\\beta) = \\prod_d \\frac{1}{B(\\alpha)}\\int \\theta_d^{\\alpha+\\text{count}} d\\theta_d"]},"params":[["n_components","int","10","主题数，正整数，默认 10。过少主题混杂、过多主题碎片化；可用困惑度或主题一致性调参。"],["max_iter","int","10","最大迭代轮数，正整数，默认 10。越多拟合越充分但越慢。"],["learning_method","str","online","学习方式。online（默认，小批量、适合大数据）、batch（全量、更精确）。"]],"input":"文档-词频矩阵 X: array [n_docs, n_vocab]","output":"model.transform(X)：每篇文档的主题分布","code":"import numpy as np\nfrom sklearn.decomposition import LatentDirichletAllocation\n\ndef lda_fit(counts, k=10):\n    model = LatentDirichletAllocation(n_components=k, max_iter=10,\n                                     learning_method='online', random_state=42)\n    doc_topic = model.fit_transform(counts)\n    return doc_topic, model.components_  # 主题-词分布\n\n# counts = 词频矩阵; dt, comp = lda_fit(counts, k=10)"},
  {"id":"lle","name":"LLE 局部线性嵌入","en":"Locally Linear Embedding","cat":"无监督与降维","diff":"进阶","summary":"流形学习：假设每个点可由其近邻线性重构，在低维保持该重构权重不变，从而保留局部几何结构。","scenes":["流形降维","局部结构保持","非线性可视化"],"idea":["每点找 k 近邻，求最小化重构误差的权重 W（约束 ΣW=1）","固定 W，在低维求坐标 Y 使重构误差最小（YYᵀ=I 约束）","只依赖局部邻域，能『展开』弯曲流形"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"重构权重守恒","formulas":["W = argmin_W Σ_i ‖x_i − Σ_j W_ij x_j‖²  s.t. Σ_j W_ij = 1","Y = argmin_Y Σ_i ‖y_i − Σ_j W_ij y_j‖²  s.t. YYᵀ = I","等价于求 (I−W)ᵀ(I−W) 最小的 d 个非零特征向量"],"steps":["LLE 关注局部线性重构而非全局距离，因此能展开 S 形等流形。","近邻数 k 是关键：太小受噪声主导，太大破坏局部性。","对噪声与邻域选择敏感，实践中常与 PCA 预降噪配合使用。"],"tex":["W = \\arg\\min_W \\sum_i \\|x_i - \\sum_j W_{ij}x_j\\|^2,\\ \\sum_j W_{ij}=1","Y = \\arg\\min_Y \\sum_i \\|y_i - \\sum_j W_{ij}y_j\\|^2,\\ YY^T=I","(I-W)^{T}(I-W)Y=\\lambda Y,\\quad Y=[v_{2},\\dots,v_{d+1}]"]},"params":[["n_components","int","2","降维后的目标维度，正整数，默认 2（须小于样本数）；越大保留信息越多但降维力度越小。"],["n_neighbors","int","5","构造局部邻域的邻居数，正整数，默认 5。过小不稳定、过大丢失局部结构。"],["reg","float","1e-3","正则化系数，正浮点数，默认 1e-3。提升局部协方差求逆的数值稳定性。"]],"input":"X: array [n, d]","output":"Z: array [n, k] 低维嵌入","code":"import numpy as np\nfrom sklearn.manifold import LocallyLinearEmbedding\nfrom sklearn.preprocessing import StandardScaler\n\ndef lle_fit(X, k=2, nbrs=5):\n    Xs = StandardScaler().fit_transform(X)\n    Z = LocallyLinearEmbedding(n_components=k, n_neighbors=nbrs,\n                              method='standard').fit_transform(Xs)\n    return Z\n\n# Z = lle_fit(X, k=2, nbrs=10)"},
  {"id":"kernel-pca","name":"核 PCA","en":"Kernel PCA","cat":"无监督与降维","diff":"进阶","summary":"用核技巧把 PCA 推广到非线性：在隐式高维特征空间做 PCA，通过核矩阵的特征值分解实现，无需显式映射。","scenes":["非线性降维","核方法预处理","特征提取"],"idea":["用核 k(x_i,x_j)=Φ(x_i)ᵀΦ(x_j) 构造核矩阵 K","中心化核矩阵 K̃（减去行/列均值）","对 K̃ 做特征分解，取前 k 大特征值对应向量作投影"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"核矩阵特征分解","formulas":["K_ij = k(x_i, x_j) = Φ(x_i)ᵀ Φ(x_j)","中心化 K̃ = K − 1_n K − K 1_n + 1_n K 1_n，1_n 为全 1/n 矩阵","取 K̃ 前 k 大特征值对应特征向量，投影 = 归一化后的分量"],"steps":["非线性核让 PCA 能捕捉弧形、环形等结构（标准 PCA 只能做线性投影）。","中心化是必须的，否则第一主成分会偏向数据均值。","代码里 fit_transform 直接给低维坐标，新样本用 transform 核映射。"],"tex":["K_{ij} = k(x_i,x_j) = \\Phi(x_i)^T\\Phi(x_j)","\\tilde{K} = K - 1_n K - K 1_n + 1_n K 1_n","Y = \\text{top-k eigenvec}(\\tilde{K})"]},"params":[["n_components","int","2","保留的主成分数，正整数，默认 2；越大保留信息越多但降维力度越小。"],["kernel","str","rbf","核函数，rbf（默认）、poly、linear 等。非线性结构用 rbf。"],["gamma","float","None","rbf 核系数，正浮点数或 None。None（默认）取 1/特征数；越大越局部、易过拟合。"]],"input":"X: array [n, d]","output":"Z: array [n, k] 非线性主成分","code":"import numpy as np\nfrom sklearn.decomposition import KernelPCA\n\ndef kpca_fit(X, k=2, kernel='rbf', gamma=10):\n    model = KernelPCA(n_components=k, kernel=kernel, gamma=gamma,\n                     fit_inverse_transform=True, random_state=42)\n    Z = model.fit_transform(X)\n    return Z\n\n# Z = kpca_fit(X, k=2, kernel='rbf')"},
  {"id":"nca","name":"NCA 近邻成分分析","en":"Neighbourhood Components Analysis","cat":"无监督与降维","diff":"高难","summary":"度量学习：学习一个线性变换，使在该空间中 KNN 的留一训练准确率最高，等价于最大化近邻正确分类的概率。","scenes":["度量学习","降维 + 分类","特征变换"],"idea":["把变换写成 P = AᵀA，距离在 A 空间中计算","定义 p_ij 为 j 成为 i 的近邻的 softmax 概率","最大化 Σ_i Σ_{j∈同类} p_ij，梯度上升更新 A"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"概率近邻与最大化","formulas":["p_ij = exp(−‖Ax_i−Ax_j‖²) / Σ_{k≠i} exp(−‖Ax_i−Ax_k‖²)","目标 max Σ_i Σ_{j∈C(i)} p_ij，C(i) 为与 i 同类的样本","梯度上升更新 A，P = AᵀA 即所学度量"],"steps":["NCA 直接优化 KNN 关心的近邻关系，比 PCA 这类无监督降维更贴分类。","学到的 A 既可用于降维也可直接作为距离度量。","对噪声标签较敏感，需配合交叉验证选维度。"],"tex":["p_{ij} = \\frac{e^{-\\|Ax_i-Ax_j\\|^2}}{\\sum_{k\\neq i} e^{-\\|Ax_i-Ax_k\\|^2}}","\\max \\sum_i \\sum_{j\\in C_i} p_{ij}","\\text{梯度上升更新 }A,\\quad P=A^{\\top}A\\text{ 即所学度量}"]},"params":[["n_components","int","None","学习到的线性投影维度，正整数或 None。None（默认）保持原维数。"],["max_iter","int","50","最大迭代次数，正整数，默认 50。越多越充分但越慢。"],["tol","float","1e-5","收敛阈值，正浮点数，默认 1e-5。越小越精确但迭代更久。"]],"input":"X: array [n, d]；y: 标签","output":"model.transform(X)：变换后坐标；A 即度量","code":"import numpy as np\nfrom sklearn.neighbors import NeighborhoodComponentsAnalysis\nfrom sklearn.neighbors import KNeighborsClassifier\n\ndef nca_fit(X, y, X_test, n_comp=None):\n    nca = NeighborhoodComponentsAnalysis(n_components=n_comp, random_state=42)\n    nca.fit(X, y)\n    Z = nca.transform(X_test)\n    return Z, nca.components_\n\n# 学完度量后接 KNN 效果通常更好"},
  {"id":"isolation-forest","name":"孤立森林 Isolation Forest","en":"Isolation Forest","cat":"无监督与降维","diff":"进阶","summary":"异常检测：随机划分特征构造多棵孤立树，异常点因易被少数切分孤立而路径更短；用平均路径长度判异常。","scenes":["异常检测","欺诈 / 入侵识别","无标签离群点"],"idea":["每棵树随机选特征与切分点递归划分","样本落到叶子所需的分裂次数即路径长度 h(x)","异常点路径短 → 异常分数接近 1"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"异常分数","formulas":["s(x,n) = 2^{−E[h(x)]/c(n)}，E[h(x)] 为平均路径长度","c(n) = 2H(n−1) − 2(n−1)/n 为归一化项，H 为调和数","s 接近 1 ⇒ 异常；接近 0.5 ⇒ 正常"],"steps":["正常样本需要更多随机切分才能孤立，因此路径长、分数低。","子采样训练每棵树，既提速又增强随机性。","contamination 设定异常比例阈值，决定 decision_function 的切分点。"],"tex":["s(x,n) = 2^{-\\frac{\\mathbb{E}[h(x)]}{c(n)}}","c(n) = 2H(n-1) - \\frac{2(n-1)}{n}","s\\to 1\\Rightarrow\\text{异常};\\quad s\\to 0.5\\Rightarrow\\text{正常}"]},"params":[["n_estimators","int","100","孤立树数量，正整数，默认 100。越多越稳越慢。"],["contamination","float/str","auto","异常点比例先验，0–0.5 或 auto，默认 auto。决定判定阈值；越大被判为异常的点越多。"],["max_samples","int/float","256","每棵树采样样本数，整数或比例，默认 256。越大越稳但越慢。"]],"input":"X: array [n, d]（无需标签）","output":"model.predict(X)：−1 异常 / 1 正常；score_samples 异常分","code":"import numpy as np\nfrom sklearn.ensemble import IsolationForest\n\ndef iso_fit(X, contamination='auto'):\n    model = IsolationForest(n_estimators=200, contamination=contamination,\n                           random_state=42)\n    model.fit(X)\n    labels = model.predict(X)        # -1 异常, 1 正常\n    scores = -model.score_samples(X) # 越大越异常\n    return labels, scores\n\n# lab, sc = iso_fit(X)"},
  {"id":"one-class-svm","name":"单类 SVM（新颖性检测）","en":"One-Class SVM","cat":"无监督与降维","diff":"高难","summary":"单类异常检测：在高维特征空间学习一个包围正常样本的边界（超球面或超平面），边界外的点判为异常，适合只有正常样本的场景。","scenes":["单类异常检测","新颖性检测","无负样本"],"idea":["用核把样本映射到高维，求最小体积包围球（SVDD）或分离超平面（ν-SVM）","ν 控制支持向量（边界）比例的上界，即异常比例上限","决策函数 > 0 为正常域，< 0 为异常"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"最小体积包围球 (SVDD)","formulas":["min R² + (1/(νn)) Σ ξ_i   s.t. ‖φ(x_i) − a‖² ≤ R² + ξ_i","KKT 条件给出 a = Σ α_i φ(x_i)，对偶式只含核 K(x_i,x_j)","ν 是支持向量比例的下界、误分（ξ>0）比例的上界"],"steps":["与二分类 SVM 不同，这里只需正常样本即可训练一个『正常域』。","ν 是异常比例先验，过大边界会过松、过小则欠拟合正常样本。","核与 γ 决定边界形状，需交叉验证调。"],"tex":["\\min_{R,a} R^2 + \\frac{1}{\\nu n}\\sum_i \\xi_i,\\quad \\|\\phi(x_i)-a\\|^2 \\le R^2+\\xi_i","KKT \\Rightarrow a = \\sum \\alpha_i \\phi(x_i)","\\frac{\\#\\{i:\\alpha_{i}>0\\}}{n}\\ \\ge\\ \\nu\\ \\ge\\ \\frac{\\#\\{i:\\xi_{i}>0\\}}{n}"]},"params":[["nu","float","0.1","上界/下界参数，0–1，默认 0.1。近似异常比例上限与支持向量比例下限；越大边界越紧、异常判定越激进。"],["kernel","str","rbf","核函数，rbf（默认）、poly、linear、sigmoid。"],["gamma","float/str","scale","核系数，正浮点数或 scale，默认 scale。越大边界越贴合训练数据、易过拟合。"]],"input":"X_train: array [n, d]（仅正常样本）","output":"model.predict(X)：+1 正常 / −1 异常","code":"import numpy as np\nfrom sklearn.svm import OneClassSVM\n\ndef ocsvm_fit(X_normal, X_test, nu=0.1, gamma='scale'):\n    model = OneClassSVM(nu=nu, kernel='rbf', gamma=gamma)\n    model.fit(X_normal)\n    return model.predict(X_test)   # +1 normal, -1 anomaly\n\n# only normal samples for training: pred = ocsvm_fit(X_train, X_test)"},
  {"id":"mean-shift","name":"均值漂移 Mean Shift","en":"Mean Shift","cat":"无监督与降维","diff":"进阶","summary":"无参数密度聚类：从每点沿核密度梯度上移，收敛到最近的模式（密度峰），自然形成任意形状的簇，无需指定簇数。","scenes":["图像分割","任意形状簇","无需预设 K"],"idea":["每点用核加权均值更新位置","迭代 x ← m(x) 直至收敛到密度峰","相近收敛点归为一个簇；带宽 h 是关键"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"核密度梯度上升","formulas":["m(x) = Σ_i g(‖(x−x_i)/h‖) x_i / Σ_i g(‖(x−x_i)/h‖)","x ← m(x) 直至不动点（密度峰）","h 大 → 少簇；h 小 → 多簇"],"steps":["均值漂移沿核密度梯度爬升，自然停在局部极大。","带宽 h 对结果极敏感，常用分位数法（如最近邻距离）估计。","QUIC 变体用树加速邻域查询，适合较大数据。"],"tex":["m(x) = \\frac{\\sum_i g(\\|(x-x_i)/h\\|) x_i}{\\sum_i g(\\|(x-x_i)/h\\|)}","x \\leftarrow m(x)\\ \\text{until fixed point}","h\\uparrow\\Rightarrow\\text{少簇};\\quad h\\downarrow\\Rightarrow\\text{多簇}"]},"params":[["bandwidth","float","None","核带宽，正浮点数或 None。None（默认）由数据自动估计；越大簇越少越粗、越小簇越多越细，是最关键参数。"],["bin_seeding","bool","False","是否用分箱种子加速初始化。true 提速但可能略降精度；false（默认）更精确。"],["max_iter","int","300","单个样本均值漂移的迭代上限，正整数，默认 300；过小可能未收敛到众数。"]],"input":"X: array [n, d]","output":"labels: array [n]；cluster_centers_ 密度峰","code":"import numpy as np\nfrom sklearn.cluster import MeanShift, estimate_bandwidth\n\ndef mean_shift_fit(X):\n    bw = estimate_bandwidth(X, quantile=0.2)\n    model = MeanShift(bandwidth=bw, bin_seeding=True).fit(X)\n    return model.labels_, model.cluster_centers_\n\n# lab, centers = mean_shift_fit(X)"},
  {"id":"incremental-clustering","name":"增量聚类（CF 树 / BIRCH）","en":"Incremental Clustering (BIRCH)","cat":"无监督与降维","diff":"高难","summary":"用紧凑的 CF 树增量吸收数据流，把样本聚成子簇摘要，再对子簇中心做全局聚类，适合无法一次载入内存的大规模数据。","scenes":["流式数据","大规模聚类","内存受限场景"],"idea":["CF 树把样本聚成紧凑子簇，只存线性统计 (n, Σx, Σxᵀx)","新样本沿树插入，超出半径阈值则分裂节点","二阶段：对 CF 叶子节点中心再做一次 K-Means"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"聚类特征 CF 与距离","formulas":["CF = (n, LS, SS)，LS = Σx，SS = Σxᵀx","子簇间距离用半径/直径判可达性（D₂ 距离）","CF 可加：CF₁ + CF₂ = (n₁+n₂, LS₁+LS₂, SS₁+SS₂)"],"steps":["CF 树只存子簇摘要，因此内存占用与数据规模几乎无关。","threshold 控制子簇粒度，越大子簇越少、越粗。","BIRCH 常用于数据太大无法放入内存时的预处理聚类。","子簇半径超过 threshold 就分裂，叶子上的子簇最后再交给全局聚类细化。"],"tex":["CF = (n,\\ \\sum x,\\ \\sum x^T x)","d_2(CF_1,CF_2) = \\sqrt{SS_1/n_1 + SS_2/n_2 - 2\\,LS_1^T LS_2/(n_1 n_2)}","CF_{1}+CF_{2}=(n_{1}+n_{2},\\ LS_{1}+LS_{2},\\ SS_{1}+SS_{2})"]},"params":[["threshold","float","0.5","CF 子簇的半径阈值，正浮点数，默认 0.5。越小子簇越细越多；越大越粗。"],["branching_factor","int","50","每个 CF 节点的最大子节点数，正整数，默认 50。越大树越宽、内存越多、精度越高。"],["n_clusters","int","3","最终聚类数，正整数或 None，默认 3。指定后对 CF 叶再聚一次。"]],"input":"X: array [n, d]（可分批 partial_fit）","output":"labels: array [n]；subcluster_centers_ 子簇中心","code":"import numpy as np\nfrom sklearn.cluster import Birch\n\ndef birch_fit(X, threshold=0.5, k=3):\n    model = Birch(threshold=threshold, n_clusters=k)\n    model.fit(X)\n    return model.predict(X), model.subcluster_centers_\n\n# lab, centers = birch_fit(X)"},
  {"id":"k-armed-bandit","name":"K-摇臂赌博机","en":"K-Armed Bandit","cat":"强化学习","diff":"入门","summary":"在只回报不确定奖励的多臂场景里权衡探索与利用，是强化学习的零状态特例，也是 ε-Greedy、UCB 等策略的发源地。","scenes":["A/B 测试","推荐冷启动","探索利用权衡"],"idea":["每个摇臂是一个动作，拉动后得到一个随机奖励，目标最大化累计回报","维护每个动作的期望奖励估计 Q(a) 与选择次数 N(a)","用 ε-Greedy 或 UCB 在「试新臂」与「吃已知高回报」间取舍"],"deps":"NumPy 1.26","updated":"2026-11-14","lang":"Python 3 · NumPy","math":{"title":"增量更新与 ε-Greedy 选择","formulas":["Q(a) ← Q(a) + (1/N(a))·(r − Q(a))","π(a) = { 随机动作 概率 ε ;  argmax_a Q(a) 概率 1−ε }"],"steps":["每步以概率 ε 随机探索，否则贪心选当前估计最高的臂，得到奖励 r。","用增量式平均把 Q(a) 朝观测奖励拉近：N(a) 每选一次加 1，步长 1/N(a)。","ε 衰减可让早期多探索、后期多利用；UCB 则显式加一项 √(ln t / N(a)) 鼓励欠试探的臂。"],"tex":["Q(a)\\leftarrow Q(a)+\\frac{1}{N(a)}\\bigl(r-Q(a)\\bigr)","\\pi(a)=\\begin{cases}\\text{random},&p=\\varepsilon\\\\\\arg\\max_{a}Q(a),&p=1-\\varepsilon\\end{cases}"]},"params":[["k","int","10","摇臂（动作）数量，正整数，默认 10。越多探索成本越高。"],["eps","float","0.1","探索概率，0–1，默认 0.1。越大越常随机试新臂、探索充分但短期收益低；越小越贪心。"],["steps","int","2000","总交互步数，正整数，默认 2000。越多价值估计越准。"]],"input":"k: int 摇臂数\neps: float 探索率\nsteps: int 迭代步数","output":"Q: np.ndarray 各臂估计值\nrewards: list 每步奖励","code":"import numpy as np\n\ndef bandit(k=10, eps=0.1, steps=2000):\n    q_true = np.random.randn(k)          # 真实奖励均值\n    Q = np.zeros(k); N = np.zeros(k)\n    rewards = []\n    for t in range(1, steps + 1):\n        if np.random.rand() < eps:\n            a = np.random.randint(k)     # 探索\n        else:\n            a = int(np.argmax(Q))        # 利用\n        r = q_true[a] + np.random.randn()\n        N[a] += 1\n        Q[a] += (r - Q[a]) / N[a]       # 增量更新\n        rewards.append(r)\n    return Q, rewards\n\n# Q, rw = bandit(k=10, eps=0.1)"},
  {"id":"epsilon-greedy","name":"ε-贪心策略","en":"Epsilon-Greedy","cat":"强化学习","diff":"入门","summary":"强化学习最朴素也最常用的探索策略：以 1−ε 概率选当前最优动作，以 ε 概率随机探索，简单有效地平衡探索与利用。","scenes":["在线策略探索","训练期探索","策略基线"],"idea":["设定探索率 ε，每步按概率决定贪心或随机","随训练推进把 ε 从较大值线性/指数衰减到很小","对比 UCB、Softmax 等更精细的探索策略它是零额外计算的基线"],"deps":"NumPy 1.26","updated":"2026-11-14","lang":"Python 3 · NumPy","math":{"title":"ε-Greedy 行为策略","formulas":["aₜ = { 随机动作 a∈A , 概率 ε ;  argmax_a Q(sₜ,a) , 概率 1−ε }","εₜ = max(ε_min, ε₀ · γ^t)"],"steps":["输入当前状态 sₜ 与动作价值表 Q。","以 ε 掷硬币：命中则 uniform 随机选动作，否则选 argmax Q(sₜ,·)。","训练中将 ε 按调度衰减，使前期探索充分、后期趋于利用。"],"tex":["a_t\\sim\\begin{cases}\\text{Unif}(\\mathcal A),&p=\\varepsilon\\\\\\arg\\max_a Q(s_t,a),&p=1-\\varepsilon\\end{cases}","\\varepsilon_t=\\max(\\varepsilon_{\\min},\\,\\varepsilon_0\\gamma^{t})"]},"params":[["Q","array [|S|,|A|]","—","动作价值表，形状 [状态数, 动作数]。由算法在线维护，初始可为 0。"],["eps","float","0.1","探索率，0–1，默认 0.1。越大越常随机探索。无单位。"],["decay","float","0.999","探索率衰减系数，0–1，默认 0.999。每步取 eps←max(下限, eps·decay)，使后期趋于利用。"]],"input":"Q: np.ndarray 价值表\neps: float 初始探索率","output":"a: int 选定动作\neps: float 衰减后探索率","code":"import numpy as np\n\ndef eps_greedy(Q_s, eps=0.1):\n    \"\"\"Q_s: 当前状态下各动作价值的一维数组\"\"\"\n    if np.random.rand() < eps:\n        return int(np.random.randint(len(Q_s)))   # 探索\n    return int(np.argmax(Q_s))                    # 利用\n\n# eps = 0.3\n# for t in range(1000):\n#     a = eps_greedy(Q[state], eps)\n#     eps = max(0.01, eps * 0.999)"},
  {"id":"q-learning","name":"Q-Learning","en":"Q-Learning","cat":"强化学习","diff":"进阶","summary":"无模型、离策略的时序差分控制算法，通过最大化下一状态最优动作价值来更新 Q 表，收敛到最优策略。","scenes":["离散状态控制","迷宫/网格世界","离策略学习"],"idea":["维护状态-动作价值表 Q(s,a)","用 ε-Greedy 产生行为，但更新目标取下一状态的最大 Q","以 TD 误差 α[r + γ·max_a Q(s',a) − Q(s,a)] 增量更新"],"deps":"NumPy 1.26","updated":"2026-11-14","lang":"Python 3 · NumPy","math":{"title":"Q-Learning 更新规则","formulas":["Q(s,a) ← Q(s,a) + α[ r + γ·max_{a'} Q(s',a') − Q(s,a) ]","π*(s) = argmax_a Q*(s,a)"],"steps":["在状态 s 用 ε-Greedy 选动作 a，执行后观测奖励 r 与下一状态 s'。","目标是离策略的：用 max_a' Q(s',a') 而非实际采取的动作，故可学最优策略。","学习率 α 控制步长，折扣 γ 衡量未来奖励权重；足够探索下 Q 收敛到 Q*。"],"tex":["Q(s,a)\\leftarrow Q(s,a)+\\alpha\\bigl[r+\\gamma\\max_{a\\prime}Q(s\\prime,a\\prime)-Q(s,a)\\bigr]","\\pi^{*}(s)=\\arg\\max_{a}Q^{*}(s,a)"]},"params":[["n_states","int","—","状态总数，正整数，须与环境的离散状态空间一致；决定 Q 表行数。"],["n_actions","int","—","动作总数，正整数，须与环境可选动作一致；决定 Q 表列数。"],["alpha","float","0.1","学习率，0–1，常用 0.05–0.3，默认 0.1。越大更新越快但不稳；越小越平滑但慢。无单位。"],["gamma","float","0.9","折扣因子，0–1，默认 0.9。越接近 1 越重视长期回报；越小越短视。"]],"input":"env: 提供 step(s,a)->(r,s',done) 的环境\nQ: np.ndarray [n_states, n_actions]","output":"Q: np.ndarray 收敛后的价值表","code":"import numpy as np\n\ndef q_learning(env, n_s, n_a, episodes=500, alpha=0.1, gamma=0.9, eps=0.1):\n    Q = np.zeros((n_s, n_a))\n    for _ in range(episodes):\n        s = env.reset()\n        done = False\n        while not done:\n            a = np.random.randint(n_a) if np.random.rand() < eps else int(np.argmax(Q[s]))\n            r, s2, done = env.step(s, a)\n            target = r + gamma * np.max(Q[s2]) * (not done)\n            Q[s, a] += alpha * (target - Q[s, a])   # TD 更新\n            s = s2\n    return Q\n\n# Q = q_learning(env, 16, 4)"},
  {"id":"sarsa","name":"Sarsa","en":"State-Action-Reward-State-Action","cat":"强化学习","diff":"进阶","summary":"无模型、在策略的时序差分控制算法，更新使用实际下一步动作的价值，比 Q-Learning 更保守、更安全。","scenes":["在策略控制","安全第一的控制","在线学习"],"idea":["与 Q-Learning 不同，更新目标用下一步实际动作 a' 的 Q 值","行为策略与目标策略一致（都是 ε-Greedy），故为在策略","在危险环境中更稳健，因为会避开高风险的探索路径"],"deps":"NumPy 1.26","updated":"2026-11-14","lang":"Python 3 · NumPy","math":{"title":"Sarsa 更新规则","formulas":["Q(s,a) ← Q(s,a) + α[ r + γ·Q(s',a') − Q(s,a) ]","a' ~ π(·|s')   (与目标同策略)"],"steps":["在 s 选 a，执行得 r、s'；再按同一策略在 s' 选 a'。","用实际将执行的 a' 构造 TD 目标，因此学到的就是该行为策略下的值。","相比 Q-Learning 把 max 换成 on-policy 采样，对探索惩罚更敏感。"],"tex":["Q(s,a)\\leftarrow Q(s,a)+\\alpha\\bigl[r+\\gamma Q(s\\prime,a\\prime)-Q(s,a)\\bigr]","a\\prime\\sim\\pi(\\cdot\\mid s\\prime)"]},"params":[["n_states","int","—","状态总数，正整数，须与环境离散状态空间一致。"],["n_actions","int","—","动作总数，正整数，须与环境可选动作一致。"],["alpha","float","0.1","学习率，0–1，默认 0.1。越大更新快但不稳。无单位。"],["gamma","float","0.9","折扣因子，0–1，默认 0.9。越接近 1 越重视长期回报。"]],"input":"env: step(s,a)->(r,s',done)\nQ: np.ndarray [n_states, n_actions]","output":"Q: np.ndarray 在策略价值表","code":"import numpy as np\n\ndef sarsa(env, n_s, n_a, episodes=500, alpha=0.1, gamma=0.9, eps=0.1):\n    Q = np.zeros((n_s, n_a))\n    for _ in range(episodes):\n        s = env.reset(); done = False\n        a = np.random.randint(n_a) if np.random.rand() < eps else int(np.argmax(Q[s]))\n        while not done:\n            r, s2, done = env.step(s, a)\n            a2 = np.random.randint(n_a) if np.random.rand() < eps else int(np.argmax(Q[s2]))\n            target = r + gamma * Q[s2, a2] * (not done)\n            Q[s, a] += alpha * (target - Q[s, a])\n            s, a = s2, a2\n    return Q\n\n# Q = sarsa(env, 16, 4)"},
  {"id":"dqn","name":"深度 Q 网络","en":"Deep Q-Network (DQN)","cat":"强化学习","diff":"高难","summary":"用神经网络近似 Q 函数，引入经验回放与目标网络稳定训练，让智能体直接从像素学会玩 Atari 游戏。","scenes":["高维状态空间","像素级控制","离策略深度 RL"],"idea":["用 CNN/MLP 近似 Q(s,a;θ)，输出各动作价值","经验回放池打破样本相关性，随机采样小批量训练","目标网络 θ⁻ 滞后更新，缓解 Q 估计自举带来的震荡"],"deps":"PyTorch 2.2","updated":"2026-11-14","lang":"Python 3 · PyTorch","math":{"title":"DQN 损失与目标网络","formulas":["L(θ) = E[( r + γ·max_a Q(s',a;θ⁻) − Q(s,a;θ) )²]","θ⁻ ← τθ + (1−τ)θ⁻   (软更新)"],"steps":["交互产生 (s,a,r,s') 存入回放池，训练时随机采样降低相关性。","损失用目标网络 θ⁻ 算出的 TD 目标，主网络 θ 用梯度下降更新。","θ⁻ 每隔若干步硬拷贝或按 τ 软更新，保证目标稳定。"],"tex":["\\mathcal L(\\theta)=\\mathbb E\\bigl[(r+\\gamma\\max_{a}Q(s\\prime,a;\\theta^{-})-Q(s,a;\\theta))^{2}\\bigr]","\\theta^{-}\\leftarrow\\tau\\theta+(1-\\tau)\\theta^{-}"]},"params":[["state_dim","int","—","状态向量/特征维度，正整数，须与网络输入一致；无单位。"],["action_dim","int","—","动作总数（网络输出维度），正整数，须与环境可选动作一致。"],["lr","float","1e-3","学习率，正浮点数，默认 1e-3。太大不稳、太小收敛慢。"],["gamma","float","0.99","折扣因子，0–1，默认 0.99。越接近 1 越重视长期回报。"]],"input":"state: torch.Tensor [B, state_dim]\naction: torch.Tensor [B]","output":"q_values: torch.Tensor [B, action_dim]","code":"import torch, torch.nn as nn\n\nclass DQN(nn.Module):\n    def __init__(self, s_dim, a_dim):\n        super().__init__()\n        self.net = nn.Sequential(nn.Linear(s_dim, 128), nn.ReLU(),\n                                 nn.Linear(128, 128), nn.ReLU(),\n                                 nn.Linear(128, a_dim))\n    def forward(self, x):\n        return self.net(x)\n\n# q_net = DQN(4, 2); tgt = DQN(4, 2); tgt.load_state_dict(q_net.state_dict())\n# loss = ((r + 0.99*tgt(s2).max(1).values*(1-done) - q_net(s).gather(1,a))**2).mean()"},
  {"id":"mdp","name":"马尔可夫决策过程","en":"Markov Decision Process (MDP)","cat":"强化学习","diff":"入门","summary":"用五元组 (S,A,P,R,γ) 形式化序列决策问题，状态满足马尔可夫性，是几乎所有强化学习算法的理论框架。","scenes":["RL 问题建模","策略评估理论","动态规划基础"],"idea":["定义状态集 S、动作集 A、转移概率 P、奖励 R、折扣 γ","价值函数 V^π(s) 与动作价值 Q^π(s,a) 衡量策略优劣","贝尔曼方程是求解最优价值的核心递归关系"],"deps":"理论框架","updated":"2026-11-14","lang":"理论 · 数学推导","math":{"title":"贝尔曼方程","formulas":["V^π(s) = E_π[ Σₖ γᵏ r_{t+k} | s_t = s ]","V*(s) = max_a [ R(s,a) + γ·Σ_{s'} P(s'|s,a)·V*(s') ]"],"steps":["从状态 s 出发，按策略 π 行动得到即时奖励与下一状态分布。","状态价值是未来折扣奖励的期望；动作价值再对首步动作做期望。","最优价值满足贝尔曼最优性：对任意 s 取 max 即得 V*，由此反推最优策略。"],"tex":["V^{\\pi}(s)=\\mathbb E_{\\pi}\\!\\left[\\sum_{k=0}^{\\infty}\\gamma^{k}r_{t+k}\\mid s_{t}=s\\right]","V^{*}(s)=\\max_{a}\\left[R(s,a)+\\gamma\\sum_{s\\prime}P(s\\prime\\mid s,a)V^{*}(s\\prime)\\right]"]},"params":[["S","set","—","状态空间（集合），枚举问题所有可能状态；规模决定价值表大小与求解开销，无单位。"],["A","set","—","动作空间（集合），枚举智能体在各状态可选动作；无单位。"],["gamma","float","0.9","折扣因子，0–1，默认 0.9。越接近 1 越重视长期回报，影响价值收敛。"]],"input":"P: 转移概率张量 [|S|,|A|,|S|]\nR: 奖励张量 [|S|,|A|]","output":"V: np.ndarray 状态价值\npi: np.ndarray 最优策略","code":"import numpy as np\n\ndef value_iteration(P, R, gamma=0.9, tol=1e-6):\n    n_s, n_a = R.shape\n    V = np.zeros(n_s)\n    while True:\n        Q = R + gamma * (P @ V)          # [S,A]\n        V_new = Q.max(axis=1)\n        if np.abs(V_new - V).max() < tol:\n            break\n        V = V_new\n    pi = Q.argmax(axis=1)\n    return V, pi\n\n# V, pi = value_iteration(P, R)"},
  {"id":"apriori","name":"Apriori 算法","en":"Apriori","cat":"关联规则与规则学习","diff":"入门","summary":"经典关联规则挖掘算法，利用「频繁项集的子集必频繁」的反单调性，逐层搜索候选项集并剪枝，找出强关联规则。","scenes":["购物篮分析","共现推荐","频繁模式挖掘"],"idea":["用支持度计数筛选频繁 1-项集","基于频繁 k-项集自连接生成候选 (k+1)-项集","用最小支持度剪枝非频繁候选，再算置信度提取规则"],"deps":"NumPy 1.26","updated":"2026-11-14","lang":"Python 3 · 纯实现","math":{"title":"支持度、置信度与反单调剪枝","formulas":["supp(X) = |{t : X⊆t}| / |D|","conf(X→Y) = supp(X∪Y) / supp(X)","若 X 非频繁，则 X 的任意超集也非频繁"],"steps":["扫描事务库统计 1-项集支持度，保留 ≥ min_sup 的项。","频繁 k-项集两两连接生成候选，用先验性质剪掉含非频繁子集的候选。","对频繁项集生成规则，过滤 conf ≥ min_conf 的强规则。"],"tex":["\\operatorname{supp}(X)=\\frac{|\\{t:X\\subseteq t\\}|}{|D|}","\\operatorname{conf}(X\\!\\to\\!Y)=\\frac{\\operatorname{supp}(X\\cup Y)}{\\operatorname{supp}(X)}","X\\text{ 非频繁}\\Rightarrow\\forall Y\\supset X,\\; Y\\text{ 亦非频繁}"]},"params":[["transactions","list[set]","—","事务集合，每项为一个商品/项集（如 [{牛奶,面包},...]）。"],["min_sup","float","0.2","最小支持度阈值，0–1，默认 0.2。越高只保留常见组合、规则更少更可靠；越低越多但含噪声。"],["min_conf","float","0.6","最小置信度阈值，0–1，默认 0.6。越高规则越可靠、数量越少。"]],"input":"transactions: list of item-sets\nmin_sup: float 支持度阈值","output":"freq: dict 频繁项集\nrules: list 关联规则","code":"def apriori(transactions, min_sup=0.2):\n    n = len(transactions)\n    cnt = {}\n    for t in transactions:\n        for item in t:\n            cnt[frozenset([item])] = cnt.get(frozenset([item]), 0) + 1\n    freq = {k: v / n for k, v in cnt.items() if v / n >= min_sup}\n    k = 2\n    while freq:\n        items = list(freq.keys())\n        cand = {}\n        for i in range(len(items)):\n            for j in range(i + 1, len(items)):\n                union = items[i] | items[j]\n                if len(union) == k and union not in cand:\n                    s = sum(1 for t in transactions if union <= t) / n\n                    if s >= min_sup:\n                        cand[union] = s\n        if not cand:\n            break\n        freq = cand; k += 1\n    return freq\n\n# tx = [{'牛奶','面包'},{'面包','尿布'},{'牛奶','面包','尿布'}]\n# print(apriori(tx))"},
  {"id":"eclat","name":"Eclat 算法","en":"ECLAT","cat":"关联规则与规则学习","diff":"进阶","summary":"等价类聚类算法，用「项→事务列表」的垂直数据格式，通过集合交集快速算支持度，避免反复扫描事务库。","scenes":["纵向数据格式","大规模频繁项集","内存换时间"],"idea":["把数据转成每项对应的事务 ID 列表 (tid-list)","项集支持度 = 两 tid-list 的交集长度","用深度优先搜索沿等价类扩展项集，交集为空即剪枝"],"deps":"纯 Python","updated":"2026-11-14","lang":"Python 3 · 纯实现","math":{"title":"tid-list 交集求支持度","formulas":["T(X) = 各事务包含 X 的 tid 集合","supp(X∪Y) = | T(X) ∩ T(Y) | / |D|"],"steps":["预处理得到项到 tid-list 的映射。","合并两个项集的 tid-list 取其交集，长度即共同出现次数。","DFS 扩展时若交集为空则停止该分支，天然完成剪枝。"],"tex":["T(X)=\\{t\\mid X\\subseteq t\\}","\\operatorname{supp}(X\\cup Y)=\\frac{|T(X)\\cap T(Y)|}{|D|}"]},"params":[["transactions","list[set]","—","事务集合，每项为一个项集（如 [{A,B},{B,C}]）；数据规模影响 tid-list 的内存占用。"],["min_sup","float","0.2","最小支持度阈值，0–1，默认 0.2。越高频繁项集越少越可靠。"]],"input":"transactions: list of item-sets","output":"freq: dict 项集->支持度","code":"def eclat(transactions, min_sup=0.2):\n    n = len(transactions)\n    tid = {}\n    for i, t in enumerate(transactions):\n        for item in t:\n            tid.setdefault(item, set()).add(i)\n    freq = {}\n    def dfs(items, tids):\n        for j in range(len(items)):\n            new_items = items | items[j]\n            inter = tids & tid.get(list(items)[j], set())\n            if len(inter) / n >= min_sup:\n                freq[frozenset(new_items)] = len(inter) / n\n                dfs(new_items, inter)\n    for item, t in tid.items():\n        if len(t) / n >= min_sup:\n            freq[frozenset([item])] = len(t) / n\n            dfs(frozenset([item]), t)\n    return freq\n\n# print(eclat(tx))"},
  {"id":"fp-growth","name":"FP-Growth","en":"Frequent Pattern Growth","cat":"关联规则与规则学习","diff":"进阶","summary":"用 FP 树压缩存储事务库，通过条件模式基递归挖掘频繁项集，无需像 Apriori 那样反复生成候选项集。","scenes":["无候选集挖掘","稠密数据","频繁模式压缩"],"idea":["两次扫描构建 FP 树：先统计频次，再按频次降序插入事务","为每个频繁项构建条件模式基与条件 FP 树","从条件树递归提取频繁项集，组合得到完整模式"],"deps":"纯 Python","updated":"2026-11-14","lang":"Python 3 · 纯实现","math":{"title":"条件模式基与条件 FP 树","formulas":["CPB(α) = { P | P 是 α 在树中的前缀路径 }","supp(α) = Σ_{(P,c)∈CPB(α)} c"],"steps":["扫描一次得频繁项频次，二次扫描按降序把事务插入 FP 树。","对每个频繁项自底向上找其条件模式基（含计数前缀路径）。","用条件模式基建条件 FP 树并递归，组合前缀得到频繁项集。"],"tex":["\\text{ ConditionalPatternBase}(\\alpha)=\\{P\\mid P\\text{ 是 }\\alpha\\text{ 的前缀路径}\\}","\\operatorname{supp}(\\alpha)=\\sum_{(P,c)\\in CPB(\\alpha)} c"]},"params":[["transactions","list[set]","—","事务集合，每项为一个项集；用于构建 FP 树，规模影响内存与速度。"],["min_sup","float","0.2","最小支持度阈值，0–1，默认 0.2。越高频繁项集越少越可靠。"]],"input":"transactions: list of item-sets","output":"freq: dict 频繁项集->支持度","code":"class Node:\n    def __init__(self, item, cnt, parent):\n        self.item, self.cnt, self.parent = item, cnt, parent\n        self.children = {}; self.link = None\n\ndef fp_growth(transactions, min_sup=0.2):\n    n = len(transactions)\n    freq = {}\n    cnt = {}\n    for t in transactions:\n        for it in t: cnt[it] = cnt.get(it, 0) + 1\n    items = [k for k, v in cnt.items() if v / n >= min_sup]\n    items.sort(key=lambda x: -cnt[x])\n    # 头表 + 树构建略；此处给出频次统计骨架\n    for it in items:\n        freq[frozenset([it])] = cnt[it] / n\n    return freq\n\n# print(fp_growth(tx))"},
  {"id":"jrip","name":"JRip 规则学习","en":"JRip (RIPPER)","cat":"关联规则与规则学习","diff":"高难","summary":"基于分开- conquer 与剪枝的规则归纳算法（RIPPER 的 Java 实现），先贪心生成覆盖规则，再用剪枝与优化提升泛化。","scenes":["可解释分类","规则提取","不平衡数据"],"idea":["对每类反复「生长」一条规则覆盖正例、排除负例","用最小描述长度 (MDL) 剪枝规则前件","重复优化阶段微调规则集直到不再改进"],"deps":"Weka 3.8","updated":"2026-11-14","lang":"Weka · Java API","math":{"title":"MDL 剪枝准则","formulas":["DL = (p + n)·log₂(2) + p·log₂(p/(p+n)) + n·log₂(n/(p+n))","规则保留当前件当且仅当去掉后 DL 不增加"],"steps":["按信息增益贪心添加条件，直到规则纯度为 0 或达到最大条件数。","自后向前逐个去掉前件，若描述长度 DL 减小则保留裁剪。","全局优化阶段对每条规则尝试替换，依据错误率与 MDL 取舍。"],"tex":["DL=(p+n)\\log_{2}2+p\\log_{2}\\frac{p}{p+n}+n\\log_{2}\\frac{n}{p+n}","\\text{keep antecedent iff }\\Delta DL\\le 0"]},"params":[["folds","int","3","优化阶段交叉验证折数，正整数，默认 3。越大剪枝更稳但更慢。"],["minNo","int","2","规则最小覆盖样本数，正整数，默认 2。越大规则越少越泛化，越小越细碎易过拟合。"],["optimizations","int","2","规则集优化轮数，正整数，默认 2。越多越精炼但越慢。"]],"input":"instances: Weka Instances (含类标)","output":"rules: JRip 规则集模型","code":"import weka.classifiers.rules.JRip;\nimport weka.core.Instances;\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\npublic class RunJRip {\n  public static void main(String[] a) throws Exception {\n    Instances data = new Instances(new BufferedReader(new FileReader(\"data.arff\")));\n    data.setClassIndex(data.numAttributes() - 1);\n    JRip jrip = new JRip();\n    jrip.setFolds(3);\n    jrip.buildClassifier(data);\n    System.out.println(jrip);   // 打印规则集\n  }\n}"},
  {"id":"part","name":"PART 规则学习","en":"PART","cat":"关联规则与规则学习","diff":"高难","summary":"结合 C4.5 决策树与规则归纳：每轮用剪枝后的树生成一条最优规则并移除其覆盖样本，递归得到规则集。","scenes":["可解释分类","规则集生成","替代决策树"],"idea":["用 C4.5 在剩余样本上建一棵剪枝决策树","提取从根到叶最高置信度叶的路径作为一条规则","移除被覆盖的样本，重复直到无样本剩余"],"deps":"Weka 3.8","updated":"2026-11-14","lang":"Weka · Java API","math":{"title":"规则生成与样本移除","formulas":["规则 R: 前件 = 树根到叶路径的条件，结论 = 叶类标","S ← S \\ {被 R 正确/错误覆盖的样本}"],"steps":["在当前样本子集上训练并剪枝一棵 J48 树。","选置信度最高的叶，把根到该叶的路径转成 IF-THEN 规则。","从训练集删去该规则覆盖的样本，循环直到覆盖完。"],"tex":["R:\\;\\text{IF }\\bigwedge_{\\text{path}} \\text{cond} \\;\\text{THEN class}=c^{*}","S\\leftarrow S\\setminus\\{\\text{covered by }R\\}"]},"params":[["binarySplits","bool","false","是否强制二叉树分裂。true 仅二分；false（默认）允许多路分裂。"],["confidence","float","0.25","剪枝置信度阈值，0–1，默认 0.25。越小剪枝越激进（树越小）。"],["minNumObj","int","2","叶节点最少样本数，正整数，默认 2。越大树越简单、抗过拟合。"]],"input":"instances: Weka Instances","output":"rules: PART 规则集","code":"import weka.classifiers.rules.PART;\nimport weka.core.Instances;\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\npublic class RunPART {\n  public static void main(String[] a) throws Exception {\n    Instances data = new Instances(new BufferedReader(new FileReader(\"data.arff\")));\n    data.setClassIndex(data.numAttributes() - 1);\n    PART part = new PART();\n    part.setConfidenceFactor(0.25f);\n    part.buildClassifier(data);\n    System.out.println(part);\n  }\n}"},
