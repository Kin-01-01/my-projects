  --bg:#1c1c1e;--surface:#242426;--parchment:#161617;--ink:#f5f5f7;
  --muted:#bcbcc3;--faint:#9d9da5;--line:#38383b;--line-soft:#2c2c2f;
  --blue:#2997ff;--blue-hover:#47a9ff;--blue-soft:#1b3550;--blue-pale:#152436;
  --dark:#000000;--on-dark:#ffffff;--dark-muted:#a1a1a6;
  --veil:rgba(18,20,26,.10);
  --pane-bg:rgba(28,28,30,.46);
  --pane-solid:rgba(28,28,30,.90);
  --glass-bg:rgba(44,44,48,.64);
  --glass-solid:rgba(44,44,48,.88);
  --glass-line:rgba(255,255,255,.13);
  --glass-shadow:rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:clip}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  background-image:linear-gradient(var(--veil),var(--veil)), var(--wallpaper-light);
  background-size:cover;background-position:center;
  background-attachment:fixed;background-repeat:no-repeat;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei","WenQuanYi Micro Hei",system-ui,sans-serif;
  font-size:14px;line-height:1.6;font-optical-sizing:auto;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
::selection{background:var(--blue-soft);color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{height:48px;background:rgba(8,9,12,.95);color:var(--on-dark);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .mark{width:20px;height:20px;border-radius:5px;background:var(--blue);display:grid;place-items:center}
.brand .mark svg{width:16px;height:16px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand small{color:var(--dark-muted);font-size:12px;margin-left:2px}
.nav{display:flex;gap:26px;margin:0 auto;align-items:center}
.nav button{color:var(--dark-muted);font-size:12px;padding:14px 0;border-bottom:2px solid transparent;white-space:nowrap}
.nav button.on{color:var(--on-dark);font-weight:600;border-bottom-color:var(--blue)}
.tools{display:flex;align-items:center;gap:14px;flex:none}
.tools button{color:var(--dark-muted);font-size:12px;display:flex;align-items:center;gap:5px}
.tools svg{width:15px;height:15px}
.hamburger{display:none}

/* ---------- section sub navigation ---------- */
.subnav{height:40px;background:var(--subnav-bg);border-bottom:1px solid var(--glass-line);
  position:sticky;top:48px;z-index:58}
.subnav-inner{height:100%;display:flex;align-items:center;gap:16px;padding:0 24px}
.subnav-label{font-size:12px;font-weight:600;color:var(--ink);flex:none;white-space:nowrap}
.subnav-sep{width:1px;height:16px;background:var(--line);flex:none}
.anchors{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.anchors::-webkit-scrollbar{display:none}
.anchor{font-size:12px;color:var(--muted);padding:5px 11px;border-radius:999px;white-space:nowrap;transition:color 150ms var(--ease-hover),background 150ms var(--ease-hover)}
.anchor.on{color:var(--blue);background:var(--blue-pale);font-weight:600}
.totop{flex:none;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:4px;
  opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out)}
.totop.show{opacity:1;pointer-events:auto}
[data-anchor]{scroll-margin-top:96px}
.detail-cols aside,.form-cols aside{position:sticky;top:96px;align-self:start;
  max-height:calc(100vh - 110px);overflow-y:auto;padding-right:2px}
.detail-cols aside::-webkit-scrollbar,.form-cols aside::-webkit-scrollbar{width:6px}
.detail-cols aside::-webkit-scrollbar-thumb,.form-cols aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr) 376px;min-height:calc(100vh - 88px)}
.shell.wide{grid-template-columns:260px minmax(0,1fr)}
.shell.wide .preview{display:none}
.sidebar{background:var(--bg);border-right:1px solid var(--glass-line);padding:24px 0 20px;display:flex;flex-direction:column;gap:0;position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:0 20px 14px}
.side-head b{font-size:13px}
.side-head span{font-size:12px;color:var(--faint)}
.side-group{padding:12px 20px}
.side-group.on{background:var(--blue-pale)}
.side-group h4{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
.side-group.on h4{color:var(--blue)}
.side-group h4 em{font-style:normal;color:var(--faint);font-size:11px;font-weight:400}
.side-group ul{list-style:none;margin:0;padding:0}
.side-group li{font-size:12px;color:var(--muted);line-height:25px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;white-space:nowrap;transition:transform 140ms var(--ease-out),background 140ms var(--ease-hover)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn-block{width:100%}
.btn-sm{padding:7px 14px;font-size:12px}

.main{background:var(--parchment);padding:28px;min-width:0}
.preview{background:var(--bg);border-left:1px solid var(--glass-line);padding:22px;display:flex;flex-direction:column;gap:12px;position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto}
.preview::-webkit-scrollbar,.sidebar::-webkit-scrollbar,.codebody::-webkit-scrollbar{width:8px;height:8px}
.preview::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.codebody::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- common ---------- */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:30px;font-weight:600;letter-spacing:-.5px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.stat.accent{background:var(--blue-pale);border-color:var(--blue-soft);color:var(--blue)}
.sec-title{font-size:17px;font-weight:600;margin:0 0 12px}
.eyebrow{font-size:12px;font-weight:600;color:var(--ink);margin:0 0 8px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.d0{background:var(--blue-soft);color:var(--blue)}
.d1{background:var(--blue);color:#fff}
.d2{background:var(--ink);color:var(--bg)}
.tag{display:inline-flex;border-radius:var(--r-sm);background:var(--parchment);color:var(--muted);padding:5px 10px;font-size:11px;white-space:nowrap}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.link{font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.box{background:var(--parchment);border-radius:var(--r-sm);padding:14px}

/* ---------- browse ---------- */
.search-row{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:44px;min-width:0}
.search svg{width:16px;height:16px;flex:none;color:var(--faint)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:13px;min-width:0}
.search input::placeholder{color:var(--faint)}
.search kbd{font:11px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border-radius:999px;padding:7px 14px;font-size:12px;background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.chip-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.hint-narrow{display:none}
.result-line{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.entry{contain:layout style;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:border-color 150ms var(--ease-hover),transform 150ms var(--ease-out)}
.entry.sel{border-color:var(--blue)}
.entry-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.entry h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.entry h3 em{font-style:normal;font-size:12px;color:var(--faint);font-weight:400;margin-left:5px}
.entry p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.entry .meta{font-size:11px;color:var(--faint);line-height:1.5}
.entry .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.icon-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);padding:5px 8px;border-radius:6px;min-height:24px}
.icon-btn.on{color:var(--blue)}
.icon-btn svg{width:13px;height:13px}
.archive{margin-top:18px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.archive-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.empty{text-align:center;padding:48px 20px;color:var(--faint);font-size:13px}

/* ---------- preview ---------- */
.pv-head{display:flex;justify-content:space-between;align-items:center}
.pv-title{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.3}
.pv-body{font-size:13px;line-height:1.65;color:var(--muted)}
.pv-steps{font-size:12px;line-height:1.8;color:var(--muted);white-space:pre-line}
.codebox{background:var(--code);border-radius:var(--r-sm);overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--code-line);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#cccccc}
.codebar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2997ff;margin-right:8px}
.codebar-left{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-badge{background:#2997ff;color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;letter-spacing:.4px;flex:none}
.codefile{color:#8e8e93;flex:none}
.lang-pill{display:inline-flex;font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--blue);background:var(--blue-pale);border-radius:5px;padding:2px 7px;white-space:nowrap}
.codebar button{color:#2997ff;font-size:11px;font-weight:600}
.codebody{padding:12px 0;overflow-x:auto;font:11.5px/1.7 ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace}
.cline{display:flex;gap:14px;padding:0 14px;white-space:pre}
.cline .ln{width:22px;flex:none;text-align:right;color:#6e6e73;user-select:none}
.cline code{color:var(--code-text)}
.pv-actions{display:flex;gap:8px}
.pv-actions .btn{flex:1}
textarea.note{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg);font-size:12px;line-height:1.7;outline:0;white-space:pre-wrap}
textarea.note:focus{border-color:var(--blue)}
.note-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.note-item{background:var(--parchment);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;line-height:1.6;position:relative}
.note-item time{display:block;color:var(--faint);font-size:11px;margin-bottom:4px;padding-right:82px}
.note-item .note-text{white-space:pre-wrap;word-break:break-word;line-height:1.75;color:var(--ink)}
.note-item.editing{border:1px solid var(--blue);background:var(--blue-pale)}
.note-ops{position:absolute;right:8px;top:7px;display:flex;gap:2px}
.note-ops button{color:var(--faint);font-size:11px;line-height:1;padding:3px 6px;border-radius:5px}
.note-actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.note-hint{font-size:11px;color:var(--faint);margin:7px 0 0;line-height:1.6}

/* ---------- detail ---------- */
.crumb{font-size:12px;color:var(--faint);margin-bottom:16px}
.detail-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.detail-head h1{font-size:30px}
.detail-cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.info-card{background:var(--parchment);border-radius:var(--r-sm);padding:14px}
.info-card b{display:block;color:var(--blue);font-size:12px;margin-bottom:8px}
.info-card p{margin:0;font-size:12px;line-height:1.65;color:var(--muted)}
.block{margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--faint);font-weight:600;background:var(--parchment);padding:10px 12px}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);color:var(--muted);vertical-align:top}
td.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--blue);white-space:nowrap}
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.io-card{background:var(--parchment);border-radius:var(--r-sm);padding:14px}
.io-card b{font-size:12px}
.io-card pre{margin:8px 0 0;font:11.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--blue);white-space:pre-wrap;word-break:break-all}
.side-card{background:var(--parchment);border-radius:10px;padding:16px;margin-bottom:14px}
.side-card h4{font-size:13px;margin:0 0 10px}
.kv{font-size:12px;line-height:1.9;color:var(--muted);white-space:pre-line}
/* 详情页「相关算法」：跨分类条目带一个浅色分类后缀，可点可聚焦 */
.rel-list{display:flex;flex-direction:column;gap:1px}
.rel{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:1.85;color:var(--blue);
  cursor:pointer;border-radius:4px;padding:1px 4px;margin-left:-4px;transition:background 140ms var(--ease-hover)}
.rel:hover{background:var(--blue-pale)}
.rel em{font-style:normal;font-size:10px;color:var(--faint);margin-left:auto;white-space:nowrap}
/* 名字先省略，保证右侧分类后缀永远看得全 */
.rel-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rel:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:60%;background:var(--blue);border-radius:3px}

/* ---------- review ---------- */
.review-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.review-stats .card{padding:18px}
.review-stats .num{font-size:28px;font-weight:600;line-height:1.2;font-family:Inter,-apple-system,sans-serif}
.review-stats .lbl{font-size:12px;color:var(--muted)}
.review-stats .extra{font-size:11px;color:var(--faint);margin-top:4px}
.review-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.qlist{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.qtable{width:100%;font-size:12px}
.qtable th{background:var(--parchment);border-top:1px solid var(--line)}
.qtable td{padding:13px 20px}
.qtable tr:last-child td{border-bottom:0}
.qtable .nm{font-weight:600;color:var(--ink)}
.dark-card{background:var(--code);color:#fff;border-radius:10px;padding:16px;margin-top:14px}
.dark-card h4{margin:0 0 8px;font-size:13px}
.dark-card p{margin:0 0 12px;font-size:12px;line-height:1.6;color:#cccccc}

/* ---------- new entry ---------- */
.form-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.form{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:24px}
.field{display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.field label{width:130px;flex:none;font-size:12px;font-weight:600}
.field input,.field select{width:100%;border:0;outline:0;background:transparent;font-size:12px;color:var(--ink)}
.field input::placeholder{color:var(--faint)}
.field input:focus,.field select:focus{color:var(--blue)}
.form-hint{font-size:11px;color:var(--faint);line-height:1.7;margin-top:12px}
.form-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}

.math-card{background:var(--blue-pale);border:1px solid var(--blue-soft);border-radius:10px;padding:16px 20px 18px;margin-bottom:14px}
.math-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.math-title{font-size:12px;font-weight:600;color:var(--blue)}
.math-copy{font-size:11px;font-weight:600;color:var(--blue);flex:none}
.mrow{display:flex;align-items:center;gap:14px;padding:5px 0}
.mrow + .mrow{border-top:1px dashed var(--blue-soft);margin-top:8px;padding-top:14px}
.mformula{flex:1;min-width:0;font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-size:17px;line-height:2.15;font-style:italic;color:var(--ink);letter-spacing:.2px}
.mno{flex:none;font-size:11px;color:var(--faint);font-style:normal}
.mfn{font-style:normal}
.mfn i,.mformula sup i,.mformula sub i{font-style:normal}
.mfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .28em;line-height:1.2;font-style:normal}
.mnum{display:block;padding:0 .35em;border-bottom:1.2px solid currentColor;text-align:center}
.mden{display:block;padding:0 .35em;text-align:center}
.msqrt{display:inline-flex;align-items:stretch;vertical-align:middle;font-style:normal}
.mrad{font-size:1.3em;line-height:1}
.mbody{border-top:1.2px solid currentColor;padding:0 .16em;margin-left:-.04em}
.mbigop{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 .16em;line-height:1;font-style:normal}
.mbigop .mop{font-size:1.35em;line-height:.9}
.mbigop sup,.mbigop sub{font-size:.55em;line-height:1.05;font-style:normal}
.mformula sup,.mformula sub{font-size:.66em;font-style:normal;line-height:0}
.mspace{display:inline-block;width:1.1em}
.munknown{color:#c0392b;font-style:normal;font-size:.8em}
.macc{position:relative;display:inline-block;line-height:1}
.maccm{position:absolute;left:0;right:0;top:-.1em;text-align:center;font-style:normal;font-size:.88em;line-height:1;pointer-events:none}
.mrm,.mrm i{font-style:normal}
.mbf,.mbf i,.mbb,.mbb i{font-weight:700;font-style:normal}
.mcal{font-family:Georgia,"Times New Roman",serif}
.mformula br{display:block;content:""}
.math-steps{margin:0;padding-left:20px;font-size:12.5px;line-height:1.9;color:var(--muted)}
.math-steps li{padding-left:4px;margin-bottom:6px}
.math-steps li::marker{color:var(--blue);font-weight:600}
.math-mini{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-size:14px;line-height:2.1;font-style:italic;color:var(--ink);background:var(--blue-pale);border-radius:8px;padding:10px 12px}
.math-note{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.7}
/* ---------- misc ---------- */
.skip-link{position:absolute;left:-9999px;top:0;z-index:200;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:0 0 8px 0;font-size:13px;font-weight:600}

<script>
/* ============================================================

const CATS = ['基础与线性模型','树模型与集成学习','无监督与降维','模型训练与评估','损失函数与评估指标','深度学习核心','进阶高难实现','自监督与对比学习','LLM 与参数高效微调','半监督学习','图与晶体建模','强化学习','关联规则与规则学习','推荐与 CTR 排序','概率图与生成模型','优化·度量·迁移学习','时间序列与预测','Weka 算法实现'];
const DIFFS = ['入门','进阶','高难'];
/* 跨分类的「同族算法」交叉引用。
   只影响详情页侧栏的「相关算法」，不改动任何条目所属分类。
   解决的是：Weka 实现组自成一组，从主家族（KNN / SVM / C4.5…）找不进来，反之亦然。 */
const NEAR = {

  m5p:['cart','decision-tree'], m5rules:['m5p','decision-tree'],
  smo:['svm'], libsvm:['svm'], spegasos:['svm'],
  'weka-mlp':['mlp'], rbfnetwork:['rbfn'],
  nnge:['jrip','part'], bayesnet:['naive-bayes','crf'],
  aode:['naive-bayes'], waode:['aode','naive-bayes'],
  knn:['ibk','kstar'], c45:['j48'], cart:['simplecart','m5p','reptree'],
  svm:['smo','libsvm','spegasos'], mlp:['weka-mlp'], rbfn:['rbfnetwork'],
  jrip:['nnge'], 'naive-bayes':['aode','bayesnet','waode']
};

const DATA = [
  {"id":"linear-regression","name":"线性回归","en":"Linear Regression","cat":"基础与线性模型","diff":"入门","summary":"用最小二乘拟合特征与目标的线性关系，是回归任务最常用、最容易解释的基线模型。","scenes":["连续值预测","基线对照","系数可解释性"],"idea":["构造设计矩阵 X 与目标 y","最小化残差平方和求闭式解或梯度下降","用系数解释特征影响方向，用 R² / MSE 评估"],"deps":"scikit-learn 1.4","updated":"2026-11-08","lang":"Python 3 · scikit-learn","math":{"title":"最小二乘目标与闭式解","formulas":["ŷ = Xw + b,    L(w,b) = (1/2n) Σᵢ (yᵢ − ŷᵢ)²","∂L/∂w = −Xᵀ(y − Xw)/n = 0  ⇒  w* = (XᵀX)⁻¹ Xᵀ y"],"steps":["把偏置 b 并入权重（X 增一列全 1），L 变成关于 w 的凸二次函数，驻点即全局最小。","对 w 求梯度并令零得到正规方程 (XᵀX)w = Xᵀy；XᵀX 可逆时直接求逆，不可逆时用伪逆 / SVD。","代码 model.fit() 内部解的就是这个方程组：model.coef_ 对应 w*，model.intercept_ 对应 b。"],"tex":["ŷ = Xw + b,\\quad L(w,b) = \\frac{1}{2n}\\sum_{i=1}^{n}(y_i − ŷ_i)^{2}","\\frac{\\partial L}{\\partial w} = −\\frac{X^{T}(y − Xw)}{n} = 0 \\Rightarrow w^{*} = (X^{T}X)^{-1}X^{T}y"]},"params":[["X_train","array [n, d]","—","训练特征矩阵，形状 [样本数 n, 特征数 d]，每行一个样本、每列一个特征，需为数值型且无缺失。无单位；若各特征量纲不同（米/千克/秒…）建议先标准化，否则系数尺度不可比。"],["y_train","array [n]","—","训练目标（标签）向量，长度 n，须与 X_train 行数对应，为连续数值。无单位。"],["fit_intercept","bool","True","是否拟合截距项 b。true（默认）允许回归面不过原点，通常应保留；false 强制过原点，仅当数据已中心化时使用，否则会引入系统偏差。"]],"input":"X_train: np.ndarray, shape (n_samples, n_features)\ny_train: np.ndarray, shape (n_samples,)","output":"model: LinearRegression\npred: np.ndarray, shape (n_test,)","code":"import numpy as np\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.metrics import mean_squared_error, r2_score\n\ndef train_predict(X_train, y_train, X_test, y_test=None):\n    model = LinearRegression()\n    model.fit(X_train, y_train)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print(\"MSE:\", mean_squared_error(y_test, pred))\n        print(\"R2 :\", r2_score(y_test, pred))\n    return model, pred\n\n# 调用\n# X = np.random.randn(100, 3); y = X @ np.array([1.5, -2.0, 0.7]) + 0.1\n# m, p = train_predict(X[:80], y[:80], X[80:], y[80:])"},
  {"id":"logistic-regression","name":"逻辑回归","en":"Logistic Regression","cat":"基础与线性模型","diff":"入门","summary":"用 Sigmoid 把线性输出映射为概率，适合二分类与需要可解释系数的场景。","scenes":["二分类","概率输出","可解释风控"],"idea":["线性组合 z = w·x + b","Sigmoid 映射到 (0,1) 作为正类概率","最小化交叉熵损失，L2 正则控制复杂度"],"deps":"scikit-learn 1.4","updated":"2026-11-06","lang":"Python 3 · scikit-learn","math":{"title":"Sigmoid 映射与交叉熵","formulas":["z = wᵀx + b,    p = σ(z) = 1 / (1 + e^(−z))","L(w) = −(1/n) Σᵢ [ yᵢ ln pᵢ + (1−yᵢ) ln(1−pᵢ) ] + (1/2C)‖w‖²","∂L/∂z = p − y  ⇒  ∂L/∂w = Xᵀ(p − y)/n + w/C"],"steps":["线性输出 z ∈ (−∞,+∞) 经 Sigmoid 压到 (0,1)，可直接当作正类概率。","最大似然取负对数得到交叉熵；对 z 求导恰好是 p − y，形式极简，这正是梯度下降好写的原因。","C 是正则强度的倒数（C 越小惩罚越重）；predict_proba() 返回 p，(p ≥ 0.5) 得到类别。"],"tex":["z = w^{T}x + b,\\quad p = σ(z) = \\frac{1}{1 + e^{−z}}","L(w) = −\\frac{1}{n}\\sum_{i=1}^{n}\\left[y_i \\ln p_i + (1−y_i)\\ln(1−p_i)\\right] + \\frac{1}{2C}‖w‖^{2}","\\frac{\\partial L}{\\partial z} = p − y \\Rightarrow \\frac{\\partial L}{\\partial w} = \\frac{X^{T}(p−y)}{n} + \\frac{w}{C}"]},"params":[["C","float","1.0","正则强度的倒数，正浮点数，常用 0.01–100。C 越小正则越强、模型更平滑但可能欠拟合；C 越大越贴合训练集、易过拟合。默认 1.0，无单位。"],["max_iter","int","100","优化器最大迭代次数，正整数，常用 100–1000。过小可能未收敛（会告警），过大只增加耗时。默认 100。"],["solver","str","lbfgs","优化求解器，可选 lbfgs / liblinear / newton-cg / sag / saga。lbfgs（默认）适合中小数据与 L2；sag/saga 适合大数据；liblinear 支持 L1。不同求解器支持的惩罚项不同。"]],"input":"X: np.ndarray, shape (n, d)\ny: np.ndarray of 0/1, shape (n,)","output":"model.predict_proba(X)[:, 1] → 正类概率，shape (n,)","code":"import numpy as np\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import accuracy_score\n\ndef train_predict(X_train, y_train, X_test, y_test=None, C=1.0):\n    model = LogisticRegression(C=C, max_iter=1000)\n    model.fit(X_train, y_train)\n    proba = model.predict_proba(X_test)[:, 1]\n    pred = (proba >= 0.5).astype(int)\n    if y_test is not None:\n        print(\"acc:\", accuracy_score(y_test, pred))\n    return model, proba\n\n# 调用\n# X = np.random.randn(200, 4); y = (X[:, 0] + X[:, 1] > 0).astype(int)\n# m, p = train_predict(X[:160], y[:160], X[160:], y[160:])"},
  {"id":"ridge-lasso","name":"岭回归与 Lasso","en":"Ridge / Lasso","cat":"基础与线性模型","diff":"入门","summary":"在线性回归损失上加入 L2 / L1 正则，抑制过拟合；Lasso 还能把不重要特征的系数压到 0，实现特征选择。","scenes":["多重共线性","特征选择","高维小样本"],"idea":["岭回归：损失 + α·||w||²，收缩系数但不置零","Lasso：损失 + α·||w||₁，产生稀疏解","用交叉验证选 α"],"deps":"scikit-learn 1.4","updated":"2026-11-02","lang":"Python 3 · scikit-learn","math":{"title":"正则化目标与稀疏性来源","formulas":["Ridge： L(w) = ‖y − Xw‖²₂ + α‖w‖²₂  ⇒  w* = (XᵀX + αI)⁻¹ Xᵀy","Lasso： L(w) = ‖y − Xw‖²₂ + α‖w‖₁","L1 在 wⱼ = 0 处不可导，次梯度含 [−α, α]  ⇒  最优解允许落在 0"],"steps":["Ridge 加 αI 让矩阵一定可逆，并把共线特征的系数一起压小，但不会压到零。","Lasso 的 L1 惩罚在原点有尖角，最优条件允许 0 属于次梯度，因此产生稀疏解，可当特征选择。","α 对尺度敏感，代码用 StandardScaler 把标准化放进 pipeline；coef_ 中的零项即被剔除的特征。"],"tex":["\\text{Ridge}:\\quad L(w) = ‖y − Xw‖_2^{2} + α‖w‖_2^{2} \\Rightarrow w^{*} = (X^{T}X + αI)^{-1}X^{T}y","\\text{Lasso}:\\quad L(w) = ‖y − Xw‖_2^{2} + α‖w‖_1","\\text{subgrad}_{w_j=0}\\,L ∈ [−α, α] \\Rightarrow w_j^{*} = 0\\quad \\text{可成为最优解}"]},"params":[["alpha","float","1.0","正则强度，非负浮点数，常用 1e-4–100。越大收缩越强、系数越趋近 0（过强会欠拟合）；=0 退化为普通最小二乘。默认 1.0，无单位。"],["X","array [n, d]","—","特征矩阵 [n, d]。建议先对各列标准化，否则正则对量纲大的特征惩罚不均。无单位。"],["fit_intercept","bool","True","是否拟合截距。true（默认）通常保留；false 用于已中心化数据、强制过原点。"]],"input":"标准化后的 X_train / y_train","output":"model.coef_ → 系数向量；model.predict(X) → 预测值","code":"from sklearn.linear_model import Ridge, Lasso\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import make_pipeline\n\ndef build_model(kind=\"ridge\", alpha=1.0):\n    est = Ridge(alpha=alpha) if kind == \"ridge\" else Lasso(alpha=alpha)\n    # 正则对尺度敏感，务必把标准化放进 pipeline\n    return make_pipeline(StandardScaler(), est)\n\ndef fit_select(X, y, kind=\"lasso\", alpha=0.05):\n    model = build_model(kind, alpha).fit(X, y)\n    coef = model[-1].coef_\n    keep = [i for i, c in enumerate(coef) if abs(c) > 1e-6]\n    return model, keep\n\n# 调用\n# m, keep = fit_select(X, y, \"lasso\", 0.05)\n# print(\"保留特征:\", keep)"},
  {"id":"knn","name":"K 近邻","en":"K-Nearest Neighbors","cat":"基础与线性模型","diff":"入门","summary":"不做显式训练，预测时找距离最近的 K 个样本投票或平均；对特征尺度敏感，必须先标准化。","scenes":["小数据集分类","推荐召回","基线对照"],"idea":["计算测试点与所有训练点的距离","取距离最小的 K 个邻居","分类用多数投票，回归用均值"],"deps":"scikit-learn 1.4","updated":"2026-10-28","lang":"Python 3 · scikit-learn","math":{"title":"距离度量与多数投票","formulas":["d(x, xᵢ) = (Σⱼ |xⱼ − xᵢⱼ|ᵖ)^(1/p)   （p=2 欧氏，p=1 曼哈顿）","Nₖ(x) = { d(x, xᵢ) 最小的 k 个样本 }","ŷ = argmax_c Σ_{xᵢ∈Nₖ} wᵢ I(yᵢ = c),   wᵢ = 1 / d(x, xᵢ)"],"steps":["KNN 没有可训练参数，全部计算发生在预测阶段，属于惰性学习。","距离对量纲敏感：取值范围大的特征会主导 d，所以必须先 StandardScaler。","k 小则方差大、k 大则偏差大；weights=\"distance\" 用 1/d 加权削弱远邻干扰。"],"tex":["d(x,x_i) = \\left(\\sum_j |x_j − x_{ij}|^{p}\\right)^{1/p}\\quad (p=2\\quad \\text{欧氏},\\quad p=1\\quad \\text{曼哈顿})","N_k(x) = \\text{距离最小的 } k \\text{ 个训练样本}","ŷ = \\text{argmax}_c \\sum_{x_i ∈ N_k} w_i\\,I(y_i = c),\\quad w_i = \\frac{1}{d(x,x_i)}"]},"params":[["n_neighbors","int","5","近邻数量 K，正整数，常用 3–15。K 越大决策边界越平滑、抗噪但可能欠拟合；K 越小越敏感、易受噪声影响而过拟合。默认 5，无单位。"],["weights","str","uniform","近邻投票权重方式。uniform（默认）所有邻居等权；distance 按距离倒数加权，近邻影响更大，适合密度不均的数据。"],["metric","str","minkowski","距离度量。minkowski（默认，p=2 即欧氏距离）、euclidean、manhattan、cosine 等。度量应与特征尺度匹配，使用前建议标准化。"]],"input":"标准化后的 X_train, y_train, X_test","output":"pred: array，分类标签或回归值","code":"from sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.metrics import accuracy_score\n\ndef knn_predict(X_train, y_train, X_test, y_test=None, k=5):\n    model = make_pipeline(\n        StandardScaler(),\n        KNeighborsClassifier(n_neighbors=k, weights=\"distance\")\n    )\n    model.fit(X_train, y_train)\n    pred = model.predict(X_test)\n    if y_test is not None:\n        print(\"acc:\", accuracy_score(y_test, pred))\n    return model, pred\n\n# 调用：m, p = knn_predict(X_tr, y_tr, X_te, y_te, k=7)"},
  {"id":"decision-tree","name":"决策树","en":"Decision Tree","cat":"树模型与集成学习","diff":"入门","summary":"按特征阈值递归切分，让子节点纯度不断提升；规则直观可解释，但单棵树容易过拟合。","scenes":["可解释规则","快速基线","特征交互探索"],"idea":["枚举特征与切分点，选信息增益/基尼下降最大的","递归分裂直到满足停止条件","用 max_depth / min_samples_leaf 剪枝"],"deps":"scikit-learn 1.4","updated":"2026-11-01","lang":"Python 3 · scikit-learn","math":{"title":"不纯度增益与贪心分裂","formulas":["Gini(D) = 1 − Σ_c p_c²,    Entropy(D) = −Σ_c p_c log₂ p_c","Gain(D, j, t) = Gini(D) − (|D_L|/|D|)Gini(D_L) − (|D_R|/|D|)Gini(D_R)","(j*, t*) = argmax_{j,t} Gain(D, j, t)"],"steps":["对每个特征 j 与阈值 t 枚举切分，选使子节点加权不纯度下降最多的一组。","递归执行到深度或叶样本数达标；单棵树能极细地拟合训练数据，所以必须剪枝。","max_depth / min_samples_leaf 对应停止条件；feature_importances_ 是各特征累计 Gain 的归一化。"],"tex":["\\text{Gini}(D) = 1 − \\sum_c p_c^{2},\\quad \\text{Entropy}(D) = −\\sum_c p_c \\log_2 p_c","\\text{Gain}(D,j,t) = \\text{Gini}(D) − \\frac{|D_L|}{|D|}\\text{Gini}(D_L) − \\frac{|D_R|}{|D|}\\text{Gini}(D_R)","(j^{*},t^{*}) = \\text{argmax}_{j,t}\\quad \\text{Gain}(D,j,t)"]},"params":[["max_depth","int","None","树最大深度，正整数或 None。None（默认）不限深、易过拟合；越小树越浅越简单，常用 3–15 以平衡偏差与方差。"],["min_samples_leaf","int","1","叶节点最少样本数，正整数，默认 1。越大叶越“厚”、正则越强、抗噪但可能欠拟合。"],["criterion","str","gini","分裂质量准则。gini（默认，基尼不纯度，快）、entropy（信息熵）。二者结果相近，entropy 略慢。"]],"input":"X_train, y_train（无需标准化）","output":"model.predict(X)；model.feature_importances_；可导出树规则文本","code":"from sklearn.tree import DecisionTreeClassifier, export_text\nfrom sklearn.metrics import accuracy_score\n\ndef tree_fit(X_train, y_train, X_test=None, y_test=None, max_depth=4):\n    model = DecisionTreeClassifier(\n        max_depth=max_depth, min_samples_leaf=5, random_state=42\n    )\n    model.fit(X_train, y_train)\n    if X_test is not None and y_test is not None:\n        print(\"acc:\", accuracy_score(y_test, model.predict(X_test)))\n    return model\n\n# 调用\n# m = tree_fit(X_tr, y_tr, X_te, y_te, max_depth=4)\n# print(export_text(m, feature_names=[\"f1\", \"f2\", \"f3\"]))"},
  {"id":"random-forest","name":"随机森林","en":"Random Forest","cat":"树模型与集成学习","diff":"入门","summary":"Bagging 多棵决策树并投票/平均，抗过拟合、对特征尺度不敏感，是表格数据的稳妥基线。","scenes":["表格数据","特征重要性","缺失值鲁棒场景"],"idea":["Bootstrap 抽样生成多份子集","每棵树分裂时随机选特征子集","分类投票 / 回归平均，降低方差"],"deps":"scikit-learn 1.4","updated":"2026-11-03","lang":"Python 3 · scikit-learn","math":{"title":"Bagging 的方差缩减","formulas":["ĥ(x) = (1/B) Σ_b h_b(x)   （分类：argmax_c Σ_b I(h_b(x)=c)）","若单树方差 σ²、树间相关系数 ρ： Var(平均) = ρσ² + (1−ρ)σ²/B","max_features 越小 ⇒ 树间 ρ 越小 ⇒ 集成方差越低"],"steps":["Bootstrap 有放回抽样让每棵树看到约 63.2% 不重复样本，袋外样本还能估泛化误差。","平均 B 棵高方差、低偏差的树，方差按 (1−ρ)/B 衰减，偏差基本不变。","代码 n_estimators 就是 B；max_features=\"sqrt\" 通过随机选特征降低 ρ。"],"tex":["ĥ(x) = \\frac{1}{B}\\sum_b h_b(x)\\quad (\\text{分类}: \\text{argmax}_c \\sum_b I(h_b(x)=c))","\\text{Var}(ĥ) = ρσ^{2} + \\frac{(1−ρ)σ^{2}}{B}","\\text{特征随机性} ⇒ ρ ↓ ⇒ \\text{集成方差} ↓"]},"params":[["n_estimators","int","100","决策树数量，正整数，常用 100–500。越多方差越低、越稳，但训练/预测越慢且收益递减。默认 100。"],["max_features","str","sqrt","每次分裂随机考虑的特征数。sqrt（默认，√d）、log2、整数或浮点比例。越小树间越多样、降方差但单树更弱。"],["n_jobs","int","-1","并行线程数，整数，-1（默认）用全部 CPU 核。不影响结果，只影响速度。"]],"input":"X_train, y_train；支持 predict_proba","output":"pred 或 proba；feature_importances_ 给出特征重要性","code":"import pandas as pd\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import classification_report\n\ndef rf_fit(X_train, y_train, X_test, y_test, n=200):\n    model = RandomForestClassifier(\n        n_estimators=n, max_features=\"sqrt\",\n        min_samples_leaf=2, n_jobs=-1, random_state=42\n    )\n    model.fit(X_train, y_train)\n    pred = model.predict(X_test)\n    print(classification_report(y_test, pred))\n    imp = pd.Series(model.feature_importances_).sort_values(ascending=False)\n    return model, imp\n\n# 调用：m, imp = rf_fit(X_tr, y_tr, X_te, y_te)"},
  {"id":"xgboost","name":"XGBoost 梯度提升","en":"XGBoost","cat":"树模型与集成学习","diff":"进阶","summary":"串行训练弱学习器拟合残差，配合正则与二阶梯度，在结构化数据竞赛中长期表现稳定。","scenes":["结构化数据竞赛","非线性拟合","排序与点击率预估"],"idea":["每轮新增一棵树拟合上一轮残差","目标函数用二阶泰勒展开 + 正则项","用学习率、早停与子采样控制过拟合"],"deps":"xgboost 2.0","updated":"2026-11-04","lang":"Python 3 · XGBoost","math":{"title":"二阶泰勒展开与加法训练","formulas":["ŷᵢ⁽ᵗ⁾ = ŷᵢ⁽ᵗ⁻¹⁾ + fₜ(xᵢ)","Obj⁽ᵗ⁾ ≈ Σᵢ [ gᵢ fₜ(xᵢ) + ½ hᵢ fₜ²(xᵢ) ] + Ω(fₜ),   Ω(f) = γT + ½λ‖w‖²","gᵢ = ∂ℓ/∂ŷ⁽ᵗ⁻¹⁾,  hᵢ = ∂²ℓ/∂(ŷ⁽ᵗ⁻¹⁾)²,   wⱼ* = −Σ_{i∈j} gᵢ / (Σ_{i∈j} hᵢ + λ)"],"steps":["每轮不重训模型，只新增一棵树去拟合当前预测的一阶 / 二阶梯度（残差的推广）。","把损失在 ŷ⁽ᵗ⁻¹⁾ 处二阶展开，目标变成关于叶权重的二次函数，可直接求闭式解 wⱼ*。","learning_rate 收缩 wⱼ*、subsample/colsample 加随机性、early_stopping_rounds 靠验证集 AUC 决定停轮。"],"tex":["ŷ_i^{(t)} = ŷ_i^{(t−1)} + f_t(x_i)","\\text{Obj}^{(t)} ≈ \\sum_i \\left[ g_i f_t(x_i) + \\frac{1}{2}h_i f_t^{2}(x_i) \\right] + Ω(f_t),\\quad Ω(f) = γT + \\frac{1}{2}λ‖w‖^{2}","g_i = \\frac{\\partial ℓ}{\\partial ŷ^{(t−1)}},\\quad h_i = \\frac{\\partial^{2} ℓ}{\\partial (ŷ^{(t−1)})^{2}},\\quad w_j^{*} = −\\frac{\\sum_{i ∈ j} g_i}{\\sum_{i ∈ j} h_i + λ}"]},"params":[["n_estimators","int","400","提升轮数（树的数量），正整数，常用 100–1000。越多拟合越强但易过拟合、耗时增加，建议配早停。默认 400。"],["learning_rate","float","0.05","每棵树的收缩步长（学习率），0–1，常用 0.01–0.3。越小需越多树、泛化更好；越大收敛快但易震荡过拟合。默认 0.05，无单位。"],["max_depth","int","4","单棵树最大深度，正整数，常用 3–10。越大交互越复杂、拟合越强但易过拟合、内存增。默认 4。"],["early_stopping_rounds","int","30","早停耐心值，正整数，默认 30。验证集指标连续该轮数不提升即停止，防止过拟合与浪费；需提供验证集。"]],"input":"X_train / y_train + 验证集 (X_valid, y_valid)","output":"model.predict(X)；model.feature_importances_","code":"import xgboost as xgb\nfrom sklearn.metrics import roc_auc_score\n\ndef xgb_fit(X_train, y_train, X_valid, y_valid, X_test):\n    model = xgb.XGBClassifier(\n        n_estimators=400, learning_rate=0.05, max_depth=4,\n        subsample=0.8, colsample_bytree=0.8,\n        eval_metric=\"auc\", early_stopping_rounds=30,\n        random_state=42, n_jobs=-1\n    )\n    model.fit(X_train, y_train, eval_set=[(X_valid, y_valid)], verbose=False)\n    proba = model.predict_proba(X_test)[:, 1]\n    return model, proba\n\n# 调用：m, p = xgb_fit(X_tr, y_tr, X_va, y_va, X_te)\n# print(\"AUC:\", roc_auc_score(y_te, p))"},
  {"id":"lightgbm","name":"LightGBM","en":"LightGBM","cat":"树模型与集成学习","diff":"进阶","summary":"基于直方图与 leaf-wise 生长的梯度提升框架，训练快、内存占用低，适合大规模表格数据。","scenes":["大规模表格数据","在线特征迭代","训练效率优先"],"idea":["把连续特征分桶成直方图，降低切分点搜索成本","leaf-wise 每次分裂增益最大的叶子","配合 num_leaves / min_data_in_leaf 防止过深"],"deps":"lightgbm 4.x","updated":"2026-11-07","lang":"Python 3 · LightGBM","math":{"title":"直方图分裂与 leaf-wise 增益","formulas":["Gain = ½[ (Σ_L g)²/(Σ_L h + λ) + (Σ_R g)²/(Σ_R h + λ) − (Σ g)²/(Σ h + λ) ] − γ","连续特征分桶成 K 个 bin 后，复杂度从 O(#样本 × #特征) 降到 O(#bin × #特征)"],"steps":["分桶后只需按 bin 累加 g、h 的直方图，枚举 K 个切分点即可，内存与耗时都大幅下降。","leaf-wise 每次挑全树增益最大的叶子分裂，同叶子数下比 level-wise 误差更低，但更容易长深。","num_leaves 控制叶子总数、min_child_samples 限制最小样本量，二者共同防止过拟合。"],"tex":["\\text{Gain} = \\frac{1}{2}\\left[ \\frac{(\\sum_L g)^{2}}{\\sum_L h + λ} + \\frac{(\\sum_R g)^{2}}{\\sum_R h + λ} − \\frac{(\\sum g)^{2}}{\\sum h + λ} \\right] − γ","O(n·d) → O(K·d),\\quad K = \\text{直方图 bin 数}"]},"params":[["num_leaves","int","31","单棵树叶子数，正整数，默认 31。是控制复杂度的主参数（应小于 2^max_depth）；越大拟合越强、越易过拟合。"],["learning_rate","float","0.05","学习率（收缩步长），0–1，常用 0.01–0.2。越小越稳需更多树；越大越快易过拟合。默认 0.05。"],["min_data_in_leaf","int","20","叶节点最少样本数，正整数，默认 20。越大正则越强、抗过拟合，是 LightGBM 防过拟合的关键参数。"],["n_estimators","int","300","迭代轮数（树数），正整数，默认 300。与学习率配合，小学习率需更多轮。"]],"input":"X_train / y_train，可为 DataFrame（自动处理类别列）","output":"model.predict_proba(X)[:, 1]；model.feature_importance_","code":"import lightgbm as lgb\nfrom sklearn.metrics import roc_auc_score\n\ndef lgb_fit(X_train, y_train, X_valid, y_valid, X_test):\n    model = lgb.LGBMClassifier(\n        n_estimators=300, learning_rate=0.05, num_leaves=31,\n        min_child_samples=20, subsample=0.8, colsample_bytree=0.8,\n        random_state=42, n_jobs=-1, verbose=-1\n    )\n    model.fit(X_train, y_train,\n              eval_set=[(X_valid, y_valid)],\n              callbacks=[lgb.early_stopping(30, verbose=False)])\n    proba = model.predict_proba(X_test)[:, 1]\n    return model, proba\n\n# 调用：m, p = lgb_fit(X_tr, y_tr, X_va, y_va, X_te)\n# print(\"AUC:\", roc_auc_score(y_te, p))"},
  {"id":"kmeans","name":"K-Means 聚类","en":"K-Means","cat":"无监督与降维","diff":"入门","summary":"交替执行样本分配与质心更新，把数据划分为 K 个紧凑簇；需先标准化，K 可用肘部法选。","scenes":["客户分群","无标签探索","特征离散化"],"idea":["随机初始化 K 个质心","把样本分到最近质心，再更新质心为簇均值","重复至收敛；用 inertia / 轮廓系数选 K"],"deps":"scikit-learn 1.4","updated":"2026-10-25","lang":"Python 3 · scikit-learn","math":{"title":"交替最小化与肘部法","formulas":["目标（inertia）： J = Σᵢ ‖xᵢ − μ_{zᵢ}‖²₂,   zᵢ = argmin_k ‖xᵢ − μₖ‖²","E 步：固定 μ，令 zᵢ 取最近质心使 J 最小","M 步：固定 z，μₖ = (1/|Cₖ|) Σ_{i∈Cₖ} xᵢ   （均值使平方误差最小）"],"steps":["两步都让 J 单调不增且 J 有下界 0，因此迭代必然收敛（可能停在局部最优）。","对 μₖ 求导得 2Σ(xᵢ − μₖ) = 0，直接给出质心更新式，这就是 M 步。","代码 elbow() 画不同 K 的 J 取拐点；silhouette_score 用簇内 / 簇间距离交叉验证 K。"],"tex":["J = \\sum_i ‖x_i − μ_{z_i}‖_2^{2},\\quad z_i = \\text{argmin}_k ‖x_i − μ_k‖^{2}","\\text{E 步}:\\quad μ \\text{ 固定},\\quad z_i = \\text{argmin}_k ‖x_i − μ_k‖^{2}","\\text{M 步}:\\quad z \\text{ 固定},\\quad μ_k = \\frac{1}{|C_k|}\\sum_{i ∈ C_k} x_i\\quad (\\partial J / \\partial μ_k = 0)"]},"params":[["n_clusters","int","8","簇数量 K，正整数，默认 8。需预先给定；过小欠拟合（把多簇合并）、过大过拟合（把单簇拆散）。可用肘部法或轮廓系数选 K。"],["n_init","int","10","不同初始化的重复运行次数，正整数，默认 10。取惯性最优的一次；越多越稳但越慢。"],["random_state","int","42","随机种子，整数或 None。固定后可复现结果；None 每次不同。不影响模型能力，只影响可复现性。"]],"input":"标准化后的 X: np.ndarray, shape (n, d)","output":"labels: array [n]；centers: array [K, d]","code":"import numpy as np\nfrom sklearn.cluster import KMeans\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.metrics import silhouette_score\n\ndef cluster(X, k=4):\n    Xs = StandardScaler().fit_transform(X)\n    model = KMeans(n_clusters=k, n_init=10, random_state=42)\n    labels = model.fit_predict(Xs)\n    print(\"silhouette:\", silhouette_score(Xs, labels))\n    return model, labels\n\ndef elbow(X, ks=range(2, 9)):\n    Xs = StandardScaler().fit_transform(X)\n    return [KMeans(n_clusters=k, n_init=10, random_state=42)\n            .fit(Xs).inertia_ for k in ks]\n\n# 调用：m, lab = cluster(X, k=4); print(elbow(X))"},
  {"id":"dbscan","name":"DBSCAN 密度聚类","en":"DBSCAN","cat":"无监督与降维","diff":"进阶","summary":"基于密度连通性发现任意形状簇并自动识别噪声点，不需要预先指定簇数。","scenes":["异常检测","空间轨迹","非球形簇"],"idea":["以 eps 为半径统计邻域内样本数","密度达 min_samples 的点成为核心点，向外扩展连通簇","不属于任何簇的点标记为 -1（噪声）"],"deps":"scikit-learn 1.4","updated":"2026-10-29","lang":"Python 3 · scikit-learn","math":{"title":"密度可达与噪声判定","formulas":["ε-邻域： N_ε(x) = { xᵢ | d(x, xᵢ) ≤ ε }","核心点 ⇔ |N_ε(x)| ≥ min_samples","密度可达：存在链 p₁,…,pₙ，p₁ 为核心点，p_{i+1} ∈ N_ε(pᵢ) 且 pᵢ 是核心点"],"steps":["只有核心点能向外扩展簇；边界点可归入簇但不能继续扩展，非可达点标为 −1 噪声。","与 K-Means 不同，不需要指定 K，且能识别任意形状簇，但对密度不均的数据很敏感。","eps 用 k 距离曲线选拐点（代码注释里的 NearestNeighbors 片段）；距离同样需先标准化。"],"tex":["N_ε(x) = \\text{所有满足 } d(x,x_i) ≤ ε \\text{ 的样本}","\\text{核心点} ⇔ |N_ε(x)| ≥ m\\quad (m = \\text{最小样本数})","p_1 → p_2 → ⋯ → p_n,\\quad p_{i+1} ∈ N_ε(p_i)"]},"params":[["eps","float","0.5","邻域半径 ε，正浮点数，最敏感参数，默认 0.5。太小会把点都判为噪声、簇碎裂；太大把不同簇粘连。可用 k-距离图辅助选择。"],["min_samples","int","5","成为核心点所需的邻域点数，正整数，默认 5。越大要求越密、噪声更多；越小越易形成簇。"],["metric","str","euclidean","距离度量，euclidean（默认）、manhattan、cosine 等。应与数据分布匹配。"]],"input":"标准化后的 X: array [n, d]","output":"labels: array [n]，噪声点为 -1","code":"import numpy as np\nfrom sklearn.cluster import DBSCAN\nfrom sklearn.preprocessing import StandardScaler\n\ndef density_cluster(X, eps=0.5, min_samples=5):\n    Xs = StandardScaler().fit_transform(X)\n    labels = DBSCAN(eps=eps, min_samples=min_samples).fit_predict(Xs)\n    n_clusters = len(set(labels)) - (1 if -1 in labels else 0)\n    n_noise = int((labels == -1).sum())\n    print(\"clusters:\", n_clusters, \"noise:\", n_noise)\n    return labels\n\n# 用 k 距离曲线选 eps：\n# from sklearn.neighbors import NearestNeighbors\n# d, _ = NearestNeighbors(n_neighbors=5).fit(Xs).kneighbors(Xs)\n# eps = np.sort(d[:, -1])[int(0.95 * len(Xs))]"},
  {"id":"pca","name":"PCA 主成分分析","en":"PCA","cat":"无监督与降维","diff":"入门","summary":"把特征投影到方差最大的正交方向，用于降维、去噪与可视化；必须先看累计解释方差比。","scenes":["高维降维","可视化","多重共线性处理"],"idea":["中心化（并标准化）数据","对协方差矩阵做 SVD，取前 k 个特征向量","投影到低维空间，记录解释方差比"],"deps":"scikit-learn 1.4","updated":"2026-10-31","lang":"Python 3 · scikit-learn","math":{"title":"协方差特征分解与最大方差投影","formulas":["中心化后 C = (1/n) XᵀX = V Λ Vᵀ,   Λ = diag(λ₁ ≥ … ≥ λ_d ≥ 0)","取前 k 个特征向量 Vₖ： Z = X Vₖ,   方差占比 = Σ_{j≤k} λⱼ / Σⱼ λⱼ","等价形式： min_{rank(Vₖ)=k} ‖X − Z Vₖᵀ‖²_F"],"steps":["第一主成分是使投影方差 max_{‖v‖=1} vᵀCv 的方向，拉格朗日乘子法给出 Cv = λv。","按特征值降序取前 k 列，既是最大方差方向，也是最小重建误差方向（Eckart–Young）。","explained_variance_ratio_ 即 λⱼ / Σλ；n_components 传 0~1 浮点数表示累计方差阈值。"],"tex":["C = \\frac{1}{n}X^{T}X = VΛV^{T},\\quad Λ = \\text{diag}(λ_1 ≥ ⋯ ≥ λ_d ≥ 0)","Z = XV_k,\\quad \\text{方差占比} = \\frac{\\sum_{j ≤ k}λ_j}{\\sum_j λ_j}","\\min_{\\text{rank}(V_k)=k} ‖X − ZV_k^{T}‖_F^{2}"]},"params":[["n_components","int|float","2","保留的主成分数，正整数或 0–1 浮点。整数指定维数；浮点如 0.95 表示保留 95% 方差。默认 2。越多信息保留越多但降维力度越小。"],["whiten","bool","False","是否白化（各主成分方差归一到 1）。true 使各维等方差、利于后续模型；false（默认）保留原始方差。"],["svd_solver","str","auto","SVD 求解器，auto（默认）、full、randomized、arpack。大数据可用 randomized 加速，小矩阵用 full/arpack 更精确。"]],"input":"标准化后的 X: array [n, d]","output":"Z: array [n, k]；model.explained_variance_ratio_","code":"import numpy as np\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler\n\ndef reduce_dim(X, variance=0.95):\n    Xs = StandardScaler().fit_transform(X)\n    model = PCA(n_components=variance, random_state=42)\n    Z = model.fit_transform(Xs)\n    print(\"kept dims:\", Z.shape[1])\n    print(\"cumulative var:\", np.cumsum(model.explained_variance_ratio_)[-1])\n    return model, Z\n\n# 2D 可视化：model, Z = reduce_dim(X, 2)\n# 注意 n_components 传整数时表示维度数，传 0~1 浮点数表示方差比例"},
  {"id":"gmm","name":"高斯混合模型","en":"Gaussian Mixture","cat":"无监督与降维","diff":"进阶","summary":"假设数据由多个高斯分布混合生成，用 EM 估计参数，输出软分配概率，能描述椭球形簇。","scenes":["软聚类","密度估计","异常分数"],"idea":["E 步：计算每个样本属于各分量的后验概率","M 步：用加权样本更新均值、协方差与混合权重","用 BIC / AIC 选择分量个数"],"deps":"scikit-learn 1.4","updated":"2026-11-02","lang":"Python 3 · scikit-learn","math":{"title":"EM 算法与软分配","formulas":["p(x) = Σ_{k=1}^K πₖ N(x | μₖ, Σₖ),    Σₖ πₖ = 1","E 步： γ_{ik} = πₖ N(xᵢ|μₖ,Σₖ) / Σⱼ πⱼ N(xᵢ|μⱼ,Σⱼ)","M 步： Nₖ = Σᵢ γ_{ik},  μₖ = Σᵢ γ_{ik}xᵢ / Nₖ,  Σₖ = Σᵢ γ_{ik}(xᵢ−μₖ)(xᵢ−μₖ)ᵀ / Nₖ"],"steps":["含隐变量 z（样本属于哪个分量），直接最大化似然困难，EM 交替抬高证据下界。","E 步用贝叶斯公式算后验责任度 γ；M 步把 γ 当权重做加权极大似然更新参数。","协方差可取全矩阵，故能拟合椭球簇；用 BIC = −2 lnL + p ln n 惩罚参数量，代码遍历 K 取最小。"],"tex":["p(x) = \\sum_{k=1}^{K}π_k N(x | μ_k, Σ_k),\\quad \\sum_k π_k = 1","γ_{ik} = \\frac{π_k N(x_i | μ_k, Σ_k)}{\\sum_j π_j N(x_i | μ_j, Σ_j)}","N_k = \\sum_i γ_{ik},\\quad μ_k = \\frac{\\sum_i γ_{ik}x_i}{N_k},\\quad Σ_k = \\frac{\\sum_i γ_{ik}(x_i−μ_k)(x_i−μ_k)^{T}}{N_k}"]},"params":[["n_components","int","3","高斯分量个数，正整数，默认 3。过少拟合不足、过多过拟合；可用 BIC 选择。"],["covariance_type","str","full","协方差矩阵形式。full（默认，每分量独立全协方差）、tied（共享）、diag（对角）、spherical（各向同性）。full 表达能力最强但参数最多。"],["n_init","int","3","初始化次数，正整数，默认 3。取似然最优的一次；越多越稳但越慢。"]],"input":"标准化后的 X: array [n, d]","output":"labels（硬分配）、proba（软分配）、score_samples（对数密度）","code":"import numpy as np\nfrom sklearn.mixture import GaussianMixture\nfrom sklearn.preprocessing import StandardScaler\n\ndef gmm_fit(X, max_k=8):\n    Xs = StandardScaler().fit_transform(X)\n    bics = [GaussianMixture(n_components=k, n_init=3, random_state=42)\n            .fit(Xs).bic(Xs) for k in range(1, max_k + 1)]\n    best_k = int(np.argmin(bics)) + 1\n    model = GaussianMixture(n_components=best_k, n_init=3,\n                            random_state=42).fit(Xs)\n    print(\"best k by BIC:\", best_k)\n    return model, model.predict_proba(Xs), model.score_samples(Xs)\n\n# 调用：m, proba, density = gmm_fit(X)"},
  {"id":"kfold","name":"K 折交叉验证","en":"K-Fold CV","cat":"模型训练与评估","diff":"进阶","summary":"把数据切成 K 份轮流做验证集，用均值与标准差稳定评估泛化性能，避免单次划分的偶然性。","scenes":["小样本评估","模型选择","结果可信度"],"idea":["按 StratifiedKFold 保持类别比例切分","每折重新训练并评估，收集分数","汇报 mean ± std，比较模型差异是否显著"],"deps":"scikit-learn 1.4","updated":"2026-11-08","lang":"Python 3 · scikit-learn","math":{"title":"交叉验证估计量与标准误","formulas":["把数据分成互斥 K 折 D₁…D_K：  CV = (1/K) Σₖ L( f_{D∖Dₖ}, Dₖ )","s = √( Σₖ (scoreₖ − CV)² / (K−1) ),   报告 CV ± s"],"steps":["每折模型都在未参与训练的 Dₖ 上评估，避免单次 hold-out 划分带来的偶然偏差。","分层切分保持每折类别比例，对不平衡数据尤其重要；回归任务改用普通 KFold。","两模型均值差若小于 s 量级就不算显著；cross_val_score 返回的 scores 正是各折分数。"],"tex":["CV = \\frac{1}{K}\\sum_k L\\left(f_{D∖D_k},\\quad D_k\\right)","s = \\sqrt{\\frac{\\sum_k (\\text{score}_k − CV)^{2}}{K−1}},\\quad \\text{报告 } CV ± s"]},"params":[["n_splits","int","5","折数 K，正整数，默认 5。常用 5 或 10；越大评估越稳但越慢（训练 K 次）。"],["shuffle","bool","True","划分前是否打乱数据。true（默认）避免顺序偏差；时序数据应设 false 以防信息泄漏。"],["scoring","str","accuracy","评估指标，accuracy（默认）、f1、roc_auc、neg_mean_squared_error 等。应与任务（分类/回归）匹配。"]],"input":"X, y, model（任意实现 fit/predict 的估计器）","output":"scores: array [K]；打印 mean ± std","code":"import numpy as np\nfrom sklearn.model_selection import StratifiedKFold, cross_val_score\nfrom sklearn.ensemble import RandomForestClassifier\n\ndef cv_evaluate(X, y, model=None, k=5):\n    model = model or RandomForestClassifier(n_estimators=100, random_state=42)\n    cv = StratifiedKFold(n_splits=k, shuffle=True, random_state=42)\n    scores = cross_val_score(model, X, y, cv=cv, scoring=\"accuracy\", n_jobs=-1)\n    print(f\"accuracy: {scores.mean():.4f} +/- {scores.std():.4f}\")\n    return scores\n\n# 分类任务用 StratifiedKFold；回归用 KFold + scoring=\"r2\"\n# 调用：scores = cv_evaluate(X, y, k=10)"},
  {"id":"grid-search","name":"网格搜索与调参","en":"GridSearchCV","cat":"模型训练与评估","diff":"进阶","summary":"遍历超参数组合并用交叉验证打分，自动选出最优配置；维度高时改用随机搜索或贝叶斯优化。","scenes":["超参数调优","流水线联合调参","基线提升"],"idea":["定义参数网格（pipeline 参数用 步骤名__参数名）","对每组参数做 K 折交叉验证","取 mean_test_score 最大的组合，在测试集上一次性评估"],"deps":"scikit-learn 1.4","updated":"2026-11-08","lang":"Python 3 · scikit-learn","math":{"title":"超参数空间与嵌套评估","formulas":["θ* = argmin_{θ∈Θ} (1/K) Σₖ L( A_θ(D∖Dₖ), Dₖ )","网格 Θ = Θ₁ × … × Θ_m,   组合数 |Θ| = Π_j |Θ_j|"],"steps":["把「训练算法 A」看作超参数 θ 的函数，用 CV 均值作为选 θ 的目标函数。","组合数随维度指数增长，维度高时改用 RandomizedSearchCV 或贝叶斯优化更划算。","测试集必须留到搜参结束后只用一次；search.score(X_test, y_test) 即最终无偏评估。"],"tex":["θ^{*} = \\text{argmin}_{θ ∈ Θ}\\quad \\frac{1}{K}\\sum_k L\\left(A_θ(D∖D_k),\\quad D_k\\right)","Θ = Θ_1 × ⋯ × Θ_m,\\quad |Θ| = \\prod_j |Θ_j|"]},"params":[["param_grid","dict","—","待搜索的参数字典，键为参数名、值为候选列表（如 {C:[0.1,1,10]}）。组合数决定搜索开销。"],["cv","int","5","交叉验证折数，正整数，默认 5。越大评估越稳但越慢。"],["n_jobs","int","-1","并行数，整数，-1（默认）用全部核。只影响速度。"],["scoring","str","accuracy","优化目标指标，accuracy（默认）等。应与业务目标一致（不平衡分类宜用 f1/roc_auc）。"]],"input":"X_train, y_train + 参数网格","output":"best_params_ / best_score_ / best_estimator_","code":"from sklearn.model_selection import GridSearchCV\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.svm import SVC\n\ndef tune(X_train, y_train, X_test, y_test):\n    pipe = make_pipeline(StandardScaler(), SVC())\n    grid = {\"svc__C\": [0.1, 1, 10],\n            \"svc__gamma\": [\"scale\", 0.01, 0.1],\n            \"svc__kernel\": [\"rbf\"]}\n    search = GridSearchCV(pipe, grid, cv=5, scoring=\"accuracy\", n_jobs=-1)\n    search.fit(X_train, y_train)\n    print(\"best:\", search.best_params_, search.best_score_)\n    print(\"test:\", search.score(X_test, y_test))\n    return search.best_estimator_\n\n# 调用：best_model = tune(X_tr, y_tr, X_te, y_te)"},
  {"id":"confusion-matrix","name":"混淆矩阵与分类报告","en":"Classification Report","cat":"模型训练与评估","diff":"入门","summary":"用 TP/FP/FN/TN 展开评估，输出精确率、召回率、F1；类别不平衡时只看准确率会被误导。","scenes":["分类评估","阈值选择","错误分析"],"idea":["统计真实标签与预测标签的交叉计数","精确率 = TP/(TP+FP)，召回率 = TP/(TP+FN)","宏平均看整体，加权平均考虑类别样本量"],"deps":"scikit-learn 1.4","updated":"2026-11-05","lang":"Python 3 · scikit-learn","math":{"title":"精确率、召回率与 F1","formulas":["Precision = TP/(TP+FP),   Recall = TPR = TP/(TP+FN),   FPR = FP/(FP+TN)","F1 = 2·P·R / (P + R)   （P 与 R 的调和平均）","macro 平均逐类等权；weighted 平均按 support 加权"],"steps":["正类占比 1% 时全预测负类也有 99% 准确率，因此必须看混淆矩阵展开的四个量。","提高阈值会降 FP、升 FN（P 升 R 降），调阈值就是在 P–R 曲线上挑工作点。","classification_report 一次输出各类 P/R/F1/support；平均方式决定不平衡数据下的读数。"],"tex":["P = \\frac{TP}{TP+FP},\\quad R = \\text{TPR} = \\frac{TP}{TP+FN},\\quad \\text{FPR} = \\frac{FP}{FP+TN}","F_1 = \\frac{2PR}{P+R}\\quad (P \\text{ 与 } R \\text{ 的调和平均})","\\text{macro}=\\frac{1}{K}\\sum_{k}\\mathrm{metric}_{k},\\quad \\text{weighted}=\\frac{1}{n}\\sum_{k}n_{k}\\,\\mathrm{metric}_{k}"]},"params":[["y_true","array","—","真实类别标签数组，长度 n，元素为类标（字符串或整数）。须与 y_pred 逐一对应，无单位。"],["y_pred","array","—","预测标签数组，长度 n，与 y_true 逐一对齐。"],["labels","list","None","类别显示顺序，列表或 None。None（默认）按出现顺序；指定可固定行列顺序便于比较。"]],"input":"y_true, y_pred（长度相同的一维数组）","output":"混淆矩阵 ndarray；classification_report 文本","code":"import numpy as np\nfrom sklearn.metrics import (confusion_matrix, classification_report,\n                             precision_recall_fscore_support)\n\ndef evaluate(y_true, y_pred, labels=None):\n    cm = confusion_matrix(y_true, y_pred, labels=labels)\n    print(cm)\n    print(classification_report(y_true, y_pred, digits=4))\n    p, r, f, s = precision_recall_fscore_support(y_true, y_pred, average=\"macro\")\n    return cm, {\"precision\": p, \"recall\": r, \"f1\": f, \"support\": s}\n\n# 调整阈值再评估：\n# proba = model.predict_proba(X)[:, 1]\n# y_pred = (proba >= 0.35).astype(int)\n# cm, report = evaluate(y_test, y_pred)"},
  {"id":"roc-auc","name":"ROC / AUC 与阈值选择","en":"ROC-AUC","cat":"模型训练与评估","diff":"进阶","summary":"遍历分类阈值绘制 TPR-FPR 曲线，AUC 衡量排序能力；用约登指数找最佳阈值。","scenes":["不平衡二分类","阈值决策","模型排序能力对比"],"idea":["按预测概率降序，逐步移动阈值","记录每个阈值下的 TPR 与 FPR","AUC 为曲线下面积；最佳阈值取 TPR-FPR 最大处"],"deps":"scikit-learn 1.4","updated":"2026-11-06","lang":"Python 3 · scikit-learn","math":{"title":"ROC 曲线、AUC 与约登指数","formulas":["随阈值 τ 扫描： TPR(τ) = TP/(TP+FN),   FPR(τ) = FP/(FP+TN)","AUC = ∫₀¹ TPR(FPR) dFPR ≈ (1/(n₊n₋)) Σ_{i,j} I(sᵢ > sⱼ)","约登指数 J(τ) = TPR − FPR,   τ* = argmax_τ J(τ)"],"steps":["AUC 只依赖「正类分数高于负类分数」的概率，与阈值和类别比例无关，适合不平衡场景。","把分数降序扫描、累计 TP/FP 得到折线，梯形积分即 AUC。","代码用 tpr − fpr 取最大点作为最佳阈值，替代默认的 0.5。"],"tex":["\\text{TPR}(τ) = \\frac{TP}{TP+FN},\\quad \\text{FPR}(τ) = \\frac{FP}{FP+TN}","\\text{AUC} = \\int_0^{1}\\text{TPR}(\\text{FPR})\\,d\\text{FPR} ≈ \\frac{1}{n_+ n_-}\\sum_{i,j} I(s_i > s_j)","J(τ) = \\text{TPR} − \\text{FPR},\\quad τ^{*} = \\text{argmax}_τ J(τ)"]},"params":[["y_true","array","—","真实二分类标签数组（0/1 或布尔），长度 n，须与 y_score 一一对应，无单位。"],["y_score","array","—","正类的预测概率或决策分数，长度 n。AUC 只依赖排序、与阈值无关。"]],"input":"y_true（0/1）、y_score（概率）","output":"auc 标量、best_threshold、roc_curve 三元组","code":"import numpy as np\nfrom sklearn.metrics import roc_curve, roc_auc_score\n\ndef roc_report(y_true, y_score):\n    fpr, tpr, thresholds = roc_curve(y_true, y_score)\n    auc = roc_auc_score(y_true, y_score)\n    j = tpr - fpr                      # Youden's J\n    best = float(thresholds[int(np.argmax(j))])\n    print(f\"AUC: {auc:.4f}  best threshold: {best:.4f}\")\n    return {\"auc\": auc, \"threshold\": best, \"fpr\": fpr, \"tpr\": tpr}\n\n# 调用：res = roc_report(y_test, proba)\n# y_pred = (proba >= res[\"threshold\"]).astype(int)"},
  {"id":"mlp","name":"多层感知机 MLP","en":"MLP (PyTorch)","cat":"深度学习核心","diff":"进阶","summary":"全连接层堆叠加非线性激活，是最基础的神经网络；配 Dropout、BatchNorm 与 Adam 构成训练模板。","scenes":["表格回归/分类","网络结构教学","嵌入后接分类头"],"idea":["Linear → BatchNorm → ReLU → Dropout 反复堆叠","用 CrossEntropyLoss / MSELoss 定义目标","mini-batch + Adam 反向传播更新"],"deps":"PyTorch 2.3","updated":"2026-11-04","lang":"Python 3 · PyTorch","math":{"title":"前向传播与反向传播","formulas":["a^(l) = φ(W^(l) a^(l−1) + b^(l)),    a^(0) = x","L = −Σ_c y_c ln ŷ_c,    ŷ = softmax(z^(L))","δ^(L) = ŷ − y,   δ^(l) = (W^(l+1))ᵀ δ^(l+1) ⊙ φ′(z^(l)),   ∂L/∂W^(l) = δ^(l)(a^(l−1))ᵀ"],"steps":["每层做一次仿射变换再过非线性 φ；没有 φ，多层线性叠加会退化成单层。","Softmax + 交叉熵对 z 的梯度恰好是 ŷ − y，省掉一层求导，数值也更稳定。","loss.backward() 自动按链式法则算 δ；BatchNorm 稳住分布、Dropout 随机屏蔽神经元抑制过拟合。"],"tex":["a^{(l)} = φ\\left(W^{(l)}a^{(l−1)} + b^{(l)}\\right),\\quad a^{(0)} = x","L = −\\sum_c y_c \\ln ŷ_c,\\quad ŷ = \\text{softmax}(z^{(L)})","δ^{(L)} = ŷ − y,\\quad δ^{(l)} = (W^{(l+1)})^{T}δ^{(l+1)} ⊙ φ′(z^{(l)}),\\quad \\frac{\\partial L}{\\partial W^{(l)}} = δ^{(l)}(a^{(l−1)})^{T}"]},"params":[["in_dim","int","—","输入特征维度 d，正整数，须与输入向量长度一致；决定首层权重形状，无单位。"],["hidden","list","[128, 64]","各隐层宽度列表，如 [128, 64]。层数/宽度越大容量越强但易过拟合、更慢。"],["dropout","float","0.2","失活概率，0–1，默认 0.2。越大正则越强、抗过拟合但可能欠拟合。"],["lr","float","1e-3","学习率，正浮点数，默认 1e-3。太大发散、太小收敛慢。"]],"input":"x: Tensor [B, in_dim]","output":"logits: Tensor [B, num_classes]","code":"import torch\nimport torch.nn as nn\n\nclass MLP(nn.Module):\n    def __init__(self, in_dim, num_classes, hidden=(128, 64), dropout=0.2):\n        super().__init__()\n        layers, d = [], in_dim\n        for h in hidden:\n            layers += [nn.Linear(d, h), nn.BatchNorm1d(h),\n                       nn.ReLU(), nn.Dropout(dropout)]\n            d = h\n        layers.append(nn.Linear(d, num_classes))\n        self.net = nn.Sequential(*layers)\n\n    def forward(self, x):\n        return self.net(x)\n\ndef train_one_epoch(model, loader, optimizer, device=\"cpu\"):\n    model.train()\n    loss_fn = nn.CrossEntropyLoss()\n    total = 0.0\n    for x, y in loader:\n        x, y = x.to(device), y.to(device)\n        optimizer.zero_grad()\n        loss = loss_fn(model(x), y)\n        loss.backward()\n        optimizer.step()\n        total += loss.item() * len(y)\n    return total / len(loader.dataset)\n\n# m = MLP(20, 3); opt = torch.optim.Adam(m.parameters(), lr=1e-3)\n# train_one_epoch(m, loader, opt)"},
  {"id":"cnn","name":"卷积神经网络 CNN","en":"CNN (PyTorch)","cat":"深度学习核心","diff":"进阶","summary":"用局部感受野与权值共享提取空间特征，卷积 → 激活 → 池化 → 全连接是图像任务的经典范式。","scenes":["图像分类","特征提取 backbone","二维信号"],"idea":["Conv2d 提取局部模式，BatchNorm 稳定分布","ReLU + MaxPool 逐级降采样并扩大感受野","展平后接全连接分类头"],"deps":"PyTorch 2.3","updated":"2026-11-05","lang":"Python 3 · PyTorch","math":{"title":"卷积、感受野与参数共享","formulas":["(I * K)_{i,j} = Σ_m Σ_n I_{i+m, j+n} · K_{m,n} + b","输出尺寸： H_out = ⌊(H + 2p − k)/s⌋ + 1","第 l 层感受野： R_l = R_{l−1} + (k_l − 1) Π_{i<l} s_i"],"steps":["局部连接 + 权值共享让参数量与图像边长无关，且天然保留平移等变性。","堆叠卷积与池化逐步扩大感受野、降低分辨率，通道数增加以容纳更抽象的语义特征。","代码 Conv2d→BN→ReLU→MaxPool 重复三次；AdaptiveAvgPool2d(1) 把任意尺寸压成 1×1 再接分类头。"],"tex":["(I*K)_{i,j} = \\sum_m \\sum_n I_{i+m,j+n} K_{m,n} + b","H_{out} = ⌊\\frac{H + 2p − k}{s}⌋ + 1","R_l = R_{l−1} + (k_l − 1)\\prod_{i<l} s_i"]},"params":[["in_channels","int","3","输入通道数，正整数，默认 3（RGB）或 1（灰度），须与数据一致。"],["num_classes","int","10","输出类别数，正整数，默认 10。等于分类任务的类数。"],["base","int","32","首层卷积通道数，正整数，默认 32。越大容量越强但参数/计算更多。"]],"input":"x: Tensor [B, C, H, W]","output":"logits: Tensor [B, num_classes]","code":"import torch\nimport torch.nn as nn\n\nclass SmallCNN(nn.Module):\n    def __init__(self, in_channels=3, num_classes=10, base=32):\n        super().__init__()\n        self.features = nn.Sequential(\n            nn.Conv2d(in_channels, base, 3, padding=1),\n            nn.BatchNorm2d(base), nn.ReLU(), nn.MaxPool2d(2),\n            nn.Conv2d(base, base * 2, 3, padding=1),\n            nn.BatchNorm2d(base * 2), nn.ReLU(), nn.MaxPool2d(2),\n            nn.Conv2d(base * 2, base * 4, 3, padding=1),\n            nn.ReLU(), nn.AdaptiveAvgPool2d(1),\n        )\n        self.head = nn.Sequential(nn.Flatten(),\n                                  nn.Linear(base * 4, num_classes))\n\n    def forward(self, x):\n        return self.head(self.features(x))\n\n# m = SmallCNN(3, 10)\n# out = m(torch.randn(8, 3, 32, 32))   # -> [8, 10]"},
  {"id":"lstm","name":"LSTM 序列建模","en":"LSTM (PyTorch)","cat":"深度学习核心","diff":"进阶","summary":"用门控机制缓解 RNN 梯度消失，捕捉序列中的长期依赖；取最后时刻隐状态做分类或回归。","scenes":["时间序列预测","文本分类","传感器序列"],"idea":["遗忘门/输入门/输出门控制记忆单元 C 的读写","按时间步展开，nn.LSTM 内部完成全部循环","取最后一层最后时刻 h_n 接分类头"],"deps":"PyTorch 2.3","updated":"2026-11-03","lang":"Python 3 · PyTorch","math":{"title":"门控循环与梯度通路","formulas":["fₜ = σ(W_f[hₜ₋₁, xₜ] + b_f),   iₜ = σ(W_i[hₜ₋₁, xₜ] + b_i),   oₜ = σ(W_o[hₜ₋₁, xₜ] + b_o)","C̃ₜ = tanh(W_C[hₜ₋₁, xₜ] + b_C),    Cₜ = fₜ ⊙ Cₜ₋₁ + iₜ ⊙ C̃ₜ","hₜ = oₜ ⊙ tanh(Cₜ),    ∂Cₜ/∂Cₜ₋₁ ≈ fₜ  （加法通路避免连乘导致梯度消失）"],"steps":["普通 RNN 的状态是 W 的连乘，|W| < 1 时梯度指数衰减；LSTM 把记忆放在加法通路 Cₜ 上。","遗忘门 fₜ ≈ 1 时梯度可近乎无损地跨时间步回传，这是它能记住长依赖的关键。","nn.LSTM 内部完成全部时间步循环；取 h_n[-1]（最后一层最后时刻）作为整段序列的表示。"],"tex":["f_t = σ(W_f[h_{t−1},x_t]+b_f),\\quad i_t = σ(W_i[h_{t−1},x_t]+b_i),\\quad o_t = σ(W_o[h_{t−1},x_t]+b_o)","C̃_t = \\tanh(W_C[h_{t−1},x_t]+b_C),\\quad C_t = f_t ⊙ C_{t−1} + i_t ⊙ C̃_t","h_t = o_t ⊙ \\tanh(C_t),\\quad \\frac{\\partial C_t}{\\partial C_{t−1}} ≈ f_t"]},"params":[["input_size","int","—","每步输入的特征维度，正整数，须与序列特征数一致；无单位。"],["hidden_size","int","64","隐状态维度，正整数，默认 64。越大记忆容量越强但更慢、易过拟合。"],["num_layers","int","2","堆叠 LSTM 层数，正整数，默认 2。越多表达越强但更慢。"],["batch_first","bool","True","输入是否为 [batch, seq, feature] 布局。true（默认）是；false 为 [seq, batch, feature]。"]],"input":"x: Tensor [B, T, input_size]","output":"logits: Tensor [B, num_classes]","code":"import torch\nimport torch.nn as nn\n\nclass LSTMClassifier(nn.Module):\n    def __init__(self, input_size, hidden_size=64,\n                 num_layers=2, num_classes=2, dropout=0.2):\n        super().__init__()\n        self.lstm = nn.LSTM(input_size, hidden_size, num_layers,\n                            batch_first=True,\n                            dropout=dropout if num_layers > 1 else 0)\n        self.head = nn.Linear(hidden_size, num_classes)\n\n    def forward(self, x, lengths=None):\n        out, (h_n, c_n) = self.lstm(x)\n        # h_n: [num_layers, B, H]，取最后一层的隐状态\n        return self.head(h_n[-1])\n\n# m = LSTMClassifier(16, 64, 2, 3)\n# y = m(torch.randn(4, 20, 16))   # -> [4, 3]"},
  {"id":"self-attention","name":"多头自注意力","en":"Multi-Head Attention","cat":"深度学习核心","diff":"高难","summary":"用缩放点积注意力并行建模序列全局依赖，多头机制在不同子空间捕捉关系，是现代大模型核心结构。","scenes":["序列建模","预训练模型","长距离依赖"],"idea":["线性投影得到 Q / K / V，按头切分","缩放点积 + 可选掩码 + Softmax 归一化","加权求和、拼接多头并做一次线性变换"],"deps":"PyTorch 2.3","updated":"2026-11-08","lang":"Python 3 · PyTorch","math":{"title":"缩放点积注意力与多头投影","formulas":["Q = XW_Q,  K = XW_K,  V = XW_V,    d_k = d_model / h","Attention(Q,K,V) = softmax( QKᵀ / √d_k + M ) V","MultiHead = Concat(head₁,…,head_h) W_O,   headᵢ = Attention(QWᵢ^Q, KWᵢ^K, VWᵢ^V)"],"steps":["点积衡量查询与键的相似度；除以 √d_k 是因为 d_k 维点积方差约 d_k，不缩放会让 Softmax 饱和、梯度趋零。","掩码 M 在被屏蔽位置填 −1e9（代码 masked_fill(mask==0, -1e9)），必须在 Softmax 之前加。","qkv = Linear(d_model, 3·d_model) 一次算出 Q/K/V，chunk(3) 切开；view/transpose 完成按头切分。"],"tex":["Q = XW_Q,\\quad K = XW_K,\\quad V = XW_V,\\quad d_k = \\frac{d_{model}}{h}","\\text{Attention}(Q,K,V) = \\text{softmax}\\left(\\frac{QK^{T}}{\\sqrt{d_k}} + M\\right)V","\\text{MultiHead} = \\text{Concat}(\\text{head}_1,…,\\text{head}_h)W_O,\\quad \\text{head}_i = \\text{Attention}(QW_i^{Q},KW_i^{K},VW_i^{V})"]},"params":[["d_model","int","512","模型/隐层维度，正整数，默认 512，须能被 n_heads 整除。越大表达越强但参数越多。"],["n_heads","int","8","注意力头数，正整数，默认 8。多头并行捕捉不同子空间关系；须整除 d_model。"],["dropout","float","0.1","注意力权重 dropout，0–1，默认 0.1。越大正则越强。"],["mask","Tensor|None","None","注意力掩码张量或 None。None（默认）不屏蔽；0 位置被屏蔽（如 padding 或因果掩码），形状需可广播。"]],"input":"x: Tensor [B, N, D]；mask 可选","output":"out: Tensor [B, N, D]，与输入形状一致","code":"import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass MultiHeadAttention(nn.Module):\n    def __init__(self, d_model=512, n_heads=8, dropout=0.1):\n        super().__init__()\n        assert d_model % n_heads == 0\n        self.n_heads = n_heads\n        self.d_k = d_model // n_heads\n        self.qkv = nn.Linear(d_model, 3 * d_model)\n        self.out = nn.Linear(d_model, d_model)\n        self.dropout = nn.Dropout(dropout)\n\n    def forward(self, x, mask=None):\n        b, n, _ = x.shape\n        q, k, v = self.qkv(x).chunk(3, dim=-1)\n        q = q.view(b, n, self.n_heads, self.d_k).transpose(1, 2)\n        k = k.view(b, n, self.n_heads, self.d_k).transpose(1, 2)\n        v = v.view(b, n, self.n_heads, self.d_k).transpose(1, 2)\n        scores = (q @ k.transpose(-2, -1)) / (self.d_k ** 0.5)\n        if mask is not None:\n            scores = scores.masked_fill(mask == 0, -1e9)\n        attn = self.dropout(F.softmax(scores, dim=-1))\n        out = (attn @ v).transpose(1, 2).contiguous().view(b, n, -1)\n        return self.out(out)\n\n# m = MultiHeadAttention(64, 4)\n# out = m(torch.randn(2, 16, 64))   # -> [2, 16, 64]"},
  {"id":"transformer-block","name":"Transformer Encoder Block","en":"Transformer Block","cat":"进阶高难实现","diff":"高难","summary":"把多头注意力、残差连接、层归一化与前馈网络组合成可堆叠的编码器块，是 BERT 类模型的基本单元。","scenes":["预训练语言模型","编码器堆叠","特征交互建模"],"idea":["Pre-LN：先归一化再进子层，训练更稳定","子层输出加残差，再接 Dropout","逐位置前馈网络做非线性变换"],"deps":"PyTorch 2.3","updated":"2026-11-09","lang":"Python 3 · PyTorch","math":{"title":"残差连接与 Pre-LN","formulas":["Pre-LN： x′ = x + Dropout( MHA( LN(x) ) )","x″ = x′ + Dropout( FFN( LN(x′) ) ),    FFN(z) = W₂ GELU(W₁z + b₁) + b₂","∂L/∂x = ∂L/∂x′ · (1 + ∂F/∂x)  ⇒  恒等分支保证梯度不消失"],"steps":["深层堆叠时残差的 \"+1\" 项让梯度至少有一条不经变换的通路，因此能训练几十层。","Pre-LN（先归一化再进子层）比 Post-LN 训练更稳，通常不需要冗长的 warmup。","代码 norm1→attn→残差、norm2→ffn→残差 与公式逐行对应；d_ff 一般取 4·d_model。"],"tex":["x′ = x + \\text{Dropout}\\left(\\text{MHA}\\left(\\text{LN}(x)\\right)\\right)","x″ = x′ + \\text{Dropout}\\left(\\text{FFN}\\left(\\text{LN}(x′)\\right)\\right),\\quad \\text{FFN}(z) = W_2\\,\\text{GELU}(W_1 z + b_1) + b_2","\\frac{\\partial L}{\\partial x} = \\frac{\\partial L}{\\partial x′}\\left(1 + \\frac{\\partial F}{\\partial x}\\right) ⇒ \\text{恒等分支保证梯度不消失}"]},"params":[["d_model","int","512","模型维度，正整数，默认 512。越大表达越强但参数/计算越多。"],["n_heads","int","8","注意力头数，正整数，默认 8，须整除 d_model。多头并行捕捉不同子空间关系。"],["d_ff","int","2048","前馈网络隐层维度，正整数，默认 2048（通常为 d_model 的 4 倍）。越大容量越强但参数更多。"],["dropout","float","0.1","各子层 dropout 概率，0–1，默认 0.1。越大正则越强、抗过拟合。"]],"input":"x: Tensor [B, N, D]；src_key_padding_mask 可选","output":"out: Tensor [B, N, D]","code":"import torch\nimport torch.nn as nn\n\nclass EncoderBlock(nn.Module):\n    def __init__(self, d_model=512, n_heads=8, d_ff=2048, dropout=0.1):\n        super().__init__()\n        self.norm1 = nn.LayerNorm(d_model)\n        self.attn = nn.MultiheadAttention(d_model, n_heads,\n                                         dropout=dropout, batch_first=True)\n        self.norm2 = nn.LayerNorm(d_model)\n        self.ffn = nn.Sequential(nn.Linear(d_model, d_ff), nn.GELU(),\n                                 nn.Dropout(dropout),\n                                 nn.Linear(d_ff, d_model))\n        self.drop = nn.Dropout(dropout)\n\n    def forward(self, x, key_padding_mask=None):\n        h = self.norm1(x)\n        h, _ = self.attn(h, h, h, key_padding_mask=key_padding_mask)\n        x = x + self.drop(h)                       # 残差 1\n        h = self.norm2(x)\n        return x + self.drop(self.ffn(h))          # 残差 2\n\nclass Encoder(nn.Module):\n    def __init__(self, num_layers=6, **kw):\n        super().__init__()\n        self.layers = nn.ModuleList([EncoderBlock(**kw)\n                                    for _ in range(num_layers)])\n    def forward(self, x, mask=None):\n        for layer in self.layers:\n            x = layer(x, mask)\n        return x\n\n# enc = Encoder(6, d_model=64, n_heads=4, d_ff=256)\n# out = enc(torch.randn(2, 16, 64))"},
  {"id":"vae","name":"变分自编码器 VAE","en":"VAE","cat":"进阶高难实现","diff":"高难","summary":"把输入编码为高斯分布参数，用重参数化采样后重建；损失 = 重建误差 + KL 散度，可生成新样本。","scenes":["生成建模","表示学习","异常检测"],"idea":["编码器输出 mu 与 logvar","重参数化 z = mu + eps·exp(0.5·logvar) 使梯度可回传","最小化 BCE/MSE 重建损失与 KL(q||N(0,1))"],"deps":"PyTorch 2.3","updated":"2026-11-01","lang":"Python 3 · PyTorch","math":{"title":"变分下界与重参数化","formulas":["ELBO： L(θ,φ) = E_{q_φ(z|x)}[ln p_θ(x|z)] − D_KL( q_φ(z|x) ‖ p(z) ),   p(z) = N(0,I)","q_φ(z|x) = N(μ, diag(σ²)),    D_KL = −½ Σⱼ (1 + ln σⱼ² − μⱼ² − σⱼ²)","重参数化： z = μ + σ ⊙ ε,   ε ~ N(0,I)  ⇒  ∂z/∂φ 可导"],"steps":["后验 p(z|x) 难解，用可训练的高斯 q_φ 近似；最大化 ELBO 等价于同时优化重建项与 KL 正则。","直接对分布采样不可导，把随机性移到 ε 上，z 变成 μ、σ 的确定性函数，梯度才能回传到编码器。","代码输出 logvar = ln σ²（数值更稳）；vae_loss 中 BCE 是重建项、KLD 是解析算出的 KL 项。"],"tex":["\\text{ELBO}:\\quad L(θ,φ) = E_{q_φ(z|x)}\\left[\\ln p_θ(x|z)\\right] − D_{KL}\\left(q_φ(z|x) ‖ p(z)\\right),\\quad p(z)=N(0,I)","q_φ(z|x) = N(μ, \\text{diag}(σ^{2})),\\quad D_{KL} = −\\frac{1}{2}\\sum_j \\left(1 + \\ln σ_j^{2} − μ_j^{2} − σ_j^{2}\\right)","z = μ + σ ⊙ ε,\\quad ε ∼ N(0,I) ⇒ \\frac{\\partial z}{\\partial φ}\\quad \\text{可导}"]},"params":[["in_dim","int","784","输入向量维度（如 784=28×28 展平），正整数；决定编码器首层与解码器末层尺寸，无单位。"],["hidden","int","400","编码/解码隐层宽度，正整数，默认 400。越大容量越强但更慢。"],["z_dim","int","20","潜变量维度，正整数，默认 20。越大表达越丰富但更难训练、可能偏离先验。"],["beta","float","1.0","KL 项权重（β-VAE），正浮点数，默认 1.0。越大越强调潜空间规整、解耦更好但重建略差。"]],"input":"x: Tensor [B, in_dim]，值建议归一化到 [0,1]","output":"recon, mu, logvar；vae_loss(x, ...) 返回总损失","code":"import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass VAE(nn.Module):\n    def __init__(self, in_dim=784, hidden=400, z_dim=20):\n        super().__init__()\n        self.enc = nn.Sequential(nn.Linear(in_dim, hidden), nn.ReLU())\n        self.mu = nn.Linear(hidden, z_dim)\n        self.logvar = nn.Linear(hidden, z_dim)\n        self.dec = nn.Sequential(nn.Linear(z_dim, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, in_dim), nn.Sigmoid())\n\n    def reparameterize(self, mu, logvar):\n        std = torch.exp(0.5 * logvar)\n        return mu + std * torch.randn_like(std)\n\n    def forward(self, x):\n        h = self.enc(x)\n        mu, logvar = self.mu(h), self.logvar(h)\n        return self.dec(self.reparameterize(mu, logvar)), mu, logvar\n\ndef vae_loss(x, recon, mu, logvar, beta=1.0):\n    bce = F.binary_cross_entropy(recon, x, reduction=\"sum\") / x.size(0)\n    kld = -0.5 * torch.mean(1 + logvar - mu.pow(2) - logvar.exp())\n    return bce + beta * kld, bce, kld\n\n# m = VAE(); recon, mu, lv = m(x); loss, _, _ = vae_loss(x, recon, mu, lv)"},
  {"id":"lora","name":"LoRA 低秩微调","en":"LoRA","cat":"LLM 与参数高效微调","diff":"高难","summary":"冻结预训练权重，仅训练注入的低秩增量矩阵 BA，用极小参数量完成大模型下游适配。","scenes":["参数高效微调","大模型下游适配","显存受限训练"],"idea":["冻结原权重 W，旁路加 B·A（r ≪ d）","缩放因子 alpha/r 控制增量幅度，A 随机初始化、B 置零","只优化 A、B；推理时可把 BA 合并回 W，零额外延迟"],"deps":"PyTorch 2.3 / peft","updated":"2026-11-05","lang":"Python 3 · PyTorch / PEFT","math":{"title":"低秩增量与参数量压缩","formulas":["W ∈ R^{d×k} 冻结,   ΔW = B A,   B ∈ R^{d×r}, A ∈ R^{r×k},   r ≪ min(d,k)","h = W x + (α/r) · B A x","可训练参数从 d·k 降到 r(d+k)： d=k=768, r=8 时为 12288/589824 ≈ 2.1%"],"steps":["假设下游适配的权重更新具有低内在秩，用两个瘦矩阵的乘积来近似 ΔW。","A 用 Kaiming 初始化、B 初始化为 0，保证训练起点 ΔW = 0，模型行为与原模型完全一致。","merge() 把 (α/r)·BA 加回 W 得到普通 Linear，推理零额外延迟；代码只放开 A、B 的 requires_grad。"],"tex":["W ∈ R^{d×k}\\quad \\text{冻结},\\quad ΔW = BA,\\quad B ∈ R^{d×r},\\quad A ∈ R^{r×k},\\quad r ≪ \\min(d,k)","h = Wx + \\frac{α}{r}BAx","dk → r(d+k):\\quad 768×768 → 8(768+768) ⇒ \\text{约 } 2.1%"]},"params":[["r","int","8","低秩秩数，正整数，默认 8。越小新增参数越少、越省显存但表达力越弱；越大越接近全量微调。"],["alpha","int","16","缩放系数，正整数，默认 16。控制 LoRA 分支对输出的影响幅度（常取 alpha/r）；越大更新幅度越大。"],["dropout","float","0.05","LoRA 分支 dropout，0–1，默认 0.05。越大正则越强。"],["target_modules","list","—","要替换为 LoRA 的线性层名称列表，如 [q_proj,v_proj]。选择注意力/前馈层决定适配范围。"]],"input":"x: Tensor [B, N, in_features]；base_layer 为冻结的 nn.Linear","output":"out: Tensor [B, N, out_features]，形状与原层一致","code":"import math\nimport torch\nimport torch.nn as nn\n\nclass LoRALinear(nn.Module):\n    def __init__(self, base: nn.Linear, r=8, alpha=16, dropout=0.05):\n        super().__init__()\n        self.base = base\n        for p in self.base.parameters():\n            p.requires_grad_(False)               # 冻结预训练权重\n        self.A = nn.Parameter(torch.empty(r, base.in_features))\n        self.B = nn.Parameter(torch.zeros(base.out_features, r))\n        nn.init.kaiming_uniform_(self.A, a=math.sqrt(5))\n        self.scaling = alpha / r\n        self.drop = nn.Dropout(dropout)\n\n    def forward(self, x):\n        return self.base(x) + self.drop(x) @ self.A.T @ self.B.T * self.scaling\n\n    def merge(self):\n        # 推理前把 BA 合并回原权重，去掉额外计算\n        with torch.no_grad():\n            self.base.weight += (self.B @ self.A) * self.scaling\n        return self.base\n\ndef trainable_params(model):\n    return sum(p.numel() for p in model.parameters() if p.requires_grad)\n\n# base = nn.Linear(768, 768); layer = LoRALinear(base, r=8)\n# out = layer(torch.randn(2, 16, 768))"},
  {"id":"ddpm","name":"扩散模型 DDPM（简化）","en":"Denoising Diffusion","cat":"进阶高难实现","diff":"高难","summary":"前向逐步加噪、反向学习去噪；训练目标是预测被加入的噪声，采样时从纯高斯噪声迭代还原图像。","scenes":["图像生成","数据增强","生成模型研究"],"idea":["按 beta schedule 预计算 alphas_cumprod","随机时间步 t，构造 x_t = sqrt(a)·x0 + sqrt(1-a)·eps","用 MSE 训练 noise predictor；采样时逐步减去预测噪声"],"deps":"PyTorch 2.3","updated":"2026-11-10","lang":"Python 3 · PyTorch","math":{"title":"前向加噪、反向去噪与训练目标","formulas":["q(xₜ|xₜ₋₁) = N( √(1−βₜ) xₜ₋₁, βₜ I ),    ᾱₜ = Π_{s≤t}(1−β_s)","xₜ = √ᾱₜ · x₀ + √(1−ᾱₜ) · ε,    ε ~ N(0,I)","L = E_{t,x₀,ε} ‖ ε − ε_θ(xₜ, t) ‖²","xₜ₋₁ = (xₜ − βₜ/√(1−ᾱₜ) · ε_θ) / √(1−βₜ) + σₜ z"],"steps":["ᾱₜ 可预计算，所以任意时刻 t 的加噪样本能一步采样出来，无需循环 T 次。","去噪网络不预测图像本身，而是预测被加进去的噪声 ε；简化后训练目标就是普通 MSE。","代码 q_sample 对应第 2 式、loss 对应第 3 式、sample 循环对应第 4 式；a_bar 即 ᾱₜ。"],"tex":["q(x_t|x_{t−1}) = N\\left(\\sqrt{1−β_t}\\,x_{t−1},\\quad β_t I\\right),\\quad ᾱ_t = \\prod_{s ≤ t}(1−β_s)","x_t = \\sqrt{ᾱ_t}\\,x_0 + \\sqrt{1−ᾱ_t}\\,ε,\\quad ε ∼ N(0,I)","L = E_{t,x_0,ε} ‖ε − ε_θ(x_t,t)‖^{2}","x_{t−1} = \\frac{x_t − \\frac{β_t}{\\sqrt{1−ᾱ_t}}ε_θ}{\\sqrt{1−β_t}} + σ_t z"]},"params":[["timesteps","int","1000","扩散总步数 T，正整数，默认 1000。越大生成越精细但采样越慢。"],["beta_start","float","1e-4","起始噪声方差 β，正浮点数，默认 1e-4。越小初期加噪越轻、细节保留越多。"],["beta_end","float","0.02","终止噪声方差 β，正浮点数，默认 0.02。越大最终越接近纯噪声。"],["model","nn.Module","—","去噪网络 nn.Module，输入 (x_t, t) 输出同形状的噪声预测。需自行定义 U-Net 等结构。"]],"input":"x0: Tensor [B, C, H, W]（归一化到 [-1,1]）；t: Tensor [B]","output":"训练：loss 标量；采样：Tensor [B, C, H, W]","code":"import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass DDPM:\n    def __init__(self, model, timesteps=1000,\n                 beta_start=1e-4, beta_end=0.02, device=\"cpu\"):\n        self.model, self.T, self.device = model, timesteps, device\n        betas = torch.linspace(beta_start, beta_end, timesteps, device=device)\n        alphas = 1.0 - betas\n        self.a_bar = torch.cumprod(alphas, dim=0)\n\n    def q_sample(self, x0, t, noise=None):\n        noise = noise or torch.randn_like(x0)\n        a = self.a_bar[t].view(-1, *([1] * (x0.dim() - 1)))\n        return a.sqrt() * x0 + (1 - a).sqrt() * noise, noise\n\n    def loss(self, x0):\n        b = x0.size(0)\n        t = torch.randint(0, self.T, (b,), device=x0.device)\n        xt, noise = self.q_sample(x0, t)\n        return F.mse_loss(self.model(xt, t), noise)\n\n    @torch.no_grad()\n    def sample(self, shape):\n        self.model.eval()\n        x = torch.randn(shape, device=self.device)\n        for t in reversed(range(self.T)):\n            tt = torch.full((shape[0],), t, device=self.device, dtype=torch.long)\n            eps = self.model(x, tt)\n            a, a_prev = self.a_bar[t], self.a_bar[max(t - 1, 0)]\n            beta = 1 - a / a_prev\n            x = (x - beta / (1 - a).sqrt() * eps) / (1 - beta).sqrt()\n            if t > 0:\n                x = x + beta.sqrt() * torch.randn_like(x)\n        return x.clamp(-1, 1)\n\n# model = MyUNetWithTimeEmbedding()\n# ddpm = DDPM(model); loss = ddpm.loss(x0); imgs = ddpm.sample((4, 3, 32, 32))"},
  {"id":"gbdt","name":"GBDT 梯度提升决策树","en":"Gradient Boosting Decision Trees","cat":"树模型与集成学习","diff":"进阶","summary":"串行训练 CART 回归树去拟合当前模型的负梯度（伪残差），用 shrinkage 累加成加性模型；XGBoost / LightGBM 都是它的工程化演进。","scenes":["表格数据回归与分类","非线性特征拟合","竞赛强基线"],"idea":["初始化 F₀ = argmin_γ Σ L(yᵢ, γ)，通常取标签均值或对数几率","每轮计算伪残差 rᵢₘ = −∂L/∂F(xᵢ)，用一棵深度受限的树 hₘ 去拟合它","Fₘ = Fₘ₋₁ + ν·hₘ，ν 是学习率；用多棵弱树逐步降低偏差"],"deps":"scikit-learn 1.4","updated":"2026-11-14","lang":"Python 3 · scikit-learn","math":{"title":"加性模型与函数空间梯度下降","formulas":["F_M(x) = F₀(x) + ν Σ_{m=1}^{M} h_m(x)，h_m 为 CART 回归树","r_{im} = −[∂L(y_i, F(x_i)) / ∂F(x_i)]，平方损失时 r = y − ŷ 即普通残差","F_m = F_{m−1} + ν·h_m，ν ∈ (0,1] 称 shrinkage（学习率）"],"steps":["把模型看成一个函数 F，梯度提升就是在函数空间里做梯度下降，每棵树是负梯度方向的一个近似。","平方损失下 −∂L/∂F = y − ŷ，正好是残差；交叉熵下则是 y − p，统一了分类与回归。","代码里 learning_rate 对应 ν、n_estimators 对应 M；staged_predict_proba 可逐轮查看加性模型收敛。"],"tex":["F_M(x) = F_0(x) + ν\\sum_{m=1}^{M} h_m(x),\\quad h_m \\text{ 为 CART 回归树}","r_{im} = −\\frac{\\partial L(y_i,F(x_i))}{\\partial F(x_i)}\\quad (\\text{平方损失时 } r = y − ŷ)","F_m = F_{m−1} + ν h_m,\\quad ν ∈ (0,1]\\ \\text{为学习率}"]},"params":[["n_estimators","int","100","提升轮数，正整数，默认 100。越多拟合越强但易过拟合、变慢。"],["learning_rate","float","0.1","学习率，0–1，常用 0.01–0.2。越小需越多树、泛化更好；越大越快易过拟合。默认 0.1。"],["max_depth","int","3","单树最大深度，正整数，默认 3。浅树（3–5）通常更稳，深树易过拟合。"],["subsample","float","1.0","每轮建树的行采样比例，0–1，默认 1.0（用全部样本）。<1 引入随机性、降方差抗过拟合。"]],"input":"X_train: array [n, d]；y_train: 0/1 或连续值","output":"model.predict_proba(X)[:, 1]；staged_predict_proba 返回逐轮预测","code":"import numpy as np\nfrom sklearn.ensemble import GradientBoostingClassifier\nfrom sklearn.metrics import roc_auc_score\n\ndef gbdt_fit(X_train, y_train, X_valid, y_valid, n=200, lr=0.05):\n    model = GradientBoostingClassifier(\n        n_estimators=n, learning_rate=lr, max_depth=3,\n        subsample=0.8, random_state=42)\n    model.fit(X_train, y_train)\n    proba = model.predict_proba(X_valid)[:, 1]\n    print(\"AUC:\", roc_auc_score(y_valid, proba))\n    # staged_predict_proba 逐轮观察加性模型 F_m 的收敛\n    curve = np.array([roc_auc_score(y_valid, p[:, 1])\n                      for p in model.staged_predict_proba(X_valid)])\n    return model, curve\n\n# 调用：m, curve = gbdt_fit(X_tr, y_tr, X_va, y_va)"},
  {"id":"svm","name":"支持向量机 SVM","en":"Support Vector Machine","cat":"基础与线性模型","diff":"进阶","summary":"寻找最大化间隔的超平面；通过核技巧把样本隐式映射到高维空间，最终决策边界只由少量支持向量决定。","scenes":["小样本高维分类","文本与生物信息","核方法基线"],"idea":["软间隔目标：最小化 ½‖w‖² + CΣξᵢ，约束 yᵢ(wᵀφ(xᵢ)+b) ≥ 1−ξᵢ","拉格朗日对偶把 w 写成 Σαᵢyᵢφ(xᵢ)，仅 αᵢ>0 的样本是支持向量","用核函数 K(xᵢ,xⱼ)=φ(xᵢ)ᵀφ(xⱼ) 代替显式高维映射，RBF 最常用"],"deps":"scikit-learn 1.4","updated":"2026-11-14","lang":"Python 3 · scikit-learn","math":{"title":"最大间隔、对偶与核技巧","formulas":["min_{w,b,ξ} ½‖w‖² + C Σᵢ ξᵢ，s.t. yᵢ(wᵀφ(xᵢ)+b) ≥ 1−ξᵢ, ξᵢ ≥ 0","max_α Σᵢ αᵢ − ½ Σᵢⱼ αᵢαⱼ yᵢyⱼ K(xᵢ,xⱼ)，s.t. 0 ≤ αᵢ ≤ C, Σᵢ αᵢyᵢ = 0","f(x) = sign(Σ_{i∈SV} αᵢ yᵢ K(xᵢ,x) + b)，RBF: K = exp(−γ‖x−x′‖²)"],"steps":["最大化间隔 2/‖w‖ 等价于最小化 ½‖w‖²；松弛变量 ξ 允许少量误分类，C 控制惩罚强度。","对偶后优化变量只有 α，且目标只出现样本内积，因此可以用核函数替换内积而不必显式构造 φ。","代码 svc.support_ 给出支持向量下标；gamma 越大 RBF 越窄、模型越容易过拟合。"],"tex":["\\min_{w,b,ξ}\\ \\frac{1}{2}‖w‖^{2} + C\\sum_i ξ_i,\\quad y_i(w^{T}φ(x_i)+b) ≥ 1−ξ_i","\\max_{α}\\ \\sum_i α_i − \\frac{1}{2}\\sum_{i,j} α_i α_j y_i y_j K(x_i,x_j)","f(x) = \\text{sign}\\left(\\sum_{i ∈ SV} α_i y_i K(x_i,x) + b\\right),\\quad K_{\\text{RBF}} = e^{−γ‖x−x′‖^{2}}"]},"params":[["C","float","1.0","惩罚系数，正浮点数，常用 0.1–100。C 越大越不允许误分类、间隔变窄易过拟合；C 越小允许更多容错、间隔更宽但可能欠拟合。默认 1.0，无单位。"],["kernel","str","rbf","核函数。rbf（默认，径向基，适合非线性）、linear（线性）、poly（多项式）、sigmoid。非线性数据优先用 rbf。"],["gamma","float/str","scale","RBF/多项式核系数，正浮点数或 scale/auto。gamma 越大单个样本影响范围越小、边界越弯曲易过拟合；越小影响范围越大、边界越平缓。默认 scale（≈1/(d·Var(X))）。"],["probability","bool","False","是否启用概率估计。true 会做内部交叉验证输出类别概率、训练更慢；false（默认）只输出决策值、更快。"]],"input":"X_train: array [n, d]（务必标准化）；y_train: 类别标签","output":"model.predict(X)；svc.support_ 支持向量下标；decision_function 间隔距离","code":"import numpy as np\nfrom sklearn.svm import SVC\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.metrics import classification_report\n\ndef svm_fit(X_train, y_train, X_test, y_test, C=1.0, gamma=\"scale\"):\n    # SVM 对尺度敏感，标准化必须放进 pipeline\n    model = make_pipeline(StandardScaler(),\n                          SVC(C=C, gamma=gamma, kernel=\"rbf\",\n                              probability=True, random_state=42))\n    model.fit(X_train, y_train)\n    print(classification_report(y_test, model.predict(X_test)))\n    svc = model[-1]\n    print(\"support vectors per class:\", svc.n_support_)\n    return model, svc.support_\n\n# 调用：m, sv_idx = svm_fit(X_tr, y_tr, X_te, y_te, C=10)"},
  {"id":"naive-bayes","name":"朴素贝叶斯 NB","en":"Naive Bayes","cat":"基础与线性模型","diff":"入门","summary":"基于贝叶斯定理与「特征条件独立」假设的生成式分类器；训练只需统计频次，速度极快，对高维稀疏文本特别友好。","scenes":["文本分类与垃圾邮件","高维稀疏特征","小样本快速基线"],"idea":["由训练集统计先验 P(c) 与类条件概率 P(x_j|c)","条件独立假设把 P(x|c) 拆成 ∏_j P(x_j|c)","取最大后验，实际计算用对数求和避免概率连乘下溢"],"deps":"scikit-learn 1.4","updated":"2026-11-14","lang":"Python 3 · scikit-learn","math":{"title":"贝叶斯定理与条件独立假设","formulas":["P(c|x) = P(c)P(x|c)/P(x) ∝ P(c) ∏_{j=1}^{d} P(x_j|c)","ŷ = argmax_c [ ln P(c) + Σ_j ln P(x_j|c) ]","多项式模型：P(x_j|c) = (N_{jc}+α)/(N_c+αd)，α 为拉普拉斯平滑"],"steps":["分母 P(x) 对所有类别相同，比较时可省略，只需算先验与似然的乘积。","「朴素」就在于假设各特征在给定类别下独立，现实中常不成立，但分类排序依然往往有效。","代码 predict_log_proba 返回的就是 ln P(c)+Σ ln P(x_j|c) 归一化后的结果；var_smoothing 防止方差为 0。"],"tex":["P(c|x) = \\frac{P(c)P(x|c)}{P(x)} ∝ P(c)\\prod_{j=1}^{d} P(x_j|c)","ŷ = \\text{argmax}_c\\left[\\ln P(c) + \\sum_j \\ln P(x_j|c)\\right]","P(x_j|c) = \\frac{N_{jc}+α}{N_c+αd}\\quad (\\text{拉普拉斯平滑 } α>0)"]},"params":[["alpha","float","1.0","拉普拉斯（加法）平滑系数，非负浮点数，常用 1e-10–1.0。越大平滑越强、抑制零概率但可能过度平滑；越小越贴近数据。默认 1.0，无单位。"],["var_smoothing","float","1e-9","方差平滑项，正浮点数，默认 1e-9。为所有特征方差加上该比例的最大方差以提升数值稳定性，通常无需改动。"],["fit_prior","bool","True","是否从数据学习类先验。true（默认）用样本中的类别频率；false 使用均匀先验。类别极不均衡时可酌情调整。"],["priors","array","None","自定义类先验概率数组，长度等于类别数、元素和为 1。None（默认）表示由 fit_prior 决定；已知先验时手动指定可改善概率校准。"]],"input":"X_train: array [n, d]（文本用词频矩阵）；y_train: 类别标签","output":"model.predict(X)；predict_log_proba(X) 返回对数后验","code":"import numpy as np\nfrom sklearn.naive_bayes import GaussianNB, MultinomialNB\nfrom sklearn.metrics import accuracy_score\n\ndef nb_fit(X_train, y_train, X_test, y_test):\n    model = GaussianNB(var_smoothing=1e-9)\n    model.fit(X_train, y_train)\n    pred = model.predict(X_test)\n    print(\"acc:\", accuracy_score(y_test, pred))\n    # joint_log_likelihood = ln P(c) + Σ ln P(x_j|c)\n    logp = model.predict_log_proba(X_test[:3])\n    return model, logp\n\ndef nb_text_fit(counts, y_train):\n    \"\"\"词频矩阵用多项式模型 + 拉普拉斯平滑\"\"\"\n    return MultinomialNB(alpha=1.0).fit(counts, y_train)\n\n# 调用：m, logp = nb_fit(X_tr, y_tr, X_te, y_te)"},
