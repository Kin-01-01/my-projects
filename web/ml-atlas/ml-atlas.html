  {"id":"rmsprop","name":"RMSProp 均方根传播","en":"RMSProp","cat":"优化·度量·迁移学习","diff":"进阶","summary":"把 AdaGrad 的「无限累加」改成「指数滑动平均」，让分母只反映近期梯度尺度，解决了后期停滞；它正是 Adam 的一半。","scenes":["非平稳目标","RNN 训练","理解 Adam"],"idea":["v ← βv + (1−β)g²，β 取 0.9 左右","θ ← θ − η·g/√(v+ε)","分母只记「最近一段」的梯度幅度，因此步长不会单调趋零"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"移动平均分母","formulas":["v_t = β·v_{t−1} + (1−β)·g_t²","θ_{t+1} = θ_t − η·g_t / √(v_t + ε)","β=0.9 时有效窗口约 1/(1−β)=10 步"],"steps":["与 AdaGrad 的唯一实质区别就是 v 的更新方式：累积改成滑动平均，于是梯度变小后分母也会跟着变小，训练不会停。","β 越大窗口越长、越平滑，但对尺度突变更迟钝；0.9 是通用默认，RNN 上常取 0.95。","加动量版（PyTorch 默认 momentum=0）在大批量训练时能进一步抑制抖动。"],"tex":["v_{t} = \\beta v_{t-1}+(1-\\beta)g_{t}^{2}","\\theta_{t+1} = \\theta_{t}-\\frac{\\eta\\,g_{t}}{\\sqrt{v_{t}+\\varepsilon}}","\\beta=0.9\\Rightarrow\\frac{1}{1-\\beta}=10\\text{ 步有效窗口}"]},"params":[["lr","float","0.001","学习率，正浮点数，默认 0.001。分母已被归一化，所以基础值比 SGD 小两个数量级。"],["beta","float","0.9","平方梯度的滑动平均系数，0–1，默认 0.9。越大窗口越长、步长越平稳；RNN 上常用 0.95。"],["eps","float","1e-8","数值稳定项，正浮点数，默认 1e-8。防止梯度极小时分母趋零导致爆步。"],["momentum","float","0.0","动量系数，0–1，默认 0（关闭）。设 0.9 相当于「RMSProp + 动量」，大批量训练时更稳。"]],"input":"grad_fn(theta) 与初始 theta","output":"theta: 优化后参数；可记录逐坐标有效步长","code":"import numpy as np\n\nclass RMSProp:\n    def __init__(self, lr=1e-3, beta=0.9, eps=1e-8, momentum=0.0):\n        self.lr, self.beta, self.eps, self.mu = lr, beta, eps, momentum\n\n    def step(self, theta, grad, t):\n        if not hasattr(self, 'v'):\n            self.v = np.zeros_like(theta)\n            self.buf = np.zeros_like(theta)\n        self.v = self.beta * self.v + (1 - self.beta) * grad ** 2   # 滑动平均，不再单调增\n        self.buf = self.mu * self.buf + grad / np.sqrt(self.v + self.eps)\n        return theta - self.lr * self.buf\n\nif __name__ == '__main__':\n    A = np.diag([1.0, 100.0])                        # 病态二次函数\n    for name, cls in [('AdaGrad(累积)', 'adagrad'), ('RMSProp(滑动)', 'rmsprop')]:\n        theta = np.array([9.0, 9.0])\n        if cls == 'adagrad':\n            G = np.zeros(2)\n            for t in range(300):\n                g = A @ theta\n                G += g ** 2\n                theta = theta - 0.5 * g / np.sqrt(G + 1e-8)\n        else:\n            opt = RMSProp(lr=0.05)\n            for t in range(300):\n                theta = opt.step(theta, A @ theta, t)\n        print(f'{name}: 300 步后 loss={0.5*theta@A@theta:.6f}  theta={np.round(theta,4)}')\n    print('说明：AdaGrad 后期步长被累积分母压死，RMSProp 仍能继续收敛。')"},
  {"id":"adam","name":"Adam 自适应矩估计","en":"Adaptive Moment Estimation","cat":"优化·度量·迁移学习","diff":"入门","summary":"动量 + RMSProp 的结合：一阶矩估方向、二阶矩定步长，再加偏差修正让前期估计不发散。默认 lr=1e-3 通常就能用，是深度学习的默认选择。","scenes":["深度网络默认优化器","稀疏梯度","快速原型"],"idea":["m ← β₁m + (1−β₁)g 估梯度方向；v ← β₂v + (1−β₂)g² 估梯度尺度","偏差修正 m̂ = m/(1−β₁ᵗ)、v̂ = v/(1−β₂ᵗ)，修正初期偏向 0 的问题","θ ← θ − η·m̂/(√v̂+ε)"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"一阶/二阶矩与偏差修正","formulas":["m_t = β₁m_{t−1} + (1−β₁)g_t，v_t = β₂v_{t−1} + (1−β₂)g_t²","m̂_t = m_t/(1−β₁ᵗ)，v̂_t = v_t/(1−β₂ᵗ)","θ_{t+1} = θ_t − η·m̂_t/(√v̂_t + ε)"],"steps":["偏差修正这一步很关键：m、v 都从 0 初始化，前几步会严重偏向 0，除 (1−βᵗ) 才让早期步长正常。","Adam 的自适应步长对超参不敏感，但也因此在某些任务上泛化略逊于调好动量的 SGD —— 这是「自适应 vs 泛化」的常见权衡。","L2 正则直接加进 Adam 会被自适应分母一起缩放，效果被削弱，所以实践中用 AdamW（解耦权重衰减）。"],"tex":["m_{t} = \\beta_{1}m_{t-1}+(1-\\beta_{1})g_{t}","\\hat{m}_{t} = \\frac{m_{t}}{1-\\beta_{1}^{t}},\\quad \\hat{v}_{t} = \\frac{v_{t}}{1-\\beta_{2}^{t}}","\\theta_{t+1} = \\theta_{t}-\\frac{\\eta\\,\\hat{m}_{t}}{\\sqrt{\\hat{v}_{t}}+\\varepsilon}"]},"params":[["lr","float","0.001","学习率，正浮点数，默认 0.001。Adam 对学习率不敏感，1e-4~3e-3 都能跑；调参优先级低于其他超参。"],["beta1","float","0.9","一阶矩（动量）衰减率，0–1，默认 0.9。越大方向越平滑、对梯度突变越迟钝。"],["beta2","float","0.999","二阶矩衰减率，0–1，默认 0.999。越大步长尺度越稳定；稀疏梯度场景可降到 0.99。"],["eps","float","1e-8","数值稳定项，正浮点数，默认 1e-8。梯度极小时防止除零；混合精度训练建议放大到 1e-6。"],["weight_decay","float","0.0","权重衰减系数，非负浮点数，默认 0。建议用解耦版（AdamW）：θ ← θ − η·(m̂/(√v̂+ε) + λθ)。"]],"input":"grad_fn(theta) 与初始 theta","output":"theta: 优化后参数；可记录 m̂、v̂ 与有效步长","code":"import numpy as np\n\nclass Adam:\n    def __init__(self, lr=1e-3, beta1=0.9, beta2=0.999, eps=1e-8, weight_decay=0.0):\n        self.lr, self.b1, self.b2, self.eps, self.wd = lr, beta1, beta2, eps, weight_decay\n        self.t = 0\n\n    def step(self, theta, grad):\n        if not hasattr(self, 'm'):\n            self.m = np.zeros_like(theta); self.v = np.zeros_like(theta)\n        self.t += 1\n        self.m = self.b1 * self.m + (1 - self.b1) * grad       # 一阶矩：方向\n        self.v = self.b2 * self.v + (1 - self.b2) * grad ** 2  # 二阶矩：尺度\n        m_hat = self.m / (1 - self.b1 ** self.t)               # 偏差修正\n        v_hat = self.v / (1 - self.b2 ** self.t)\n        update = m_hat / (np.sqrt(v_hat) + self.eps)\n        if self.wd:                                            # 解耦权重衰减（AdamW 做法）\n            theta = theta - self.lr * self.wd * theta\n        return theta - self.lr * update\n\nif __name__ == '__main__':\n    # Rosenbrock 函数：经典的非凸病态测试函数\n    def rosen(t): return (1 - t[0]) ** 2 + 100 * (t[1] - t[0] ** 2) ** 2\n    def grad(t):\n        return np.array([-2 * (1 - t[0]) - 400 * t[0] * (t[1] - t[0] ** 2),\n                         200 * (t[1] - t[0] ** 2)])\n\n    for name, opt, steps in [('SGD(手动lr)', None, 4000), ('Adam', Adam(lr=0.01), 4000)]:\n        theta = np.array([-1.5, 1.5])\n        if opt is None:\n            for _ in range(steps):\n                theta = theta - 0.001 * grad(theta)      # 普通 SGD 在这个函数上极慢\n        else:\n            for _ in range(steps):\n                theta = opt.step(theta, grad(theta))\n        print(f'{name:12s} 4000 步后 f={rosen(theta):.8f}  theta={np.round(theta,4)}')\n\n    # 偏差修正的直观效果：第一步的有效步长应约等于 lr\n    a = Adam(lr=0.1)\n    th = np.zeros(1)\n    th2 = a.step(th, np.array([1.0]))\n    print('第一步位移（应≈lr=0.1）:', round(float(abs(th2[0])), 4))"},
  {"id":"newton","name":"牛顿法","en":"Newton's Method","cat":"优化·度量·迁移学习","diff":"进阶","summary":"用二阶信息（Hessian）直接跳到二次近似的最优点，收敛是二次的——误差每步平方级下降。代价是每次要算 H 并解线性方程组，参数一多就不可行。","scenes":["小规模凸优化","逻辑回归精调","理解拟牛顿与二阶方法"],"idea":["θ ← θ − H⁻¹∇L，H 是海森矩阵","二次函数上一步到位；一般情形在极小值附近二次收敛","拟牛顿法（BFGS/L-BFGS）用 B≈H 近似，避免显式算 H"],"deps":"numpy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"二阶更新与二次收敛","formulas":["θ_{t+1} = θ_t − H_t^{−1} ∇L(θ_t)","对二次函数 L = ½θᵀAθ − bᵀθ： 一步得到 θ* = A^{−1}b","误差递推 ‖θ_{t+1}−θ*‖ ≤ C‖θ_t−θ*‖²"],"steps":["一阶方法只看斜率，牛顿法还看曲率：曲率大的方向步子自动变小，因此对病态问题远快于 GD。","H 不一定正定（非凸区域），直接用会向鞍点走；所以要用阻尼/LM（H+λI）或线搜索保证下降。","参数量 n 时 H 是 n²、求逆是 n³ —— 这就是深度学习不用牛顿法的唯一原因；L-BFGS 用 m 对向量近似绕开了它。"],"tex":["\\theta_{t+1} = \\theta_{t}-H_{t}^{-1}\\nabla L(\\theta_{t})","L = \\tfrac{1}{2}\\theta^{\\top}A\\theta-b^{\\top}\\theta \\Rightarrow \\theta^{*}=A^{-1}b","\\lVert\\theta_{t+1}-\\theta^{*}\\rVert \\le C\\lVert\\theta_{t}-\\theta^{*}\\rVert^{2}"]},"params":[["max_iter","int","50","最大迭代数，正整数，默认 50。牛顿法收敛快，几十步足够；超过说明在非凸区域震荡。"],["tol","float","1e-8","梯度范数的停止阈值，正浮点数，默认 1e-8。"],["damping","float","0.0","Hessian 阻尼 λ（加在 H+λI 上），非负浮点数，默认 0。H 非正定时调大保证方向仍是下降方向。"],["line_search","bool","True","是否做回溯线搜索，默认 true。牛顿步可能过长导致损失上升，线搜索能兜住这种情况。"]],"input":"loss_fn(theta)、grad_fn(theta)、hess_fn(theta)","output":"theta: 最优点；history: 每步损失与梯度范数","code":"import numpy as np\n\ndef newton(loss, grad, hess, theta0, max_iter=50, tol=1e-8, damping=0.0, line_search=True):\n    theta = np.array(theta0, float)\n    hist = []\n    for it in range(max_iter):\n        g, H = grad(theta), hess(theta)\n        gn = np.linalg.norm(g)\n        hist.append((loss(theta), gn))\n        if gn < tol:\n            break\n        Hd = H + damping * np.eye(len(theta))        # 阻尼：H 非正定时也能解\n        step = -np.linalg.solve(Hd, g)               # 牛顿方向 = -H⁻¹g\n        if line_search:                              # 回溯线搜索，保证损失下降\n            t, cur = 1.0, loss(theta)\n            while t > 1e-8 and loss(theta + t * step) > cur + 1e-4 * t * g @ step:\n                t *= 0.5\n            step *= t\n        theta = theta + step\n    return theta, hist\n\nif __name__ == '__main__':\n    # 逻辑回归：给出解析的梯度与 Hessian\n    rng = np.random.RandomState(0)\n    X = rng.randn(300, 3)\n    w_true = np.array([1.2, -0.8, 0.5])\n    y = (X @ w_true + 0.5 * rng.randn(300) > 0).astype(float)\n\n    def sigmoid(z): return 1 / (1 + np.exp(-z))\n    def loss(w):\n        p = sigmoid(X @ w)\n        return float(-(y * np.log(p + 1e-12) + (1 - y) * np.log(1 - p + 1e-12)).mean())\n    def grad(w):\n        return X.T @ (sigmoid(X @ w) - y) / len(y)\n    def hess(w):\n        p = sigmoid(X @ w)\n        return (X.T * (p * (1 - p))) @ X / len(y)\n\n    w, h = newton(loss, grad, hess, np.zeros(3))\n    print('牛顿法：迭代 %d 步，最终 loss=%.8f' % (len(h), h[-1][0]))\n    print('参数:', np.round(w, 4))\n    print('每步梯度范数:', [f'{g:.2e}' for _, g in h])   # 二次收敛：范数平方级下降\n\n    # 一阶方法对照：需要多得多的步数\n    w2 = np.zeros(3)\n    for i in range(3000):\n        w2 -= 0.5 * grad(w2)\n    print('梯度下降 3000 步 loss=%.8f' % loss(w2))"},
  {"id":"conjugate-gradient","name":"共轭梯度法 CG","en":"Conjugate Gradient Method","cat":"优化·度量·迁移学习","diff":"进阶","summary":"不用 Hessian 的共轭方向法：每步方向与之前所有方向共轭（A-正交），理论上 n 步解出 n 维二次问题。适合大规模凸问题，尤其线性方程组与岭回归。","scenes":["大规模线性方程","岭回归求解","稀疏凸优化内层"],"idea":["p_0 = −g_0，每步沿 p_k 走到该方向的极小点","新方向与所有历史方向 A-共轭：p_{k+1} = −g_{k+1} + β_k p_k","β 用 Fletcher-Reeves 或 Polak-Ribière 公式"],"deps":"numpy · scipy","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"共轭方向与步长","formulas":["α_k = g_kᵀg_k / (p_kᵀA p_k)","x_{k+1} = x_k + α_k p_k，g_{k+1} = g_k + α_k A p_k","β_k = g_{k+1}ᵀg_{k+1} / g_kᵀg_k（Fletcher-Reeves）"],"steps":["梯度下降每步都「抵消」上一方向的进展，所以病态问题上锯齿前进；共轭方向不会互相破坏，因此收敛快得多。","理论上 n 步精确收敛，但浮点误差会让共轭性退化，实际常把 n 步当作重启周期。","只要会算 A·p 就能跑 CG —— 不需要显式存 A，这让它天然适合大规模稀疏矩阵和矩阵无关（matrix-free）场景。"],"tex":["\\alpha_{k} = \\frac{g_{k}^{\\top}g_{k}}{p_{k}^{\\top}Ap_{k}}","g_{k+1} = g_{k}+\\alpha_{k}Ap_{k}","\\beta_{k} = \\frac{g_{k+1}^{\\top}g_{k+1}}{g_{k}^{\\top}g_{k}}"]},"params":[["max_iter","int","None","最大迭代数，None（默认）取变量维数 n。二次问题理论上 n 步收敛，超出通常意味着数值退化。"],["tol","float","1e-10","残差范数的停止阈值，正浮点数，默认 1e-10。"],["beta_rule","str","fr","β 的计算方式。fr（Fletcher-Reeves，默认，稳）、pr（Polak-Ribière，通常更快但可能不单调）。"],["precond","bool","False","是否用对角预条件（Jacobi），默认 false。A 的对角差异大时开启能显著减少迭代数。"]],"input":"A: (n, n) 对称正定矩阵（或 matvec 函数）；b: (n,)","output":"x: 解；iters: 实际迭代数","code":"import numpy as np\n\ndef cg(A, b, x0=None, max_iter=None, tol=1e-10, beta_rule='fr', precond=False):\n    \"\"\"共轭梯度法：A 可为矩阵或 matvec 函数，无需显式求逆。\"\"\"\n    matvec = A if callable(A) else (lambda v: A @ v)\n    n = len(b) if not callable(A) else (len(x0) if x0 is not None else None)\n    x = np.zeros(n) if x0 is None else np.array(x0, float)\n    r = b - matvec(x)\n    p = r.copy()\n    rs = r @ r\n    M = None\n    if precond:\n        diag = A.diagonal() if hasattr(A, 'diagonal') else np.ones(n)\n        M = 1.0 / diag                              # Jacobi 预条件子\n    max_iter = max_iter or n\n    for k in range(max_iter):\n        if np.sqrt(rs) < tol:\n            return x, k\n        Ap = matvec(p)\n        alpha = rs / (p @ Ap)                       # 沿共轭方向走到极小\n        x = x + alpha * p\n        r = r - alpha * Ap\n        rs_new = r @ r\n        beta = rs_new / rs if beta_rule == 'fr' else max(0.0, rs_new / rs)\n        p = r + beta * p                            # 新方向与历史方向 A-共轭\n        rs = rs_new\n        if precond:\n            z = M * r\n            p = z + beta * p\n    return x, max_iter\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    n = 60\n    Q, _ = np.linalg.qr(rng.randn(n, n))\n    A = Q @ np.diag(np.logspace(0, 3, n)) @ Q.T      # 条件数 1000 的对称正定矩阵\n    A = (A + A.T) / 2\n    b = rng.randn(n)\n\n    x_cg, it = cg(A, b, tol=1e-8)\n    x_ex = np.linalg.solve(A, b)\n    print(f'CG: {it} 步，相对残差 {np.linalg.norm(b - A@x_cg)/np.linalg.norm(b):.2e}')\n\n    # 对照：梯度下降在同样条件数下要慢得多\n    x, lr = np.zeros(n), 1.0 / np.linalg.eigvalsh(A).max()\n    for k in range(3000):\n        x -= lr * (A @ x - b)\n    print('梯度下降 3000 步残差:', f'{np.linalg.norm(b - A@x)/np.linalg.norm(b):.2e}')\n\n    # 矩阵无关用法：只提供 matvec，就能解大规模稀疏系统\n    from scipy.sparse import diags\n    Asp = diags([-np.ones(99), 4 * np.ones(100), -np.ones(99)], [-1, 0, 1]).toarray()\n    x_sp, it2 = cg(Asp, np.ones(100), tol=1e-10)\n    print(f'三对角系统: {it2} 步，与精确解差异 {np.abs(x_sp - np.linalg.solve(Asp, np.ones(100))).max():.2e}')"},
  {"id":"lbfgs","name":"L-BFGS 拟牛顿法","en":"Limited-memory BFGS","cat":"优化·度量·迁移学习","diff":"进阶","summary":"有限内存拟牛顿：只保存最近 m 步的位移与梯度差，用两循环递推隐式构造 Hessian 的逆，内存 O(mn)。它是 sklearn 逻辑回归与大量大规模优化的默认选择。","scenes":["大规模逻辑回归","内存受限的二阶优化","需要高精度解"],"idea":["用最近 m 对 (s_k, y_k) 近似 Hessian 的逆，而不是显式存 n×n 矩阵","两循环递推：先反向乘一串修正项，再正向乘回来，得到 H·g","s_k = θ_{k+1}−θ_k，y_k = g_{k+1}−g_k，ρ_k = 1/(y_kᵀs_k)"],"deps":"scipy","updated":"2026-11-15","lang":"Python 3 · SciPy","math":{"title":"BFGS 更新与两循环递推","formulas":["H_{k+1} = (I − ρ_k s_k y_kᵀ) H_k (I − ρ_k y_k s_kᵀ) + ρ_k s_k s_kᵀ","ρ_k = 1/(y_kᵀ s_k)","两循环：s_k = θ_{k+1}−θ_k，y_k = g_{k+1}−g_k；q ← g，对 k=m..1 做 q ← q − α_k y_k（α_k = ρ_k s_kᵀq），再正向累加得 H·g"],"steps":["BFGS 用梯度差自动「学」曲率，不需要二阶导数；L-BFGS 进一步只留 m 对向量，把内存从 O(n²) 降到 O(mn)。","m 一般取 5–20：太小退化近似最速下降，太大接近 BFGS 但每步更贵。","这是「准牛顿」的核心权衡：用一阶信息近似二阶，牺牲一点收敛阶换取可行性——深度学习中参数量上亿，只能这么做。"],"tex":["H_{k+1} = (I-\\rho_{k}s_{k}y_{k}^{\\top})H_{k}(I-\\rho_{k}y_{k}s_{k}^{\\top})+\\rho_{k}s_{k}s_{k}^{\\top}","\\rho_{k} = \\frac{1}{y_{k}^{\\top}s_{k}}","s_{k}=\\theta_{k+1}-\\theta_{k},\\; y_{k}=g_{k+1}-g_{k};\\quad q\\leftarrow g,\\;\\text{for }k=m..1:\\ q\\leftarrow q-\\alpha_{k}y_{k},\\;\\alpha_{k}=\\rho_{k}s_{k}^{\\top}q"]},"params":[["m","int","10","保存的历史对数，正整数，默认 10。5–20 常用：太小近似退化为最速下降，太大内存与每步开销上升。"],["max_iter","int","15000","最大迭代数，正整数。L-BFGS 每步都做线搜索，迭代数通常几百即可，默认值只是上限。"],["tol","float","1e-6","梯度范数的停止阈值，正浮点数，默认 1e-6。需要更高精度时降到 1e-9。"],["c1","float","1e-4","Armijo 线搜索的充分下降常数，正浮点数，默认 1e-4。太大导致步长过短、收敛慢。"]],"input":"loss_fn(theta) 返回 (loss, grad)；theta0 初值","output":"theta: 最优参数；info: 迭代数、最终梯度范数","code":"import numpy as np\nfrom scipy.optimize import minimize\n\ndef lbfgs(fun_grad, theta0, m=10, max_iter=15000, tol=1e-6, c1=1e-4):\n    \"\"\"调用 scipy 的 L-BFGS-B：只需给 loss 与梯度，二阶信息由算法自己攒。\"\"\"\n    res = minimize(fun_grad, np.asarray(theta0, float), jac=True, method='L-BFGS-B',\n                   options={'maxiter': max_iter, 'maxcor': m, 'gtol': tol, 'ftol': 1e-12})\n    return res.x, res\n\nif __name__ == '__main__':\n    from sklearn.datasets import load_breast_cancer\n    X, y = load_breast_cancer(return_X_y=True)\n    X = (X - X.mean(0)) / (X.std(0) + 1e-9)\n    X = np.c_[X, np.ones(len(X))]                     # 加上截距列\n    n, d = X.shape\n\n    def sigmoid(z): return 1 / (1 + np.exp(-z))\n\n    def loss_grad(w):\n        p = sigmoid(X @ w)\n        loss = float(-(y * np.log(p + 1e-12) + (1 - y) * np.log(1 - p + 1e-12)).mean())\n        loss += 1e-3 * (w ** 2).sum()                 # L2 正则\n        grad = X.T @ (p - y) / n + 2e-3 * w\n        return loss, grad\n\n    w, res = lbfgs(loss_grad, np.zeros(d))\n    print('L-BFGS 状态:', res.message)\n    print('迭代数:', res.nit, ' 最终 loss:', round(float(res.fun), 6))\n    print('梯度范数:', f'{np.linalg.norm(res.jac):.2e}')\n\n    # 内存对照：显式 Hessian 的规模\n    print(f'参数维度 {d} -> 显式 Hessian 需 {d*d*8/1e6:.1f} MB；L-BFGS 只需 {2*10*d*8/1e3:.0f} KB')\n\n    # 交叉验证精度\n    from sklearn.linear_model import LogisticRegression\n    from sklearn.model_selection import cross_val_score\n    clf = LogisticRegression(solver='lbfgs', C=100, max_iter=1000)\n    print('sklearn(solver=lbfgs) CV:', round(cross_val_score(clf, X[:, :-1], y, cv=5).mean(), 4))"},
  {"id":"greedy-layerwise","name":"逐层贪婪预训练","en":"Greedy Layer-wise Training","cat":"优化·度量·迁移学习","diff":"进阶","summary":"每次只训练一层、训好就冻结，把它的隐表示当作下一层的输入。它是 DBN 与堆叠自编码器的训练方式，也是「深层网络训不动」那个年代的关键技巧。","scenes":["深层网络预训练","无标签数据利用","理解 DBN / SAE"],"idea":["先训第一层（RBM 或自编码器），只优化这一层的重建/似然","冻结第一层，用它的输出作为第二层输入，再训第二层","全部堆完接分类头；可选整体微调，让各层协同"],"deps":"numpy · scikit-learn","updated":"2026-11-15","lang":"Python 3 · NumPy","math":{"title":"逐层的局部目标与整体微调","formulas":["第 l 层： min_{W_l} L_l(W_l; h_{l−1})，h_{l−1} = f_{l−1}(x) 固定不变","h_l = f_l(h_{l−1}; W_l)","微调： min_{W_{1..L}} CE(head(h_L), y)"],"steps":["贪心的含义：每层只对自己的局部目标最优，不保证整体最优——但它是当年第一个能让深层网络「训得动」的办法。","预训练给了一个好的初始化区域：权重落在有结构的子空间里，后续 BP 不容易陷在坏鞍点。","如今 ReLU + BN + 残差 + 大量数据已经解决了这个问题，所以纯监督任务不再需要；但在无标签数据远多于标签时，逐层预训练仍然有效。"],"tex":["\\min_{W_{l}}L_{l}(W_{l};h_{l-1}),\\quad h_{l-1}\\ \\text{fixed}","h_{l} = f_{l}(h_{l-1};W_{l})","\\min_{W_{1..L}}\\mathrm{CE}(head(h_{L}),y)"]},"params":[["hidden","int","32","每层隐单元数，正整数，默认 32。预训练时通常每层同宽，便于堆叠；太窄会逐层丢信息。"],["n_layers","int","3","堆叠层数，正整数，默认 3。2–4 层最能体现逐层训练的价值，再深收益递减。"],["epochs_per_layer","int","60","每层预训练轮数，正整数，默认 60。偏少则该层表示还没学到结构就冻结了。"],["lr","float","0.1","每层无监督训练的步长，正浮点数，默认 0.1。自编码器的重建任务对步长不如分类敏感。"],["finetune_epochs","int","0","整体微调轮数，非负整数，默认 0（不微调，仅用预训练特征）。设 30–100 可再提升，但会丢掉「纯无监督」的性质。"]],"input":"X: (n, d)；y: 可选标签（微调用）","output":"model: 每层 W/b；encode(X) 逐层前向得到顶层表示","code":"import numpy as np\n\ndef sigmoid(z): return 1 / (1 + np.exp(-z))\n\nclass LayerAE:\n    \"\"\"单层自编码器：逐层贪婪训练的最小单元。\"\"\"\n    def __init__(self, n_in, n_hidden, lr=0.1, seed=0):\n        rng = np.random.RandomState(seed)\n        self.W1 = rng.normal(0, np.sqrt(1 / n_in), (n_in, n_hidden))\n        self.W2 = rng.normal(0, np.sqrt(1 / n_hidden), (n_hidden, n_in))\n        self.b1, self.b2 = np.zeros(n_hidden), np.zeros(n_in)\n        self.lr = lr\n\n    def fit(self, H, epochs=60):\n        for _ in range(epochs):\n            Z = sigmoid(H @ self.W1 + self.b1)\n            out = sigmoid(Z @ self.W2 + self.b2)\n            err = out - H\n            dz = (err @ self.W2.T) * Z * (1 - Z)\n            self.W2 -= self.lr * Z.T @ err / len(H); self.b2 -= self.lr * err.mean(0)\n            self.W1 -= self.lr * H.T @ dz / len(H);  self.b1 -= self.lr * dz.mean(0)\n        return self\n\n    def encode(self, H): return sigmoid(H @ self.W1 + self.b1)\n\nclass GreedyStack:\n    \"\"\"逐层训练：每层训完即冻结，其输出作为下一层输入。\"\"\"\n    def __init__(self, hidden=32, n_layers=3, epochs_per_layer=60, lr=0.1, seed=0):\n        self.hidden, self.L, self.epl, self.lr, self.seed = hidden, n_layers, epochs_per_layer, lr, seed\n\n    def fit(self, X):\n        self.layers, H = [], np.asarray(X, float)\n        for l in range(self.L):\n            ae = LayerAE(H.shape[1], self.hidden, lr=self.lr, seed=self.seed + l).fit(H, self.epl)\n            self.layers.append(ae)\n            H = ae.encode(H)                        # 冻结该层，用它的表示继续往上堆\n            print(f'第 {l+1} 层预训练完成 -> 表示形状 {H.shape}')\n        return self\n\n    def encode(self, X):\n        H = np.asarray(X, float)\n        for ae in self.layers:\n            H = ae.encode(H)\n        return H\n\nif __name__ == '__main__':\n    from sklearn.datasets import load_digits\n    from sklearn.linear_model import LogisticRegression\n    from sklearn.model_selection import cross_val_score\n    X = load_digits().data / 16.0\n    y = load_digits().target\n\n    gs = GreedyStack(hidden=32, n_layers=3, epochs_per_layer=50).fit(X)\n    H = gs.encode(X)\n    print('逐层预训练特征 + 逻辑回归 CV:',\n          round(cross_val_score(LogisticRegression(max_iter=1000), H, y, cv=5).mean(), 3))\n    print('随机初始化同宽度 + 逻辑回归 CV:',\n          round(cross_val_score(LogisticRegression(max_iter=1000),\n                                np.maximum(X @ np.ones((X.shape[1], 32)), 0), y, cv=5).mean(), 3))\n    print('原始像素 + 逻辑回归 CV:',\n          round(cross_val_score(LogisticRegression(max_iter=1000), X, y, cv=5).mean(), 3))"},
  {"id":"prophet","name":"Prophet 预测","en":"Prophet","cat":"时间序列与预测","diff":"入门","summary":"加法分解式预测器：趋势（分段线性/饱和增长）+ 季节性（傅里叶项）+ 节假日，用贝叶斯方式给出不确定性。对缺失值和异常值都不敏感，几乎不用调参。","scenes":["业务指标预测","含节假日效应","缺测多的序列"],"idea":["y(t) = g(t) + s(t) + h(t) + ε，四项分别可解释","趋势 g 是带变点的分段线性，变点位置自动从数据里选","季节 s 用傅里叶级数，节假日 h 用哑变量+窗口"],"deps":"prophet 1.1","updated":"2026-11-15","lang":"Python 3 · prophet","math":{"title":"分解式模型与傅里叶季节项","formulas":["y(t) = g(t) + s(t) + h(t) + ε_t","g(t) = (k + a(t)ᵀδ)·t + (m + a(t)ᵀγ)","s(t) = Σ_{n=1}^{N}[a_n cos(2πnt/P) + b_n sin(2πnt/P)]"],"steps":["a(t) 是变点指示向量：某时刻之后趋势斜率改变，变点数量与先验由 changepoint_prior_scale 控制。","傅里叶级数用少量 sin/cos 项就能拟合任意平滑季节曲线，N（阶数）越大越灵活也越容易过拟合。","Prophet 给出的区间是贝叶斯后验的近似，包含趋势与季节的不确定性，比固定宽度的置信带更贴近实际。"],"tex":["y(t) = g(t)+s(t)+h(t)+\\varepsilon_{t}","g(t) = (k+a(t)^{\\top}\\delta)t+(m+a(t)^{\\top}\\gamma)","s(t) = \\sum_{n=1}^{N}\\Big[a_{n}\\cos\\frac{2\\pi nt}{P}+b_{n}\\sin\\frac{2\\pi nt}{P}\\Big]"]},"params":[["growth","str","linear","趋势形式。linear（默认，分段线性，适合多数业务指标）、logistic（饱和增长，需给 cap 上限，适合有天花板的场景如渗透率）。"],["changepoint_prior_scale","float","0.05","变点先验强度，正浮点数，默认 0.05。越大越容易加变点、趋势越灵活（易过拟合）；越小趋势越平滑（易欠拟合）。这是最该调的一个参数。"],["seasonality_prior_scale","float","10.0","季节项先验强度，正浮点数，默认 10。越大季节波动可以越剧烈；数据噪声大时调小以平滑季节。"],["seasonality_mode","str","additive","季节效应形式。additive（默认，振幅恒定）、multiplicative（振幅随趋势成比例放大，业务量增长时更合适）。"],["interval_width","float","0.8","预测区间宽度（后验分位），0–1，默认 0.8。想给更保守的上下界就调到 0.95。"]],"input":"ds: 时间列（datetime）；y: 数值列；可选 cap / holiday","output":"forecast: ds, yhat, yhat_lower, yhat_upper, trend, 季节分量","code":"import numpy as np, pandas as pd\nfrom prophet import Prophet\nfrom prophet.diagnostics import cross_validation, performance_metrics\n\nrng = np.random.RandomState(0)\nn = 730                                             # 两年日数据\nds = pd.date_range('2023-01-01', periods=n, freq='D')\ntrend = np.linspace(100, 160, n)\nweekly = 8 * np.sin(2 * np.pi * ds.dayofweek / 7)   # 周季节\nyearly = 15 * np.sin(2 * np.pi * ds.dayofyear / 365.25)\nnoise = rng.normal(0, 4, n)\ny = trend + weekly + yearly + noise\ndf = pd.DataFrame({'ds': ds, 'y': y})\ndf.loc[rng.choice(n, 10), 'y'] = np.nan             # 人为挖掉 10 个点，Prophet 会自动忽略\n\nm = Prophet(growth='linear',\n            changepoint_prior_scale=0.05,           # 趋势灵活度：最关键的超参\n            seasonality_mode='additive',\n            interval_width=0.9,\n            yearly_seasonality=10,                  # 傅里叶阶数：越大季节曲线越灵活\n            weekly_seasonality=True)\nm.add_country_holidays(country_name='CN')           # 节假日效应用哑变量\nm.fit(df)\n\nfuture = m.make_future_dataframe(periods=60)\nfc = m.predict(future)\nprint(fc[['ds', 'yhat', 'yhat_lower', 'yhat_upper', 'trend']].tail(3).round(2))\n\n# 分量拆解：趋势 / 周 / 年 —— 这是 Prophet 最实用的地方\nprint('季节分量列:', [c for c in fc.columns if 'season' in c or 'holiday' in c])\n\n# 滚动交叉验证：按时间顺序切，不能随机打乱\ncv = cross_validation(m, initial='365 days', period='90 days', horizon='60 days', disable_tqdm=True)\nprint(performance_metrics(cv)[['horizon', 'mape', 'rmse']].head().round(3))"},
  {"id":"tbats","name":"TBATS 多重季节模型","en":"TBATS","cat":"时间序列与预测","diff":"高难","summary":"专治「多重季节 + 非整数周期」的指数平滑模型：三角函数季节项 + Box-Cox 变换 + ARMA 残差 + 趋势。日/周/年三层叠加的电力负荷、客流数据是它的主场。","scenes":["多重季节周期","日周期非整数（365.25/7）","电力负荷与客流"],"idea":["季节用三角函数和表示，因此能处理非整数周期（如 52.18 周/年）","Box-Cox 变换稳定方差，ARMA 拟合残差自相关","每个季节分量可带「随时间演变」项（TBATS 里的 T），适应季节形态漂移"],"deps":"tbats 1.1","updated":"2026-11-15","lang":"Python 3 · tbats","math":{"title":"TBATS 的状态空间组成","formulas":["y_t^{(ω)} = ℓ_{t−1} + φ·b_{t−1} + Σ_i s_{t−m_i}^{(i)} + d_t","s_t^{(i)} = Σ_{j=1}^{k_i} [s_{j,t−1}^{(i)}cos λ_j^{(i)} + s*_{j,t−1}^{(i)}sin λ_j^{(i)}]","λ_j^{(i)} = 2πj/m_i，m_i 可为非整数"],"steps":["为什么用三角函数：普通季节指数平滑要求周期是整数，而「年」在周数据里是 52.18 周，无法直接建索引。","k_i（每个季节的谐波数）由 AIC 自动选：太小季节形状刻不出来，太大参数爆炸。","Box-Cox 的 λ 也由模型自动估：方差随水平增长的数据（如销量）用 λ<1 能明显改善预测。"],"tex":["y_{t}^{(\\omega)} = \\ell_{t-1}+\\phi b_{t-1}+\\sum_{i}s_{t-m_{i}}^{(i)}+d_{t}","s_{t}^{(i)} = \\sum_{j=1}^{k_{i}}\\big[s_{j,t-1}^{(i)}\\cos\\lambda_{j}^{(i)}+s_{j,t-1}^{*(i)}\\sin\\lambda_{j}^{(i)}\\big]","\\lambda_{j}^{(i)} = \\frac{2\\pi j}{m_{i}}"]},"params":[["seasonal_periods","list","[7, 365.25]","季节周期列表，可为非整数，默认 [7, 365.25]。日数据就填 [7, 365.25]；小时数据可填 [24, 168, 8766]。"],["use_boxcox","bool/str","True","是否做 Box-Cox 变换，true（默认，自动估 λ）或给定数值。方差随水平增长时必开。"],["use_trend","bool","True","是否包含趋势项，默认 true。明显无趋势的平稳序列可关掉以减少参数。"],["use_arma_errors","bool","True","是否用 ARMA 拟合残差，默认 true。残差仍有自相关时开启能提升精度。"],["n_jobs","int","1","并行拟合的进程数，正整数，默认 1。多重季节模型拟合较慢，可设为 CPU 核数。"]],"input":"y: 等间隔时间序列（pandas Series，带 DatetimeIndex 更佳）","output":"forecaster: 可 predict(steps)；含拟合的谐波数、Box-Cox λ","code":"import numpy as np, pandas as pd\nfrom tbats import TBATS\n\nrng = np.random.RandomState(0)\n\n# 造一条「日周期 + 周周期 + 趋势」的小时级数据（多重季节，周期非整数关系）\nhours = 24 * 60\nt = np.arange(hours)\nseries = (100 + 0.01 * t                                   # 缓慢趋势\n          + 12 * np.sin(2 * np.pi * t / 24)                # 日周期\n          + 6 * np.sin(2 * np.pi * t / (24 * 7))           # 周周期\n          + rng.normal(0, 2, hours))\n\ny = pd.Series(series, index=pd.date_range('2024-01-01', periods=hours, freq='h'))\n\nestimator = TBATS(\n    seasonal_periods=[24, 24 * 7],      # 多重季节：日 + 周\n    use_boxcox=True,                    # 自动估 Box-Cox λ\n    use_trend=True,\n    use_arma_errors=True,               # 残差用 ARMA 修正\n    n_jobs=1\n)\nforecaster = estimator.fit(y)\n\ny_hat = forecaster.predict(steps=48)    # 预测未来 48 小时\nprint('预测前 6 个点:', np.round(y_hat[:6], 2))\nprint('拟合的谐波数:', forecaster.summary())\nprint('Box-Cox lambda:', round(float(forecaster.model.box_cox_lambda), 4))\n\n# 用训练集最后 48 点做回测\ntrain, test = y[:-48], y[-48:]\nf2 = TBATS(seasonal_periods=[24, 24 * 7]).fit(train)\npred = f2.predict(steps=48)\nmape = np.mean(np.abs((test.values - pred) / test.values)) * 100\nprint('回测 MAPE: %.2f%%' % mape)"},
  {"id":"arima-garch","name":"ARIMA-GARCH 混合模型","en":"ARIMA + GARCH","cat":"时间序列与预测","diff":"高难","summary":"两段式建模：ARIMA 抓均值（趋势与自相关），GARCH 抓波动率聚集（方差随时间变）。金融收益序列的标配——均值几乎不可预测，但波动率有很强记忆。","scenes":["金融收益波动率","风险 VaR 估计","波动聚集的序列"],"idea":["ARIMA(p,d,q)：差分去趋势，用 AR 项与 MA 项拟合条件均值","对残差平方建 GARCH(1,1)：σ²_t = ω + αε²_{t−1} + βσ²_{t−1}","联合预测得到动态均值与动态方差，区间宽度随时变化"],"deps":"statsmodels · arch","updated":"2026-11-15","lang":"Python 3 · statsmodels","math":{"title":"条件均值与条件方差","formulas":["ARIMA： φ(B)(1−B)^d y_t = θ(B)ε_t","GARCH(1,1)： σ²_t = ω + α·ε²_{t−1} + β·σ²_{t−1}","平稳条件： α + β < 1；越接近 1 波动记忆越长"],"steps":["两段式不是「更复杂的模型」，而是承认两件事有不同来源：均值受信息驱动、方差受恐慌与聚集驱动。","α 衡量「新冲击的影响」，β 衡量「旧波动的记忆」；金融数据常见 α≈0.05、β≈0.9，即冲击短期剧烈、记忆很长。","预测区间应随 σ_t 变化：波动率高时区间自动变宽，这比固定宽度的置信带更符合实际风险。"],"tex":["\\phi(B)(1-B)^{d}y_{t} = \\theta(B)\\varepsilon_{t}","\\sigma_{t}^{2} = \\omega+\\alpha\\varepsilon_{t-1}^{2}+\\beta\\sigma_{t-1}^{2}","\\alpha+\\beta<1"]},"params":[["order","tuple","(1,0,1)","ARIMA 的 (p,d,q)，默认 (1,0,1)。p 自回归阶数、d 差分次数、q 移动平均阶数；可用 AIC 网格搜索确定。"],["garch_order","tuple","(1,1)","GARCH 的 (p,q)，默认 (1,1)。(1,1) 在绝大多数金融序列上已足够，阶数再高容易不收敛。"],["dist","str","normal","残差分布假设。normal（默认）、t（厚尾，金融数据更常用）、skewt（偏厚尾）。选错会让 VaR 低估风险。"],["mean_model","str","Constant","均值模型：Constant（常数）、AR（自回归）、Zero（零均值，纯波动率建模）。"]],"input":"y: 收益率序列（通常已取对数差分）；可选外生变量 X","output":"model: ARIMA 均值参数 + GARCH 方差参数；forecast 返回均值与 σ_t","code":"import numpy as np, pandas as pd\nfrom statsmodels.tsa.arima.model import ARIMA\nfrom arch import arch_model\n\nrng = np.random.RandomState(0)\n\n# 造一条带「波动聚集」的收益序列：GARCH(1,1) 生成\nn, omega, alpha, beta = 1500, 0.02, 0.08, 0.90\neps = np.zeros(n); sigma2 = np.zeros(n)\nsigma2[0] = omega / (1 - alpha - beta)\nz = rng.standard_t(5, n) / np.sqrt(5 / 3)          # 厚尾冲击\nfor t in range(1, n):\n    sigma2[t] = omega + alpha * eps[t - 1] ** 2 + beta * sigma2[t - 1]\n    eps[t] = np.sqrt(sigma2[t]) * z[t]\nr = pd.Series(eps, index=pd.date_range('2019-01-01', periods=n, freq='B'), name='ret')\n\n# 第一步：ARIMA 拟合条件均值\narima = ARIMA(r, order=(1, 0, 1)).fit()\nprint('ARIMA 参数:', arima.params.round(4).to_dict())\nresid = pd.Series(arima.resid, index=r.index)\n\n# 第二步：对残差建 GARCH(1,1)，抓波动率\ng = arch_model(resid * 100, mean='Zero', vol='GARCH', p=1, q=1, dist='t')\ngres = g.fit(disp='off')\nprint('GARCH 参数:', gres.params.round(4).to_dict())\nprint(f'alpha+beta = {gres.params[\"alpha[1]\"] + gres.params[\"beta[1]\"]:.4f} （越接近 1 波动记忆越长）')\n\n# 波动率曲线与动态区间\ncond_vol = gres.conditional_volatility / 100\nfc = gres.forecast(horizon=5, reindex=False)\nprint('未来 5 期预测标准差:', np.round(np.sqrt(fc.variance.values[-1]), 4))\n\nmean_fc = arima.get_forecast(5).predicted_mean\nse = np.sqrt(fc.variance.values[-1]) / 100\nprint('\\n动态 95% 区间:')\nfor h in range(5):\n    print(f'  h={h+1}: 均值 {mean_fc.iloc[h]:+.4f}  区间 [{mean_fc.iloc[h]-1.96*se[h]:+.4f}, {mean_fc.iloc[h]+1.96*se[h]:+.4f}]')"},
  {"id":"sarimax","name":"SARIMAX 季节自回归","en":"Seasonal ARIMAX","cat":"时间序列与预测","diff":"进阶","summary":"ARIMA 的季节扩展：加 SAR/SMA 季节项与外部回归量（exog），同时刻画「短期自相关 + 周期重复 + 外生因素」。传统参数模型里通用性最强的一个。","scenes":["月度/周度业务预测","带节假日或气温的销量","需要置信区间"],"idea":["非季节部分 ARIMA(p,d,q) 之外再加季节部分 (P,D,Q,s)","y_t 还能挂外生变量 x_tᵀβ，如促销、天气、价格","极大似然估计参数，用 AIC/BIC 在阶数网格里选"],"deps":"statsmodels 0.14","updated":"2026-11-15","lang":"Python 3 · statsmodels","math":{"title":"季节算子与外生回归项","formulas":["φ(B)Φ(B^s)(1−B)^d(1−B^s)^D y_t = θ(B)Θ(B^s)ε_t + x_tᵀβ","季节差分 (1−B^s)：去掉「同相位」的重复模式","AIC = −2·lnL + 2k，越小越好"],"steps":["s 是周期长度：月度 12、周度 7、小时 24。周期填错等于没做季节建模，这是最常见的失误。","D 一般取 0 或 1。季节已平稳还强行季节差分，会引入负自相关，预测反而变差。","exog 在预测期也必须给得出（未来促销/气温要已知）。预测期拿不到外生变量，就只能退回纯 ARIMA。"],"tex":["\\phi(B)\\Phi(B^{s})(1-B)^{d}(1-B^{s})^{D}y_{t} = \\theta(B)\\Theta(B^{s})\\varepsilon_{t}+x_{t}^{\\top}\\beta","(1-B^{s})y_{t}=y_{t}-y_{t-s}\\ \\ (D=1)","\\mathrm{AIC}=-2\\ln L+2k\\quad\\text{（越小越好）}"]},"params":[["order","tuple","(1,1,1)","非季节部分 (p,d,q)，默认 (1,1,1)。p 自回归阶、d 差分次数、q 移动平均阶；可用 AIC 网格搜索。"],["seasonal_order","tuple","(1,1,1,12)","季节部分 (P,D,Q,s)，默认季节周期 12（月度）。s 必须与数据频率匹配，否则季节项无效。"],["trend","str","c","确定性趋势项。c（默认，常数）、t（线性）、n（无）。差分后一般用 n 或 c，数据有明显线性趋势时用 t。"],["enforce_stationarity","bool","True","是否强制非季节 AR 部分平稳，默认 true。放宽到 false 拟合更贴但预测可能发散，仅在诊断时用。"],["exog","array","None","外生回归量 (n, k)，None（默认）即纯 SARIMAX 无外生项。预测时必须同时提供未来的 exog。"]],"input":"endog: 时间序列 (n,)；exog: 可选 (n, k)；forecast steps","output":"result: params、aic、预测均值与置信区间","code":"import numpy as np, pandas as pd, warnings\nfrom statsmodels.tsa.statespace.sarimax import SARIMAX\nwarnings.filterwarnings('ignore')\n\nrng = np.random.RandomState(0)\nn = 96                                             # 8 年月度数据\nt = np.arange(n)\nseason = 6 * np.sin(2 * np.pi * t / 12)             # 年周期\npromo = (rng.rand(n) < 0.15).astype(float)          # 外生变量：促销月\ny = 100 + 0.4 * t + season + 8 * promo + rng.normal(0, 1.5, n)\ndf = pd.DataFrame({'y': y, 'promo': promo},\n                  index=pd.date_range('2018-01-01', periods=n, freq='MS'))\n\ntrain, test = df.iloc[:-12], df.iloc[-12:]\nbest = None\nfor order in [(1, 1, 1), (2, 1, 1), (1, 1, 2)]:\n    for sorder in [(1, 1, 1, 12), (0, 1, 1, 12), (1, 1, 0, 12)]:\n        try:\n            m = SARIMAX(train['y'], exog=train[['promo']], order=order,\n                        seasonal_order=sorder, trend='c', enforce_stationarity=True)\n            r = m.fit(disp=False)\n            if best is None or r.aic < best[1].aic:\n                best = ((order, sorder), r)\n        except Exception:\n            continue\n\n(order, sorder), res = best\nprint('最优阶数:', order, sorder, ' AIC:', round(res.aic, 2))\nprint('外生项系数(promo):', round(float(res.params[0]), 3))\n\n# 预测：未来 12 期的 exog 也必须提供\nfc = res.get_forecast(steps=12, exog=test[['promo']])\nmean, ci = fc.predicted_mean, fc.conf_int(alpha=0.05)\nmape = np.mean(np.abs((test['y'].values - mean.values) / test['y'].values)) * 100\nprint('回测 MAPE: %.2f%%' % mape)\nprint(pd.DataFrame({'预测': mean.values.round(1),\n                    '下界': ci.iloc[:, 0].values.round(1),\n                    '上界': ci.iloc[:, 1].values.round(1)}).head(4))"},
  {"id":"stl-decompose","name":"STL 时序分解","en":"Seasonal-Trend Decomposition by Loess","cat":"时间序列与预测","diff":"入门","summary":"用 Loess 平滑把序列拆成趋势 + 季节 + 残差，且季节项允许随时间缓慢变化。比经典的「平均去季节」稳得多，看时序结构第一件事就该做它。","scenes":["时序结构诊断","季节强度评估","残差作为异常检测基准"],"idea":["内循环：去趋势 → 按相位平滑 → 去季节 → 平滑出新趋势","外循环：用残差算稳健权重，压住异常值影响","季节强度 = 1 − Var(残差)/Var(季节+残差)，接近 1 说明季节很强"],"deps":"statsmodels 0.14","updated":"2026-11-15","lang":"Python 3 · statsmodels","math":{"title":"加法分解与季节强度","formulas":["y_t = T_t + S_t + R_t","S 由「同相位点的 Loess 平滑」逐点估计，因此可随时间漂移","季节强度 F_S = max(0, 1 − Var(R)/Var(S+R))"],"steps":["加法分解适合季节振幅恒定；振幅随水平放大的数据（销量增长）应先用对数变换再分解。","period 必须等于真实周期：日数据填 7（周），小时数据填 24（日）。填错会把周期结构塞进残差。","残差才是后续建模的对象：残差里若还有明显结构，说明分解不够或该换模型（如乘性）。"],"tex":["y_{t} = T_{t}+S_{t}+R_{t}","S_{t}=\\mathrm{Loess}_{s}\\big(y_{t}-T_{t}\\big)","F_S=\\max\\Bigl(0,\\;1-\\frac{\\mathrm{Var}(R)}{\\mathrm{Var}(S+R)}\\Bigr)"]},"params":[["period","int","7","季节周期长度，正整数，默认 7（周）。必须与采样频率匹配：日数据 7、小时数据 24、月度 12。"],["seasonal","int","7","季节平滑窗口（奇数），正整数，默认 7。越大季节曲线越平滑、越小越贴合细节。"],["trend","int","None","趋势平滑窗口，None（默认）自动取大于 period 的最小奇数。越大趋势越平滑。"],["robust","bool","False","是否用稳健拟合（外循环加权），默认 false。数据含异常值时设为 true 可防止异常点拉偏趋势。"],["seasonal_deg","int","1","季节子序列的局部多项式阶数，0 或 1，默认 1。0 等价于分段常数，更硬但更稳。"]],"input":"y: 等间隔序列（可带 DatetimeIndex）；period","output":"result: trend / seasonal / resid 三条分量 + 强度指标","code":"import numpy as np, pandas as pd\nfrom statsmodels.tsa.seasonal import STL\n\nrng = np.random.RandomState(0)\nn = 365 * 2\nt = np.arange(n)\ny = (20 + 0.02 * t                                     # 缓慢趋势\n     + 5 * np.sin(2 * np.pi * t / 7)                   # 周季节\n     + rng.normal(0, 0.8, n))\ny[120] += 12                                           # 人为塞一个异常值\nts = pd.Series(y, index=pd.date_range('2023-01-01', periods=n, freq='D'))\n\nstl = STL(ts, period=7, seasonal=13, trend=None, robust=True)\nres = stl.fit()\n\nstrength = lambda part: max(0, 1 - np.var(res.resid) / np.var(part + res.resid))\nprint('趋势强度: %.3f' % strength(res.trend))\nprint('季节强度: %.3f' % strength(res.seasonal))\nprint('残差标准差: %.3f' % np.std(res.resid))\n\n# 残差做异常检测：|z| > 3 视为异常点\nz = np.abs(res.resid - res.resid.mean()) / res.resid.std()\nprint('检出异常点数量:', int((z > 3).sum()), '| 实际注入 1 个')\n\n# 只用趋势+季节做预测（朴素外推），看残差是否已经足够白\nrecon = res.trend + res.seasonal\nprint('重建误差(应≈残差):', round(float(np.abs(recon + res.resid - ts.values).max()), 6))"},
  {"id":"n-beats","name":"N-BEATS 时序预测","en":"Neural Basis Expansion Analysis","cat":"时间序列与预测","diff":"高难","summary":"纯 MLP 的可解释时序模型：每个 block 学「backcast + forecast」，预测由趋势基（多项式）或季节基（傅里叶）展开，堆叠后逐层修正残差——不用注意力也能打赢很多深度模型。","scenes":["单变量长序列预测","需要可解释外推","M4 类竞赛 baseline"],"idea":["block 输入回看窗口，同时输出 backcast 与 forecast","forecast 由一组基函数展开：趋势用多项式、季节用傅里叶","把 backcast 从输入中减掉，残差喂给下一个 block（双重残差堆叠）"],"deps":"PyTorch 2.3","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"基函数展开与残差堆叠","formulas":["f = Σ_k θ_k v_k：趋势基 v_k = t^k，季节基 v_k = cos(2πkt/P), sin(2πkt/P)","x_{l+1} = x_l − g_l(x_l)，g 为 backcast","ŷ = Σ_l f_l，各 block 的预测相加"],"steps":["关键设计是「双残差」：backcast 让每个 block 只负责解释自己还解释不了的部分，因此堆叠不会重复建模。","趋势基用低阶多项式（2–3 阶）就够，高阶会外推爆炸；季节基的谐波数决定能表达多复杂的周期形状。","因为预测是基函数的线性组合，可以直接画出「趋势项」和「季节项」两条曲线，可解释性是它相对 LSTM 的最大优势。"],"tex":["f = \\sum_{k}\\theta_{k}v_{k}","x_{l+1} = x_{l}-g_{l}(x_{l})","\\hat{y} = \\sum_{l}f_{l}"]},"params":[["lookback","int","4","回看窗口长度（输入步数），正整数，默认 4。至少要覆盖一个完整周期，否则季节基学不到相位。"],["horizon","int","1","预测步数，正整数，默认 1。多步预测直接一次输出，不做递归。"],["n_blocks","int","3","堆叠的 block 数，正整数，默认 3。越多残差修正越细，2–6 常用。"],["hidden","int","64","每个 block 内 FC 层宽度，正整数，默认 64。越大容量越强，小数据上容易过拟合。"],["basis","str","trend","block 的基类型：trend（多项式外推）、seasonality（傅里叶）、generic（自由全连接，无基约束）。"]],"input":"X: (n, lookback)；y: (n, horizon)","output":"model: 各 block 权重；predict 返回 (n, horizon)，可分解出趋势/季节分量","code":"import numpy as np, torch, torch.nn as nn\n\nclass NBeatsBlock(nn.Module):\n    \"\"\"一个 block：Mc 生成基系数，基矩阵把系数映射成 forecast / backcast。\"\"\"\n    def __init__(self, lookback, horizon, hidden=64, basis='trend', n_basis=3):\n        super().__init__()\n        self.lookback, self.horizon, self.basis = lookback, horizon, basis\n        self.fc = nn.Sequential(nn.Linear(lookback, hidden), nn.ReLU(),\n                                nn.Linear(hidden, hidden), nn.ReLU())\n        self.theta_b = nn.Linear(hidden, n_basis)      # forecast 系数\n        self.theta_g = nn.Linear(hidden, n_basis)      # backcast 系数\n        self.Vf = self._basis_matrix(horizon, basis, n_basis)\n        self.Vb = self._basis_matrix(lookback, basis, n_basis)\n\n    @staticmethod\n    def _basis_matrix(length, basis, n_basis):\n        t = np.arange(length) / length                 # 归一化时间轴\n        if basis == 'trend':\n            cols = [t ** k for k in range(n_basis)]    # 多项式基\n        else:\n            P = max(length // 2, 2)\n            cols = []\n            for k in range(1, n_basis // 2 + 1):\n                cols += [np.cos(2 * np.pi * k * np.arange(length) / P),\n                         np.sin(2 * np.pi * k * np.arange(length) / P)]\n            cols = cols[:n_basis]                      # 傅里叶基\n        return torch.tensor(np.stack(cols, axis=1), dtype=torch.float32)\n\n    def forward(self, x):\n        h = self.fc(x)\n        fc = self.theta_b(h) @ self.Vf.T               # 预测 = 系数 × 基\n        bc = self.theta_g(h) @ self.Vb.T               # 回看重建\n        return fc, bc\n\nclass NBeats(nn.Module):\n    def __init__(self, lookback=24, horizon=6, n_blocks=3, hidden=64, basis='trend'):\n        super().__init__()\n        self.blocks = nn.ModuleList([NBeatsBlock(lookback, horizon, hidden, basis) for _ in range(n_blocks)])\n\n    def forward(self, x):\n        residual, total = x, 0\n        for blk in self.blocks:\n            fc, bc = blk(residual)\n            residual = residual - bc                   # 只把「解释不了」的部分传下去\n            total = total + fc\n        return total\n\nif __name__ == '__main__':\n    rng = np.random.RandomState(0)\n    L, H = 24, 6\n    t = np.arange(600)\n    s = 10 + 0.05 * t + 3 * np.sin(2 * np.pi * t / 12) + rng.normal(0, .3, 600)\n    X = torch.tensor(np.stack([s[i:i + L] for i in range(len(s) - L - H + 1)]), dtype=torch.float32)\n    y = torch.tensor(np.stack([s[i + L:i + L + H] for i in range(len(s) - L - H + 1)]), dtype=torch.float32)\n    m = NBeats(L, H, n_blocks=3, basis='trend')\n    opt = torch.optim.Adam(m.parameters(), lr=1e-2)\n    for ep in range(300):\n        opt.zero_grad()\n        loss = nn.functional.mse_loss(m(X), y)\n        loss.backward(); opt.step()\n    print('train MSE:', round(float(loss), 4))"},
  {"id":"tft","name":"TFT 时序融合 Transformer","en":"Temporal Fusion Transformer","cat":"时间序列与预测","diff":"高难","summary":"把「变量选择 + LSTM 局部编码 + 可解释多头注意力 + 分位数输出」缝在一张网里：既拿到 SOTA 级精度，又能导出「哪些变量、哪些历史时刻重要」的权重。","scenes":["多变量时序预测","需要特征重要性","概率区间预测"],"idea":["变量选择网络 VSN 给每个输入特征学一个权重，直接得到特征重要性","静态协变量编码 + LSTM 编码器/解码器处理局部动态","可解释注意力：每个预测步对历史各步的注意力权重可导出"],"deps":"PyTorch 2.3","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"变量选择、注意力与分位数损失","formulas":["VSN： ξ = softmax(GRN(x))，x̃ = ξ ⊙ GRN(x)","Attn(Q,K,V) = softmax(QKᵀ/√d_k) V","分位数损失： L = Σ_q max(q(y−ŷ_q), (q−1)(y−ŷ_q))"],"steps":["VSN 的 softmax 是「跨特征」归一化的，所以权重可以直接读成「这个特征占多少话语权」，这也是 TFT 与普通注意力模型最大的差别。","门控残差网络 GRN 用 GLU 形式：GRN(a) = LayerNorm(a + GLU(…))，作用是让每个变量先过一层非线性再被加权。","分位数输出让网络一次给出多条分位线（如 0.1/0.5/0.9），比单点预测更贴近业务需要的区间。"],"tex":["\\xi = \\mathrm{softmax}(\\mathrm{GRN}(x)),\\quad \\tilde{x} = \\xi\\odot\\mathrm{GRN}(x)","\\mathrm{Attn}(Q,K,V) = \\mathrm{softmax}\\!\\left(\\frac{QK^{\\top}}{\\sqrt{d_{k}}}\\right)V","L = \\sum_{q}\\max\\big(q(y-\\hat{y}_{q}),\\,(q-1)(y-\\hat{y}_{q})\\big)"]},"params":[["hidden","int","64","隐层维度，正整数，默认 64。VSN、LSTM、注意力的宽度都取它，越大容量越强也越易过拟合。"],["n_heads","int","4","可解释注意力的头数，正整数，默认 4。每头关注不同历史片段，头数需整除 hidden。"],["n_lstm_layers","int","1","LSTM 编码器层数，正整数，默认 1。时序不长时 1 层足够，多层收益有限。"],["quantiles","list","[0.1,0.5,0.9]","输出的分位点，默认 0.1/0.5/0.9。要更保守的区间就加 0.05 与 0.95。"],["dropout","float","0.1","各层 dropout，0–1，默认 0.1。小数据上调到 0.2–0.3。"]],"input":"x_past: (B, T, F) 历史特征；x_future: 已知的未来协变量；y: (B, H)","output":"model: 各分量权重 + 注意力权重；predict 返回各分位点预测","code":"import torch, torch.nn as nn, torch.nn.functional as F\n\nclass GLU(nn.Module):\n    def __init__(self, d):\n        super().__init__(); self.fc = nn.Linear(d, 2 * d)\n    def forward(self, x):\n        a, b = self.fc(x).chunk(2, dim=-1)\n        return a * torch.sigmoid(b)\n\nclass GRN(nn.Module):\n    \"\"\"门控残差网络：TFT 里所有「非线性 + 归一化」都用它。\"\"\"\n    def __init__(self, d, dropout=0.1):\n        super().__init__()\n        self.fc1 = nn.Linear(d, d); self.glu = GLU(d)\n        self.norm = nn.LayerNorm(d); self.drop = nn.Dropout(dropout)\n    def forward(self, x):\n        h = self.drop(self.glu(F.elu(self.fc1(x))))\n        return self.norm(x + h)\n\nclass VSN(nn.Module):\n    \"\"\"变量选择网络：给每个特征一个 softmax 权重，权重可直接当特征重要性。\"\"\"\n    def __init__(self, n_feat, d):\n        super().__init__()\n        self.w = nn.Linear(n_feat, n_feat)                 # 跨特征做 softmax\n        self.grn = GRN(n_feat)\n    def forward(self, x):                                   # x: (B, T, F)\n        xi = torch.softmax(self.w(x), dim=-1)               # 每个时刻的特征权重\n        return xi * self.grn(x), xi\n\nclass TFT(nn.Module):\n    def __init__(self, n_feat=6, hidden=64, n_heads=4, n_lstm_layers=1,\n                 quantiles=(0.1, 0.5, 0.9), dropout=0.1, horizon=6):\n        super().__init__()\n        self.quantiles, self.horizon = quantiles, horizon\n        self.vsn = VSN(n_feat, hidden)\n        self.inp = nn.Linear(n_feat, hidden)\n        self.lstm = nn.LSTM(hidden, hidden, n_lstm_layers, batch_first=True)\n        self.attn = nn.MultiheadAttention(hidden, n_heads, dropout=dropout, batch_first=True)\n        self.norm = nn.LayerNorm(hidden)\n        self.query = nn.Parameter(torch.randn(1, horizon, hidden))   # 每个预测步一个查询\n        self.head = nn.Linear(hidden, len(quantiles))\n\n    def forward(self, x):                                    # x: (B, T, F)\n        sel, w = self.vsn(x)                                 # 变量选择 + 权重\n        h, _ = self.lstm(self.inp(sel))                      # 局部动态\n        q = self.query.expand(x.size(0), -1, -1)\n        a, attn_w = self.attn(q, h, h, need_weights=True)      # 可解释注意力\n        out = self.norm(a + q)\n        return self.head(out), w, attn_w\n\ndef quantile_loss(pred, y, quantiles):\n    loss = 0\n    for i, q in enumerate(quantiles):\n        e = y - pred[..., i]\n        loss = loss + torch.max(q * e, (q - 1) * e).mean()\n    return loss\n\nif __name__ == '__main__':\n    torch.manual_seed(0)\n    B, T, Fd, H = 32, 48, 6, 6\n    x = torch.randn(B, T, Fd)\n    y = torch.randn(B, H)\n    m = TFT(n_feat=Fd, hidden=32, n_heads=4, horizon=H)\n    opt = torch.optim.Adam(m.parameters(), lr=1e-2)\n    for ep in range(80):\n        opt.zero_grad()\n        pred, w, attn = m(x)\n        loss = quantile_loss(pred, y, m.quantiles)\n        loss.backward(); opt.step()\n    print('quantile loss:', round(float(loss), 4))\n    print('变量权重(最后一层均值):', w.mean(dim=(0, 1)).detach().numpy().round(3))\n    print('注意力形状 (B, H, T):', tuple(attn.shape))"},
  {"id":"informer","name":"Informer 长时序预测","en":"Informer Long-sequence Forecasting","cat":"时间序列与预测","diff":"高难","summary":"为长序列设计的稀疏 Transformer：ProbSparse 注意力只保留「查询分布偏离均匀」的少数 Top-k，把 O(L²) 压到 O(L log L)；再加蒸馏式 encoder 与一次输出全长的 decoder。","scenes":["长输入长输出预测","电力/交通长序列","Transformer 效率优化"],"idea":["ProbSparse：用 KL 散度上界挑出「活跃」查询，其余用均值近似","自注意力蒸馏：每层把序列长度减半，堆叠后覆盖更长依赖","decoder 一次前向输出整段预测，不做逐步递归"],"deps":"PyTorch 2.3","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"稀疏度度量与蒸馏","formulas":["M(q_i,K) = max_j (q_i k_jᵀ/√d) − (1/L)Σ_j (q_i k_jᵀ/√d)","只取 M 最大的 u = c·ln L 个查询算注意力，其余用 V 的均值","蒸馏层： Conv1d(k=3, stride=2) + MaxPool，长度 L → L/2"],"steps":["稀疏性来自观察：真实序列的注意力分布高度长尾，少数查询贡献绝大部分注意力质量，其余接近均匀分布（等价于对 V 取平均）。","复杂度从 O(L²d) 降到 O(L log L · d)：L=1000 时计算量差两个数量级，这是 Informer 能处理长输入的根本。","蒸馏让 encoder 每层长度减半，最后几层的注意力实际作用在「粗粒度」序列上，因此能覆盖很长的时间跨度而不爆显存。"],"tex":["M(q_{i},K) = \\max_{j}\\frac{q_{i}k_{j}^{\\top}}{\\sqrt{d}}-\\frac{1}{L}\\sum_{j}\\frac{q_{i}k_{j}^{\\top}}{\\sqrt{d}}","\\text{keep top-}u,\\; u = c\\ln L","L \\rightarrow L/2 \\;\\text{per distilling layer}"]},"params":[["seq_len","int","96","编码器输入长度，正整数，默认 96。Informer 的优势在长输入（≥96），短序列用普通 Transformer 更省事。"],["label_len","int","48","decoder 的起始已知段长度，正整数，默认 48。给 decoder 一个「起点上下文」，避免从零开始。"],["pred_len","int","24","预测长度，正整数，默认 24。一次前向直接输出，不递归。"],["d_model","int","64","模型维度，正整数，默认 64。需能被 n_heads 整除。"],["n_heads","int","4","注意力头数，正整数，默认 4，需整除 d_model。多头并行关注不同的滞后区间与周期片段，头数过多在小数据集上会过拟合。"],["e_layers","int","2","编码器层数（含蒸馏），正整数，默认 2。层数越多序列被压得越短。"],["factor","int","5","ProbSparse 的采样因子 c，正整数，默认 5。参与采样的查询数为 c·ln L，越大越接近全注意力。"]],"input":"x_enc: (B, seq_len, F)；x_dec: (B, label_len+pred_len, F)","output":"model: encoder/decoder；predict 返回 (B, pred_len, F)","code":"import math, torch, torch.nn as nn\n\nclass ProbSparseAttention(nn.Module):\n    \"\"\"ProbSparse：只让「活跃」查询做完整注意力，其余退化为 V 的均值。\"\"\"\n    def __init__(self, d_model, n_heads, factor=5):\n        super().__init__()\n        self.h, self.dk = n_heads, d_model // n_heads\n        self.factor = factor\n        self.qkv = nn.Linear(d_model, 3 * d_model)\n        self.out = nn.Linear(d_model, d_model)\n\n    def forward(self, x):\n        B, L, _ = x.shape\n        q, k, v = self.qkv(x).chunk(3, dim=-1)\n        q = q.view(B, L, self.h, self.dk).transpose(1, 2)   # (B,h,L,dk)\n        k = k.view(B, L, self.h, self.dk).transpose(1, 2)\n        v = v.view(B, L, self.h, self.dk).transpose(1, 2)\n        score = q @ k.transpose(-2, -1) / math.sqrt(self.dk)\n        # 稀疏度度量：max - mean，越大说明该查询越「活跃」\n        M = score.max(-1).values - score.mean(-1)\n        u = max(1, int(self.factor * math.log(L + 1)))\n        top = M.topk(min(u, L), dim=-1).indices               # 每个头挑 top-u 查询\n        full = torch.zeros_like(score)\n        idx = top.unsqueeze(-1).expand(-1, -1, -1, L)\n        full.scatter_(2, idx, score.gather(2, idx))           # 只保留活跃查询的分数\n        attn = torch.softmax(full, dim=-1)\n        # 非活跃查询直接用 V 的均值近似（均匀注意力）\n        ctx_sparse = attn @ v\n        ctx_mean = v.mean(dim=2, keepdim=True).expand(-1, -1, L, -1)\n        mask = full.abs().sum(-1, keepdim=True) > 0           # 是否被选中\n        ctx = torch.where(mask, ctx_sparse, ctx_mean)\n        ctx = ctx.transpose(1, 2).reshape(B, L, -1)\n        return self.out(ctx)\n\nclass Distill(nn.Module):\n    \"\"\"自注意力蒸馏：长度减半，降低显存与计算。\"\"\"\n    def __init__(self, d):\n        super().__init__()\n        self.conv = nn.Conv1d(d, d, 3, padding=1)\n        self.norm = nn.BatchNorm1d(d)\n    def forward(self, x):                                    # (B,L,d)\n        h = self.norm(self.conv(x.transpose(1, 2))).transpose(1, 2)\n        return nn.functional.gelu(h)[:, ::2, :]              # stride-2 式下采样\n\nclass EncoderLayer(nn.Module):\n    def __init__(self, d, h, factor, distill=True):\n        super().__init__()\n        self.attn = ProbSparseAttention(d, h, factor)\n        self.ff = nn.Sequential(nn.Linear(d, 4 * d), nn.GELU(), nn.Linear(4 * d, d))\n        self.n1, self.n2 = nn.LayerNorm(d), nn.LayerNorm(d)\n        self.distill = Distill(d) if distill else None\n    def forward(self, x):\n        x = self.n1(x + self.attn(x))\n        x = self.n2(x + self.ff(x))\n        return self.distill(x) if self.distill else x\n\nclass Informer(nn.Module):\n    def __init__(self, n_feat=7, d_model=64, n_heads=4, e_layers=2, d_layers=1,\n                 pred_len=24, factor=5):\n        super().__init__()\n        self.enc_in = nn.Linear(n_feat, d_model)\n        self.dec_in = nn.Linear(n_feat, d_model)\n        self.enc = nn.ModuleList([EncoderLayer(d_model, n_heads, factor, distill=(i < e_layers - 1))\n                                  for i in range(e_layers)])\n        self.dec = nn.ModuleList([EncoderLayer(d_model, n_heads, factor, distill=False)\n                                  for _ in range(d_layers)])\n        self.proj = nn.Linear(d_model, n_feat)\n        self.pred_len = pred_len\n\n    def forward(self, x_enc, x_dec):\n        memory = self.enc_in(x_enc)\n        for layer in self.enc:\n            memory = layer(memory)                            # 长度逐层减半\n        h = self.dec_in(x_dec)\n        for layer in self.dec:\n            h = layer(h)\n        return self.proj(h[:, -self.pred_len:, :])\n\nif __name__ == '__main__':\n    torch.manual_seed(0)\n    B, L, Fd, P = 8, 96, 7, 24\n    x_enc = torch.randn(B, L, Fd)\n    x_dec = torch.randn(B, 48 + P, Fd)\n    m = Informer(n_feat=Fd, d_model=32, n_heads=4, e_layers=2, pred_len=P)\n    y = m(x_enc, x_dec)\n    print('输出形状:', tuple(y.shape), '（应为', (B, P, Fd), '）')\n    print('参数量:', sum(p.numel() for p in m.parameters()))"},
  {"id":"hdbscan","name":"HDBSCAN 层次密度聚类","en":"HDBSCAN","cat":"无监督与降维","diff":"进阶","summary":"层次密度聚类：先建最小生成树，再按「簇稳定性」自底向上切树，能自动决定簇数、识别噪声，而且不像 DBSCAN 要求全局统一 eps。","scenes":["密度差异大的数据","自动定簇数","异常点标注"],"idea":["用核心距离构造互达距离，建最小生成树","按 1/距离 从大到小切树，算每个候选簇的稳定性","保留稳定性最高的簇，其余点标为噪声（-1）"],"deps":"hdbscan 0.8","updated":"2026-11-15","lang":"Python 3 · hdbscan","math":{"title":"互达距离与簇稳定性","formulas":["d_mreach(a,b) = max(core_k(a), core_k(b), d(a,b))","稳定性 S(C) = Σ_{p∈C} (λ_p − λ_birth)，λ = 1/distance","λ = 1/d：距离越小密度越高，λ 是密度的倒数尺度"],"steps":["核心思想：DBSCAN 用一个 eps 判所有区域，密度差异大时必然顾此失彼；HDBSCAN 把 eps 变成一条连续的 λ 轴，在所有密度层上都找簇。","簇稳定性衡量「这个簇在多少密度尺度上持续存在」——持续得越久越可信，这是它自动定簇数的依据。","min_cluster_size 是最该调的参数：它决定「多小的簇才值得叫簇」，其余参数影响有限。"],"tex":["d_{mreach}(a,b) = \\max\\big(core_{k}(a),\\,core_{k}(b),\\,d(a,b)\\big)","S(C) = \\sum_{p\\in C}(\\lambda_{p}-\\lambda_{birth})","\\lambda=1/d,\\quad d\\downarrow\\Rightarrow\\lambda\\uparrow"]},"params":[["min_cluster_size","int","15","最小簇大小，正整数，默认 15。这是主参数：越大簇越少越粗，越小越容易切出碎片簇。"],["min_samples","int","None","核心距离所用的近邻数，None（默认）等于 min_cluster_size。越大越保守、噪声点越多。"],["metric","str","euclidean","距离度量，默认欧氏。高维文本可用 cosine，记得先归一化。"],["cluster_selection_method","str","eom","簇选择方式：eom（默认，按稳定性最优）、leaf（取最细的叶簇，适合要细粒度时）。"],["allow_single_cluster","bool","False","是否允许只返回一个簇，默认 false。数据确实只有一个簇时设为 true。"]],"input":"X: (n, d) 特征矩阵（建议标准化）","output":"labels: (n,)，-1 表示噪声；probabilities: 归属置信度","code":"import numpy as np, hdbscan\nfrom sklearn.datasets import make_blobs\nfrom sklearn.preprocessing import StandardScaler\n\n# 造密度差异很大的三团数据 + 少量噪声\nX1, _ = make_blobs(n_samples=300, centers=[[0, 0]], cluster_std=0.3, random_state=0)\nX2, _ = make_blobs(n_samples=300, centers=[[6, 6]], cluster_std=1.8, random_state=0)\nX3, _ = make_blobs(n_samples=200, centers=[[-6, 6]], cluster_std=0.8, random_state=0)\nX = StandardScaler().fit_transform(np.vstack([X1, X2, X3]))\n\nclusterer = hdbscan.HDBSCAN(min_cluster_size=15, min_samples=10,\n                            cluster_selection_method='eom', metric='euclidean')\nlabels = clusterer.fit_predict(X)\nprint('自动发现的簇数:', len(set(labels)) - (1 if -1 in labels else 0))\nprint('噪声点占比: %.1f%%' % (100 * (labels == -1).mean()))\nprint('各簇样本数:', np.bincount(labels[labels >= 0]))\n\n# 稳定性与置信度：可直接用来筛「可信样本」\nprint('平均归属概率: %.3f' % clusterer.probabilities_[labels >= 0].mean())\nprint('簇持续性(stability):', [round(float(s), 2) for s in clusterer.cluster_persistence_])\n\n# sklearn 内置版（1.3+）等价写法\nfrom sklearn.cluster import HDBSCAN as SkHDBSCAN\nsk = SkHDBSCAN(min_cluster_size=15, min_samples=10).fit(X)\nprint('sklearn 版簇数:', len(set(sk.labels_)) - (1 if -1 in sk.labels_ else 0))"},
  {"id":"optics","name":"OPTICS 密度排序聚类","en":"OPTICS","cat":"无监督与降维","diff":"进阶","summary":"密度排序聚类：按可达距离输出一条排序，从「可达距离图」的山谷读簇。不要求全局统一 eps，因此能同时处理疏密差异大的簇——DBSCAN 的放宽版。","scenes":["簇密度不均","探索性聚类","可达距离图诊断"],"idea":["按核心距离从小到大扩展，记录每个点的可达距离","可达距离序列画出柱状图：谷=簇内部，峰=簇边界","用 xi 或阈值从排序结果里抽取簇"],"deps":"scikit-learn 1.4","updated":"2026-11-15","lang":"Python 3 · scikit-learn","math":{"title":"核心距离与可达距离","formulas":["core_dist(p) = 第 min_samples 近邻的距离","reach(p,q) = max(core_dist(p), d(p,q))","簇 = 可达距离低于阈值的连续段；边界处可达距离出现尖峰"],"steps":["OPTICS 本质上把 DBSCAN 的「一次 eps 判定」换成「一条密度排序」，eps 变成事后从图里读出来的量。","可达距离图是它最大的价值：峰值是簇边界，谷的深度反映簇内密度，一眼能看出有几个簇、密度差多少。","xi 法（默认陡峭度检测）比固定阈值更省心；但 xi 太小时会把密度波动误判成新簇。"],"tex":["core\\_dist(p) = d(p,\\,k\\text{-th neighbor})","reach(p,q) = \\max\\big(core\\_dist(p),\\,d(p,q)\\big)","\\text{cluster} = \\{\\text{连续的 } reach < \\varepsilon\\}"]},"params":[["min_samples","int","5","核心点的近邻数，正整数，默认 5。越大越保守（要求更密的邻域），噪声点更多。"],["xi","float","0.05","陡峭度阈值，0–1，默认 0.05。越小越容易切出更多簇；0.05–0.1 是常用范围。"],["min_cluster_size","int","None","最小簇大小，None（默认）沿用 min_samples。调大可过滤掉小碎片簇。"],["metric","str","minkowski","距离度量，默认 minkowski(p=2) 即欧氏。高维可用 cosine。"],["cluster_method","str","xi","抽簇方式：xi（默认，陡峭度）、dbscan（用 max_eps 当 eps，等价于自适应版 DBSCAN）。"]],"input":"X: (n, d) 特征矩阵","output":"labels: (n,)；reachability_ 与 ordering_ 可直接画可达距离图","code":"import numpy as np\nfrom sklearn.cluster import OPTICS\nfrom sklearn.datasets import make_blobs\nfrom sklearn.preprocessing import StandardScaler\n\nX1, _ = make_blobs(n_samples=250, centers=[[0, 0]], cluster_std=0.25, random_state=0)\nX2, _ = make_blobs(n_samples=250, centers=[[5, 5]], cluster_std=1.5, random_state=0)\nX = StandardScaler().fit_transform(np.vstack([X1, X2]))\n\nopt = OPTICS(min_samples=8, xi=0.05, min_cluster_size=20, cluster_method='xi')\nlabels = opt.fit_predict(X)\nprint('簇数:', len(set(labels)) - (1 if -1 in labels else 0), '| 噪声占比: %.1f%%' % (100 * (labels == -1).mean()))\n\n# 可达距离图的数据：横轴 ordering_ 顺序，纵轴 reachability_（峰=边界，谷=簇）\norder, reach = opt.ordering_, opt.reachability_[opt.ordering_]\nprint('可达距离 min/median/max: %.2f / %.2f / %.2f' % (reach.min(), np.median(reach), reach.max()))\nprint('前 12 个点的排序与可达距离:')\nprint(np.c_[order[:12], np.round(reach[:12], 2)])\n\n# 对比：DBSCAN 用单一 eps，在密度差异大的数据上会漏掉稀疏簇\nfrom sklearn.cluster import DBSCAN\nfrom sklearn.metrics import adjusted_rand_score\nd = DBSCAN(eps=0.3, min_samples=8).fit_predict(X)\nprint('DBSCAN(eps=0.3) 簇数:', len(set(d)) - (1 if -1 in d else 0))\nprint('两种结果的一致性 ARI:', round(adjusted_rand_score(labels, d), 3))"},
  {"id":"ppo","name":"近端策略优化 PPO","en":"Proximal Policy Optimization (PPO)","cat":"强化学习","diff":"高难","summary":"用“裁剪”的替代目标把每次策略更新的幅度限制在一个信任区间内，既保留了策略梯度的简单，又拿到了 TRPO 级别的稳定性。","scenes":["连续动作控制","离散动作游戏","RLHF 偏好对齐","大规模并行采样"],"idea":["用新旧策略的概率比 r_t(θ) 度量这次更新迈了多大一步","目标函数对 r_t 做 clip(1−ε, 1+ε)：好处被截断，坏处不截断，取两者的较小值形成悲观下界","用 GAE 估计优势 Â_t，在偏差与方差之间取折中，替代原始回报","同一批数据跑多轮（epochs）更新，样本利用率远高于 vanilla 策略梯度"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"PPO-Clip 目标与 GAE","formulas":["r_t(θ) = π_θ(a_t|s_t) / π_θold(a_t|s_t)","L^CLIP(θ) = E_t[ min( r_t(θ)·Â_t , clip(r_t(θ), 1−ε, 1+ε)·Â_t ) ]","Â_t^GAE = Σ_{l≥0} (γλ)^l · δ_{t+l} ,  δ_t = r_t + γV(s_{t+1}) − V(s_t)"],"steps":["用当前策略采样一批轨迹，同时记录 log π_old(a|s) 与状态价值 V(s)。","反向计算 TD 残差 δ_t，按 γλ 加权累加得到每个时刻的优势估计 Â_t。","把 Â_t 归一化后代入裁剪目标：当 Â>0 时比值涨过 1+ε 就失去梯度，当 Â<0 时跌过 1−ε 就失去梯度，更新被“锁”在区间内。","总损失 = −L^CLIP + c1·价值回归 MSE − c2·策略熵，三项一起反传，跑若干 epoch 后丢弃这批数据。"],"tex":["r_t(\\theta)=\\frac{\\pi_\\theta(a_t\\mid s_t)}{\\pi_{\\theta_{\\mathrm{old}}}(a_t\\mid s_t)}","L^{\\mathrm{CLIP}}(\\theta)=\\mathbb E_t\\Bigl[\\min\\bigl(r_t(\\theta)\\hat A_t,\\;\\mathrm{clip}(r_t(\\theta),1-\\epsilon,1+\\epsilon)\\hat A_t\\bigr)\\Bigr]","\\hat A_t^{\\mathrm{GAE}}=\\sum_{l\\ge 0}(\\gamma\\lambda)^{l}\\delta_{t+l},\\quad \\delta_t=r_t+\\gamma V(s_{t+1})-V(s_t)"]},"params":[["clip_eps","float","0.2","裁剪半径 ε，正浮点数，常取 0.1–0.3，默认 0.2。越小每次更新越保守、训练越稳但更慢；调大到 0.4 以上容易策略崩塌。"],["epochs","int","10","每批数据的复用轮数，正整数，默认 10。轮数越多样本效率越高，但超过十余轮后新旧策略差异变大，裁剪会大面积切断梯度。"],["gae_lambda","float","0.95","GAE 的偏差-方差折中系数 λ，0–1，默认 0.95。接近 0 近似单步 TD（低方差高偏差），接近 1 近似蒙特卡洛回报（高方差低偏差）。"],["gamma","float","0.99","回报折扣因子 γ，0–1，默认 0.99。越接近 1 越看重长期收益，但有效视界变长、方差上升；回合步数短时可降到 0.95。"],["entropy_coef","float","0.01","策略熵奖励系数，非负浮点数，默认 0.01。适当加熵能防止策略过早收敛到单一动作；过大会让策略始终随机、学不到确定行为。"],["lr","float","3e-4","学习率，正浮点数，默认 3e-4，无单位。PPO 对学习率敏感，配 Adam 时通常不超过 1e-3，连续控制任务常用 3e-4。"]],"input":"states: torch.Tensor [T, state_dim]\nactions: torch.Tensor [T]  (离散) 或 [T, act_dim] (连续)\nlogp_old: torch.Tensor [T]\nreturns / advantages: torch.Tensor [T]","output":"policy_loss, value_loss, entropy: torch.Tensor (标量)","code":"import torch, torch.nn as nn\n\nclass ActorCritic(nn.Module):\n    def __init__(self, s_dim, a_dim, hidden=64):\n        super().__init__()\n        self.body = nn.Sequential(nn.Linear(s_dim, hidden), nn.Tanh(),\n                                  nn.Linear(hidden, hidden), nn.Tanh())\n        self.pi = nn.Linear(hidden, a_dim)      # 离散动作的 logits\n        self.v  = nn.Linear(hidden, 1)\n\n    def forward(self, s):\n        h = self.body(s)\n        return self.pi(h), self.v(h).squeeze(-1)\n\ndef ppo_loss(model, s, a, logp_old, adv, ret, clip_eps=0.2, ent_coef=0.01, vf_coef=0.5):\n    logits, v = model(s)\n    dist = torch.distributions.Categorical(logits=logits)\n    logp = dist.log_prob(a)\n    ratio = torch.exp(logp - logp_old)                 # r_t(theta)\n    surr1 = ratio * adv\n    surr2 = torch.clamp(ratio, 1 - clip_eps, 1 + clip_eps) * adv\n    policy_loss = -torch.min(surr1, surr2).mean()      # 悲观下界\n    value_loss = ((ret - v) ** 2).mean()\n    entropy = dist.entropy().mean()\n    return policy_loss + vf_coef * value_loss - ent_coef * entropy\n\ndef gae(rewards, values, dones, gamma=0.99, lam=0.95):\n    adv, last = torch.zeros_like(rewards), 0.0\n    for t in reversed(range(len(rewards))):\n        next_v = values[t + 1] if t + 1 < len(values) else 0.0\n        delta = rewards[t] + gamma * next_v * (1 - dones[t]) - values[t]\n        last = delta + gamma * lam * (1 - dones[t]) * last\n        adv[t] = last\n    return adv, adv + values"},
  {"id":"a2c","name":"优势演员-评论家 A2C","en":"Advantage Actor-Critic (A2C)","cat":"强化学习","diff":"进阶","summary":"演员输出策略、评论家估计状态价值，用“实际回报减去价值基线”作为优势来指导策略更新，是理解一切 Actor-Critic 方法的最小完整骨架。","scenes":["同步并行采样","离散动作控制","教学与算法原型","策略梯度入门"],"idea":["演员 π(a|s;θ) 与评论家 V(s;w) 共享特征提取主干，两个头分别输出","优势 Â = 回报 − V(s)：直接把“这步比平均水平好多少”作为动作的权重","减去基线不改变策略梯度的期望，却能显著降低方差（这是 A2C 相对 REINFORCE 的核心收益）","A2C 是 A3C 的同步版本：多环境并行采样后拼接成一个 batch 一次更新，实现更简单、GPU 利用率更高"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"优势函数与双头损失","formulas":["Â_t = Σ_{k=0}^{n−1} γ^k r_{t+k} + γ^n V(s_{t+n}) − V(s_t)","L_actor(θ) = −E[ log π_θ(a_t|s_t) · Â_t ]","L_critic(w) = E[ ( V_w(s_t) − R_t )² ] ,  L = L_actor + c_v·L_critic − c_e·H(π)"],"steps":["n 个环境各走 n_steps 步，收集 (s, a, r, s′, done)。","用自举方式算每个时刻的 n 步回报并减去 V(s)，得到优势 Â_t。","演员按 −logπ·Â 反传（Â>0 提高该动作概率，Â<0 压低），评论家按 MSE 回归回报。","熵正则项 H(π) 防止策略过早坍缩为确定性动作。"],"tex":["\\hat A_t=\\sum_{k=0}^{n-1}\\gamma^{k}r_{t+k}+\\gamma^{n}V(s_{t+n})-V(s_t)","L_{\\mathrm{actor}}(\\theta)=-\\mathbb E\\bigl[\\log\\pi_\\theta(a_t\\mid s_t)\\hat A_t\\bigr]","L=L_{\\mathrm{actor}}+c_v\\bigl(V_w(s_t)-R_t\\bigr)^{2}-c_e H(\\pi)"]},"params":[["n_steps","int","5","每个环境单次采样的步数，正整数，默认 5。值越大回报估计偏差越小但方差越大；连续控制常用 5–20，离散任务可取 128。"],["n_envs","int","8","并行环境数量，正整数，默认 8。越多 batch 越大、梯度越平滑，代价是内存与模拟器开销线性增长。"],["gamma","float","0.99","折扣因子 γ，0–1，默认 0.99，无单位。决定智能体的“视界”，越接近 1 越重视远期回报，但回报方差也随之放大。"],["entropy_coef","float","0.01","熵奖励系数，非负浮点数，默认 0.01。适度探索用；设为 0 常导致策略早熟，设太大则收敛不到确定策略。"],["value_coef","float","0.5","评论家损失权重 c_v，非负浮点数，默认 0.5。太小价值估计跟不上、优势失真；太大则价值梯度压过策略梯度。"],["lr","float","7e-4","共享主干的学习率，正浮点数，默认 7e-4，无单位。A2C 常用 RMSProp/Adam，学习率超过 1e-3 时容易发散。"]],"input":"states: torch.Tensor [B, state_dim]\nactions: torch.Tensor [B]\nreturns: torch.Tensor [B]\nadvantages: torch.Tensor [B]","output":"actor_loss, critic_loss, entropy: torch.Tensor (标量)","code":"import torch, torch.nn as nn\n\nclass A2CNet(nn.Module):\n    def __init__(self, s_dim, a_dim, hidden=64):\n        super().__init__()\n        self.trunk = nn.Sequential(nn.Linear(s_dim, hidden), nn.Tanh())\n        self.pi = nn.Linear(hidden, a_dim)\n        self.v  = nn.Linear(hidden, 1)\n\n    def act(self, s):\n        h = self.trunk(s)\n        logits = self.pi(h)\n        dist = torch.distributions.Categorical(logits=logits)\n        a = dist.sample()\n        return a, dist.log_prob(a), self.v(h).squeeze(-1)\n\ndef a2c_loss(logp, values, returns, adv, ent_coef=0.01, value_coef=0.5, ent=0.0):\n    advantage = (returns - values).detach()          # 这里直接用 n 步回报减基线\n    actor_loss  = -(logp * advantage).mean()\n    critic_loss = ((returns - values) ** 2).mean()\n    return actor_loss + value_coef * critic_loss - ent_coef * ent\n\n# 伪训练循环：多环境并行采样 -> 拼接 batch -> 一次 backward\n# for step in range(total):\n#     s, a, logp, v = net.act(states)\n#     nxt, r, done = envs.step(a)\n#     buf.append((s, a, logp, r, nxt, done))\n#     if len(buf) == n_steps * n_envs: update(); buf.clear()"},
  {"id":"sac","name":"软演员-评论家 SAC","en":"Soft Actor-Critic (SAC)","cat":"强化学习","diff":"高难","summary":"在最大熵框架下做离策略 Actor-Critic：策略除了最大化回报，还要最大化自己的熵，因此天然具备探索能力，是连续控制任务上最稳的默认算法之一。","scenes":["连续动作机器人控制","样本效率敏感场景","离策略深度 RL","真实系统在线学习"],"idea":["目标改为 J(π) = Σ E[ r + α·H(π(·|s)) ]，“回报 + 熵”一起最大化","双 Q 网络取最小值抑制过估计（Twin-Critic），配合目标网络软更新","策略用“重参数化技巧”采样：a = tanh(μ + σ⊙ξ)，梯度可以穿过采样直达策略参数","温度 α 可自动调节：熵低于目标值就调大 α 鼓励探索，高于目标值就调小"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"最大熵目标与软 Q 更新","formulas":["J(π) = Σ_t E_{(s_t,a_t)~ρ_π}[ r(s_t,a_t) + α·H( π(·|s_t) ) ]","y = r + γ·( min_{i=1,2} Q̄_i(s′,a′) − α·log π(a′|s′) ) ,  a′ ~ π(·|s′)","L_π = E[ α·log π(a|s) − min_i Q_i(s,a) ] ,  a = tanh(μ_θ(s) + σ_θ(s)⊙ξ)"],"steps":["从回放池采样一批转移，用目标网络算软 TD 目标 y（含熵项 −α log π）。","两个 Q 网络各自回归 y，取较小值作为策略改进时的价值估计，抑制正偏差。","策略网络最大化 min Q − α log π；重参数化让梯度穿过 tanh 采样，得到确定性的低方差梯度。","温度 α 的优化目标为 J(α) = E[ −α·(log π(a|s) + H̄) ]；为避免 α 变负，实际对 log α 求导：∂J/∂log α = −α·(log π + H̄)，于是 log α ← log α − β·∂J/∂log α。直觉是：当前熵低于目标 H̄ 时括号里为负，∂J/∂log α 为正，α 被推大以鼓励探索；反之 α 缩小、策略变确定。"],"tex":["J(\\pi)=\\sum_t\\mathbb E_{\\rho_\\pi}\\bigl[r(s_t,a_t)+\\alpha H(\\pi(\\cdot\\mid s_t))\\bigr]","y=r+\\gamma\\bigl(\\min_{i=1,2}\\bar Q_i(s\\prime,a\\prime)-\\alpha\\log\\pi(a\\prime\\mid s\\prime)\\bigr)","L_\\pi=\\mathbb E\\bigl[\\alpha\\log\\pi(a\\mid s)-\\min_i Q_i(s,a)\\bigr]"]},"params":[["alpha","float","0.2","熵温度系数 α，正浮点数，默认 0.2（自动调节时作为初值）。越大越鼓励随机探索、策略越“软”；越小越接近普通确定性策略改进。"],["target_entropy","float","−dim(A)","目标熵 H̄，通常取 −动作维度（负浮点数）。自动调温时 α 会驱动策略熵逼近该值，−dim 表示希望每维约保留 1 的自然单位熵。"],["tau","float","0.005","目标网络软更新系数 τ，0–1，默认 0.005，无单位。每步 θ̄ ← τθ + (1−τ)θ̄；越小目标越稳但跟踪越慢，常用 0.001–0.01。"],["gamma","float","0.99","折扣因子 γ，0–1，默认 0.99。越接近 1 越重视长期回报；连续控制任务常用 0.99，步长很小时可用 0.999。"],["batch_size","int","256","每次从回放池采样的小批量大小，正整数，默认 256。SAC 是离策略算法，batch 太小会让双 Q 估计抖动明显。"],["lr","float","3e-4","网络学习率，正浮点数，默认 3e-4，无单位。策略与两个 Q 网络通常共用同一学习率，超过 1e-3 常出现价值发散。"]],"input":"state: torch.Tensor [B, state_dim]\naction: torch.Tensor [B, act_dim]  (经 tanh 压缩到 [-1,1])\nreward, next_state, done: torch.Tensor [B]","output":"q1, q2: torch.Tensor [B, 1]\nlog_prob: torch.Tensor [B, 1]","code":"import torch, torch.nn as nn, torch.nn.functional as F\n\nLOG_STD_MIN, LOG_STD_MAX = -20, 2\n\nclass GaussianPolicy(nn.Module):\n    def __init__(self, s_dim, a_dim, hidden=256):\n        super().__init__()\n        self.net = nn.Sequential(nn.Linear(s_dim, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, hidden), nn.ReLU())\n        self.mu  = nn.Linear(hidden, a_dim)\n        self.ls  = nn.Linear(hidden, a_dim)\n\n    def sample(self, s):\n        h = self.net(s)\n        mu, ls = self.mu(h), self.ls(h).clamp(LOG_STD_MIN, LOG_STD_MAX)\n        std = ls.exp()\n        dist = torch.distributions.Normal(mu, std)\n        x = dist.rsample()                       # 重参数化，梯度可回传\n        a = torch.tanh(x)\n        logp = dist.log_prob(x) - torch.log(1 - a.pow(2) + 1e-6)\n        return a, logp.sum(-1, keepdim=True)\n\nclass TwinQ(nn.Module):\n    def __init__(self, s_dim, a_dim, hidden=256):\n        super().__init__()\n        def q():\n            return nn.Sequential(nn.Linear(s_dim + a_dim, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, 1))\n        self.q1, self.q2 = q(), q()\n\n    def forward(self, s, a):\n        x = torch.cat([s, a], -1)\n        return self.q1(x), self.q2(x)\n\ndef soft_q_target(r, done, q1t, q2t, logp_next, alpha, gamma=0.99):\n    q_next = torch.min(q1t, q2t) - alpha * logp_next    # 软价值\n    return r + gamma * (1 - done) * q_next\n\ndef sac_losses(policy, q, q_targ, s, a, r, s2, d, alpha=0.2, gamma=0.99):\n    with torch.no_grad():\n        a2, logp2 = policy.sample(s2)\n        q1t, q2t = q_targ(s2, a2)\n        y = soft_q_target(r, d, q1t, q2t, logp2, alpha, gamma)\n    q1, q2 = q(s, a)\n    q_loss = F.mse_loss(q1, y) + F.mse_loss(q2, y)\n    a_new, logp = policy.sample(s)\n    q1p, q2p = q(s, a_new)\n    pi_loss = (alpha * logp - torch.min(q1p, q2p)).mean()\n    return q_loss, pi_loss"},
  {"id":"ddpg","name":"深度确定性策略梯度 DDPG","en":"Deep Deterministic Policy Gradient (DDPG)","cat":"强化学习","diff":"高难","summary":"把 DQN 的离策略训练套路搬到连续动作上：演员直接输出确定动作，评论家给出该动作的 Q 值，演员沿着 ∇_a Q 的方向改进——无需对动作空间采样。","scenes":["连续控制","离策略学习","确定性策略","机器人关节控制"],"idea":["确定性策略 a = μ(s;θ) 输出唯一动作，避免了连续空间无法枚举动作的问题","确定性策略梯度：∇_θ J = E[ ∇_a Q(s,a;w)|_{a=μ(s)} · ∇_θ μ(s;θ) ]，先对动作求导再对参数求导","沿用 DQN 的两件法宝：经验回放打破相关性，目标网络加软更新抑制发散","探索靠给动作叠加噪声（OU 过程或高斯噪声），因为策略本身不含随机性"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"确定性策略梯度与软更新","formulas":["∇_θ J = E_{s~D}[ ∇_a Q(s,a;w)|_{a=μ(s;θ)} · ∇_θ μ(s;θ) ]","y = r + γ·Q′(s′, μ′(s′;θ′); w′)","L(w) = E[ ( Q(s,a;w) − y )² ] ,  w′ ← τw + (1−τ)w′"],"steps":["演员按 μ(s) 加噪声输出动作，与环境交互后把 (s,a,r,s′,done) 存入回放池。","评论家以软 TD 目标 y（用目标演员+目标评论家算，无 max 操作）为标签做回归。","演员沿 ∇_a Q·∇_θ μ 上升，把动作推向评论家评价更高的方向；注意更新演员时冻结评论家参数。","目标网络按 τ 缓慢跟随，避免自举目标追逐一个剧烈变化的网络。"],"tex":["\\nabla_\\theta J=\\mathbb E_s\\bigl[\\nabla_a Q(s,a;w)\\big|_{\\scriptstyle a=\\mu(s;\\theta)}\\nabla_\\theta\\mu(s;\\theta)\\bigr]","y=r+\\gamma Q\\prime(s\\prime,\\mu\\prime(s\\prime;\\theta\\prime);w\\prime)","w\\prime\\leftarrow\\tau w+(1-\\tau)w\\prime"]},"params":[["tau","float","0.001","目标网络软更新系数 τ，0–1，默认 0.001，无单位。DDPG 比 SAC 更依赖慢更新，τ 大于 0.01 时常见 Q 值爆炸。"],["noise_std","float","0.1","探索噪声标准差，非负浮点数，默认 0.1（动作已归一化到 [-1,1]）。太小探索不足易陷局部最优，太大会让轨迹像随机游走、价值学不出来。"],["gamma","float","0.99","折扣因子 γ，0–1，默认 0.99，无单位。决定长期回报权重；任务回合较长时可提高到 0.999 并相应放慢目标更新。"],["batch_size","int","64","回放池采样批量，正整数，默认 64（原论文取值）。批量太小评论家梯度噪声大，批量放大到 256 通常更稳。"],["actor_lr","float","1e-4","演员学习率，正浮点数，默认 1e-4，无单位。演员梯度经过 ∇_a Q 放大，学习率通常要比评论家小一个量级。"],["critic_lr","float","1e-3","评论家学习率，正浮点数，默认 1e-3，无单位。评论家需要快速跟上回报变化，但过大时 TD 目标本身会震荡。"]],"input":"state: torch.Tensor [B, state_dim]\naction: torch.Tensor [B, act_dim]\nreward, next_state, done: torch.Tensor [B]","output":"action (演员, 确定性): torch.Tensor [B, act_dim]\nq_value (评论家): torch.Tensor [B, 1]","code":"import torch, torch.nn as nn, torch.nn.functional as F\n\nclass Actor(nn.Module):\n    def __init__(self, s_dim, a_dim, hidden=256):\n        super().__init__()\n        self.net = nn.Sequential(nn.Linear(s_dim, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, a_dim), nn.Tanh())\n    def forward(self, s):\n        return self.net(s)                       # 确定性动作，范围 [-1,1]\n\nclass Critic(nn.Module):\n    def __init__(self, s_dim, a_dim, hidden=256):\n        super().__init__()\n        self.net = nn.Sequential(nn.Linear(s_dim + a_dim, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, hidden), nn.ReLU(),\n                                 nn.Linear(hidden, 1))\n    def forward(self, s, a):\n        return self.net(torch.cat([s, a], -1))\n\ndef ddpg_update(actor, critic, actor_t, critic_t, opt_a, opt_c,\n                s, a, r, s2, d, gamma=0.99, tau=0.001):\n    with torch.no_grad():\n        y = r + gamma * (1 - d) * critic_t(s2, actor_t(s2))\n    critic_loss = F.mse_loss(critic(s, a), y)\n    opt_c.zero_grad(); critic_loss.backward(); opt_c.step()\n\n    # 演员：最大化 Q(s, mu(s))，等价于最小化 -Q；更新时冻结评论家\n    actor_loss = -critic(s, actor(s)).mean()\n    opt_a.zero_grad(); actor_loss.backward(); opt_a.step()\n\n    with torch.no_grad():\n        for p, pt in zip(actor.parameters(), actor_t.parameters()):\n            pt.mul_(1 - tau).add_(tau * p)\n        for p, pt in zip(critic.parameters(), critic_t.parameters()):\n            pt.mul_(1 - tau).add_(tau * p)\n    return critic_loss.item(), actor_loss.item()"},
  {"id":"mf-recsys","name":"矩阵分解推荐 MF / BPR","en":"Matrix Factorization for Recommendation (BPR-MF)","cat":"推荐与 CTR 排序","diff":"进阶","summary":"把稀疏的用户-物品评分矩阵拆成两个低维隐向量矩阵，用内积预测偏好；配合 BPR 成对损失即可只凭“点击/未点击”学出排序。","scenes":["协同过滤召回","隐式反馈建模","冷启动之外的个性化","大规模稀疏矩阵补全"],"idea":["用户 u 与物品 i 各有一个 k 维隐向量 p_u、q_i，预测偏好 r̂ = p_u·q_i + b_u + b_i + μ","隐向量的每一维可理解为某种潜在风格（如“动作片偏好度”），模型自动学出而不需人工定义","显式评分用平方损失 + L2 正则；隐式反馈用 BPR：让正样本得分比负样本高出至少一个 margin","BPR 用“用户对正样本的偏好 > 对负样本的偏好”这一成对约束，避免把未点击一律当作 0 分"],"deps":"PyTorch 2.2 / NumPy","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"MF 预测与 BPR 成对损失","formulas":["r̂_{ui} = μ + b_u + b_i + p_u·q_i","L = Σ_{(u,i,j)} −ln σ( r̂_{ui} − r̂_{uj} ) + λ( ‖p_u‖² + ‖q_i‖² + ‖q_j‖² )","∂L/∂p_u = −(1−σ(Δ))·(q_i − q_j) + 2λp_u"],"steps":["为每个用户采样一个正样本 i（有点击/购买）与一个负样本 j（未交互），构成三元组 (u,i,j)。","用内积差 Δ = r̂_ui − r̂_uj 度量“正样本比负样本好多少”。","损失为 −ln σ(Δ)：Δ 越大损失越小；Δ 为负时梯度最强，把正样本往上推、负样本往下压。","SGD 更新隐向量，L2 正则抑制隐向量范数膨胀（否则训练集 AUC 涨而线上排序塌）。"],"tex":["\\hat r_{ui}=\\mu+b_u+b_i+p_u\\cdot q_i","L=\\sum_{(u,i,j)}-\\ln\\sigma(\\hat r_{ui}-\\hat r_{uj})+\\lambda\\bigl(\\lVert p_u\\rVert^{2}+\\lVert q_i\\rVert^{2}+\\lVert q_j\\rVert^{2}\\bigr)","\\nabla_{p_u}L=-(1-\\sigma(\\Delta))(q_i-q_j)+2\\lambda p_u"]},"params":[["n_factors","int","32","隐向量维度 k，正整数，默认 32。太小表达力不足（欠拟合），太大在稀疏数据上极易过拟合；工业召回常取 32–128。"],["lr","float","0.01","学习率，正浮点数，默认 0.01，无单位。BPR 对学习率敏感，配 Adam 时常用 1e-3，纯 SGD 时 0.01 左右。"],["reg","float","1e-4","L2 正则系数 λ，非负浮点数，默认 1e-4。交互极稀疏时必须加大（1e-5~1e-3），否则隐向量范数爆炸、推荐全挤到热门物品。"],["epochs","int","20","训练轮数，正整数，默认 20。每轮遍历全部交互；配合早停时监控验证集 NDCG 而非训练损失。"],["neg_per_pos","int","1","每个正样本采样的负样本个数，正整数，默认 1。增大可让梯度更平滑，但计算成本线性上升，常用 1–4。"]],"input":"users: torch.LongTensor [B]\npos_items: torch.LongTensor [B]\nneg_items: torch.LongTensor [B]","output":"scores: torch.Tensor [B]  (预测偏好分数)\nloss: torch.Tensor (标量)","code":"import torch, torch.nn as nn\n\nclass BPRMF(nn.Module):\n    def __init__(self, n_users, n_items, k=32, reg=1e-4):\n        super().__init__()\n        self.P = nn.Embedding(n_users, k)     # 用户隐向量\n        self.Q = nn.Embedding(n_items, k)     # 物品隐向量\n        nn.init.normal_(self.P.weight, std=0.01)\n        nn.init.normal_(self.Q.weight, std=0.01)\n        self.reg = reg\n\n    def score(self, u, i):\n        return (self.P(u) * self.Q(i)).sum(-1)\n\n    def forward(self, u, i, j):\n        pu, qi, qj = self.P(u), self.Q(i), self.Q(j)\n        x = (pu * (qi - qj)).sum(-1)                     # Delta = r_ui - r_uj\n        loss = -torch.nn.functional.logsigmoid(x).mean()\n        reg = (pu.pow(2).sum() + qi.pow(2).sum() + qj.pow(2).sum()) / u.size(0)\n        return loss + self.reg * reg\n\ndef full_rank(model, user_ids, n_items, topk=10):\n    \"\"\"离线评估：给一批用户出 top-k 推荐\"\"\"\n    with torch.no_grad():\n        U = model.P(torch.as_tensor(user_ids))                 # [B, k]\n        S = U @ model.Q.weight.t()                             # [B, n_items]\n        return S.topk(topk, dim=-1).indices"},
  {"id":"neumf","name":"神经协同过滤 NeuMF","en":"Neural Collaborative Filtering (NeuMF)","cat":"推荐与 CTR 排序","diff":"高难","summary":"用神经网络替代矩阵分解的内积：广义矩阵分解（GMF）负责线性交互，多层感知机（MLP）负责非线性交互，两路拼接输出预测，突破内积的表达上限。","scenes":["隐式反馈排序","非线性用户-物品交互","神经协同过滤","召回/精排之间"],"idea":["GMF 分支：把用户与物品隐向量逐元素相乘，等价于带权内积，保留 MF 的线性表达能力","MLP 分支：两路隐向量拼接后过若干全连接层，学习高阶非线性交互","两条分支使用各自独立的 embedding（不复用），最后 concat 过一个线性层输出","预训练技巧：GMF 用 MF 的隐向量初始化、MLP 用随机初始化，再联合微调，收敛更快更稳"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"GMF 与 MLP 双路融合","formulas":["φ^GMF = p_u^G ⊙ q_i^G","φ^MLP = a_L( … a_1( [p_u^M ; q_i^M] W_1 ) … )","ŷ_{ui} = σ( hᵀ [ φ^GMF ; φ^MLP ] )"],"steps":["为用户/物品各准备两套 embedding：GMF 用的 p^G,q^G 与 MLP 用的 p^M,q^M。","GMF 路逐元素相乘得到线性交互向量；MLP 路先拼接再逐层升维降维，得到非线性交互向量。","两路向量拼接后经一层线性映射 + sigmoid，输出点击概率。","损失为二元交叉熵；负样本按均匀分布采样（隐式反馈下未交互≠负样本，需注意采样偏差）。"],"tex":["\\phi^{\\mathrm{GMF}}=p_u^{G}\\odot q_i^{G}","\\phi^{\\mathrm{MLP}}=a_L(\\cdots a_1([p_u^{M};q_i^{M}]W_1)\\cdots)","\\hat y_{ui}=\\sigma\\bigl(h^{\\top}[\\phi^{\\mathrm{GMF}};\\phi^{\\mathrm{MLP}}]\\bigr)"]},"params":[["n_factors","int","8","GMF 与 MLP 的隐向量维度，正整数，默认 8（原论文取值）。维度太小 GMF 路表达力弱，放大到 32/64 通常能涨点但更易过拟合。"],["layers","list","[64,32,16,8]","MLP 各隐藏层宽度，正整数列表，默认 [64,32,16,8]。逐层收窄形成漏斗结构，层数越多非线性越强、参数也越多。"],["dropout","float","0.2","MLP 各层 dropout 比例，0–1，默认 0.2。稀疏交互数据上设为 0.2–0.5 能明显抑制过拟合；数据充足时可降到 0。"],["neg_ratio","int","4","每正样本采样的负样本倍数，正整数，默认 4。负样本越多排序边界越清晰，但训练时间线性增长。"],["lr","float","1e-3","学习率，正浮点数，默认 1e-3，无单位。配合 Adam 使用；embedding 层可单独给更大学习率以加快收敛。"]],"input":"user_ids: torch.LongTensor [B]\nitem_ids: torch.LongTensor [B]\nlabels: torch.Tensor [B]  (0/1)","output":"logits / prob: torch.Tensor [B]","code":"import torch, torch.nn as nn\n\nclass NeuMF(nn.Module):\n    def __init__(self, n_users, n_items, k=8, layers=(64, 32, 16, 8), dropout=0.2):\n        super().__init__()\n        # GMF 分支的 embedding\n        self.pg = nn.Embedding(n_users, k)\n        self.qg = nn.Embedding(n_items, k)\n        # MLP 分支的 embedding（独立参数）\n        self.pm = nn.Embedding(n_users, k)\n        self.qm = nn.Embedding(n_items, k)\n\n        mlp, in_dim = [], 2 * k\n        for h in layers:\n            mlp += [nn.Linear(in_dim, h), nn.ReLU(), nn.Dropout(dropout)]\n            in_dim = h\n        self.mlp = nn.Sequential(*mlp)\n        self.out = nn.Linear(k + layers[-1], 1)\n\n    def forward(self, u, i):\n        gmf = self.pg(u) * self.qg(i)                       # 线性交互\n        mlp = self.mlp(torch.cat([self.pm(u), self.qm(i)], -1))  # 非线性交互\n        return self.out(torch.cat([gmf, mlp], -1)).squeeze(-1)\n\ndef train_step(model, opt, u, i, y):\n    logits = model(u, i)\n    loss = nn.functional.binary_cross_entropy_with_logits(logits, y.float())\n    opt.zero_grad(); loss.backward(); opt.step()\n    return loss.item()"},
  {"id":"wide-deep","name":"Wide & Deep 模型","en":"Wide & Deep Learning Recommender","cat":"推荐与 CTR 排序","diff":"进阶","summary":"Google 提出的经典双塔思想：Wide 侧做人工交叉特征的线性记忆，Deep 侧用 embedding + MLP 做泛化，两路 logit 相加后统一过 sigmoid。","scenes":["应用商店推荐","CTR 预估","记忆与泛化兼顾","稀疏类别特征"],"idea":["Wide 部分：对人工设计的交叉特征（如“已安装应用 × 曝光应用”）做线性加权，擅长“精确记忆”高频共现模式","Deep 部分：类别特征查 embedding 后拼接，过 3 层 ReLU 网络，擅长“泛化”到没见过的组合","两路输出在 logit 空间直接相加：ŷ = σ( w_wideᵀx_wide + w_deepᵀa^L + b )","训练用 Follow-the-regularized-leader（FTRL）+ L1 训 Wide，AdaGrad 训 Deep，联合反传"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"双路 logit 相加","formulas":["ŷ = σ( w^T_{wide}[x, φ(x)] + w^T_{deep} a^{(l_f)} + b )","a^{(l+1)} = ReLU( W^{(l)} a^{(l)} + b^{(l)} )","L = −(1/N)Σ [ y·log ŷ + (1−y)·log(1−ŷ) ]"],"steps":["Wide 输入是原始稀疏特征与人工交叉特征的拼接向量 x_wide，权重用 L1 正则稀疏化。","Deep 输入是各字段 embedding 的拼接，逐层 ReLU 变换得到最后一层激活 a^{l_f}。","两路输出取内积后相加（在 logit 空间，不是概率空间），再过 sigmoid 得到点击率。","联合训练时梯度同时回传到 Wide 的稀疏权重与 Deep 的 embedding，共享同一份 BCE 损失。"],"tex":["\\hat y=\\sigma\\bigl(w_{\\mathrm{wide}}^{\\top}[x,\\phi(x)]+w_{\\mathrm{deep}}^{\\top}a^{(l_f)}+b\\bigr)","a^{(l+1)}=\\mathrm{ReLU}(W^{(l)}a^{(l)}+b^{(l)})","L=-\\frac{1}{N}\\sum\\bigl[y\\log\\hat y+(1-y)\\log(1-\\hat y)\\bigr]"]},"params":[["wide_dim","int","—","Wide 侧输入维度（原始+交叉特征数），正整数，须与特征构造函数输出一致，无单位。"],["emb_dim","int","8","每个类别字段的 embedding 维度，正整数，默认 8。维度越大表达越强但参数暴涨，高基数特征（如 item_id）常用 8–16。"],["hidden","list","[128,64,32]","Deep 侧隐藏层宽度，正整数列表，默认 [128,64,32]。层数加深能拟合更复杂交互，但小数据集上两层往往已足够。"],["l1_wide","float","1e-5","Wide 侧 L1 正则系数，非负浮点数，默认 1e-5。作用是让大量无效交叉特征权重归零，系数过大则连有效特征也被压掉。"],["lr","float","1e-3","学习率，正浮点数，默认 1e-3，无单位。原论文 Wide 用 FTRL、Deep 用 AdaGrad；用 Adam 统一训练时 1e-3 起步即可。"]],"input":"x_wide: torch.Tensor [B, wide_dim]\nx_deep: torch.LongTensor [B, n_fields]  (类别特征索引)","output":"prob: torch.Tensor [B]  (点击率预测)","code":"import torch, torch.nn as nn\n\nclass WideAndDeep(nn.Module):\n    def __init__(self, wide_dim, n_fields, vocab_sizes, emb_dim=8, hidden=(128, 64, 32)):\n        super().__init__()\n        self.wide = nn.Linear(wide_dim, 1)\n        self.embs = nn.ModuleList([nn.Embedding(v, emb_dim) for v in vocab_sizes])\n\n        deep, in_dim = [], n_fields * emb_dim\n        for h in hidden:\n            deep += [nn.Linear(in_dim, h), nn.ReLU()]\n            in_dim = h\n        self.deep = nn.Sequential(*deep)\n        self.deep_out = nn.Linear(in_dim, 1)\n\n    def forward(self, x_wide, x_deep):\n        # Deep 侧：查表 -> 展平 -> MLP\n        e = [emb(x_deep[:, i]) for i, emb in enumerate(self.embs)]\n        h = self.deep(torch.cat(e, -1))\n        # 两路在 logit 空间相加，再过 sigmoid\n        logit = self.wide(x_wide).squeeze(-1) + self.deep_out(h).squeeze(-1)\n        return torch.sigmoid(logit)\n\ndef build_cross_features(pairs):\n    \"\"\"人工交叉特征：把离散组合映射成 0/1 稀疏列（示意）\"\"\"\n    out = torch.zeros(len(pairs[0][0]), len(pairs))\n    for j, (a, b) in enumerate(pairs):\n        out[:, j] = (a == b).float()      # 例如 已安装APP == 曝光APP\n    return out"},
  {"id":"deepfm","name":"DeepFM 深度因子分解机","en":"Deep Factorization Machine (DeepFM)","cat":"推荐与 CTR 排序","diff":"高难","summary":"把 Wide&Deep 的 Wide 侧换成 FM：二阶交叉特征由 embedding 内积自动学出，彻底摆脱人工特征工程；FM 与 Deep 共享同一套 embedding，端到端联合训练。","scenes":["CTR 预估","免特征工程建模","高基数类别特征","低阶+高阶交叉同时建模"],"idea":["FM 部分自动捕捉二阶交叉：Σ_{i<j} ⟨v_i, v_j⟩ x_i x_j，用隐向量内积替代为每个交叉组合单独设权重","Deep 部分捕捉高阶交叉，输入就是同一批字段的 embedding 拼接","关键设计：FM 与 Deep 共享 embedding 表——同一字段的低阶与高阶表示一致，既省参数又让梯度互相增强","输出 = σ( 一阶线性项 + FM 二阶项 + Deep 高阶项 )，三部分共同决定预测"],"deps":"PyTorch 2.2","updated":"2026-11-15","lang":"Python 3 · PyTorch","math":{"title":"FM 二阶项与三路求和","formulas":["ŷ = σ( w_0 + Σ_i w_i x_i + Σ_{i<j} ⟨v_i, v_j⟩ x_i x_j + MLP(x) )","Σ_{i<j} ⟨v_i,v_j⟩x_ix_j = ½ [ (Σ_i v_i x_i)² − Σ_i (v_i x_i)² ]   (k 维逐元素)","L = −(1/N) Σ [ y log ŷ + (1−y) log(1−ŷ) ]"],"steps":["每个字段查两个向量：标量权重 w_i（一阶）与 k 维隐向量 v_i（二阶与 Deep 共用）。","二阶项用平方和差公式计算，复杂度从 O(n²k) 降到 O(nk)，无需枚举字段对。","把各字段 v_i 拼接后送入 MLP 得到高阶项；三部分（一阶、二阶、高阶）求和再过 sigmoid。","全部参数（含 embedding）由同一个 BCE 损失端到端更新，因此低阶交叉与高阶交叉互相约束、共同收敛。"],"tex":["\\hat y=\\sigma\\Bigl(w_0+\\sum_i w_i x_i+\\sum_{i<j}\\langle v_i,v_j\\rangle x_i x_j+\\mathrm{MLP}(x)\\Bigr)","\\sum_{i<j}\\langle v_i,v_j\\rangle x_i x_j=\\tfrac{1}{2}\\Bigl[\\bigl(\\sum_i v_i x_i\\bigr)^{2}-\\sum_i (v_i x_i)^{2}\\Bigr]","L=-\\frac{1}{N}\\sum\\bigl[y\\log\\hat y+(1-y)\\log(1-\\hat y)\\bigr]"]},"params":[["n_fields","int","—","特征字段数（如 用户ID/城市/类目/时段 共几列），正整数，须等于输入张量第二维，无单位。"],["emb_dim","int","10","每字段隐向量维度 k，正整数，默认 10（原论文取值）。k 决定二阶交叉的表达力，工业实践常用 8–16。"],["hidden","list","[64,32]","Deep 侧隐藏层宽度，正整数列表，默认 [64,32]。DeepFM 的 Deep 通常比 Wide&Deep 浅，两三层即可。"],["dropout","float","0.3","Deep 侧与 embedding 的 dropout 比例，0–1，默认 0.3。高基数 ID 类特征极易记住样本，dropout 是主要的抗过拟合手段。"],["lr","float","1e-3","学习率，正浮点数，默认 1e-3，无单位。embedding 与 MLP 共用一个优化器时，1e-3 配 Adam 是稳妥起点。"],["l2_emb","float","1e-5","embedding 的 L2 正则系数，非负浮点数，默认 1e-5。CTR 场景下 embedding 范数会持续膨胀，需靠正则控制。"]],"input":"x: torch.LongTensor [B, n_fields]  (各字段的类别索引)","output":"prob: torch.Tensor [B]","code":"import torch, torch.nn as nn\n\nclass DeepFM(nn.Module):\n    def __init__(self, vocab_sizes, emb_dim=10, hidden=(64, 32), dropout=0.3):\n        super().__init__()\n        n_fields = len(vocab_sizes)\n        self.emb = nn.ModuleList([nn.Embedding(v, emb_dim) for v in vocab_sizes])\n        for e in self.emb:                      # 小初始化，避免初始交叉项过大\n            nn.init.normal_(e.weight, std=0.01)\n        self.lin = nn.ModuleList([nn.Embedding(v, 1) for v in vocab_sizes])  # 一阶项\n        self.bias = nn.Parameter(torch.zeros(1))\n\n        deep, in_dim = [], n_fields * emb_dim   # 与 FM 共享同一套 embedding\n        for h in hidden:\n            deep += [nn.Linear(in_dim, h), nn.ReLU(), nn.Dropout(dropout)]\n            in_dim = h\n        self.mlp = nn.Sequential(*deep)\n        self.deep_out = nn.Linear(in_dim, 1)\n\n    def forward(self, x):\n        vs = [e(x[:, i]) for i, e in enumerate(self.emb)]     # n_fields 个 [B, k]\n        V = torch.stack(vs, 1)                                # [B, n_fields, k]\n\n        first = sum(l(x[:, i]).squeeze(-1) for i, l in enumerate(self.lin))\n        # FM 二阶项：平方和差公式，O(n*k)\n        s = V.sum(1)                                          # [B, k]\n        second = 0.5 * (s.pow(2) - V.pow(2).sum(1)).sum(-1)\n        deep = self.deep_out(self.mlp(V.flatten(1))).squeeze(-1)\n\n        return torch.sigmoid(first + second + deep + self.bias)"},
