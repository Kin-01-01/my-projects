<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人博客 · 图文文章、足迹地图与作品集" />
  <title>MyBlog · 个人空间</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body id="top">

  <!-- 顶部滚动进度条 -->
  <div class="scroll-progress"><span class="scroll-progress-fill" id="scrollFill"></span></div>

  <!-- 导航栏 -->
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#/" class="brand" id="brandName">MyBlog</a>
      <nav class="nav-links">
        <a href="#/" data-route="home">首页</a>
        <a href="#/posts" data-route="posts">文章</a>
        <a href="#/map" data-route="map">足迹</a>
        <a href="#/works" data-route="works">作品</a>
        <a href="#/about" data-route="about">关于</a>
      </nav>
      <button class="nav-admin" id="navAdmin" type="button">管理</button>
    </div>
  </header>

  <!-- 路由视图容器 -->
  <main id="app"></main>

  <footer class="footer">
    <p>© 2026 MyBlog · 用代码记录生活与思考</p>
  </footer>

  <!-- 内容管理后台 -->
  <div class="modal-backdrop" id="adminModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="内容管理">
      <div class="modal-head">
        <h3>内容管理</h3>
        <button class="modal-close" data-close="adminModal" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="admin-tabs" id="adminTabs">
        <button class="admin-tab active" data-tab="post" type="button">写文章</button>
        <button class="admin-tab" data-tab="work" type="button">加作品</button>
        <button class="admin-tab" data-tab="photo" type="button">传照片</button>
        <button class="admin-tab" data-tab="about" type="button">关于我</button>
        <button class="admin-tab" data-tab="profile" type="button">站点资料</button>
        <button class="admin-tab" data-tab="backup" type="button">备份</button>
      </div>
      <div class="modal-body" id="adminForm"></div>
      <div class="modal-foot">
        <span class="admin-tip" id="adminTip"></span>
        <button class="btn-ghost" data-close="adminModal" type="button">关闭</button>
        <button class="btn-primary" id="adminSave" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="vendor/echarts.min.js"></script>
  <script src="js/china-geo.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
