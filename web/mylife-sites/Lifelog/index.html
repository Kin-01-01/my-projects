<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心迹 · 记录生活、轨迹与情绪</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="scroll-progress"><div class="scroll-progress__bar" id="scrollBar"></div></div>

  <!-- 顶部导航 -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="#hero">心迹<span class="nav__brand-dot">·</span></a>
      <nav class="nav__links">
        <a href="#timeline">轨迹</a>
        <a href="#feed">记录</a>
        <a href="#trash">情绪</a>
      </nav>
      <div class="nav__actions">
        <button class="icon-btn" id="themeToggle" title="切换深浅色" aria-label="切换深浅色">🌙</button>
        <button class="btn btn--primary" id="btnWrite">✎ 写一笔</button>
      </div>
    </div>
  </header>

  <main>
    <!-- 首屏 -->
    <section class="hero" id="hero">
      <div class="hero__inner reveal">
        <p class="hero__eyebrow">你的私人记录本</p>
        <h1 class="hero__title">把日子，慢慢收进来</h1>
        <p class="hero__lead">记录人生轨迹、日常碎片，和每一个想说出口的情绪。<br />所有内容只存在你自己的浏览器里——轻量、私密、随时可翻。</p>
        <div class="hero__stats" id="heroStats">
          <div class="stat"><span class="stat__num" id="statDays">0</span><span class="stat__label">已陪伴天数</span></div>
          <div class="stat"><span class="stat__num" id="statFeed">0</span><span class="stat__label">生活记录</span></div>
          <div class="stat"><span class="stat__num" id="statMood">0</span><span class="stat__label">情绪倾倒</span></div>
        </div>
        <div class="hero__cta">
          <a class="btn btn--primary" href="#feed">开始记录 →</a>
          <button class="btn btn--ghost" id="btnTrashHero">🗑 倒掉情绪</button>
        </div>
      </div>
    </section>

    <!-- 人生轨迹时间线 -->
    <section class="section" id="timeline">
      <div class="section__head reveal">
        <h2 class="section__title">人生轨迹</h2>
        <p class="section__sub">重要的节点，串成一条线。</p>
        <button class="btn btn--soft" data-add="timeline">+ 添加一个节点</button>
      </div>
      <div class="timeline" id="timelineList"></div>
    </section>

    <!-- 生活记录流 -->
    <section class="section section--alt" id="feed">
      <div class="section__head reveal">
        <h2 class="section__title">生活记录流</h2>
        <p class="section__sub">随手记下的日常，向下滑动慢慢翻。</p>
        <button class="btn btn--soft" data-add="feed">+ 记一笔生活</button>
      </div>
      <div class="feed" id="feedList"></div>
    </section>

    <!-- 情绪垃圾桶 -->
    <section class="section" id="trash">
      <div class="section__head reveal">
        <h2 class="section__title">情绪垃圾桶</h2>
        <p class="section__sub">不吐不快，或只是想给此刻打个标签。写下的都会被收好，也可以随时清空。</p>
        <button class="btn btn--soft" id="btnTrashSection">🗑 倒一点情绪</button>
      </div>
      <div class="trash" id="trashList"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__brand">心迹 · 数据只保存在本机浏览器</span>
      <div class="footer__actions">
        <button class="btn btn--ghost btn--sm" id="btnExport">导出备份</button>
        <button class="btn btn--ghost btn--sm" id="btnImport">导入备份</button>
        <input type="file" id="fileImport" accept="application/json" hidden />
      </div>
    </div>
  </footer>

  <!-- 常驻：情绪垃圾桶 -->
  <button class="fab" id="fabTrash" title="随时倒情绪" aria-label="情绪垃圾桶">🗑</button>

  <!-- 弹窗：写一笔 -->
  <div class="modal" id="modalWrite" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__tabs">
          <button type="button" class="modal__tab is-active" data-tab="timeline">人生轨迹</button>
          <button type="button" class="modal__tab" data-tab="feed">生活记录</button>
        </div>
        <button type="button" class="modal__close" data-close aria-label="关闭">✕</button>
      </div>
      <form id="formWrite" class="form">
        <div class="form__pane" data-pane="timeline">
          <label class="field"><span>日期</span><input type="date" name="date" required /></label>
          <label class="field"><span>节点标题</span><input type="text" name="title" placeholder="例如：第一次进实验室" maxlength="40" required /></label>
          <label class="field"><span>一句话描述</span><textarea name="desc" rows="3" placeholder="发生了什么，为什么重要" maxlength="200"></textarea></label>
        </div>
        <div class="form__pane" data-pane="feed" hidden>
          <label class="field"><span>日期</span><input type="date" name="date2" required /></label>
          <div class="field">
            <span>此刻心情（可选）</span>
            <div class="mood-grid" id="moodGridFeed"></div>
          </div>
          <label class="field"><span>写点什么</span><textarea name="text" rows="4" placeholder="今天发生了什么，或只是想说说话" maxlength="1000" required></textarea></label>
          <label class="field"><span>配图（可选）</span><input type="file" name="photo" accept="image/*" /></label>
        </div>
        <div class="form__foot">
          <button type="button" class="btn btn--ghost" data-close>取消</button>
          <button type="submit" class="btn btn--primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 弹窗：情绪垃圾桶 -->
  <div class="modal" id="modalTrash" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel">
      <div class="modal__head">
        <h3 class="modal__title">🗑 情绪垃圾桶</h3>
        <button type="button" class="modal__close" data-close aria-label="关闭">✕</button>
      </div>
      <form id="formTrash" class="form">
        <div class="field">
          <span>此刻是哪种心情？</span>
          <div class="mood-grid" id="moodGridTrash"></div>
        </div>
        <label class="field"><span>把情绪倒出来（可选）</span><textarea name="text" rows="5" placeholder="不用修饰，想说什么说什么。" maxlength="1000"></textarea></label>
        <div class="form__foot">
          <button type="button" class="btn btn--ghost" data-close>先不写了</button>
          <button type="submit" class="btn btn--primary">倒进垃圾桶</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
