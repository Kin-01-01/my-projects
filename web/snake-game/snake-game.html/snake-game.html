<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🐍 可爱贪吃蛇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "Comic Sans MS", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffe9f3 0%, #e7f5ff 50%, #fff5e1 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5a4a6a;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    background: rgba(255,255,255,0.75);
    border-radius: 28px;
    padding: 22px 26px 26px;
    box-shadow: 0 18px 50px rgba(180,150,200,0.35);
    backdrop-filter: blur(6px);
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
    color: #ff7eb3;
    text-shadow: 1px 2px 0 #fff;
  }
  .sub { font-size: 13px; color: #9a8aad; margin-bottom: 14px; }

  .hud {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 16px;
    font-weight: bold;
  }
  .hud .pill {
    background: #fff;
    border-radius: 16px;
    padding: 6px 14px;
    box-shadow: 0 4px 10px rgba(180,150,200,0.25);
    min-width: 92px;
  }
  .hud .label { font-size: 11px; color: #b0a0c0; display: block; font-weight: normal; }

  .stage {
    position: relative;
    display: inline-block;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: inset 0 0 0 4px #fff, 0 10px 30px rgba(180,150,200,0.3);
    background: #fdf6ff;
  }
  canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 30px; color: #ff7eb3; }
  .overlay p { font-size: 15px; color: #7a6a8a; line-height: 1.6; }
  .big-score { font-size: 44px; color: #ff9a3c; font-weight: bold; }

  button {
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    background: linear-gradient(135deg, #ff9ec4, #ffb86c);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(255,150,180,0.45);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(255,150,180,0.55); }
  button:active { transform: translateY(1px); }

  .tips {
    margin-top: 14px;
    font-size: 12.5px;
    color: #a896ba;
    line-height: 1.7;
  }
  .legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🐍 可爱贪吃蛇</h1>
    <div class="sub">方向键 / WASD 控制 · 空格暂停 · 回车重开</div>

    <div class="hud">
      <div class="pill"><span class="label">分数</span><span id="score">0</span></div>
      <div class="pill"><span class="label">最高分</span><span id="best">0</span></div>
      <div class="pill"><span class="label">速度</span><span id="level">1</span></div>
    </div>

    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">准备好了吗？🐣</h2>
        <p id="ovText">用 方向键 或 WASD 移动小蛇，<br>吃苹果变长，吃星星加分，吃蘑菇减速～</p>
        <div class="big-score hidden" id="ovScore"></div>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>

    <div class="legend">
      <span>🍎 普通 +10</span>
      <span>⭐ 星星 +30</span>
      <span>🍄 蘑菇 减速</span>
    </div>
    <div class="tips">
      撞墙或撞到自己就结束啦 · 分数越高蛇跑得越快<br>
      最高分自动保存在本机，关掉再开也还在
    </div>
  </div>

<script>
(function () {
  "use strict";

  const COLS = 20, ROWS = 20, CELL = 24;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const levelEl = document.getElementById("level");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovScore = document.getElementById("ovScore");
  const startBtn = document.getElementById("startBtn");

  const BEST_KEY = "cuteSnakeBest";
  let best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
  bestEl.textContent = best;

  // ---- 音效（Web Audio 合成，无需音频文件） ----
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, vol, when) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (when || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  const sndEat = () => { beep(620, 0.12, "triangle", 0.2); beep(880, 0.10, "triangle", 0.15, 0.04); };
  const sndStar = () => { [660, 880, 1180, 1480].forEach((f, i) => beep(f, 0.12, "square", 0.14, i * 0.06)); };
  const sndMush = () => { beep(300, 0.18, "sine", 0.18); beep(220, 0.18, "sine", 0.14, 0.06); };
  const sndOver = () => { [520, 400, 300, 200].forEach((f, i) => beep(f, 0.22, "sawtooth", 0.16, i * 0.10)); };
  const sndTurn = () => beep(440, 0.05, "sine", 0.06);

  // ---- 游戏状态 ----
  let snake, dir, nextDir, food, special, score, level, baseSpeed;
  let running = false, paused = false, gameOver = false;
  let lastStep = 0, specialUntil = 0, slowUntil = 0;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    level = 1;
    baseSpeed = 140;
    special = null;
    specialUntil = 0;
    slowUntil = 0;
    spawnFood();
    updateHud();
  }

  function cellFree(x, y) {
    return !snake.some(s => s.x === x && s.y === y);
  }

  function spawnFood() {
    let x, y;
    do { x = (Math.random() * COLS) | 0; y = (Math.random() * ROWS) | 0; }
    while (!cellFree(x, y) || (special && special.x === x && special.y === y));
    food = {x, y};
  }

  function maybeSpawnSpecial() {
    // 概率出现星星或蘑菇，持续 6 秒后消失
    if (special) return;
    if (Math.random() < 0.22) {
      let x, y;
      do { x = (Math.random() * COLS) | 0; y = (Math.random() * ROWS) | 0; }
      while (!cellFree(x, y) || (food.x === x && food.y === y));
      const type = Math.random() < 0.5 ? "star" : "mushroom";
      special = {x, y, type};
      specialUntil = performance.now() + 6000;
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = level;
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return endGame();
    // 撞自己
    if (snake.some(s => s.x === head.x && s.y === head.y)) return endGame();

    snake.unshift(head);

    if (food.x === head.x && food.y === head.y) {
      score += 10;
      sndEat();
      level = 1 + Math.floor(score / 50);
      spawnFood();
      maybeSpawnSpecial();
    } else if (special && special.x === head.x && special.y === head.y) {
      if (special.type === "star") { score += 30; sndStar(); }
      else { score += 0; slowUntil = performance.now() + 4000; sndMush(); }
      special = null;
    } else {
      snake.pop();
    }

    // 道具超时消失
    if (special && performance.now() > specialUntil) special = null;

    updateHud();
  }

  function endGame() {
    running = false;
    gameOver = true;
    sndOver();
    if (score > best) { best = score; localStorage.setItem(BEST_KEY, String(best)); }
    updateHud();
    ovTitle.textContent = "游戏结束 💫";
    ovText.innerHTML = "这一局表现不错～<br>再来一局挑战最高分吧！";
    ovScore.textContent = score;
    ovScore.classList.remove("hidden");
    startBtn.textContent = "再玩一次";
    overlay.classList.remove("hidden");
  }

  function speedNow() {
    let s = baseSpeed - (level - 1) * 10;
    if (s < 60) s = 60;
    if (performance.now() < slowUntil) s += 70; // 蘑菇减速
    return s;
  }

  // ---- 渲染 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawGrid() {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? "#fdeefb" : "#f6e6fb";
        roundRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2, 6);
        ctx.fill();
      }
    }
  }

  function drawSnake() {
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const g = ctx.createLinearGradient(s.x*CELL, s.y*CELL, s.x*CELL+CELL, s.y*CELL+CELL);
      g.addColorStop(0, `hsl(${140 - t*40}, 70%, ${62 - t*12}%)`);
      g.addColorStop(1, `hsl(${150 - t*40}, 75%, ${52 - t*12}%)`);
      ctx.fillStyle = g;
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x*CELL + pad, s.y*CELL + pad, CELL - pad*2, CELL - pad*2, i === 0 ? 9 : 8);
      ctx.fill();
    }
    // 蛇头眼睛
    const h = snake[0];
    const cx = h.x*CELL + CELL/2, cy = h.y*CELL + CELL/2;
    const off = 4;
    const ex = dir.x * 3, ey = dir.y * 3;
    const perpx = dir.y * off, perpy = dir.x * off;
    drawEye(cx + ex + perpx, cy + ey + perpy);
    drawEye(cx + ex - perpx, cy + ey - perpy);
  }
  function drawEye(x, y) {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#333";
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI*2); ctx.fill();
  }

  function drawApple(f) {
    const cx = f.x*CELL + CELL/2, cy = f.y*CELL + CELL/2;
    ctx.fillStyle = "#ff6b81";
    ctx.beginPath(); ctx.arc(cx, cy+1, CELL*0.32, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#7bc47f"; // 叶子
    ctx.beginPath(); ctx.ellipse(cx+5, cy-7, 5, 3, -0.6, 0, Math.PI*2); ctx.fill();
    // 表情
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx-3, cy, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+3, cy, 1.6, 0, Math.PI*2); ctx.fill();
  }

  function drawStar(f) {
    const cx = f.x*CELL + CELL/2, cy = f.y*CELL + CELL/2, R = CELL*0.36, r = R*0.45;
    ctx.fillStyle = "#ffd54a";
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI/2 + i * Math.PI/5;
      const rad = i % 2 === 0 ? R : r;
      const px = cx + Math.cos(ang)*rad, py = cy + Math.sin(ang)*rad;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawMushroom(f) {
    const cx = f.x*CELL + CELL/2, cy = f.y*CELL + CELL/2;
    ctx.fillStyle = "#ff8b6b"; // 帽
    ctx.beginPath(); ctx.arc(cx, cy, CELL*0.32, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#fff"; // 白点
    ctx.beginPath(); ctx.arc(cx-5, cy-3, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+4, cy-5, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fbe9d0"; // 柄
    roundRect(cx-4, cy, 8, CELL*0.28, 3); ctx.fill();
  }

  function render() {
    drawGrid();
    if (food) drawApple(food);
    if (special) { special.type === "star" ? drawStar(special) : drawMushroom(special); }
    if (snake) drawSnake();
  }

  function loop(now) {
    if (running && !paused) {
      if (now - lastStep >= speedNow()) {
        lastStep = now;
        if (snake) step();
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  // ---- 控制 ----
  function setDir(nx, ny) {
    if (dir.x === -nx && dir.y === -ny) return; // 不能反向
    if (nextDir.x === nx && nextDir.y === ny) return;
    nextDir = {x: nx, y: ny};
    sndTurn();
  }

  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()) || ["w","a","s","d"].includes(k)) e.preventDefault();
    if (!running && (k === "enter" || k === " ")) { startGame(); return; }
    if (k === " " && running) { paused = !paused; return; }
    if (k === "enter" && gameOver) { startGame(); return; }
    if (!running || paused) return;
    if (k === "arrowup" || k === "w") setDir(0, -1);
    else if (k === "arrowdown" || k === "s") setDir(0, 1);
    else if (k === "arrowleft" || k === "a") setDir(-1, 0);
    else if (k === "arrowright" || k === "d") setDir(1, 0);
  });

  function startGame() {
    ensureAudio();
    reset();
    running = true; paused = false; gameOver = false;
    lastStep = performance.now();
    ovScore.classList.add("hidden");
    overlay.classList.add("hidden");
  }

  startBtn.addEventListener("click", startGame);

  // 初始画面
  reset();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
