<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Every layer tells a story</title>
<meta name="description" content="Move across the bare branches — spring follows your cursor. An interactive portrait of a winter tree." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 14 C8 9 8 7 8 3 M8 3 C5 4 3.6 6.4 4 9 M8 3 C11 4 12.4 6.4 12 9' stroke='%237fb069' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- The photograph itself: bare winter tree against deep blue sky.
     Drawn by CSS (object-fit: cover); the canvas above it only adds leaves. -->
<img class="photo" src="assets/tree.jpg"
     alt="Looking up the trunk of a bare winter tree, branches crossing against a deep blue sky" />

<!-- Leaf layer. Pointer events pass through; interaction is tracked on window. -->
<canvas id="grove" aria-hidden="true"></canvas>

<header class="title">
  <h1>Every layer tells a story</h1>
</header>

<p class="hint" id="hint">Move across the branches &mdash; spring follows your cursor</p>

<script src="tree-data.js"></script>
<script src="script.js"></script>
</body>
</html>
