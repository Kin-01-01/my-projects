<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>火箭发射模拟器 · Canvas 版</title>
<style>
  /* ===== 深色科技风 UI（纯 CSS，无第三方库）===== */
  :root{
    --bg:#060a11; --panel:#0b1220; --line:#17324d;
    --cyan:#39d0ff; --amber:#ffb454; --green:#4ade80; --red:#ff5c6c;
    --txt:#cfe3f5; --dim:#7d93a8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Consolas","DejaVu Sans Mono",Menlo,monospace;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}

  /* ---- 顶部参数栏（便于实时调整，修改后点「重置」生效）---- */
  header{padding:10px 14px;background:linear-gradient(180deg,#0d1726,#0a111c);
    border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
  header h1{font-size:15px;margin:0 14px 0 0;letter-spacing:2px;color:var(--cyan);
    text-shadow:0 0 12px rgba(57,208,255,.45);white-space:nowrap}
  .param{display:flex;flex-direction:column;gap:3px}
  .param label{font-size:10px;color:var(--dim);letter-spacing:.5px}
  .param input{width:86px;background:#0a1524;border:1px solid var(--line);border-radius:5px;
    color:var(--cyan);padding:4px 6px;font-size:12px;font-family:inherit;outline:none}
  .param input:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(57,208,255,.35)}

  /* ---- 主体：画布 + 遥测面板 ---- */
  main{flex:1;display:flex;min-height:0}
  #wrap{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;background:#02040a}
  #hud{position:absolute;right:14px;top:14px;width:212px;background:rgba(8,16,28,.86);
    border:1px solid var(--line);border-radius:9px;padding:11px 12px;backdrop-filter:blur(4px);
    box-shadow:0 0 24px rgba(0,0,0,.5)}
  #hud h2{margin:0 0 8px;font-size:11px;color:var(--dim);letter-spacing:2px;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;
    border-bottom:1px dashed rgba(23,50,77,.7);font-size:12px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--dim);font-size:11px}
  .row .v{color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums}
  .row .v.warn{color:var(--red)} .row .v.ok{color:var(--green)} .row .v.amber{color:var(--amber)}

  /* ---- 底部按钮 ---- */
  footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;
    background:linear-gradient(0deg,#0d1726,#0a111c)}
  button{font-family:inherit;font-size:13px;letter-spacing:2px;padding:9px 26px;border-radius:7px;
    border:1px solid var(--line);background:#0e1b2c;color:var(--txt);cursor:pointer;transition:.15s}
  button:hover{border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(57,208,255,.28)}
  button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  #btnIgnite{border-color:#7a3a1a;background:#2a1408;color:var(--amber)}
  #btnIgnite:hover{border-color:var(--amber);box-shadow:0 0 14px rgba(255,180,84,.3)}
  #status{color:var(--dim);font-size:12px;margin-left:auto;letter-spacing:1px}
  #status b{color:var(--amber)}
</style>
</head>
<body>
<div id="app">

  <!-- ================= 顶部参数栏（便于调整） ================= -->
  <header>
    <h1>火箭发射模拟器</h1>
    <div class="param"><label>额定推重比 TWR</label><input id="pTwr" type="number" value="1.3" step="0.05" min="0.5"></div>
    <div class="param"><label>初始质量 (t)</label><input id="pM0" type="number" value="500" step="10" min="10"></div>
    <div class="param"><label>燃料质量 (t)</label><input id="pFuel" type="number" value="400" step="10" min="0"></div>
    <div class="param"><label>燃烧时间 (s)</label><input id="pBurn" type="number" value="160" step="5" min="5"></div>
    <div class="param"><label>重力 (m/s²)</label><input id="pG" type="number" value="9.81" step="0.01" min="0.1"></div>
    <div class="param"><label>推力上升 (s)</label><input id="pRamp" type="number" value="3" step="0.5" min="0.5"></div>
    <div class="param"><label>时间倍率 (×)</label><input id="pTime" type="number" value="1" step="0.5" min="0.25"></div>
  </header>

  <!-- ================= 画布 + 实时遥测 ================= -->
  <main>
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="hud">
        <h2>实时遥测 TELEMETRY</h2>
        <div class="row"><span class="k">任务时间</span><span class="v" id="hTime">T- 00:00</span></div>
        <div class="row"><span class="k">推力</span><span class="v amber" id="hThrust">0 kN</span></div>
        <div class="row"><span class="k">推重比 F/(mg)</span><span class="v" id="hTwr">0.00</span></div>
        <div class="row"><span class="k">加速度</span><span class="v" id="hAcc">0.00 m/s²</span></div>
        <div class="row"><span class="k">速度</span><span class="v" id="hVel">0 m/s</span></div>
        <div class="row"><span class="k">高度</span><span class="v" id="hAlt">0 m</span></div>
        <div class="row"><span class="k">质量（箭+燃料）</span><span class="v" id="hMass">500.0 t</span></div>
        <div class="row"><span class="k">锁止状态</span><span class="v warn" id="hLock">锁死</span></div>
      </div>
    </div>
  </main>

  <!-- ================= 按钮 ================= -->
  <footer>
    <button id="btnIgnite">点火</button>
    <button id="btnReset">重置</button>
    <div id="status">待命 · 参数修改后点「重置」生效</div>
  </footer>
</div>

<script>
'use strict';
/* =========================================================================
   火箭发射模拟器（单文件 · 原生 Canvas · 无任何第三方库）
   物理模型（按需求实现）：
     1) 点火后推力在 0~3s（可调）内 smoothstep 平滑递增到额定值；
     2) 发射台压紧机构锁死火箭：推力 ≤ 箭体重力时原地不动（锁止状态）；
     3) 推力 > 重力瞬间解锁起飞（不可逆）；
     4) 燃料持续消耗：质量不断降低 → 推重比从 1.3 逐步增大；
     5) 额定推力 = 额定推重比 × 初始质量 × g。
   ========================================================================= */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const P = id => document.getElementById(id);
const params = { twr: P('pTwr'), m0: P('pM0'), fuel: P('pFuel'), burn: P('pBurn'), g: P('pG'), ramp: P('pRamp'), time: P('pTime') };
const hud = { time: P('hTime'), thrust: P('hThrust'), twr: P('hTwr'), acc: P('hAcc'), vel: P('hVel'), alt: P('hAlt'), mass: P('hMass'), lock: P('hLock') };

/* ---------- 仿真状态 ---------- */
let S = null;              // 当前仿真（点火后创建）
let running = false;       // 是否已点火
let lastTs = 0;

function readParams() {
  const num = (el, d, min) => { const v = parseFloat(el.value); return isFinite(v) && (!min || v >= min) ? v : d; };
  return {
    twr:  num(params.twr, 1.3, 0.1),
    m0:   num(params.m0, 500, 1),          // 初始质量 t
    fuel: Math.min(num(params.fuel, 400, 0), num(params.m0, 500, 1)),  // 燃料 ≤ 总质量
    burn: num(params.burn, 160, 1),        // 燃料耗尽时长 s
    g:    num(params.g, 9.81, 0.1),
    ramp: num(params.ramp, 3, 0.1),        // 推力上升时间 s
    time: num(params.time, 1, 0.01),       // 时间倍率
  };
}

function makeSim() {
  const c = readParams();
  const m0kg = c.m0 * 1000;                     // 质量统一用 kg
  const thrustRated = c.twr * m0kg * c.g;       // 额定推力 N（= TWR·m0·g）
  const burnRate = (c.fuel * 1000) / c.burn;    // kg/s
  const dryMass = m0kg - c.fuel * 1000;         // 干重（不含燃料）
  return {
    c, t: 0, y: 0, v: 0, a: 0, locked: true,
    m0kg, dryMass, burnRate, thrustRated,
    mass: m0kg,
    thrust: 0,
    smoke: [],          // 地面烟团
    trail: [],          // 尾迹烟
    stars: Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + .4 })),
    maxY: 0,                            // 观测到的最大高度（用于显示缩放）
  };
}

/* ---------- 物理步进 ---------- */
function stepPhysics(s, dt) {
  s.t += dt;
  // ① 推力爬升 0~ramp 秒（smoothstep）
  const u = Math.min(1, s.t / s.c.ramp);
  const ramp = u * u * (3 - 2 * u);
  s.thrust = s.thrustRated * ramp;
  // ② 燃料消耗（耗尽后保持干重）
  const fuelLeft = Math.max(0, s.c.fuel * 1000 - s.burnRate * s.t);
  s.mass = s.dryMass + fuelLeft;
  const weight = s.mass * s.c.g;
  // ③ 发射台锁死：推力≤重力 → 不动；超过瞬间解锁
  if (s.locked) {
    s.a = 0; s.v = 0;
    if (s.thrust > weight) s.locked = false;
    else return;
  }
  // ④ 解锁后：a = (F - mg)/m
  s.a = (s.thrust - weight) / s.mass;
  s.v += s.a * dt;
  s.y += s.v * dt;
  if (s.y > s.maxY) s.maxY = s.y;
}

/* ---------- 粒子 ---------- */
function emitParticles(s, dt) {
  if (s.t > s.c.ramp * 1.2) {                    // 点火后开始喷烟（推力建立后才有明显燃气）
    const ground = s.y < 260;
    const n = ground ? 3 : 1;
    for (let i = 0; i < n; i++) {
      const side = Math.random() < .5 ? -1 : 1;
      if (ground) {
        // 贴地烟涌：从导流槽沿场坪向外翻卷（世界坐标：x 横向、y 高度）
        s.smoke.push({ x: side * (6 + Math.random() * 30), y: 0.5 + Math.random() * 3, vx: side * (26 + Math.random() * 70), vy: 6 + Math.random() * 18,
          r: 12 + Math.random() * 16, life: 0, max: 3.5 + Math.random() * 2, kind: 'g' });
      } else {
        // 尾迹烟：在喷口下方生成（世界坐标 = 火箭横向位置、当前高度略下方）
        s.trail.push({ x: (Math.random() - .5) * 10, y: Math.max(0, s.y - 18) + (Math.random() - .5) * 6,
          vx: (Math.random() - .5) * 16, vy: -6 - Math.random() * 10,
          r: 8 + Math.random() * 9, life: 0, max: 1.6 + Math.random() * 1.2, kind: 't' });
      }
    }
  }
  for (const arr of [s.smoke, s.trail]) {
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i]; p.life += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.kind === 'g' ? 5 : 4) * dt;       // 浮力上扬 / 减速
      p.vx *= 1 - .8 * dt; p.vy *= 1 - .6 * dt;    // 阻尼
      p.r += 9 * dt;                               // 翻卷变大
      if (p.life > p.max) arr.splice(i, 1);
    }
  }
}

/* ---------- 渲染 ---------- */
function draw(s) {
  const W = cv.width, H = cv.height;
  const alt = s.y;
  // 视觉缩放：低空贴近（看得清塔架），高空拉远（火箭变小、地面远去）
  const zoom = 1.6 / (1 + alt / 260);
  // 相机跟随：火箭基座固定在画面下方 66% 处；地面随高度向下沉（世界 y 越大越靠下）
  const rocketScreenY = H * 0.66;
  const groundScreenY = rocketScreenY + alt * zoom;
  const groundVisible = groundScreenY < H + 60;

  /* --- 天空：随高度由深蓝→黑 --- */
  const k = Math.min(1, alt / 900);
  const g1 = ctx.createLinearGradient(0, 0, 0, H);
  g1.addColorStop(0, `rgb(${Math.round(6 + (1 - k) * 6)},${Math.round(12 + (1 - k) * 24)},${Math.round(24 + (1 - k) * 52)})`);
  g1.addColorStop(1, `rgb(${Math.round(12 + (1 - k) * 26)},${Math.round(22 + (1 - k) * 34)},${Math.round(40 + (1 - k) * 46)})`);
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);

  /* --- 星空：高空渐显 --- */
  if (k > 0.05) {
    ctx.globalAlpha = Math.min(1, (k - 0.05) * 2.2);
    ctx.fillStyle = '#dfeaff';
    for (const st of s.stars) { const sz = st.s; ctx.fillRect(st.x * W, st.y * H * 0.62, sz, sz); }
    ctx.globalAlpha = 1;
  }

  /* --- 地面 + 发射台 + 塔架 --- */
  if (groundVisible) {
    ctx.fillStyle = `rgb(${22 + (1 - k) * 26},${26 + (1 - k) * 24},${30 + (1 - k) * 22})`;
    ctx.fillRect(0, groundScreenY, W, H - groundScreenY);
    // 塔架（简易桁架剪影，高度按 zoom 缩放）
    const tw = 46 * zoom, th = 62 * Math.min(zoom, 1.6);
    const tx = W * 0.5 + 52 * zoom;
    ctx.strokeStyle = 'rgba(120,170,215,.85)'; ctx.lineWidth = Math.max(1, 1.6 * zoom);
    ctx.strokeRect(tx, groundScreenY - th, tw * .6, th);
    for (let i = 1; i < 6; i++) { const yy = groundScreenY - th * i / 6; ctx.beginPath(); ctx.moveTo(tx, yy); ctx.lineTo(tx + tw * .6, yy); ctx.stroke(); }
    // 发射台
    ctx.fillStyle = '#2b3444';
    ctx.fillRect(W * 0.5 - 60 * zoom, groundScreenY, 120 * zoom, 10 * Math.max(1, zoom));
  }

  /* --- 火箭基座屏幕位置（世界：x 横向、y 高度，均以发射台为原点）--- */
  const ro = { x: W * 0.5, y: rocketScreenY };
  const toScreen = (wx, wy) => ({ x: ro.x + wx * zoom, y: groundScreenY - wy * zoom });
  // 发光底座（发射台）与烟团
  for (const p of s.smoke.concat(s.trail)) {
    const sp = toScreen(p.x, p.y);
    const a = Math.max(0, 1 - p.life / p.max) * .5;
    if (a <= .01) continue;
    const warm = p.kind === 't' ? Math.max(0, 1 - p.life * 2) : 0;
    ctx.beginPath();
    ctx.fillStyle = `rgba(${Math.round(150 + warm * 105)},${Math.round(150 + warm * 60)},${Math.round(155 + warm * 10)},${a.toFixed(3)})`;
    ctx.arc(sp.x, sp.y, p.r * zoom, 0, Math.PI * 2); ctx.fill();
  }

  /* --- 火箭本体（基座固定在 ro，向上绘制） --- */
  const rW = 26 * zoom, rH = 150 * zoom;
  const bx = ro.x, by = ro.y;
  ctx.save();
  // 尾焰：多层 + 抖动，长度 ∝ 推力（未点火不画）
  if (s.thrust > 0) {
    const thr = s.thrust / s.thrustRated;
    const flick = .86 + Math.random() * .28;
    const len = (70 + 110 * thr) * flick * zoom;
    const lay = [[3.4, 'rgba(255,120,40,.55)'], [2.1, 'rgba(255,190,90,.75)'], [1.1, 'rgba(255,245,205,.95)']];
    for (const [wk, col] of lay) {
      ctx.beginPath();
      ctx.moveTo(bx - rW * .32 * wk, by);
      ctx.quadraticCurveTo(bx, by + len * 1.06, bx + rW * .32 * wk, by);
      ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    }
    // 尾焰根部亮核
    ctx.beginPath(); ctx.arc(bx, by, rW * .5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,250,225,.9)'; ctx.fill();
  }
  // 箭体（两段色带 + 头锥 + 尾翼；未点火时略带冷光）
  ctx.fillStyle = '#e8edf3';
  ctx.fillRect(bx - rW / 2, by - rH * .78, rW, rH * .78);
  ctx.fillStyle = '#c9d2dc';
  ctx.fillRect(bx - rW / 2, by - rH * .3, rW, rH * .1);       // 级间带
  ctx.beginPath();                                            // 头锥
  ctx.moveTo(bx - rW / 2, by - rH * .78);
  ctx.lineTo(bx, by - rH * .98);
  ctx.lineTo(bx + rW / 2, by - rH * .78);
  ctx.closePath(); ctx.fillStyle = '#f2f6fa'; ctx.fill();
  ctx.beginPath();                                            // 尾翼
  ctx.moveTo(bx - rW / 2, by - 6 * zoom); ctx.lineTo(bx - rW * .95, by); ctx.lineTo(bx - rW / 2, by); ctx.closePath();
  ctx.moveTo(bx + rW / 2, by - 6 * zoom); ctx.lineTo(bx + rW * .95, by); ctx.lineTo(bx + rW / 2, by); ctx.closePath();
  ctx.fillStyle = '#b9c3cd'; ctx.fill();
  // 锁死状态：画出台架压紧夹爪
  if (s.locked) {
    ctx.strokeStyle = 'rgba(255,180,84,.95)'; ctx.lineWidth = Math.max(1.5, 2.4 * zoom);
    ctx.beginPath();
    ctx.moveTo(bx - rW * 1.25, by); ctx.lineTo(bx - rW * .55, by);
    ctx.moveTo(bx + rW * .55, by); ctx.lineTo(bx + rW * 1.25, by);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,180,84,.9)'; ctx.font = `${Math.max(9, 10 * zoom)}px monospace`;
    ctx.textAlign = 'center'; ctx.fillText('发射台锁死', bx, by + 16 * Math.max(1, zoom));
  }
  ctx.restore();

  /* --- 高度标尺（左上）--- */
  ctx.fillStyle = 'rgba(125,147,168,.85)'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`视场缩放 ×${zoom.toFixed(2)}   实际高度 ${fmtAlt(s.y)}`, 14, 22);
}

function fmtAlt(m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km'; }
function fmtT(t) { const m = Math.floor(t / 60), s2 = Math.floor(t % 60); return `${String(m).padStart(2, '0')}:${String(s2).padStart(2, '0')}`; }

/* ---------- HUD ---------- */
function updateHud(s) {
  const twr = s.mass > 0 ? s.thrust / (s.mass * s.c.g) : 0;
  hud.time.textContent = (s.t < 0 ? 'T- ' : 'T+ ') + fmtT(Math.abs(s.t));
  hud.thrust.textContent = (s.thrust / 1000).toFixed(0) + ' kN' + `（${(100 * s.thrust / s.thrustRated).toFixed(0)}%）`;
  hud.twr.textContent = twr.toFixed(2);
  hud.acc.textContent = s.a.toFixed(2) + ' m/s²';
  hud.vel.textContent = Math.round(s.v) + ' m/s';
  hud.alt.textContent = fmtAlt(s.y);
  hud.mass.textContent = (s.mass / 1000).toFixed(1) + ' t';
  hud.lock.textContent = s.locked ? '锁死（推力≤重力）' : '已解锁 · 起飞';
  hud.lock.className = 'v ' + (s.locked ? 'warn' : 'ok');
}

/* ---------- 主循环 ---------- */
function frame(ts) {
  if (!lastTs) lastTs = ts;
  let dt = Math.min((ts - lastTs) / 1000, .05);
  lastTs = ts;
  if (running && S) {
    dt *= S.c.time;                       // 时间倍率
    const sub = 4;                        // 子步进：保证高倍率下积分稳定
    for (let i = 0; i < sub; i++) stepPhysics(S, dt / sub);
    emitParticles(S, dt);
    updateHud(S);
  }
  resizeIfNeeded();
  draw(S || makeSim());                   // 未点火时也绘制待命状态（锁死、零推力）
  requestAnimationFrame(frame);
}

function resizeIfNeeded() {
  const w = cv.clientWidth * devicePixelRatio, h = cv.clientHeight * devicePixelRatio;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
}

/* ---------- 按钮 ---------- */
P('btnIgnite').addEventListener('click', () => {
  S = makeSim(); running = true; lastTs = 0;
  P('btnIgnite').disabled = true;
  P('status').innerHTML = '点火指令已发出 · 推力爬升中（<b>' + S.c.ramp + 's</b>）→ 推力>重力后解锁起飞';
});
P('btnReset').addEventListener('click', () => {
  S = makeSim(); running = false; lastTs = 0;
  P('btnIgnite').disabled = false;
  P('status').textContent = '已重置 · 参数修改后点「重置」生效';
  updateHud(S);
});

/* ---------- 初始化 ---------- */
S = makeSim();
updateHud(S);
requestAnimationFrame(frame);
</script>
</body>
</html>
